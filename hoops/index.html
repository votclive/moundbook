<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#094A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brier Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Brier Stats</title>
<style>
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
/* Greenbrier brand kit (same rules as the VOTC Live app): four colors only. Green leads, white is the ground, grey is for
   outlines and rules (never text on white), black is the working accent. Big Shoulders Display in caps for headlines,
   names, scores and labels; Barlow for sentences. Square blocks, 4px buttons, 8px cards, one hard black shadow per screen
   (the score). Layout follows Jim's ChatGPT draft: home team | scoreboard | away team, tap-a-stat buttons on each player. */
:root{
  --green:#094A28; --white:#FFFFFF; --grey:#A0A0A0; --black:#000000;
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--white);color:var(--black)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1}
.kicker{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.small{font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:0 12px}

/* Top bar: solid green block, Bobcat Head as drawn, tabs on the same row so the desk keeps its height. */
.top{background:var(--green);color:var(--white);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand img{width:38px;height:37px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--white);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:16px 9px 12px;border-bottom:4px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--white)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--white);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill i{width:8px;height:8px;background:var(--grey);display:inline-block}
.pill.live i{background:var(--white)}
.pill.bad{background:var(--black);border-color:var(--black)}
main{padding:6px 0 24px}
body.has-fu main{padding-bottom:260px}

/* Generic bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 12px;font-weight:600;min-height:38px;text-decoration:none;color:var(--black)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--green);color:var(--white);border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--white);border:1px solid var(--grey);border-radius:8px;padding:14px}
.stack{display:grid;gap:12px}
.flag{border:2px solid var(--black);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.flag.bad{background:var(--black);color:var(--white)}
.flag.ok{background:var(--green);color:var(--white);border-color:var(--green)}
.flag .btn{color:var(--black)}
label.fld{display:grid;gap:4px;font-size:14px}
label.fld span{font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 9px;min-height:38px;width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--grey);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
tr.tot td{font-weight:700;border-top:2px solid var(--black)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--black);color:var(--white);padding:9px 16px;border-radius:4px;z-index:60;font-weight:600;max-width:92vw;text-align:center}
.tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--black)}
.tag.solid{background:var(--black);color:var(--white)}
.tag.green{background:var(--green);color:var(--white);border-color:var(--green)}

/* ---------- Desk: sized so an iPad in landscape (or a laptop) shows the whole game without scrolling ---------- */
.deskhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--black);margin-bottom:6px}
.deskhead .game{flex:1;min-width:200px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.deskhead h2{font-size:24px}
.periods{display:flex;gap:4px}
.periods button{min-width:44px;min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-family:var(--f-display);font-weight:800;font-size:17px}
.periods button.on{background:var(--green);color:var(--white);border-color:var(--green)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:12px;align-items:start}
.tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tc-head img{width:34px;height:33px}
.tc-head .init{width:34px;height:34px;flex:none;border:2px solid var(--grey);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:17px}
.tc-head h3{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-head .side{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em}
.find{min-height:32px!important;padding:4px 8px!important;font-size:14px;margin-bottom:6px}

.table-bar{border:2px solid var(--green);border-radius:8px;padding:5px 7px;margin-bottom:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.table-bar .kicker{color:var(--green);margin-right:2px}
.pcard{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;border:1px solid var(--grey);border-radius:8px;padding:4px 6px;margin-bottom:4px;background:var(--white)}
.pcard.on{border-left:5px solid var(--green);padding-left:5px}
.pcard.fo{border-style:dashed}
.pnum{width:42px;height:42px;border-radius:4px;border:0;background:var(--green);color:var(--white);font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;padding:0}
.pline{display:flex;gap:8px;align-items:baseline;min-width:0;margin-bottom:3px;height:20px}
.pline b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.pline span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pline .pts{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1;flex:none;margin-left:auto}
.sb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.sb + .sb{margin-top:3px}
.sb.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.sb button{min-height:31px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;padding:0 2px}
.sb button.mk{background:var(--green);border-color:var(--green);color:var(--white)}
.sb button.ms{border:1.5px solid var(--black)}
.sb button.fl{background:var(--black);border-color:var(--black);color:var(--white)}
.sb button:active{transform:scale(.96);outline:3px solid var(--black)}
.bench{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.bench .kicker{margin-right:2px}
.bench .kicker.full{width:100%}
.chip{min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-weight:700;padding:3px 9px;font-size:14px}
.chip b{font-family:var(--f-display);font-weight:900;font-size:17px;margin-right:3px}
.chip.at{background:var(--green);border-color:var(--green);color:var(--white)}
.chip.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.chip.skip{border-style:dashed}

.board{background:var(--green);color:var(--white)}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--grey)}
.board .q{background:var(--white);color:var(--green);border-radius:4px;padding:1px 8px;font-weight:900;font-size:17px;letter-spacing:.02em;flex:none}
.board .sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 2px;text-align:center}
.board .sc .t{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .sc .n{font-family:var(--f-display);font-weight:900;font-size:60px;line-height:1;text-shadow:-3px 4px 0 var(--black)}
.board .sc .poss{font-size:18px}
.board table{color:var(--white);font-size:13px}
.board th,.board td{border-color:var(--grey);color:var(--white);padding:3px 6px}
.board td:first-child{font-family:var(--f-display);font-weight:700;text-transform:uppercase}
.tbox{border:1px solid var(--grey);border-radius:8px;padding:5px 7px;margin-top:8px}
.tbox .th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbox .th b{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbox .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0}
.tbox .fouls,.tbox .tmo{display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:36px;font-size:12.5px;font-weight:600;padding:2px 4px}
.tbox .tmo{border:1px solid var(--grey);border-radius:4px;background:var(--white)}
.tbox .fouls b,.tbox .tmo b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1}
.tbox .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tbox .grid button{min-height:30px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-weight:600;font-size:12.5px;padding:0 2px}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cact .btn{min-height:34px;font-size:13px;padding:4px 6px}
.cact .wide{grid-column:span 2}
.mini{margin-top:8px;border-top:2px solid var(--black)}
.mini .plays li{padding:4px 2px;font-size:13px}

/* Follow-up strip (assist / rebound / shot spot / sub): pinned to the bottom, never blocks the next tap. */
.fu{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:4px solid var(--green);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.fu .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0}
.fu .ask{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-right:6px}
.court{display:block;width:100%;max-width:520px;height:auto;touch-action:manipulation}
.court .fl{fill:var(--white);stroke:var(--black);stroke-width:3}
.court line,.court path,.court circle.ln,.court rect.ln{fill:none;stroke:var(--grey);stroke-width:3}
.fu .court{max-width:240px}

/* Plays */
.plays{list-style:none;margin:0;padding:0}
.plays li{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--grey)}
.plays .pq{font-family:var(--f-display);font-weight:800;min-width:30px}
.plays .ps{font-family:var(--f-display);font-weight:900;min-width:52px;text-align:center;font-size:16px}
.plays .pt{flex:1;min-width:0}
.plays li.void .pt{text-decoration:line-through}
.plays li.score .pt b{color:var(--green)}
.plays li.note .pt{font-style:italic}

/* ---------- Announcer ---------- */
.ann .big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:10px;padding:10px 6px}
.ann .big .n{font-family:var(--f-display);font-weight:900;font-size:120px;line-height:.9;text-shadow:-4px 5px 0 var(--black)}
.ann .big .t{font-family:var(--f-display);font-size:30px;font-weight:800;text-transform:uppercase}
.ann .big .meta{font-size:15px;font-weight:600;margin-top:6px}
.ann .lastplay{font-size:20px;font-weight:600;text-align:center;padding:8px;border-top:1px solid var(--grey)}
.ann-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.floor td{font-size:16px}
.floor td.nm{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;cursor:pointer}
.floor .say{font-family:var(--f-body);text-transform:none;font-weight:500;font-size:13px;font-style:italic;white-space:normal}
.subs{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.subs li{padding:3px 0;border-bottom:1px solid var(--grey)}
.lead{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lead .card{padding:10px}
.lead .card b{font-family:var(--f-display);font-weight:900;font-size:34px;display:block;line-height:1}
.annbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
body.annfull .top .tabs{visibility:hidden}

/* Games */
.glist{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:110px 60px 1fr auto;gap:10px;align-items:center;border:1px solid var(--grey);border-radius:8px;padding:8px 10px}
.grow.cur{border-left:5px solid var(--green)}
.grow .d{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase}
.grow .tm{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.grow .res{font-family:var(--f-display);font-weight:900;font-size:24px;text-align:right}
.grow .res.w{color:var(--green)}

.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:12px}
.sheet{background:var(--white);border-radius:8px;padding:16px;max-width:580px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--green)}
.sheet h3{font-size:26px;margin-bottom:8px}

@media (max-width:1180px){ .desk{grid-template-columns:minmax(0,1fr) 272px minmax(0,1fr)} .board .sc .n{font-size:54px} .tabs button{font-size:16px;padding-left:7px;padding-right:7px} }
/* iPad portrait: both teams side by side under a scoreboard strip */
@media (max-width:900px){
  .desk{grid-template-columns:1fr 1fr}
  .desk .center{grid-column:1/-1;order:-1;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:start}
  .desk .center .tbox,.desk .center .cact{margin-top:0}
  .desk .center .cact{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}
  .desk .center .mini{display:none}
  .lead{grid-template-columns:1fr 1fr}
  .ann .big .n{font-size:84px}
  .brand b{display:none}
}
/* phone: one team at a time */
@media (max-width:700px){
  .desk{grid-template-columns:1fr}
  .desk .center{grid-template-columns:1fr 1fr}
  .desk .center .board{grid-column:1/-1}
  .desk .center .cact{grid-template-columns:1fr 1fr}
  .desk .teamcol.hide-narrow{display:none}
  .ann-cols{grid-template-columns:1fr}
  .ann .big .n{font-size:64px}
  .grow{grid-template-columns:90px 1fr auto}.grow .tm{display:none}
}
@media (min-width:701px){ .only-narrow{display:none!important} }
@media print{
  .top,.fu,.no-print,.toast{display:none!important}
  main{padding:0} .card{border:0;padding:0}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="bobcat-head.png" alt="Greenbrier Bobcats"><b>BRIER STATS</b></div>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <span class="pill" id="syncpill"><i></i><span>This device</span></span>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="fu"></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* Brier Stats: basketball scorebook for Greenbrier (Bobcats / Lady Cats).
   One device scores a game; everyone else signed in follows it live on the Announcer page. Each device's own saved copy is the
   truth and the cloud is only a pipe, so scoring never waits on signal. Mirrors Mound Book's design and shares its Firebase project.
   Every number on every screen is computed by replaying the game's play list, so a correction anywhere fixes everything. */
const BS_VERSION = "0.2.0";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pct = (m, a) => a ? Math.round(100 * m / a) + "%" : "–";
const ANN_ONLY = /[?&#]announcer\b/.test(location.search + location.hash);

/* ---------- schedule (from the 2026-27 master sheet in the social kit) ---------- */
const SCHEDULE = [
 ["2026-11-16","19:30","boys","Watertown","Away",0,"Hall of Fame (preseason)"],["2026-11-17","18:00","girls","White House Heritage","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-17","19:30","boys","White House Heritage","Away",0,"Hall of Fame (preseason)"],["2026-11-19","18:00","girls","Wilson Central","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-19","19:30","boys","Wilson Central","Away",0,"Hall of Fame (preseason)"],["2026-12-04","18:00","girls","Jo Byrns","Home",0,""],["2026-12-04","19:30","boys","Jo Byrns","Home",0,""],
 ["2026-12-07","18:00","girls","Merrol Hyde","Away",0,""],["2026-12-07","19:30","boys","Merrol Hyde","Away",0,""],["2026-12-08","18:00","girls","White House Heritage","Home",0,""],
 ["2026-12-08","19:30","boys","White House Heritage","Home",0,""],["2026-12-15","18:00","girls","KIPP Antioch","Away",0,""],["2026-12-15","19:30","boys","KIPP Antioch","Away",0,""],
 ["2026-12-18","18:00","girls","Gallatin","Away",0,"Christmas Classic"],["2026-12-18","19:30","boys","Gallatin","Away",0,"Christmas Classic"],

/* ---------- saved data ----------
   S.games[id]: {id, date, time, team:"boys"|"girls", opp, ha:"Home"|"Away" (ours), district, event, quarters, qlen,
     us:[player] (our roster as of tip-off), them:[player], ev:[event], status:"pre"|"live"|"final", rev, upd, writer, takeover, deleted, practice}
   player: {pid, num, name, pos}
   event: {id, at, tm:"us"|"them", pid (null = team), t, ...}
     FG {p:2|3, m:bool, x?, y?}  FT {m}  REB {o:bool}  AST  STL  BLK  TO  PF  TF (technical; no pid = bench/coach)
     TMO {len:60|30}  IN  OUT  PER (ends the period)  POSS {to}  NOTE {txt}  v:true = voided (kept, struck through)
   S.booth[gid]: {table:{us:[pid], them:[pid]}, said:[pid], notes, upd}: players waiting at the scorer's table, which of
     them the announcer has called, and the booth's own notes. Not stats, so the scorer and the announcer can both change it.
   S.say[pid]: the announcer's note for a player (how to say the name, a fact). Our players keep their pid all season. */
const KEY = "brierstats.v1";
const SAVE = {ok: true, err: ""};
let S;
function blank(){
  return {v:1, dev:rid(), teams:{boys:{name:"Bobcats", roster:[]}, girls:{name:"Lady Cats", roster:[]}}, teamsRev:0,
    games:{}, booth:{}, say:{}, sayUpd:0, settings:{bonus:5, to60:3, to30:2, quarters:4, qlen:8, otlen:4, chart:true, extra:true}, seeded:false, sync:false};
}
function load(){
  try{ const t = localStorage.getItem(KEY); S = t ? JSON.parse(t) : blank(); }catch(e){ S = blank(); SAVE.ok = false; SAVE.err = "This browser won't save (private browsing?)."; }
  const b = blank();
  for(const k of Object.keys(b)) if(S[k] === undefined) S[k] = b[k];
  for(const k of Object.keys(b.settings)) if(S.settings[k] === undefined) S.settings[k] = b.settings[k];
  if(!S.seeded){
    SCHEDULE.forEach(([date,time,team,opp,ha,dist,event]) => { const g = newGame({date,time,team,opp,ha,district:!!dist,event}); if(!S.games[g.id]) S.games[g.id] = g; });
    S.games.practice = practiceGame(); S.seeded = true; save();
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); SAVE.ok = true; SAVE.err = ""; }
  catch(e){ SAVE.ok = false; SAVE.err = "This device stopped saving (" + (e.name || "storage full") + "). Back up the game from Setup now."; }
}
function newGame(o){
  let id = o.id || (o.date + "-" + o.team);
  if(!o.id && S.games[id]){ let n = 2; while(S.games[id + "-" + n]) n++; id = id + "-" + n; }
  return {id, date:o.date, time:o.time||"", team:o.team, opp:o.opp||"Opponent", ha:o.ha||"Home", district:!!o.district, event:o.event||"",
    quarters:S.settings.quarters, qlen:S.settings.qlen, us:[], them:[], ev:[], status:"pre", rev:0, upd:Date.now(), writer:null, takeover:null, deleted:false, practice:!!o.practice};
}
function practiceGame(){
  const P = (num,name,pos) => ({pid:rid(), num:String(num), name, pos});
  const g = newGame({id:"practice", date:new Date().toISOString().slice(0,10), team:"boys", opp:"Visitors", ha:"Home", practice:true});
  g.us = [P(0,"Sample Guard","PG"),P(3,"Sample Wing","SG"),P(5,"Sample Shooter","G"),P(12,"Sample Reserve","G"),P(22,"Sample Post","PF"),P(24,"Sample Forward","F"),P(33,"Sample Center","C"),P(44,"Sample Big","C")];
  g.them = [P(1,"","G"),P(2,"","G"),P(10,"","F"),P(11,"","G"),P(15,"","F"),P(21,"","C"),P(30,"","F")];
  return g;
}

/* ---------- replay: every number comes from here ---------- */
const LINE = () => ({pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,to:0,pf:0,tf:0,pm:0,gp:0});
const OTHER = tm => tm === "us" ? "them" : "us";
function perLabel(g, q){ const Q = g.quarters || 4; return q <= Q ? "Q" + q : (q === Q + 1 ? "OT" : "OT" + (q - Q)); }
function replay(g){
  const R = {q:1, sc:{us:0,them:0}, qs:{us:[0],them:[0]}, tf:{us:{},them:{}}, tmo:{us:{60:0,30:0},them:{60:0,30:0}},
    box:{us:{},them:{}}, team:{us:LINE(),them:LINE()}, court:{us:new Set(),them:new Set()}, plays:[], shots:[], lastMiss:null, poss:null};
  const L = (tm, pid) => pid ? (R.box[tm][pid] || (R.box[tm][pid] = LINE())) : R.team[tm];
  const add = (tm, pts) => {
    R.sc[tm] += pts; R.qs[tm][R.q-1] = (R.qs[tm][R.q-1] || 0) + pts;
    for(const t of ["us","them"]) R.court[t].forEach(pid => { L(t, pid).pm += t === tm ? pts : -pts; });
  };
  for(const e of g.ev){
    const q = R.q, before = {us:R.sc.us, them:R.sc.them};
    if(e.v){ R.plays.push({e, q, sc:before, void:true}); continue; }
    const tm = e.tm, ln = L(tm, e.pid);
    if(e.pid) ln.gp = 1;
    switch(e.t){
      case "FG": ln.fga++; if(e.p === 3) ln.tpa++;
        if(e.m){ ln.fgm++; if(e.p === 3) ln.tpm++; ln.pts += e.p; add(tm, e.p); R.lastMiss = null; } else R.lastMiss = tm;
        R.shots.push({e, q}); break;
      case "FT": ln.fta++; if(e.m){ ln.ftm++; ln.pts++; add(tm, 1); R.lastMiss = null; } else R.lastMiss = tm; break;
      case "REB": if(e.o) ln.oreb++; else ln.dreb++; R.lastMiss = null; break;
      case "AST": ln.ast++; break;
      case "STL": ln.stl++; R.lastMiss = null; break;
      case "BLK": ln.blk++; break;
      case "TO": ln.to++; R.lastMiss = null; break;
      case "PF": ln.pf++; R.tf[tm][q] = (R.tf[tm][q] || 0) + 1; break;
      case "TF": ln.tf++; if(e.pid) ln.pf++; R.tf[tm][q] = (R.tf[tm][q] || 0) + 1; break;
      case "TMO": R.tmo[tm][e.len === 30 ? 30 : 60]++; break;
      case "IN": R.court[tm].add(e.pid); break;
      case "OUT": R.court[tm].delete(e.pid); break;
      case "PER": R.q++; R.qs.us[R.q-1] = 0; R.qs.them[R.q-1] = 0; R.lastMiss = null; break;
      case "POSS": R.poss = e.to; break;
    }
    R.plays.push({e, q, sc:{us:R.sc.us, them:R.sc.them}, scored:R.sc.us !== before.us || R.sc.them !== before.them});
  }
  return R;
}
// Team fouls toward the bonus right now. NFHS (2023-24 on): resets each quarter; overtime counts with Q4.
function teamFouls(g, R, tm){ const Q = g.quarters || 4; if(R.q <= Q) return R.tf[tm][R.q] || 0; let n = 0; for(let q = Q; q <= R.q; q++) n += R.tf[tm][q] || 0; return n; }
// A team is "in the bonus" (shooting free throws on every foul) when the OTHER team has reached the bonus foul.
function inBonus(g, R, tm){ return teamFouls(g, R, OTHER(tm)) >= S.settings.bonus; }
function toLeft(g, R, tm){ const ot = Math.max(0, R.q - (g.quarters || 4)); return {60: S.settings.to60 + ot - R.tmo[tm][60], 30: S.settings.to30 - R.tmo[tm][30]}; }

/* ---------- names ---------- */
function roster(g, tm){ if(tm === "them") return g.them; return (g.us && g.us.length) ? g.us : (S.teams[g.team] || {}).roster || []; }
function player(g, tm, pid){ return roster(g, tm).find(p => p.pid === pid) || null; }
function usName(g){ return (S.teams[g.team] || {}).name || (g.team === "girls" ? "Lady Cats" : "Bobcats"); }
function tmName(g, tm){ return tm === "us" ? usName(g) : g.opp; }
function pLabel(g, tm, pid){ if(!pid) return tmName(g, tm) + " (team)"; const p = player(g, tm, pid); if(!p) return "?"; return "#" + p.num + (p.name ? " " + p.name : ""); }
function pShort(p){ if(!p) return ""; return (p.name || "").trim().split(/\s+/).pop() || ""; }
function sortRoster(a){ return a.slice().sort((x, y) => (parseInt(x.num, 10) || 0) - (parseInt(y.num, 10) || 0) || String(x.num).localeCompare(String(y.num))); }
function homeAway(g){ return g.ha === "Away" ? {home:"them", away:"us"} : {home:"us", away:"them"}; }
function fmtDate(d){ try{ return new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}); }catch(e){ return d; } }
function fmtTime(t){ if(!t) return ""; const [h, m] = t.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h >= 12 ? " PM" : " AM"); }
function initials(n){ return String(n || "").split(/[\s-]+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 3).map(w => w[0].toUpperCase()).join("") || "?"; }
function shortName(n){ return String(n).length > 11 ? initials(n) : n; }
function badge(g, tm){ return tm === "us" ? `<img src="bobcat-head.png" alt="">` : `<span class="init">${esc(initials(g.opp).slice(0, 2))}</span>`; }
function statLine(ln){
  const bits = [];
  if(ln.fga) bits.push(ln.fgm + "-" + ln.fga + " FG"); if(ln.tpa) bits.push(ln.tpm + "-" + ln.tpa + " 3PT"); if(ln.fta) bits.push(ln.ftm + "-" + ln.fta + " FT");
  const reb = ln.oreb + ln.dreb; if(reb) bits.push(reb + " REB"); if(ln.ast) bits.push(ln.ast + " AST"); if(ln.stl) bits.push(ln.stl + " STL"); if(ln.blk) bits.push(ln.blk + " BLK"); if(ln.to) bits.push(ln.to + " TO");
  bits.push(ln.pf + " PF");
  return bits.join(" · ");
}

function playText(g, e){
  const who = esc(pLabel(g, e.tm, e.pid)), team = esc(tmName(g, e.tm));
  switch(e.t){
    case "FG": return e.m ? "<b>" + who + " makes " + e.p + "</b>" : who + " misses " + e.p;
    case "FT": return e.m ? "<b>" + who + " makes free throw</b>" : who + " misses free throw";
    case "REB": return (e.pid ? who : team + " team") + (e.o ? " offensive" : " defensive") + " rebound";
    case "AST": return who + " assist";
    case "STL": return who + " steal";
    case "BLK": return who + " block";
    case "TO": return (e.pid ? who : team + " team") + " turnover";
    case "PF": return who + " foul";
    case "TF": return (e.pid ? who : team + " bench/coach") + " technical foul";
    case "TMO": return team + " timeout (" + (e.len === 30 ? "30s" : "60s") + ")";
    case "IN": return who + " checks in";
    case "OUT": return who + " checks out";
    case "PER": return "End of " + perLabel(g, e.q || 0);
    case "POSS": return "Possession arrow → " + esc(tmName(g, e.to));
    case "NOTE": return esc(e.txt || "Note");
  }
  return esc(e.t);
}

/* ---------- ui state ---------- */
const ui = {tab:"desk", gid:null, find:{us:"", them:""}, lineup:null, fu:[], narrow:"home", shotTm:"all", shotPid:"", gfilter:"all", sheet:null, follow:true};
try{ const p = JSON.parse(localStorage.getItem(KEY + ".ui") || "{}"); if(p.tab) ui.tab = p.tab; if(p.gid) ui.gid = p.gid; }catch(e){}
if(ANN_ONLY){ ui.tab = "ann"; document.body.classList.add("annfull"); }
function saveUi(){ if(ANN_ONLY) return; try{ localStorage.setItem(KEY + ".ui", JSON.stringify({tab:ui.tab, gid:ui.gid})); }catch(e){} }
function cur(){ const g = ui.gid && S.games[ui.gid]; return g && !g.deleted ? g : null; }
function canScore(){ return !Sync.live() || Sync.role() === "owner" || Sync.role() === "scorer"; }
function mine(g){ return !g.writer || g.writer === S.dev; }
function canEdit(g){ return g && canScore() && mine(g); }
let toastT;
function toast(msg, ms = 2400){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ---------- the table (subs waiting to check in) ---------- */
function booth(gid){ const b = S.booth[gid] || (S.booth[gid] = {table:{us:[], them:[]}, said:[], notes:"", upd:0}); if(!b.said) b.said = []; if(b.notes == null) b.notes = ""; return b; }
function setBooth(g, fn){ const b = booth(g.id); fn(b); b.upd = Date.now(); save(); Sync.dirtyBooth(g.id); }
function atTable(g, tm){ return (booth(g.id).table[tm] || []).filter(pid => player(g, tm, pid)); }
function toTable(g, tm, pid){ const l = atTable(g, tm); setBooth(g, b => { b.table[tm] = l.includes(pid) ? l.filter(x => x !== pid) : l.concat([pid]); b.said = b.said.filter(x => x !== pid || !l.includes(pid)); }); }
function offTable(g, tm, pid){ setBooth(g, b => { b.table[tm] = (b.table[tm] || []).filter(x => x !== pid); b.said = b.said.filter(x => x !== pid); }); }
// The last few subs for a team, as "#12 Smith in for #3 Lee" (an OUT recorded right before an IN is the same sub).
// Lineup taps (lu) are starters and lineup fixes, not subs worth announcing.
function subsOf(g, R, tm, n){
  const out = [], live = R.plays.filter(p => !p.void);
  live.forEach((p, i) => {
    const e = p.e; if(e.t !== "IN" || e.tm !== tm || e.lu) return;
    const prev = live[i - 1], pout = prev && prev.e.t === "OUT" && prev.e.tm === tm && Math.abs((e.at || 0) - (prev.e.at || 0)) < 4000 ? prev.e.pid : null;
    out.push({q:p.q, txt:pLabel(g, tm, e.pid) + (pout ? " in for " + pLabel(g, tm, pout) : " checks in")});
  });
  return out.slice(-n).reverse();
}

/* ---------- recording ---------- */
function touch(g){ g.rev = (g.rev || 0) + 1; g.upd = Date.now(); save(); Sync.dirty(g.id); render(); }
function claim(g){
  if(!g.writer) g.writer = S.dev;
  if(g.status === "pre"){ g.status = "live"; if(!g.us.length) g.us = JSON.parse(JSON.stringify((S.teams[g.team] || {}).roster || [])); }
}
function rec(e, opts = {}){
  const g = cur(); if(!g) return null;
  if(!canEdit(g)){ toast(canScore() ? "Another device is scoring this game. Take over first." : "Viewers can't score."); return null; }
  claim(g); e.id = rid(); e.at = Date.now(); g.ev.push(e);
  if(!opts.keepFu) ui.fu = [];
  if(!opts.quiet) touch(g); return e;
}
function stat(tm, pid, k){
  const g = cur(); if(!g) return;
  const R = replay(g);
  let e;
  switch(k){
    case "ft": e = rec({tm, pid, t:"FT", m:true}); break;
    case "ftx": e = rec({tm, pid, t:"FT", m:false}); if(e && S.settings.extra){ ui.fu = [{k:"reb", miss:tm}]; renderFu(); } break;
    case "2": case "3": case "2x": case "3x": {
      const p = parseInt(k, 10), m = !k.endsWith("x");
      e = rec({tm, pid, t:"FG", p, m}); if(!e) return;
      if(S.settings.chart) ui.fu.push({k:"loc", id:e.id});
      if(m && S.settings.extra) ui.fu.push({k:"ast", tm, shooter:pid, ref:e.id});
      if(!m && S.settings.extra) ui.fu.push({k:"reb", miss:tm});
      renderFu(); break; }
    case "reb": e = rec({tm, pid, t:"REB", o: R.lastMiss === tm}); break;
    case "ast": e = rec({tm, pid, t:"AST"}); break;
    case "stl": e = rec({tm, pid, t:"STL"}); if(e){ ui.fu = [{k:"to", tm:OTHER(tm), ref:e.id}]; renderFu(); } break;
    case "blk": e = rec({tm, pid, t:"BLK"}); if(e){ ui.fu = [{k:"blk", tm:OTHER(tm), ref:e.id, p:2}]; renderFu(); } break;
    case "to": e = rec({tm, pid, t:"TO"}); break;
    case "pf": {
      e = rec({tm, pid, t:"PF"}); if(!e) return;
      const R2 = replay(g), ln = R2.box[tm][pid];
      if(teamFouls(g, R2, tm) === S.settings.bonus) toast(tmName(g, OTHER(tm)) + " in the bonus.", 3000);
      if(ln && ln.pf === 4) toast(pLabel(g, tm, pid) + " has 4 fouls.");
      if(ln && ln.pf >= 5) toast(pLabel(g, tm, pid) + " FOULED OUT. Get a sub to the table.", 4000);
      break; }
    case "tf": e = rec({tm, pid, t:"TF"}); break;
  }
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
}
function undo(){
  const g = cur(); if(!g || !canEdit(g)) return;
  for(let i = g.ev.length - 1; i >= 0; i--){ if(!g.ev[i].v){ g.ev[i].v = true; g.ev[i].ed = Date.now(); ui.fu = []; toast("Undid: " + playText(g, g.ev[i]).replace(/<[^>]+>/g, "")); touch(g); return; } }
  toast("Nothing to undo.");
}
function endPeriod(){
  const g = cur(); if(!g) return; const R = replay(g);
  rec({tm:"us", pid:null, t:"PER", q:R.q});
  toast("End of " + perLabel(g, R.q) + ". " + usName(g) + " " + R.sc.us + ", " + g.opp + " " + R.sc.them + ".");
}
// A sub is two plays, out then in, so +/- and the floor stay right. It also clears the player off the table.
function subIn(g, tm, pin, pout){
  if(!canEdit(g)) return;
  if(pout) rec({tm, pid:pout, t:"OUT"}, {quiet:true, keepFu:true});
  rec({tm, pid:pin, t:"IN"}, {quiet:true, keepFu:true});
  offTable(g, tm, pin);
  touch(g);
}

/* ---------- render ---------- */
const TABS = [["desk","Desk"],["ann","Announcer"],["box","Box score"],["plays","Plays"],["shots","Shots"],["games","Games"],["teams","Rosters"],["setup","Setup"]];
let pendingRender = false;
// Sync calls this: it waits while someone is typing in the page so a live update doesn't eat their words.
function softRender(){
  const a = document.activeElement;
  if(a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender = false; setTimeout(render, 0); } });
function render(){
  pendingRender = false;
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${ui.tab === k}">${l}</button>`).join("");
  const pill = $("#syncpill"), ph = Sync.phase();
  pill.className = "pill" + (ph === "live" ? " live" : ph === "error" ? " bad" : "");
  pill.querySelector("span").textContent = ph === "live" ? Sync.label() : ph === "loading" ? "Connecting…" : ph === "signedout" ? "Not signed in" : ph === "waiting" ? "Waiting for Coach" : ph === "error" ? "Sync problem" : "This device";
  const banners = [];
  if(!SAVE.ok) banners.push(`<div class="flag bad" role="alert">NOT SAVING: ${esc(SAVE.err)}</div>`);
  const body = ({desk:viewDesk, ann:viewAnn, box:viewBox, plays:viewPlays, shots:viewShots, games:viewGames, teams:viewTeams, setup:viewSetup}[ui.tab] || viewDesk)();
  $("#view").innerHTML = banners.join("") + body;
  renderFu();
}
function needGame(){
  return `<div class="card stack" style="max-width:640px"><h2>Pick a game</h2><p style="margin:0">Choose tonight's game in Games, or try the practice game to get the feel of it.</p>
    <div class="row"><button class="btn primary" data-act="go" data-tab="games">Games</button><button class="btn" data-act="open" data-gid="practice">Practice game</button></div></div>`;
}
function gameTitle(g){ return `${esc(g.ha === "Away" ? "at" : "vs")} ${esc(g.opp)}`; }
function gameSub(g){ return [g.team === "girls" ? "Girls" : "Boys", fmtDate(g.date), fmtTime(g.time), g.ha, g.district ? "District" : "", g.event].filter(Boolean).map(esc).join(" · "); }

function viewDesk(){
  const g = cur(); if(!g) return needGame();
  const R = replay(g), ha = homeAway(g), Q = g.quarters || 4, edit = canEdit(g);
  let h = "";
  if(!canScore()) h += `<div class="flag">You're signed in as a viewer. <button class="btn sm" data-act="go" data-tab="ann">Open the Announcer page</button></div>`;
  else if(!mine(g)) h += `<div class="flag bad"><span>Another device is scoring this game. Only one device scores at a time.</span><button class="btn sm" data-act="takeover">Take over scoring here</button></div>`;
  if(g.status === "final") h += `<div class="flag ok"><b>FINAL.</b> Corrections still work and fix the box score everywhere. <button class="btn sm" data-act="reopen">Reopen</button></div>`;
  const pers = []; for(let q = 1; q <= Math.max(Q, R.q); q++) pers.push(q);
  h += `<div class="deskhead"><div class="game"><h2>${esc(usName(g))} ${gameTitle(g)}</h2><span class="small">${gameSub(g)}</span>
    ${g.practice ? `<span class="tag solid" title="Sample rosters. Nothing here syncs or counts.">Practice</span><button class="btn sm no-print" data-act="resetprac">Clear practice game</button>` : ""}</div>

function teamCol(g, R, tm, side, hideNarrow){

function pcard(g, R, tm, p, edit, onFloor){

function board(g, R){

function teamBox(g, R, tm, edit){

function playList(g, R, limit, edit){

/* follow-up strip */
function renderFu(){
  const el = $("#fu"), g = cur();
  if(ui.tab !== "desk" || !g || !ui.fu.length || !canEdit(g)){ el.innerHTML = ""; document.body.classList.remove("has-fu"); return; }
  const f = ui.fu[0], R = replay(g);
  const chips = (tm, excl, pool) => {
    const c = R.court[tm], list = sortRoster(roster(g, tm)).filter(p => p.pid !== excl);
    const use = pool || (c.size ? list.filter(p => c.has(p.pid)) : list);
    return use.map(p => `<button class="chip${tm === "them" ? " skip" : ""}" data-fu="pick" data-tm="${tm}" data-pid="${p.pid}"><b>${esc(p.num)}</b>${esc(pShort(p))}</button>`).join("");
  };
  let h = "";
  if(f.k === "loc") h = `<span class="ask">Where was the shot?</span>${courtSvg([], "loc")}<button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "ast") h = `<span class="ask">Assist?</span>${chips(f.tm, f.shooter)}<button class="chip skip" data-fu="skip">No assist</button>`;
  else if(f.k === "reb") h = `<span class="ask">Rebound?</span>${chips(OTHER(f.miss), null)}${chips(f.miss, null)}<button class="chip" data-fu="pick" data-tm="${OTHER(f.miss)}" data-pid="">${esc(shortName(tmName(g, OTHER(f.miss))))} team</button><button class="chip" data-fu="pick" data-tm="${f.miss}" data-pid="">${esc(shortName(tmName(g, f.miss)))} team</button><button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "to") h = `<span class="ask">Turnover by?</span>${chips(f.tm, null)}<button class="chip" data-fu="pick" data-tm="${f.tm}" data-pid="">Team</button><button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "blk") h = `<span class="ask">Whose shot got blocked?</span><button class="chip${f.p === 2 ? " at" : ""}" data-fu="bp" data-p="2">2PT</button><button class="chip${f.p === 3 ? " at" : ""}" data-fu="bp" data-p="3">3PT</button>${chips(f.tm, null)}<button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "out"){ const p = player(g, f.tm, f.pin);
    h = `<span class="ask">#${esc(p.num)} ${esc(pShort(p))} in for</span>${chips(f.tm, null, sortRoster(roster(g, f.tm)).filter(x => R.court[f.tm].has(x.pid)))}<button class="chip skip" data-fu="skip">Cancel</button>`; }
  el.innerHTML = `<div class="fu no-print"><div class="wrap">${h}</div></div>`;
  document.body.classList.add("has-fu");
}
function fuPick(tm, pid){
  const g = cur(), f = ui.fu[0]; if(!g || !f) return;
  ui.fu.shift();
  if(f.k === "ast") rec({tm, pid, t:"AST", ref:f.ref}, {keepFu:true});
  else if(f.k === "reb") rec({tm, pid, t:"REB", o: tm === f.miss}, {keepFu:true});
  else if(f.k === "to") rec({tm, pid, t:"TO", ref:f.ref}, {keepFu:true});
  else if(f.k === "blk"){ const e = rec({tm, pid, t:"FG", p:f.p, m:false, ref:f.ref}, {keepFu:true}); if(e){ ui.fu.unshift({k:"reb", miss:tm}); if(S.settings.chart) ui.fu.unshift({k:"loc", id:e.id}); render(); } }
  else if(f.k === "out") subIn(g, tm, f.pin, pid);
  else render();
}

/* court: NFHS half court, 50 ft wide x 47 ft deep, basket at top. 10 svg units per foot. x,y saved as 0..1. */
function courtSvg(shots, mode){
  let s = `<svg class="court" viewBox="0 0 500 470" ${mode === "loc" ? 'data-court="loc"' : ""} role="img" aria-label="Half court">
    <rect class="fl" x="1.5" y="1.5" width="497" height="467"/><rect class="ln" x="190" y="0" width="120" height="190"/><circle class="ln" cx="250" cy="190" r="60"/>
    <line x1="220" y1="40" x2="280" y2="40"/><circle class="ln" cx="250" cy="52.5" r="7.5"/><path d="M52.5 0 V52.5 A197.5 197.5 0 0 0 447.5 52.5 V0"/><path d="M190 470 A60 60 0 0 1 310 470"/>`;
  for(const sh of shots){
    const e = sh.e; if(e.x == null) continue;
    const x = e.x * 500, y = e.y * 470;
    s += e.m ? `<circle cx="${x}" cy="${y}" r="10" fill="#094A28"><title>${esc(sh.t || "")}</title></circle>`
             : `<g stroke="#000" stroke-width="4"><line x1="${x-8}" y1="${y-8}" x2="${x+8}" y2="${y+8}"/><line x1="${x-8}" y1="${y+8}" x2="${x+8}" y2="${y-8}"/><title>${esc(sh.t || "")}</title></g>`;
  }
  return s + `</svg>`;
}
function isThree(x, y){ const fx = x * 50, fy = y * 47; if(fy < 5.25) return Math.abs(fx - 25) > 19.75; return Math.hypot(fx - 25, fy - 5.25) > 19.75; }

/* ---------- box score ---------- */
const BOXCOLS = [["PTS","pts"],["FG","fg"],["3PT","tp"],["FT","ft"],["OR","oreb"],["DR","dreb"],["REB","reb"],["AST","ast"],["STL","stl"],["BLK","blk"],["TO","to"],["PF","pf"],["+/-","pm"]];
function cellOf(ln, k){
  switch(k){ case "fg": return ln.fgm + "-" + ln.fga; case "tp": return ln.tpm + "-" + ln.tpa; case "ft": return ln.ftm + "-" + ln.fta; case "reb": return ln.oreb + ln.dreb; case "pm": return ln.pm > 0 ? "+" + ln.pm : ln.pm; default: return ln[k]; }
}
function sumLines(lines){ const t = LINE(); for(const ln of lines) for(const k of Object.keys(t)) t[k] += ln[k] || 0; return t; }
function boxTable(g, R, tm){
  const usePm = R.plays.some(p => !p.void && p.e.t === "IN");
  const cols = BOXCOLS.filter(c => c[1] !== "pm" || usePm);
  const ps = sortRoster(roster(g, tm)).filter(p => R.box[tm][p.pid]);
  const tot = sumLines(ps.map(p => R.box[tm][p.pid]).concat([R.team[tm]]));
  return `<div class="tc-head">${badge(g, tm)}<h3>${esc(tmName(g, tm))}</h3><span class="disp" style="font-size:28px;font-weight:900">${R.sc[tm]}</span></div><div class="scroll-x"><table><tr><th class="l">Player</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr>
    ${ps.map(p => { const ln = R.box[tm][p.pid]; return `<tr><td class="l">${esc(p.num)} ${esc(p.name)}${ln.pf >= 5 ? ' <span class="tag solid">FO</span>' : ""}</td>${cols.map(c => `<td>${cellOf(ln, c[1])}</td>`).join("")}</tr>`; }).join("")}
    ${R.team[tm].oreb + R.team[tm].dreb + R.team[tm].to + R.team[tm].tf ? `<tr><td class="l">Team</td>${cols.map(c => `<td>${["oreb","dreb","reb","to"].includes(c[1]) ? cellOf(R.team[tm], c[1]) : ""}</td>`).join("")}</tr>` : ""}
    <tr class="tot"><td class="l">Totals</td>${cols.map(c => `<td>${c[1] === "pm" ? "" : cellOf(tot, c[1])}</td>`).join("")}</tr>
    <tr><td class="l">Shooting</td>${cols.map(c => `<td>${c[1] === "fg" ? pct(tot.fgm, tot.fga) : c[1] === "tp" ? pct(tot.tpm, tot.tpa) : c[1] === "ft" ? pct(tot.ftm, tot.fta) : ""}</td>`).join("")}</tr></table></div>`;
}
function review(g, R){
  const out = [];
  for(const tm of ["us","them"]){
    for(const p of roster(g, tm)){ const ln = R.box[tm][p.pid]; if(ln && ln.pf >= 5 && R.court[tm].has(p.pid)) out.push(["bad", pLabel(g, tm, p.pid) + " (" + tmName(g, tm) + ") has 5 fouls and is still on the floor."]); }
    const nums = {}; for(const p of roster(g, tm)){ if(nums[p.num]) out.push(["bad", tmName(g, tm) + " has two players wearing #" + p.num + "."]); nums[p.num] = 1; }
    if(R.court[tm].size && R.court[tm].size !== 5 && g.status !== "final") out.push(["warn", tmName(g, tm) + " has " + R.court[tm].size + " on the floor."]);
    const left = toLeft(g, R, tm); if(left[60] < 0 || left[30] < 0) out.push(["bad", tmName(g, tm) + " used more timeouts than they have."]);
  }
  const misses = R.plays.filter(p => !p.void && (p.e.t === "FG" || p.e.t === "FT") && !p.e.m).length;
  const rebs = R.plays.filter(p => !p.void && p.e.t === "REB").length;
  if(S.settings.extra && misses - rebs > 6) out.push(["warn", misses + " missed shots but only " + rebs + " rebounds logged. Fine if you skipped some."]);
  const Q = g.quarters || 4;
  if(g.status === "final" && R.q < Q) out.push(["warn", "Marked final in " + perLabel(g, R.q) + "."]);
  if(R.q >= Q && R.sc.us === R.sc.them && g.status !== "final" && g.ev.length) out.push(["warn", "Tied at the end of regulation: tap +OT."]);
  if(!out.length) out.push(["ok", "Nothing looks off. Quarter scores always add up to the total: they come from the same plays."]);
  return out;
}
function viewBox(){
  const g = cur(); if(!g) return needGame();
  const R = replay(g), ha = homeAway(g);
  return `<div class="stack"><div class="row between"><div><div class="kicker">Box score · ${g.status === "final" ? "final" : perLabel(g, R.q)}</div><h2>${esc(usName(g))} ${gameTitle(g)}</h2><div class="small">${gameSub(g)}</div></div>
      <div class="row no-print"><button class="btn" data-act="print">Print box score</button><button class="btn" data-act="csv">Player stats CSV</button><button class="btn primary" data-act="send">Send to Scorebook</button></div></div>
    <div style="max-width:520px">${board(g, R)}</div>
    <div class="card no-print"><h3 style="font-size:22px;margin-bottom:8px">Review</h3>${review(g, R).map(([k, t]) => `<div class="flag ${k === "bad" ? "bad" : k === "ok" ? "ok" : ""}" style="margin-bottom:6px">${esc(t)}</div>`).join("")}

function viewShots(){
  const g = cur(); if(!g) return needGame();
  const R = replay(g), tms = ui.shotTm === "all" ? ["us","them"] : [ui.shotTm];
  const shots = R.shots.filter(s => tms.includes(s.e.tm) && (!ui.shotPid || s.e.pid === ui.shotPid)).map(s => ({e:s.e, t:pLabel(g, s.e.tm, s.e.pid) + (s.e.m ? " made " : " missed ") + s.e.p}));
  const placed = shots.filter(s => s.e.x != null);
  const zone = f => { const z = placed.filter(s => f(s.e)); return z.filter(s => s.e.m).length + "/" + z.length; };
  const paint = e => e.x * 50 >= 19 && e.x * 50 <= 31 && e.y * 47 <= 19;
  const pl = sortRoster(tms.flatMap(tm => roster(g, tm)));
  return `<div class="card"><div class="row between"><div><div class="kicker">Shot chart</div><h2>${esc(usName(g))} ${gameTitle(g)}</h2></div>
      <div class="row"><select data-sel="shotTm" style="width:auto"><option value="all">Both teams</option><option value="us" ${ui.shotTm === "us" ? "selected" : ""}>${esc(usName(g))}</option><option value="them" ${ui.shotTm === "them" ? "selected" : ""}>${esc(g.opp)}</option></select>
      <select data-sel="shotPid" style="width:auto"><option value="">Everyone</option>${pl.map(p => `<option value="${p.pid}" ${ui.shotPid === p.pid ? "selected" : ""}>#${esc(p.num)} ${esc(p.name)}</option>`).join("")}</select></div></div>
    <div class="row" style="align-items:flex-start;margin-top:10px;gap:20px"><div style="flex:1;min-width:260px;max-width:560px">${courtSvg(shots, "")}</div>
    <table style="max-width:300px"><tr><th class="l">Spot</th><th>Made/Att</th></tr><tr><td>Paint</td><td>${zone(paint)}</td></tr><tr><td>Mid-range</td><td>${zone(e => !paint(e) && !isThree(e.x, e.y))}</td></tr><tr><td>Three</td><td>${zone(e => isThree(e.x, e.y))}</td></tr>
    <tr class="tot"><td>Charted</td><td>${placed.length} of ${shots.length}</td></tr></table></div>
    <p class="small" style="margin-bottom:0">Green dots are makes, black X's are misses. Turn on <b>Shot spots</b> on the desk to tap where each shot came from.</p></div>`;
}

/* ---------- rosters & season ---------- */
function seasonLines(team){
  const by = {};
  for(const g of Object.values(S.games)){
    if(g.deleted || g.practice || g.team !== team || g.status !== "final") continue;
    const R = replay(g);
    for(const [pid, ln] of Object.entries(R.box.us)){ if(!ln.gp) continue; const a = by[pid] || (by[pid] = {...LINE(), g:0}); for(const k of Object.keys(LINE())) a[k] += ln[k]; a.g++; }
  }
  return by;
}

/* ---------- Bobcats Scorebook hand-off ----------
   Bobcats Scorebook keeps games at games/{YYYY-MM-DD-boys|girls} with gb, opp, top ("Name 22, Name 14"),
   periods{q1..q4,ot1,ot2:{gb,opp}} as the RUNNING score at the end of each period, and live_note (the shout-out line in
   its in-game posts, which already carry the score). Its paste box reads this. Game ids match: both apps name a game
   date-team, with -2 on a second game that day. Names go by last name, the way Bobcats Scorebook writes them. */
function scorebookPayload(g){
  const R = replay(g), Q = g.quarters || 4, final = g.status === "final", periods = {};
  // Periods that are over. The period a final game ends in is the final itself; Bobcats Scorebook only keeps the end of
  // regulation (q4) and OT when the game went past them. An "End of" tapped just before Make it final doesn't count.
  let last = R.q;
  if(final && R.q > Q){ const live = R.plays.filter(p => !p.void && p.e.t !== "NOTE"); if(live.length && live[live.length - 1].e.t === "PER") last = R.q - 1; }
  let cu = {gb:0, opp:0};
  for(let q = 1; q < last && q <= Q + 2; q++){
    cu = {gb: cu.gb + (R.qs.us[q-1] || 0), opp: cu.opp + (R.qs.them[q-1] || 0)};
    periods[q <= Q ? "q" + q : "ot" + (q - Q)] = {...cu};
  }
  const named = roster(g, "us").filter(p => /^[A-Za-z]/.test(pShort(p)));
  const nm = p => named.filter(x => pShort(x).toLowerCase() === pShort(p).toLowerCase()).length > 1 ? p.name.trim() : pShort(p);
  const top = named.map(p => ({p, pts:(R.box.us[p.pid] || LINE()).pts})).filter(x => x.pts > 0).sort((a, b) => b.pts - a.pts);
  const keep = top.filter((x, i) => i < 3 || x.pts >= 10).slice(0, 5);
  return {source:"brier-stats", v:1, id:g.practice ? "practice" : g.id, date:g.date, team:g.team === "girls" ? "Girls" : "Boys", opponent:g.opp,
    final, gb: final ? R.sc.us : null, opp: final ? R.sc.them : null, periods,
    top: keep.map(x => nm(x.p) + " " + x.pts).join(", "),
    live_note: final || g.status !== "live" ? "" : keep.slice(0, 2).map((x, i) => nm(x.p) + (i ? " " : " has ") + x.pts).join(", ")};
}
function sendSheet(){
  const g = cur(); if(!g) return;
  const p = scorebookPayload(g), txt = JSON.stringify(p);
  openSheet({html:() => `<h3>Send to Bobcats Scorebook</h3>
    <p style="margin:0 0 8px">${p.final ? `Final: <b>${esc(usName(g))} ${p.gb}, ${esc(g.opp)} ${p.opp}</b>${p.top ? `<br>Top scorers: ${esc(p.top)}` : ""}`
      : `<b>Not final yet.</b> This sends the quarter scores so far (${Object.keys(p.periods).map(k => k.toUpperCase()).join(", ") || "none yet"}) for an in-game post.${p.live_note ? `<br>Shout-out: ${esc(p.live_note)}` : ""}`}</p>
    <ol style="margin:0 0 10px;padding-left:20px;font-size:14px"><li>Tap <b>Copy</b>.</li><li>In Bobcats Scorebook open this game, tap <b>Paste from Brier Stats</b>, paste, then <b>Fill it in</b>.</li></ol>
    <textarea class="mono" rows="5" readonly id="sendtxt" style="width:100%">${esc(txt)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="copysend">Copy</button><button class="btn" data-close>Done</button></div>`});
}
async function copyText(t, ta){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  if(ta){ ta.select(); try{ return document.execCommand("copy"); }catch(e){} }
  return false;
}

/* ---------- files ---------- */
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvOf(g){
  const R = replay(g), cols = ["team","num","name","pos","pts","fgm","fga","tpm","tpa","ftm","fta","oreb","dreb","reb","ast","stl","blk","to","pf","tech","plus_minus"];
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
  const lines = [cols.join(",")];
  for(const tm of ["us","them"]) for(const p of sortRoster(roster(g, tm))){ const ln = R.box[tm][p.pid]; if(!ln) continue;
    lines.push([tmName(g, tm), p.num, p.name, p.pos || "", ln.pts, ln.fgm, ln.fga, ln.tpm, ln.tpa, ln.ftm, ln.fta, ln.oreb, ln.dreb, ln.oreb + ln.dreb, ln.ast, ln.stl, ln.blk, ln.to, ln.pf, ln.tf, ln.pm].map(q).join(",")); }
  return lines.join("\n") + "\n";
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target;
  if(t.matches(".sheet-wrap") || t.closest("button[data-close]")){ closeSheet(); return; }
  const tab = t.closest("[data-tab]");
  if(tab && tab.closest("#tabs")){ ui.tab = tab.dataset.tab; ui.fu = ui.tab === "desk" ? ui.fu : []; saveUi(); render(); window.scrollTo(0, 0); return; }
  const st = t.closest("[data-st]");
  if(st && !st.disabled){ stat(st.dataset.tm, st.dataset.pid || null, st.dataset.st); return; }
  const fu = t.closest("[data-fu]");
  if(fu){ const k = fu.dataset.fu;
    if(k === "skip"){ ui.fu.shift(); renderFu(); }

function pasteRoster(team){
  sheetText("Paste the " + S.teams[team].name + " roster", "One player per line: number, name, position (position optional)", "", txt => {
    const add = []; for(const line of txt.split(/\n/)){ const m = line.trim().match(/^#?(\d{1,2})[\s,.\-:]+([^,\t]+?)(?:[\s,\t]+(PG|SG|SF|PF|G|F|C|G\/F|F\/C|Guard|Forward|Center|Wing|Post))?\s*$/i); if(m) add.push({pid:rid(), num:m[1], name:m[2].trim(), pos:(m[3] || "").toUpperCase()}); }
    if(!add.length){ toast("Didn't find any players. Try lines like: 12 Jaylen Smith G"); return; }
    const R = S.teams[team].roster;
    for(const p of add){ const same = R.find(x => x.num === p.num); if(same){ same.name = p.name; if(p.pos) same.pos = p.pos; } else R.push(p); }
    S.teamsRev++; save(); Sync.dirtyTeams(); render(); toast(add.length + " players added or updated.");
  }, 10, "0 Jaylen Smith PG\n3 Marcus Lee SG\n22 Tre Davis F");

function restore(text){
  let o; try{ o = JSON.parse(text); }catch(e){ toast("That file isn't a Brier Stats backup."); return; }
  if(!o || !o.brierstats || !o.games){ toast("That file isn't a Brier Stats backup."); return; }
  let n = 0;
  for(const [id, g] of Object.entries(o.games)){ const m = S.games[id]; if(!m || (g.rev || 0) > (m.rev || 0)){ S.games[id] = g; n++; Sync.dirty(id); } }
  if(o.say) Object.assign(S.say, o.say);
  if(o.booth) for(const [id, b] of Object.entries(o.booth)) if(!S.booth[id] || (b.upd || 0) > (S.booth[id].upd || 0)) S.booth[id] = b;
  if(o.teams && confirm("Also replace the rosters with the ones in the backup?")){ S.teams = o.teams; S.teamsRev++; Sync.dirtyTeams(); }
  save(); render(); toast("Restored " + n + " games.");
}

const RULES = "rules_version = '2';\n// Mound Book live sync. Only people Coach lets in can read or write anything.\n// The owner email below is filled in by Mound Book when it shows you these rules.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn() { return request.auth != null; }\n    function member() { return signedIn() && exists(/databases/$(db)/documents/members/$(request.auth.uid)); }\n    function role() { return get(/databases/$(db)/documents/members/$(request.auth.uid)).data.role; }\n    function owner() { return member() && role() == 'owner'; }\n    function ownerEmail() { return request.auth.token.email != null && request.auth.token.email.lower() == 'kevcriswell@gmail.com'; }\n\n    // Claiming the program: only the owner email, only once, and only together with the owner's member record.\n    match /config/owner {\n      allow read: if signedIn();\n      allow create: if signedIn() && ownerEmail()\n        && request.resource.data.uid == request.auth.uid\n        && getAfter(/databases/$(db)/documents/members/$(request.auth.uid)).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    // Pitch-count rules and pitch types: everyone reads, Coach sets them.\n    match /config/{name} {\n      allow read: if member();\n      allow write: if owner() && name != 'owner';\n    }\n    match /members/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || member());\n      allow create: if owner()\n        || (signedIn() && uid == request.auth.uid && ownerEmail()\n            && request.resource.data.role == 'owner'\n            && !exists(/databases/$(db)/documents/config/owner)\n            && existsAfter(/databases/$(db)/documents/config/owner));\n      allow update, delete: if owner();\n    }\n    // \"Let me in\" requests from a new phone. Coach approves them inside Mound Book.\n    match /requests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || owner());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Which devices are running which version, so Coach can see the iPad is up to date.\n    match /devices/{dev} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.uid == request.auth.uid;\n      allow delete: if owner();\n    }\n    // One document per game. Our hitters' names never come here, only lineup slot and bats.\n    // A copy can't go backwards: rev never decreases. A game moves to another device only when Coach moves it\n    // or a signed-in coach taps Take over (that copy names them in takeover).\n    match /games/{gid} {\n      allow read: if member();\n      // Only Coach deletes a game for everyone, or brings a deleted one back.\n      allow create: if member() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if member()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (request.resource.data.writerDev == resource.data.writerDev || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // Opposing pitchers. A merged-away kid stays as a tombstone naming the record he joined (mergedInto).\n    match /pitchers/{pid} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.id == pid;\n      allow delete: if owner();\n    }\n\n    // ---------- Brier Stats (basketball) ----------\n    // Its own people list: being let into Brier Stats does not let anyone into Mound Book, and the other way round.\n    // Coach (the Mound Book owner) is in both. Scorers write games; viewers only watch.\n    function hoopsIn() { return signedIn() && (owner() || exists(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid))); }\n    function hoopsScorer() { return signedIn() && (owner() || (exists(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid))\n        && get(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid)).data.role == 'scorer')); }\n    match /hoopsMembers/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || hoopsIn());\n      allow write: if owner();\n    }\n    match /hoopsRequests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || owner());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Rosters and settings.\n    match /hoopsBook/{name} {\n      allow read: if hoopsIn();\n      allow write: if hoopsScorer();\n    }\n    // One document per game, the whole play-by-play inside. A copy can't go backwards (rev never decreases), and a game\n    // moves to another device only when Coach moves it or a scorer taps Take over (that copy names them in takeover).\n    match /hoopsGames/{gid} {\n      allow read: if hoopsIn();\n      allow create: if hoopsScorer() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if hoopsScorer()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (resource.data.writer == null || request.resource.data.writer == resource.data.writer\n            || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // The table (subs waiting to check in), booth notes and name notes: not stats, so the announcer can add to them too.\n    match /hoopsBooth/{doc} {\n      allow read, write: if hoopsIn();\n    }\n  }\n}\n";
const Sync = (() => {
  const st = {phase:"off", err:"", uid:null, email:"", name:"", role:null, fb:null, auth:null, db:null, unsub:[], reqs:[], mems:[],
    dirty:new Set(), boothDirty:new Set(), teamsDirty:false, sayDirty:false, pushing:false, timer:null, mode:"in", busy:false};
  const live = () => st.phase === "live";
  const paint = () => softRender();
  function clear(){ st.unsub.forEach(u => { try{ u(); }catch(e){} }); st.unsub = []; }
  async function start(){
    if(st.fb || st.phase === "loading") return;
    if(location.protocol === "file:"){ st.phase = "error"; st.err = "Live sync needs the app's web address, not a file."; paint(); return; }
    st.phase = "loading"; paint();
    try{
      const fb = await import(new URL("fb.js", document.baseURI).href);
      const app = fb.initializeApp(FB, "moundbook");       // same app name as Mound Book: one sign-in covers both on this site
      const auth = fb.initializeAuth(app, {persistence: fb.browserLocalPersistence});
      const db = fb.initializeFirestore(app, {localCache: fb.memoryLocalCache()});
      Object.assign(st, {fb, auth, db});
      S.sync = true; save();
      fb.onAuthStateChanged(auth, u => onUser(u));
    }catch(e){ st.phase = "error"; st.err = "Couldn't reach the sync service (no signal?). Scoring still works and saves here; it sends when there's signal."; paint(); }
  }
  async function onUser(u){
    clear();
    if(!u){ Object.assign(st, {uid:null, email:"", role:null, phase:"signedout"}); paint(); return; }
    const {fb, db} = st;
    Object.assign(st, {uid:u.uid, email:(u.email || "").toLowerCase(), name:u.displayName || ""});
    try{
      const m = await fb.getDoc(fb.doc(db, "members", u.uid));
      if(m.exists() && m.data().role === "owner"){ st.role = "owner"; st.phase = "live"; goLive(); return; }
    }catch(e){ /* not a Mound Book member: fine */ }
    st.unsub.push(fb.onSnapshot(fb.doc(db, "hoopsMembers", u.uid), snap => {
      if(snap.exists()){ const r = snap.data().role === "scorer" ? "scorer" : "viewer"; if(st.phase !== "live"){ st.role = r; st.phase = "live"; goLive(); } else if(r !== st.role){ st.role = r; paint(); } }
      else { st.role = null; if(st.phase === "live"){ clear(); onUser(st.auth.currentUser); return; } st.phase = "waiting"; fb.setDoc(fb.doc(db, "hoopsRequests", u.uid), {email:st.email, name:st.name || "", at:Date.now()}).catch(fail); paint(); }
    }, fail));
  }
  function fail(e){
    const c = (e && e.code) || "";
    st.err = c.includes("permission") ? "The cloud won't let this device in. Coach: publish the rules below (Firebase console › Firestore › Rules)." : "Sync hiccup: " + ((e && e.message) || c || "unknown") + ". Scoring still saves here.";
    if(c.includes("permission")) st.phase = "error";
    paint();
  }
  function goLive(){
    const {fb, db} = st;
    if(!canScore() && ui.tab === "desk" && !ANN_ONLY){ ui.tab = "ann"; saveUi(); }
    st.unsub.push(fb.onSnapshot(fb.collection(db, "hoopsGames"), snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        const r = ch.doc.data(), id = ch.doc.id, l = S.games[id];
        if(ch.type === "removed"){ if(l && !st.dirty.has(id)){ delete S.games[id]; changed = true; } return; }
        if(!r || !r.id) return;
        if(!l || (r.rev || 0) > (l.rev || 0) || (r.writer !== l.writer && (r.rev || 0) >= (l.rev || 0))){
          if(l && l.writer === S.dev && r.writer !== S.dev) toast("Another device took over scoring " + (r.opp || "this game") + ".", 4000);
          S.games[id] = r; st.dirty.delete(id); changed = true;
        }
      });
      if(changed){ save(); softRender(); }
    }, fail));
    st.unsub.push(fb.onSnapshot(fb.collection(db, "hoopsBooth"), snap => {
      let changed = false;
      snap.docs.forEach(d => { const r = d.data();
        if(d.id === "_say"){ if((r.upd || 0) > (S.sayUpd || 0)){ S.say = r.say || {}; S.sayUpd = r.upd; changed = true; } return; }
        const l = S.booth[d.id]; if(!l || (r.upd || 0) > (l.upd || 0)){ S.booth[d.id] = {table:r.table || {us:[], them:[]}, said:r.said || [], notes:r.notes || "", upd:r.upd || 0}; changed = true; } });
      if(changed){ save(); softRender(); }
    }, fail));
    st.unsub.push(fb.onSnapshot(fb.doc(db, "hoopsBook", "teams"), snap => {
      if(!snap.exists()){ if(canScore()){ st.teamsDirty = true; kick(300); } return; }
      const r = snap.data();
      if((r.rev || 0) > (S.teamsRev || 0) || !canScore()){ S.teams = r.teams; S.teamsRev = r.rev || 0; if(r.settings) Object.assign(S.settings, r.settings); save(); softRender(); }
      else if((r.rev || 0) < (S.teamsRev || 0)){ st.teamsDirty = true; kick(300); }
    }, fail));
    if(st.role === "owner"){
      st.unsub.push(fb.onSnapshot(fb.collection(db, "hoopsRequests"), snap => { st.reqs = snap.docs.map(d => ({uid:d.id, ...d.data()})); paint(); }, fail));
      st.unsub.push(fb.onSnapshot(fb.collection(db, "hoopsMembers"), snap => { st.mems = snap.docs.map(d => ({uid:d.id, ...d.data()})); paint(); }, fail));
    }
    // games this device scored while offline go up now
    Object.values(S.games).forEach(g => { if(g.writer === S.dev && !g.practice && g.rev) st.dirty.add(g.id); });
    paint(); kick(500);
  }
  function dirty(id){ const g = S.games[id]; if(!g || g.practice) return; st.dirty.add(id); kick(600); }
  function dirtyBooth(id){ if(id === "practice") return; st.boothDirty.add(id); kick(600); }
  function dirtyTeams(){ st.teamsDirty = true; kick(700); }
  function dirtySay(){ st.sayDirty = true; kick(700); }
  function kick(ms){ clearTimeout(st.timer); st.timer = setTimeout(push, ms); }
  const clean = o => JSON.parse(JSON.stringify(o));
  async function push(){
    if(!live() || st.pushing) return;
    st.pushing = true;
    const {fb, db} = st;
    try{
      if(canScore()) for(const id of [...st.dirty]){
        const g = S.games[id]; if(!g || g.practice || (g.writer && g.writer !== S.dev && st.role !== "owner")){ st.dirty.delete(id); continue; }
        const rev = g.rev; await fb.setDoc(fb.doc(db, "hoopsGames", id), clean(g));
        if(S.games[id] && S.games[id].rev === rev) st.dirty.delete(id);
      }
      for(const id of [...st.boothDirty]){ const b = S.booth[id]; st.boothDirty.delete(id); if(b) await fb.setDoc(fb.doc(db, "hoopsBooth", id), clean(b)); }
      if(st.sayDirty){ st.sayDirty = false; await fb.setDoc(fb.doc(db, "hoopsBooth", "_say"), clean({say:S.say, upd:S.sayUpd || Date.now()})); }
      if(st.teamsDirty && canScore()){ st.teamsDirty = false; await fb.setDoc(fb.doc(db, "hoopsBook", "teams"), clean({teams:S.teams, rev:S.teamsRev || 0, settings:S.settings, upd:Date.now()})); }
      st.err = "";
    }catch(e){ fail(e); }
    st.pushing = false;
    if(st.dirty.size || st.boothDirty.size) kick(3000);
  }
  setInterval(() => { if(live() && (st.dirty.size || st.boothDirty.size || st.teamsDirty || st.sayDirty)) kick(100); }, 8000);
  window.addEventListener("online", () => kick(500));

  async function approve(uid, role){ const {fb, db} = st; const r = st.reqs.find(x => x.uid === uid) || st.mems.find(x => x.uid === uid) || {};
    const b = fb.writeBatch(db); b.set(fb.doc(db, "hoopsMembers", uid), {role, email:r.email || "", name:r.name || "", at:Date.now()}); b.delete(fb.doc(db, "hoopsRequests", uid)); await b.commit(); }
  function authMsg(e){ const c = (e && e.code) || ""; if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "That email and password don't match. Same account as Mound Book, if you have one."; if(c.includes("email-already")) return "That email already has an account. Sign in instead."; if(c.includes("weak-password")) return "Password needs at least 6 characters."; if(c.includes("network")) return "No signal. Try again when you have some."; if(c.includes("too-many")) return "Too many tries. Wait a minute."; return (e && e.message) || "Didn't work."; }
  function panel(){
    let h = `<div class="card stack"><h3 style="font-size:22px">Live sync</h3>`;
    if(st.err) h += `<div class="flag bad">${esc(st.err)}</div>`;
    if(st.phase === "off") h += `<p style="margin:0">One device scores; everyone Coach lets in follows it live on the Announcer page. Same sign-in as Mound Book.</p><div class="row"><button class="btn primary" data-act="sy-start">Turn on live sync</button></div>`;
    else if(st.phase === "loading") h += `<p style="margin:0">Connecting…</p>`;
    else if(st.phase === "error") h += `<div class="row"><button class="btn" data-act="sy-retry">Try again</button>${st.fb && st.uid ? `<button class="btn" data-act="sy-out">Sign out</button>` : ""}</div>`;
    else if(st.phase === "signedout") h += `<form id="sy-auth" class="stack" style="max-width:420px">
      <div class="row"><button type="button" class="btn sm" data-act="sy-mode" data-m="in" aria-pressed="${st.mode === "in"}">Sign in</button><button type="button" class="btn sm" data-act="sy-mode" data-m="up" aria-pressed="${st.mode === "up"}">New account</button></div>
      ${st.mode === "up" ? `<label class="fld"><span>Your name</span><input type="text" name="name" autocomplete="name"></label>` : ""}
      <label class="fld"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="fld"><span>Password</span><input type="password" name="pw" autocomplete="${st.mode === "up" ? "new-password" : "current-password"}" required minlength="6"></label>
      <div class="row"><button class="btn primary" type="submit" ${st.busy ? "disabled" : ""}>${st.mode === "up" ? "Create account" : "Sign in"}</button>${st.mode === "in" ? `<button type="button" class="btn" data-act="sy-reset">Forgot password</button>` : ""}</div></form>`;
    else if(st.phase === "waiting") h += `<p style="margin:0">Signed in as <b>${esc(st.email)}</b>. Waiting for Coach to let you in. This page updates by itself.</p><div class="row"><button class="btn" data-act="sy-out">Sign out</button></div>`;
    else if(st.phase === "live"){
      h += `<p style="margin:0">Signed in as <b>${esc(st.email)}</b> · ${st.role === "owner" ? "Coach (owner)" : st.role === "scorer" ? "Scorer" : "Viewer"}. ${st.dirty.size ? st.dirty.size + " game(s) waiting to send." : "Everything's sent."}</p><div class="row"><button class="btn" data-act="sy-out">Sign out</button></div>`;
      if(st.role === "owner"){
        const row = (who, btns) => `<div class="row between" style="border-bottom:1px solid var(--grey);padding:6px 0"><span>${who}</span><span class="row">${btns}</span></div>`;
        h += `<div><div class="kicker" style="margin-bottom:4px">Asking to get in</div>${st.reqs.length ? st.reqs.map(r => row(`<b>${esc(r.name || r.email)}</b> ${esc(r.email)}`, `<button class="btn sm primary" data-act="sy-approve" data-uid="${r.uid}" data-role="scorer">Scorer</button><button class="btn sm primary" data-act="sy-approve" data-uid="${r.uid}" data-role="viewer">Viewer</button><button class="btn sm" data-act="sy-deny" data-uid="${r.uid}">No</button>`)).join("") : `<p style="margin:0">Nobody waiting.</p>`}</div>
          <div><div class="kicker" style="margin-bottom:4px">Let in</div>${st.mems.length ? st.mems.map(m => row(`<b>${esc(m.name || m.email)}</b> ${esc(m.email)} · ${m.role === "scorer" ? "Scorer" : "Viewer"}`, `<button class="btn sm" data-act="sy-approve" data-uid="${m.uid}" data-role="${m.role === "scorer" ? "viewer" : "scorer"}">Make ${m.role === "scorer" ? "viewer" : "scorer"}</button><button class="btn sm dark" data-act="sy-remove" data-uid="${m.uid}">Remove</button>`)).join("") : `<p style="margin:0">Just you so far.</p>`}</div>`;
      }
    }
    if(st.role === "owner" || st.phase === "error")
      h += `<details><summary style="font-weight:600;cursor:pointer">Firestore rules (Coach, one time)</summary><p style="font-size:14px">Firebase console › Firestore Database › Rules: replace everything with this and tap Publish. It's Mound Book's rules plus the basketball part. <b>Don't re-copy the rules from Mound Book afterward</b> or basketball loses access; copy them from here.</p>
        <textarea class="mono" rows="8" readonly id="rulestxt" style="width:100%">${esc(RULES)}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="sy-copyrules">Copy rules</button></div></details>`;
    return h + `</div>`;
  }
  async function click(act, a){
    const {fb, db} = st;
    try{
      if(act === "sy-start") await start();
      else if(act === "sy-retry"){ st.err = ""; if(st.fb) onUser(st.auth.currentUser); else { st.phase = "off"; await start(); } }
      else if(act === "sy-mode"){ st.mode = a.dataset.m; render(); }
      else if(act === "sy-out"){ clear(); await fb.signOut(st.auth); S.sync = false; save(); }
      else if(act === "sy-reset"){ const e = ($("#sy-auth [name=email]") || {}).value; if(!e){ toast("Type your email first."); return; } await fb.sendPasswordResetEmail(st.auth, e.trim()); toast("Check your email for a reset link."); }
      else if(act === "sy-approve"){ await approve(a.dataset.uid, a.dataset.role); toast("Done."); }
      else if(act === "sy-deny") await fb.deleteDoc(fb.doc(db, "hoopsRequests", a.dataset.uid));
      else if(act === "sy-remove"){ if(confirm("Remove this person from Brier Stats?")) await fb.deleteDoc(fb.doc(db, "hoopsMembers", a.dataset.uid)); }
      else if(act === "sy-copyrules"){ const ok = await copyText(RULES, $("#rulestxt")); toast(ok ? "Rules copied." : "Select the rules and copy them by hand."); }
    }catch(e){ toast(authMsg(e), 4000); }
  }
  async function submit(f){
    if(f.id !== "sy-auth") return;
    const d = new FormData(f), em = String(d.get("email")).trim(), pw = String(d.get("pw")), nm = String(d.get("name") || "").trim();
    st.busy = true; render();
    try{
      if(st.mode === "up"){ const c = await st.fb.createUserWithEmailAndPassword(st.auth, em, pw); if(nm){ try{ await st.fb.updateProfile(c.user, {displayName:nm}); st.name = nm; }catch(e){} } }
      else await st.fb.signInWithEmailAndPassword(st.auth, em, pw);
    }catch(e){ toast(authMsg(e), 5000); }
    st.busy = false; render();
  }
  return {start, live, dirty, dirtyBooth, dirtyTeams, dirtySay, panel, click, submit,
    phase:() => st.phase, role:() => st.role, uid:() => st.uid,
    label:() => (st.role === "owner" ? "Coach" : st.role === "scorer" ? "Scorer" : "Viewer") + " · live"};
})();

/* ---------- boot ---------- */
load();
if(!ui.gid || !S.games[ui.gid]){
  const today = new Date().toISOString().slice(0, 10);
  const next = Object.values(S.games).filter(g => !g.practice && !g.deleted && g.date >= today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
  ui.gid = next ? next.id : "practice";
}
render();
if(S.sync) Sync.start();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
