<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#094A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brier Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Brier Stats</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Greenbrier Basketball Live Stats">
<meta property="og:description" content="Live score, box score and play-by-play for the Bobcats and Lady Cats.">
<meta property="og:image" content="https://votclive.github.io/moundbook/hoops/og-live.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
/* Greenbrier brand kit (same rules as the VOTC Live app): four colors only. Green leads, white is the ground, grey is for
   outlines and rules (never text on white), black is the working accent. Big Shoulders Display in caps for headlines,
   names, scores and labels; Barlow for sentences. Square blocks, 4px buttons, 8px cards, one hard black shadow per screen
   (the score). Layout follows Jim's ChatGPT draft: home team | scoreboard | away team, tap-a-stat buttons on each player. */
:root{
  --green:#094A28; --white:#FFFFFF; --grey:#A0A0A0; --black:#000000;
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--white);color:var(--black)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1}
.kicker{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.small{font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:0 12px}

/* Top bar: solid green block, Bobcat Head as drawn, tabs on the same row so the desk keeps its height. */
.top{background:var(--green);color:var(--white);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand img{width:38px;height:37px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--white);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:16px 9px 12px;border-bottom:4px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--white)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--white);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill i{width:8px;height:8px;background:var(--grey);display:inline-block}
.pill.live i{background:var(--white)}
.pill.bad{background:var(--black);border-color:var(--black)}
main{padding:6px 0 24px}
body.has-fu main{padding-bottom:260px}

/* Generic bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 12px;font-weight:600;min-height:38px;text-decoration:none;color:var(--black)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--green);color:var(--white);border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--white);border:1px solid var(--grey);border-radius:8px;padding:14px}
.stack{display:grid;gap:12px}
.flag{border:2px solid var(--black);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.flag.bad{background:var(--black);color:var(--white)}
.flag.ok{background:var(--green);color:var(--white);border-color:var(--green)}
.flag .btn{color:var(--black)}
label.fld{display:grid;gap:4px;font-size:14px}
label.fld span{font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 9px;min-height:38px;width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--grey);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
tr.tot td{font-weight:700;border-top:2px solid var(--black)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--black);color:var(--white);padding:9px 16px;border-radius:4px;z-index:60;font-weight:600;max-width:92vw;text-align:center}
.tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--black)}
.tag.solid{background:var(--black);color:var(--white)}
.tag.green{background:var(--green);color:var(--white);border-color:var(--green)}

/* ---------- Desk: sized so an iPad in landscape (or a laptop) shows the whole game without scrolling ---------- */
.deskhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--black);margin-bottom:6px}
.deskhead .game{flex:1;min-width:200px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.deskhead h2{font-size:24px}
.periods{display:flex;gap:4px}
.periods button{min-width:44px;min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-family:var(--f-display);font-weight:800;font-size:17px}
.periods button.on{background:var(--green);color:var(--white);border-color:var(--green)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:12px;align-items:start}
.tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tc-head img{width:34px;height:33px}
.tc-head .init,.orow .init{width:34px;height:34px;flex:none;border:2px solid var(--ta,var(--grey));border-radius:4px;background:var(--tf,var(--white));color:var(--ti,var(--black));display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:.02em}
.tc-head h3{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tl,var(--black))}
.tc-head h3 small{font-size:.62em;font-weight:700;letter-spacing:.04em}
button.tc-name{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.tc-head .side{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em}
.find{min-height:32px!important;padding:4px 8px!important;font-size:14px;margin-bottom:6px}

.table-bar{border:2px solid var(--tl,var(--green));border-radius:8px;padding:5px 7px;margin-bottom:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.table-bar .kicker{color:var(--tl,var(--green));margin-right:2px}
.pcard{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;border:1px solid var(--grey);border-radius:8px;padding:4px 6px;margin-bottom:4px;background:var(--white)}
.pcard.on{border-left:5px solid var(--tl,var(--green));padding-left:5px}
.pcard.fo{border-style:dashed}
.pnum{width:42px;height:42px;border-radius:4px;border:2px solid var(--ta,var(--tf,var(--green)));background:var(--tf,var(--green));color:var(--ti,var(--white));font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;padding:0}
.pline{display:flex;gap:8px;align-items:baseline;min-width:0;margin-bottom:3px;height:20px}
.pline b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.pline span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pfp{flex:none;align-self:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;letter-spacing:.04em;padding:3px 5px;border-radius:4px;border:1px solid transparent;color:var(--black)}
.pfp.box{border-color:var(--black)}
.pfp.solid{background:var(--black);color:var(--white);border-color:var(--black)}
.pline .pts{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1;flex:none;margin-left:auto}
.sb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.sb + .sb{margin-top:3px}
.sb.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.sb button{min-height:31px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;padding:0 2px}
.sb button.mk{background:var(--tf,var(--green));border-color:var(--tf,var(--green));color:var(--ti,var(--white))}
.sb button.ms{border:1.5px solid var(--black)}
.sb button.fl{background:var(--black);border-color:var(--black);color:var(--white)}
.sb button:active{transform:scale(.96);outline:3px solid var(--black)}
.bench{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.bench .kicker{margin-right:2px}
.bench .kicker.full{width:100%}
.chip{min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-weight:700;padding:3px 9px;font-size:14px}
.chip b{font-family:var(--f-display);font-weight:900;font-size:17px;margin-right:3px}
.chip.at{background:var(--tf,var(--green));border-color:var(--tf,var(--green));color:var(--ti,var(--white))}
.chip.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.chip.skip{border-style:dashed}

.board{background:var(--green);color:var(--white)}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--grey)}
.board .q{background:var(--white);color:var(--green);border-radius:4px;padding:1px 8px;font-weight:900;font-size:17px;letter-spacing:.02em;flex:none}
.board .sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:5px 6px 2px;text-align:center}
.board .sc .tm,.ann .big .tm{border-radius:4px;background:var(--tf,transparent);color:var(--ti,var(--white));min-width:0}
.board .sc .tm{padding:1px 3px 3px}
.board .sc .t{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .sc .n{font-family:var(--f-display);font-weight:900;font-size:60px;line-height:1;text-shadow:-3px 4px 0 var(--ts,var(--black))}
.board .sc .poss{font-size:18px}
.board table{color:var(--white);font-size:13px}
.board th,.board td{border-color:var(--grey);color:var(--white);padding:3px 6px}
.board td:first-child{font-family:var(--f-display);font-weight:700;text-transform:uppercase}
.tbox{border:1px solid var(--grey);border-radius:8px;padding:5px 7px;margin-top:8px}
.tbox .th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbox .th b{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbox .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0}
.tbox .fouls,.tbox .tmo{display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:36px;font-size:12.5px;font-weight:600;padding:2px 4px}
.tbox .tmo{border:1px solid var(--grey);border-radius:4px;background:var(--white)}
.tbox .fouls b,.tbox .tmo b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1}
.tbox .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tbox .grid button{min-height:30px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-weight:600;font-size:12.5px;padding:0 2px}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cact .btn{min-height:34px;font-size:13px;padding:4px 6px}
.cact .wide{grid-column:span 2}
.mini{margin-top:8px;border-top:2px solid var(--black)}
.mini .plays li{padding:4px 2px;font-size:13px}

/* Follow-up strip (assist / rebound / shot spot / sub): pinned to the bottom, never blocks the next tap. */
.fu{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:4px solid var(--green);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.fu .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0}
.fu .ask{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-right:6px}
.court{display:block;width:100%;max-width:520px;height:auto;touch-action:manipulation}
.court .fl{fill:var(--white);stroke:var(--black);stroke-width:3}
.court line,.court path,.court circle.ln,.court rect.ln{fill:none;stroke:var(--grey);stroke-width:3}
.fu .court{max-width:240px}
@media (min-width:901px){
  .fu.loc{left:50%;right:auto;width:300px;transform:translateX(-50%);border:4px solid var(--green);border-bottom:0;border-radius:8px 8px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.28)}
  .fu.loc .wrap{justify-content:space-between}
  .fu.loc .court{max-width:none;width:100%}
}
@media (min-width:901px) and (max-width:1180px){ .fu.loc{width:272px} }

/* Plays */
.plays{list-style:none;margin:0;padding:0}
.plays li{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--grey)}
.plays .pq{font-family:var(--f-display);font-weight:800;min-width:30px}
.plays .ps{font-family:var(--f-display);font-weight:900;min-width:52px;text-align:center;font-size:16px}
.plays .pt{flex:1;min-width:0}
.plays li.void .pt{text-decoration:line-through}
.plays li.score .pt b{color:var(--tl,var(--green))}
.plays li.note .pt{font-style:italic}

/* ---------- Announcer ---------- */
.ann .big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:10px;padding:10px 6px}
.ann .big .tm{border-radius:8px;padding:8px 6px 10px}
.ann .big .n{font-family:var(--f-display);font-weight:900;font-size:120px;line-height:.9;text-shadow:-4px 5px 0 var(--ts,var(--black))}
.ann .big .t{font-family:var(--f-display);font-size:30px;font-weight:800;text-transform:uppercase}
.ann .big .meta{font-size:15px;font-weight:600;margin-top:6px}
.ann .lastplay{font-size:20px;font-weight:600;text-align:center;padding:8px;border-top:1px solid var(--grey)}
.ann-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ann > *,.ann-cols > *{min-width:0}
.plays .pq small{display:block;font-size:11px;font-weight:500;letter-spacing:0}
.plays .ptm{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.05em;padding:0 4px;border-radius:3px;background:var(--tf,var(--green));color:var(--ti,var(--white))}
.board.linesc{max-width:560px;width:100%;justify-self:center;padding:4px 0}
.floor td{font-size:16px}
.floor td.nm{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;cursor:pointer}
.floor .say{font-family:var(--f-body);text-transform:none;font-weight:500;font-size:13px;font-style:italic;white-space:normal}
.subs{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.subs li{padding:3px 0;border-bottom:1px solid var(--grey)}
.lead{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lead .card{padding:10px}
.lead .lr{display:flex;gap:8px;align-items:center;border-top:1px solid var(--grey);padding-top:4px;margin-top:4px;min-width:0}
.lead .lr b{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;color:var(--tl,var(--green));min-width:36px}
.lead .lr span{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.lead .lr small{display:block;font-weight:500;font-size:12px}
.ann .arrow{display:grid;justify-items:center;font-size:30px;line-height:1}
.ann .arrow small{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ann .linesc{max-width:560px;width:100%;margin:0 auto;padding:0 6px}
.ann .lastplay div{line-height:1.35}
.ann .lastplay .hl-k{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ann .ago{text-align:center;padding:0 0 6px}
table.glance td,table.glance th{text-align:center}
table.glance td.l,table.glance th.l{text-align:left}
.annbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
body.annfull .top .tabs{visibility:hidden}
.annmode{display:inline-flex;border:2px solid var(--green);border-radius:4px;overflow:hidden;flex:none}
.annmode button{border:0;background:var(--white);color:var(--green);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:5px 16px;min-height:36px}
.annmode button[aria-pressed="true"]{background:var(--green);color:var(--white)}

/* ---------- PA script ---------- */
.livestrip{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:2px solid var(--black);padding:6px 0 8px;margin-bottom:10px;display:grid;gap:6px}
.ls-game{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:14px}
.ls-game .ls-sc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase}
.ls-game .ls-sc .tm{border-radius:4px;padding:1px 8px;background:var(--tf,var(--green));color:var(--ti,var(--white))}
.ls-game .ls-sc .tm b{font-weight:900;font-size:24px;margin-left:6px}
.micl{margin:4px 0 0;padding-left:20px;font-size:15px;line-height:1.45}
.seg{border:1px solid var(--grey);border-radius:8px;padding:10px 12px;display:grid;gap:6px;margin-bottom:8px}
.seg.next{border:3px solid var(--green);padding:8px 10px}
.seg.done .read{opacity:.45}
.seg.off{border-style:dashed}
.seg.later .read{opacity:.6}
.jumpnext{justify-self:start}
.seg[id]{scroll-margin-top:140px}
.ann .table-bar .chip,.livestrip .chip{font-size:20px;min-height:48px;padding:4px 12px}
.chip .say,.table-bar .say{display:block;font-size:13px;font-weight:500;font-style:italic;text-align:left}
.seg .cue{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.seg .read{font-size:20px;line-height:1.45;white-space:pre-wrap}
.seg .read b{font-weight:700}

<script>
"use strict";
/* Brier Stats: basketball scorebook for Greenbrier (Bobcats / Lady Cats).
   One device scores a game; everyone else signed in follows it live on the Announcer page. Each device's own saved copy is the
   truth and the cloud is only a pipe, so scoring never waits on signal. Mirrors Mound Book's design and shares its Firebase project.
   Every number on every screen is computed by replaying the game's play list, so a correction anywhere fixes everything. */
const BS_VERSION = "0.3.0";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pct = (m, a) => a ? Math.round(100 * m / a) + "%" : "–";
const PUB = /[?&#]live\b/.test(location.search + location.hash);           // the public page for fans: no sign-in, read only
const ANN_ONLY = !PUB && /[?&#]announcer\b/.test(location.search + location.hash);

/* ---------- schedule (from the 2026-27 master sheet in the social kit) ---------- */
const SCHEDULE = [
 ["2026-11-16","19:30","boys","Watertown","Away",0,"Hall of Fame (preseason)"],["2026-11-17","18:00","girls","White House Heritage","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-17","19:30","boys","White House Heritage","Away",0,"Hall of Fame (preseason)"],["2026-11-19","18:00","girls","Wilson Central","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-19","19:30","boys","Wilson Central","Away",0,"Hall of Fame (preseason)"],["2026-12-04","18:00","girls","Jo Byrns","Home",0,""],["2026-12-04","19:30","boys","Jo Byrns","Home",0,""],
 ["2026-12-07","18:00","girls","Merrol Hyde","Away",0,""],["2026-12-07","19:30","boys","Merrol Hyde","Away",0,""],["2026-12-08","18:00","girls","White House Heritage","Home",0,""],
 ["2026-12-08","19:30","boys","White House Heritage","Home",0,""],["2026-12-15","18:00","girls","KIPP Antioch","Away",0,""],["2026-12-15","19:30","boys","KIPP Antioch","Away",0,""],
 ["2026-12-18","18:00","girls","Gallatin","Away",0,"Christmas Classic"],["2026-12-18","19:30","boys","Gallatin","Away",0,"Christmas Classic"],
 ["2027-01-05","18:00","girls","East Robertson","Home",0,""],["2027-01-05","19:30","boys","East Robertson","Home",0,""],["2027-01-08","18:00","girls","Jo Byrns","Away",0,""],
 ["2027-01-08","19:30","boys","Jo Byrns","Away",0,""],["2027-01-12","18:00","girls","Springfield","Home",1,""],["2027-01-12","19:30","boys","Springfield","Home",1,""],
 ["2027-01-15","18:00","girls","White House","Home",1,""],["2027-01-15","19:30","boys","White House","Home",1,""],["2027-01-19","18:00","girls","Portland","Away",1,""],
 ["2027-01-19","19:30","boys","Portland","Away",1,""],["2027-01-22","18:00","girls","Liberty Creek","Away",1,""],["2027-01-22","19:30","boys","Liberty Creek","Away",1,""],
 ["2027-01-26","18:00","girls","Station Camp","Home",1,""],["2027-01-26","19:30","boys","Station Camp","Home",1,""],["2027-01-29","18:00","girls","Springfield","Away",1,""],
 ["2027-01-29","19:30","boys","Springfield","Away",1,""],["2027-02-02","18:00","girls","White House","Away",1,""],["2027-02-02","19:30","boys","White House","Away",1,""],
 ["2027-02-05","18:00","girls","Portland","Home",1,""],["2027-02-05","19:30","boys","Portland","Home",1,""],["2027-02-09","18:00","girls","Liberty Creek","Home",1,""],
 ["2027-02-09","19:30","boys","Liberty Creek","Home",1,""],["2027-02-12","18:00","girls","Station Camp","Away",1,""],["2027-02-12","19:30","boys","Station Camp","Away",1,""]];

/* ---------- saved data ----------
   S.games[id]: {id, date, time, team:"boys"|"girls", opp, ha:"Home"|"Away" (ours), district, event, quarters, qlen,
     us:[player] (our roster as of tip-off), them:[player], ev:[event], status:"pre"|"live"|"final", rev, upd, writer, takeover, deleted, practice}
   player: {pid, num, name, pos, grade ("Fr"|"So"|"Jr"|"Sr"), ht ("6-2")}
   event: {id, at, tm:"us"|"them", pid (null = team), t, ...}
     FG {p:2|3, m:bool, x?, y?}  FT {m}  REB {o:bool}  AST  STL  BLK  TO  PF  TF (technical; no pid = bench/coach)
     TMO {len:60|30}  IN  OUT  PER (ends the period)  POSS {to}  NOTE {txt}  v:true = voided (kept, struck through)
   S.booth[gid]: {table:{us:[pid], them:[pid]}, said:[pid], notes, info:{usCoach, oppCoach, officials, sponsor, honors},
     start:{us:[pid], them:[pid]}, done:[script line id], upd}: players waiting at the scorer's table, which of them the
     announcer has called, the booth's notes, and what the PA script needs (the starters the PA introduces, who coaches and
     officiates, tonight's sponsor, which script lines are read). Not stats, so the scorer and the announcer both change it.
   S.opps[name lowercased]: {mascot, girls, c1, c2, abbr}: what Coach changed about an opponent; OPP_PRESETS has the rest.
   S.script: {segs:[{id, at:"top"|"game"|"end", title, cue, text, need}], upd}: the PA's game-night script, null = the default.
   S.say[pid]: the announcer's note for a player (how to say the name, a fact). Our players keep their pid all season. */
const KEY = "brierstats.v1";
const SAVE = {ok: true, err: ""};
let S;
function blank(){
  return {v:1, dev:rid(), teams:{boys:{name:"Bobcats", roster:[]}, girls:{name:"Lady Cats", roster:[]}}, teamsRev:0,
    teamsBase:null, teamsPrev:null, strand:{}, games:{}, booth:{}, say:{}, sayUpd:0, opps:{}, script:null, settings:{bonus:5, to60:3, to30:2, quarters:4, qlen:8, otlen:4, chart:true, extra:true, pub:true, pubSec:30}, seeded:false, sync:false, unsent:{}, role:null};
}
// The book is one small key for rosters and settings plus one key per game, so a tap rewrites only its own game. A book
// saved by an older version keeps every game inside the main key; it moves over on the first save that has room.
const GKEY = KEY + ".g.", onDisk = new Map(), finalSig = new WeakMap();   // game id -> the JSON last written (or read) for it
let mainHasGames = false, MONO = false;
function load(){
  try{ const t = localStorage.getItem(KEY); S = t ? JSON.parse(t) : blank(); }catch(e){ S = blank(); SAVE.ok = false; SAVE.err = "This browser won't save (private browsing?)."; }
  if(!S.games) S.games = {};
  mainHasGames = Object.keys(S.games).length > 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); if(!k || !k.startsWith(GKEY)) continue;
      const t = localStorage.getItem(k), id = k.slice(GKEY.length); let g; try{ g = JSON.parse(t); }catch(e){ continue; }
      const o = S.games[id];   // both copies after an interrupted move: the newer one wins
      if(!o || (g.rev || 0) > (o.rev || 0) || ((g.rev || 0) === (o.rev || 0) && (g.upd || 0) >= (o.upd || 0))) S.games[id] = g;
      onDisk.set(id, t);
    }
  }catch(e){}
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // ask the browser not to clear it
  const b = blank();
  if(S.teamsBase === undefined && S.sync) S.teamsBase = S.teamsRev || 0;
  for(const k of Object.keys(b)) if(S[k] === undefined) S[k] = b[k];
  for(const k of Object.keys(b.settings)) if(S.settings[k] === undefined) S.settings[k] = b.settings[k];
  if(!S.seeded){
    SCHEDULE.forEach(([date,time,team,opp,ha,dist,event]) => { const g = newGame({date,time,team,opp,ha,district:!!dist,event}); if(!S.games[g.id]) S.games[g.id] = g; });
    S.games.practice = practiceGame(); S.seeded = true; save();
  }
  else if(mainHasGames) save();   // move an older book to one key per game now, while nothing else is going on
}
const LOCAL_SET = ["extra", "chart"];
function cloudSettings(s){ const o = {...s}; LOCAL_SET.forEach(k => delete o[k]); return o; }
function save(){
  try{
    if(MONO) localStorage.setItem(KEY, JSON.stringify(S));
    else {
      for(const id of Object.keys(S.games)){
        const g = S.games[id], sig = g.status === "final" ? [g.rev, g.upd, g.ev.length, g.writer, g.writerAt, g.deleted].join("|") : "";
        if(sig && finalSig.get(g) === sig && onDisk.has(id)) continue;   // a final game nobody touched: skip re-reading it
        const t = JSON.stringify(g); if(onDisk.get(id) !== t){ localStorage.setItem(GKEY + id, t); onDisk.set(id, t); }
        if(sig) finalSig.set(g, sig);
      }
      for(const id of [...onDisk.keys()]) if(!S.games[id]){ localStorage.removeItem(GKEY + id); onDisk.delete(id); }
      const {games, ...rest} = S; localStorage.setItem(KEY, JSON.stringify(rest)); mainHasGames = false;
    }
    SAVE.ok = true; SAVE.err = "";
  }catch(e){
    // No room to move an older book to one key per game: keep it in one key, as before, then clear the half-made copy.
    if(!MONO && mainHasGames){ try{ localStorage.setItem(KEY, JSON.stringify(S)); MONO = true; for(const id of onDisk.keys()) localStorage.removeItem(GKEY + id); onDisk.clear(); SAVE.ok = true; SAVE.err = ""; return; }catch(e2){} }
    SAVE.ok = false; SAVE.err = "This device stopped saving (" + (e.name || "storage full") + "). Back up the game from Setup now.";
  }
}
// Nothing in this book yet: no players and no game with plays (a Home Screen app opened for the first time).
function emptyBook(){ return !Object.values(S.teams || {}).some(t => t && t.roster && t.roster.length) && !Object.values(S.games).some(g => !g.practice && g.ev.length); }
// What this site keeps on this device (Mound Book shares the space), in bytes the way Safari counts them, against its
// limit of about 5 MB.
function storeUse(){
  let b = 0;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i), v = localStorage.getItem(k) || ""; b += (k.length + v.length) * (/[^\u0000-\u00ff]/.test(v) ? 2 : 1); } }catch(e){}
  return b;
}
function newGame(o){
  let id = o.id || (o.date + "-" + o.team);
  if(!o.id && S.games[id]){ let n = 2; while(S.games[id + "-" + n]) n++; id = id + "-" + n; }
  return {id, date:o.date, time:o.time||"", team:o.team, opp:o.opp||"Opponent", ha:o.ha||"Home", district:!!o.district, event:o.event||"",
    quarters:S.settings.quarters, qlen:S.settings.qlen, us:[], them:[], ev:[], status:"pre", rev:0, upd:Date.now(), writer:null, takeover:null, deleted:false, practice:!!o.practice};
}
function practiceGame(){
  const P = (num,name,pos) => ({pid:rid(), num:String(num), name, pos});
  const g = newGame({id:"practice", date:pubToday(), team:"boys", opp:"Visitors", ha:"Home", practice:true});
  g.us = [P(0,"Sample Guard","PG"),P(3,"Sample Wing","SG"),P(5,"Sample Shooter","G"),P(12,"Sample Reserve","G"),P(22,"Sample Post","PF"),P(24,"Sample Forward","F"),P(33,"Sample Center","C"),P(44,"Sample Big","C")];
  g.them = [P(1,"","G"),P(2,"","G"),P(10,"","F"),P(11,"","G"),P(15,"","F"),P(21,"","C"),P(30,"","F")];
  return g;
}

/* ---------- replay: every number comes from here ---------- */
const LINE = () => ({pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,to:0,pf:0,tf:0,pm:0,gp:0,po:0});
const OTHER = tm => tm === "us" ? "them" : "us";
function perLabel(g, q){ const Q = g.quarters || 4; return q <= Q ? "Q" + q : (q === Q + 1 ? "OT" : "OT" + (q - Q)); }
function replay(g){
  const R = {q:1, sc:{us:0,them:0}, qs:{us:[0],them:[0]}, tf:{us:{},them:{}}, tmo:{us:{60:0,30:0},them:{60:0,30:0}},
    box:{us:{},them:{}}, team:{us:LINE(),them:LINE()}, byQ:{}, court:{us:new Set(),them:new Set()}, plays:[], shots:[], lastMiss:null, poss:null, brk:false};
  const byId = new Map(); for(const e of g.ev) if(e.id) byId.set(e.id, e);
  const L = (tm, pid) => pid ? (R.box[tm][pid] || (R.box[tm][pid] = LINE())) : R.team[tm];
  // The same line, for this period only (box score by quarter).
  const LQ = (tm, pid) => { const b = R.byQ[R.q] || (R.byQ[R.q] = {us:{}, them:{}, team:{us:LINE(), them:LINE()}}); return pid ? (b[tm][pid] || (b[tm][pid] = LINE())) : b.team[tm]; };
  const add = (tm, pts) => {
    R.sc[tm] += pts; R.qs[tm][R.q-1] = (R.qs[tm][R.q-1] || 0) + pts;
    for(const t of ["us","them"]) R.court[t].forEach(pid => { L(t, pid).pm += t === tm ? pts : -pts; });
  };
  let flip = false;
  for(const e of g.ev){
    const q = R.q, before = {us:R.sc.us, them:R.sc.them};
    if(e.v){ R.plays.push({e, q, sc:before, void:true}); continue; }
    // An assist belongs to its basket: when that basket is removed, turned into a miss or moved to the passer, the
    // assist stops counting too (and comes back if the basket does).
    if(e.t === "AST" && e.ref){ const f = byId.get(e.ref);
      if(f && (f.v || !f.m || f.tm !== e.tm || f.pid === e.pid)){ R.plays.push({e, q, sc:before, void:true, auto:true}); continue; } }
    const tm = e.tm, ln = L(tm, e.pid), lq = LQ(tm, e.pid);
    const inc = (k, n = 1) => { ln[k] += n; lq[k] += n; };
    if(e.pid){ ln.gp = 1; lq.gp = 1; }
    // NFHS: each period after the first opens with the arrow team's throw-in, and the arrow switches after it.
    if(flip && R.poss && !["PER","IN","OUT","POSS","TMO","NOTE"].includes(e.t)){ R.poss = OTHER(R.poss); flip = false; }
    switch(e.t){
      case "FG": inc("fga"); if(e.p === 3) inc("tpa"); if(e.po){ ln.po = 1; lq.po = 1; }
        if(e.m){ inc("fgm"); if(e.p === 3) inc("tpm"); inc("pts", e.p); add(tm, e.p); R.lastMiss = null; } else R.lastMiss = tm;
        R.shots.push({e, q}); break;
      case "FT": inc("fta"); if(e.po){ ln.po = 1; lq.po = 1; } if(e.m){ inc("ftm"); inc("pts"); add(tm, 1); R.lastMiss = null; } else R.lastMiss = tm; break;
      case "REB": inc(e.o ? "oreb" : "dreb"); R.lastMiss = null; break;
      case "AST": inc("ast"); break;
      case "STL": inc("stl"); R.lastMiss = null; break;
      case "BLK": inc("blk"); break;
      case "TO": inc("to"); R.lastMiss = null; break;
      case "PF": inc("pf"); R.tf[tm][q] = (R.tf[tm][q] || 0) + 1; break;
      case "TF": inc("tf"); if(e.pid) inc("pf"); R.tf[tm][q] = (R.tf[tm][q] || 0) + 1; break;
      case "TMO": R.tmo[tm][e.len === 30 ? 30 : 60]++; break;
      case "IN": R.court[tm].add(e.pid); break;
      case "OUT": R.court[tm].delete(e.pid); break;
      case "PER": R.q++; R.qs.us[R.q-1] = 0; R.qs.them[R.q-1] = 0; R.lastMiss = null; flip = true; break;
      case "POSS": R.poss = e.to; flip = false; break;
    }
    R.plays.push({e, q, sc:{us:R.sc.us, them:R.sc.them}, scored:R.sc.us !== before.us || R.sc.them !== before.them});
  }
  // Between periods: the last thing that happened is the horn. Screens say "End of Q1" or "Halftime", not "Q2 0-0".
  for(let i = R.plays.length - 1; i >= 0; i--){ const p = R.plays[i]; if(p.void || p.e.t === "NOTE") continue; R.brk = p.e.t === "PER"; break; }
  return R;
}
// The period as a scoreboard says it: Q3, or END Q1 / HALFTIME / END REG between periods.
function nowLabel(g, R){
  if(!R.brk) return perLabel(g, R.q);
  const q = R.q - 1, Q = g.quarters || 4;
  return q === Q / 2 ? "HALFTIME" : q === Q ? "END REG" : "END " + perLabel(g, q);
}
// The last period with any play in it. A horn tapped just before Make it final doesn't open a new period.
function lastQ(R){ return R.brk ? R.q - 1 : R.q; }
// Team fouls toward the bonus right now. NFHS (2023-24 on): resets each quarter; overtime counts with Q4.
function teamFouls(g, R, tm){ const Q = g.quarters || 4; if(R.q <= Q) return R.tf[tm][R.q] || 0; let n = 0; for(let q = Q; q <= R.q; q++) n += R.tf[tm][q] || 0; return n; }
// A team is "in the bonus" (shooting free throws on every foul) when the OTHER team has reached the bonus foul.
function inBonus(g, R, tm){ return teamFouls(g, R, OTHER(tm)) >= S.settings.bonus; }
function toLeft(g, R, tm){ const ot = Math.max(0, R.q - (g.quarters || 4)); return {60: S.settings.to60 + ot - R.tmo[tm][60], 30: S.settings.to30 - R.tmo[tm][30]}; }

/* ---------- names ---------- */
function roster(g, tm){ if(tm === "them") return g.them; return (g.us && g.us.length) ? g.us : (S.teams[g.team] || {}).roster || []; }
function player(g, tm, pid){ return roster(g, tm).find(p => p.pid === pid) || null; }
function usName(g){ return g.usName || (S.teams[g.team] || {}).name || (g.team === "girls" ? "Lady Cats" : "Bobcats"); }
function tmName(g, tm){ return tm === "us" ? usName(g) : g.opp; }
function pLabel(g, tm, pid){ if(!pid) return tmName(g, tm) + " (team)"; const p = player(g, tm, pid); if(!p) return "?"; return "#" + p.num + (p.name ? " " + p.name : ""); }
function pShort(p){ if(!p) return ""; const w = (p.name || "").trim().split(/\s+/).filter(Boolean); while(w.length > 1 && /^(jr|sr|ii|iii|iv|v)\.?,?$/i.test(w[w.length - 1])) w.pop(); return (w.pop() || "").replace(/,$/, ""); }
function sortRoster(a){ return a.slice().sort((x, y) => (parseInt(x.num, 10) || 0) - (parseInt(y.num, 10) || 0) || String(x.num).localeCompare(String(y.num))); }
function homeAway(g){ return g.ha === "Away" ? {home:"them", away:"us"} : {home:"us", away:"them"}; }
function fmtDate(d){ try{ return new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}); }catch(e){ return d; } }
function fmtTime(t){ if(!t) return ""; const [h, m] = t.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h >= 12 ? " PM" : " AM"); }
function initials(n){ return String(n || "").split(/[\s-]+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 3).map(w => w[0].toUpperCase()).join("") || "?"; }
function shortName(n){ return String(n).length > 11 ? initials(n) : n; }
function badge(g, tm){ return tm === "us" ? `<img src="bobcat-head.png" alt="">` : `<span class="init">${esc(oppInfo(g.opp, g).abbr.slice(0, 4))}</span>`; }

/* ---------- opponents and team colors ----------
   Greenbrier is always the brand green. The opponent plays in its own colors: the number tiles, make buttons, table chips
   and its half of every scoreboard. OPP_PRESETS was researched for the 2026-27 schedule; Coach can change any of it under
   Rosters › Opponents (S.opps), and a new opponent starts in black until someone picks its colors. */
// Researched October 2026 and checked by a second, independent pass (TSSAA directory, school sites, MaxPreps, NFHS
// Network, local papers). Girls names are left blank where no source uses one; the app then uses the mascot.
const OPP_PRESETS = {
  "watertown":{name:"Watertown", mascot:"Purple Tigers", girls:"Lady Purple Tigers", c1:"#4B2E83", c2:"#FFFFFF", abbr:"WTN"},
  "white house heritage":{name:"White House Heritage", mascot:"Patriots", girls:"Lady Patriots", c1:"#022C66", c2:"#CC0022", abbr:"WHH"},
  "wilson central":{name:"Wilson Central", mascot:"Wildcats", girls:"Lady Wildcats", c1:"#034CB2", c2:"#C8880A", abbr:"WC"},
  "jo byrns":{name:"Jo Byrns", mascot:"Red Devils", girls:"Lady Red Devils", c1:"#CC0022", c2:"#FFFFFF", abbr:"JB"},
  "merrol hyde":{name:"Merrol Hyde", mascot:"Hawks", girls:"Lady Hawks", c1:"#4058C5", c2:"#C8880A", abbr:"MH"},
  "kipp antioch":{name:"KIPP Antioch", mascot:"Huskies", girls:"", c1:"#1D2945", c2:"#B9D4E7", abbr:"KAG"},
  "gallatin":{name:"Gallatin", mascot:"Green Wave", girls:"", c1:"#00824B", c2:"#C8880A", abbr:"GALL"},
  "east robertson":{name:"East Robertson", mascot:"Indians", girls:"Lady Indians", c1:"#800000", c2:"#FFFFFF", abbr:"ER"},
  "springfield":{name:"Springfield", mascot:"Yellow Jackets", girls:"", c1:"#C8880A", c2:"#FFFFFF", abbr:"SPFD"},
  "white house":{name:"White House", mascot:"Blue Devils", girls:"Lady Devils", c1:"#0033A0", c2:"#FFFFFF", abbr:"WH"},
  "portland":{name:"Portland", mascot:"Panthers", girls:"Lady Panthers", c1:"#45115B", c2:"#FFFFFF", abbr:"POR"},
  "liberty creek":{name:"Liberty Creek", mascot:"Wolves", girls:"Lady Wolves", c1:"#022C66", c2:"#CC0022", abbr:"LC"},
  "station camp":{name:"Station Camp", mascot:"Bison", girls:"", c1:"#8F0018", c2:"#454444", abbr:"SC"}};
const okey = n => String(n || "").trim().toLowerCase();
function autoAbbr(n){ const w = String(n || "").split(/[\s-]+/).filter(x => /^[A-Za-z]/.test(x)); return (w.length > 1 ? w.map(x => x[0]).join("").slice(0, 4) : (w[0] || "OPP").slice(0, 3)).toUpperCase(); }
function oppInfo(name, g){
  if(g && g.oi) return {name, ...g.oi};                       // a public copy carries its own
  const p = OPP_PRESETS[okey(name)] || {}, o = (S.opps || {})[okey(name)] || {};
  return {name, mascot:o.mascot ?? p.mascot ?? "", girls:o.girls ?? p.girls ?? "", c1:o.c1 || p.c1 || "", c2:o.c2 || p.c2 || "", abbr:(o.abbr || p.abbr || autoAbbr(name)).toUpperCase()};
}
// "Watertown Lady Tigers" for the girls game, "Watertown Purple Tigers" for the boys.
function oppNick(g){ const o = oppInfo(g.opp, g); return g.team === "girls" ? (o.girls || o.mascot) : o.mascot; }
function oppFull(g){ const n = oppNick(g); return n ? g.opp + " " + n : g.opp; }
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h || "");
function lum(h){ const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
function contrast(a, b){ const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
// Too close to our green to tell apart across a gym: any real green (hue about 75-175 degrees, not washed out), or
// anything within a short distance of #094A28. Navy and other dark blues are fine.
function nearGreen(h){
  const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if(Math.hypot((r - 9 / 255), (g - 74 / 255), (b - 40 / 255)) < .16) return true;
  if(d < .15 || mx > .92 && mn > .55) return false;
  const hue = (mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  return hue >= 75 && hue <= 175;
}
// fill: tiles and buttons; ink: text on the fill; line: the color as text or a rule on white; alt: the second color.
function inkOf(c1, c2){
  let a = hexOk(c1) ? c1.toUpperCase() : "", b = hexOk(c2) ? c2.toUpperCase() : "";
  if(!a) return {fill:"#000000", ink:"#FFFFFF", line:"#000000", alt:"", shadow:"#000000"};
  // Too pale to fill (white, silver, light gold) or too close to our green to tell apart: lead with the second color.
  if(b && (contrast(a, "#FFFFFF") < 1.5 || nearGreen(a)) && contrast(b, "#FFFFFF") >= 1.5 && !nearGreen(b)) [a, b] = [b, a];
  const ink = contrast(a, "#FFFFFF") >= contrast(a, "#000000") ? "#FFFFFF" : "#000000";
  const line = contrast(a, "#FFFFFF") >= 3 ? a : b && contrast(b, "#FFFFFF") >= 3 ? b : "#000000";
  return {fill:a, ink, line, alt:b, shadow:ink === "#FFFFFF" ? "#000000" : "transparent"};
}
const US_INK = {fill:"#094A28", ink:"#FFFFFF", line:"#094A28", alt:"", shadow:"#000000"};
function teamInk(g, tm){ if(tm === "us") return US_INK; const o = oppInfo(g.opp, g); return inkOf(o.c1, o.c2); }
function varsOf(k){ return `--tf:${k.fill};--ti:${k.ink};--tl:${k.line};--ts:${k.shadow}${k.alt ? ";--ta:" + k.alt : ""}`; }
// The style attribute that puts a block in a team's colors (ours are the page defaults).
function tvars(g, tm){ return tm === "us" ? "" : varsOf(teamInk(g, tm)); }
// Points-only scoring (Every stat off) records makes but not misses, so those lines show makes alone, never a made-attempted.
const shoot = (ln, m, a) => ln.po ? String(ln[m]) : ln[m] + "-" + ln[a];
function statLine(ln, noPf){
  const bits = [];
  if(ln.fga) bits.push(shoot(ln, "fgm", "fga") + " FG"); if(ln.tpa) bits.push(shoot(ln, "tpm", "tpa") + " 3PT"); if(ln.fta) bits.push(shoot(ln, "ftm", "fta") + " FT");
  const reb = ln.oreb + ln.dreb; if(reb) bits.push(reb + " REB"); if(ln.ast) bits.push(ln.ast + " AST"); if(ln.stl) bits.push(ln.stl + " STL"); if(ln.blk) bits.push(ln.blk + " BLK"); if(ln.to) bits.push(ln.to + " TO");
  if(!noPf) bits.push(ln.pf + " PF");
  return bits.join(" · ");
}

function playText(g, e){
  const who = esc(pLabel(g, e.tm, e.pid)), team = esc(tmName(g, e.tm));
  switch(e.t){
    case "FG": return e.m ? "<b>" + who + " makes " + e.p + "</b>" : who + " misses " + e.p;
    case "FT": return e.m ? "<b>" + who + " makes free throw</b>" : who + " misses free throw";
    case "REB": return (e.pid ? who : team + " team") + (e.o ? " offensive" : " defensive") + " rebound";
    case "AST": return who + " assist";
    case "STL": return who + " steal";
    case "BLK": return who + " block";
    case "TO": return (e.pid ? who : team + " team") + " turnover";
    case "PF": return who + " foul";
    case "TF": return (e.pid ? who : team + " bench/coach") + " technical foul";
    case "TMO": return "Timeout " + team + ", " + (e.len === 30 ? "30 seconds" : "60 seconds");
    case "IN": return who + " checks in";
    case "OUT": return who + " checks out";
    case "PER": return "End of " + perLabel(g, e.q || 0);
    case "POSS": return "Possession arrow → " + esc(tmName(g, e.to));
    case "NOTE": return esc(e.txt || "Note");
  }
  return esc(e.t);
}

/* ---------- ui state ---------- */
const ui = {open:{}, pa:true, tab:"desk", gid:null, find:{us:"", them:""}, lineup:null, fu:[], narrow:"home", shotTm:"all", shotPid:"", gfilter:"all", sheet:null, follow:true, annMode:"live", night:null, pubTm:"home"};
try{ const p = JSON.parse(localStorage.getItem(KEY + ".ui") || "{}"); if(p.tab) ui.tab = p.tab; if(p.gid) ui.gid = p.gid; if(p.annMode) ui.annMode = p.annMode; if(p.pa === false) ui.pa = false; }catch(e){}

function cur(){ const g = ui.gid && S.games[ui.gid]; return g && !g.deleted ? g : null; }
function canScore(){ return !Sync.live() || Sync.role() === "owner" || Sync.role() === "scorer"; }
function mine(g){ return !g.writer || g.writer === S.dev; }
function canEdit(g){ return g && canScore() && mine(g); }
let toastT;
function toast(msg, ms = 2400){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ---------- the table (subs waiting to check in) ---------- */
function booth(gid){ const b = S.booth[gid] || (S.booth[gid] = {table:{us:[], them:[]}, said:[], notes:"", upd:0}); if(!b.said) b.said = []; if(b.notes == null) b.notes = ""; return b; }
function setBooth(g, fn, fields){ const b = booth(g.id); fn(b); b.upd = Date.now(); save(); Sync.dirtyBooth(g.id, fields); }
function atTable(g, tm){ return (booth(g.id).table[tm] || []).filter(pid => player(g, tm, pid)); }
function toTable(g, tm, pid){ const l = atTable(g, tm); setBooth(g, b => { b.table[tm] = l.includes(pid) ? l.filter(x => x !== pid) : l.concat([pid]); b.said = b.said.filter(x => x !== pid || !l.includes(pid)); }, ["table", "said"]); }
function offTable(g, tm, pid){ setBooth(g, b => { b.table[tm] = (b.table[tm] || []).filter(x => x !== pid); b.said = b.said.filter(x => x !== pid); }, ["table", "said"]); }
// The last few subs for a team, as "#12 Smith in for #3 Lee" (an OUT recorded right before an IN is the same sub).
// Lineup taps (lu) are starters and lineup fixes, not subs worth announcing.
function subsOf(g, R, tm, n){
  const out = [], live = R.plays.filter(p => !p.void);
  live.forEach((p, i) => {
    const e = p.e; if(e.t !== "IN" || e.tm !== tm || e.lu) return;
    const prev = live[i - 1], pout = prev && prev.e.t === "OUT" && prev.e.tm === tm && Math.abs((e.at || 0) - (prev.e.at || 0)) < 4000 ? prev.e.pid : null;
    out.push({q:p.q, txt:pLabel(g, tm, e.pid) + (pout ? " in for " + pLabel(g, tm, pout) : " checks in")});
  });
  return out.slice(-n).reverse();
}

/* ---------- recording ---------- */
function touch(g){ g.rev = (g.rev || 0) + 1; g.upd = Date.now(); save(); Sync.dirty(g.id); render(); }
function claim(g){ if(!g.writer){ g.writer = S.dev; g.writerAt = Date.now(); } }
// Folds plays from another copy of the game into this one: new plays go in by time, a play changed on both sides keeps
// the later change. Returns how many plays it added or changed.
function mergeEv(g, ev){
  const have = new Map(g.ev.map(e => [e.id, e])); let n = 0;
  for(const e of ev || []){
    const x = have.get(e.id);
    if(x){ if((e.ed || 0) > (x.ed || 0)){ g.ev[g.ev.indexOf(x)] = e; have.set(e.id, e); n++; } continue; }
    let i = g.ev.length; while(i > 0 && (g.ev[i - 1].at || 0) > (e.at || 0)) i--;
    g.ev.splice(i, 0, e); have.set(e.id, e); n++;
  }
  return n;
}
// A game goes live with its first real play, not when someone types in a roster or sets the starters before tip-off
// (fans' phones and the PA's "follow the live game" key off it). Our roster is frozen into the game at that moment.
function startGame(g){ if(g.off){ g.offWas = g.off; delete g.off; } g.status = "live"; if(!g.us.length) g.us = JSON.parse(JSON.stringify((S.teams[g.team] || {}).roster || [])); }
const PREGAME = e => e.t === "POSS" || e.t === "NOTE" || e.t === "OUT" || (e.t === "IN" && e.lu);
function rec(e, opts = {}){
  const g = cur(); if(!g) return null;
  if(!canEdit(g)){ toast(canScore() ? "Another device is scoring this game. Take over first." : "Viewers can't score."); return null; }
  if(g.status === "final"){ toast("This game is final. Tap Reopen to add plays, or fix plays under Plays."); return null; }
  claim(g); e.id = rid(); e.at = Date.now();
  if(g.status === "pre" && !PREGAME(e)) startGame(g);
  g.ev.push(e);
  if(!opts.keepFu) ui.fu = [];
  if(!opts.quiet) touch(g); return e;
}
// The last play that matters for linking (subs, notes and the arrow don't count).
function lastPlay(g){ for(let i = g.ev.length - 1; i >= 0; i--){ const e = g.ev[i]; if(!e.v && !["IN","OUT","NOTE","POSS"].includes(e.t)) return e; } return null; }
const linked = (g, t, id) => g.ev.some(x => !x.v && x.t === t && x.ref === id);
let lastTap = {k:"", at:0};
function stat(tm, pid, k){
  const g = cur(); if(!g) return;
  // A finger that bounces on a button scores once. A real second tap after the toast still counts.
  const key = tm + ":" + pid + ":" + k, now = Date.now();
  if(key === lastTap.k && now - lastTap.at < 450){ lastTap.at = 0; toast("Tapped twice? Counted once. Tap again to add another."); return; }
  lastTap = {k:key, at:now};
  const R = replay(g), po = S.settings.extra ? {} : {po:1};    // points-only mode: makes are marked, so no fake shooting %
  let e;
  switch(k){
    case "ft": e = rec({tm, pid, t:"FT", m:true, ...po}); break;
    case "ftx": e = rec({tm, pid, t:"FT", m:false}); if(e && S.settings.extra){ ui.fu = [{k:"reb", miss:tm}]; renderFu(); } break;
    case "2": case "3": case "2x": case "3x": {
      const p = parseInt(k, 10), m = !k.endsWith("x");
      e = rec({tm, pid, t:"FG", p, m, ...(m ? po : {})}); if(!e) return;
      if(S.settings.chart) ui.fu.push({k:"loc", id:e.id});
      if(m && S.settings.extra) ui.fu.push({k:"ast", tm, shooter:pid, ref:e.id});
      if(!m && S.settings.extra) ui.fu.push({k:"reb", miss:tm});
      renderFu(); break; }
    case "reb": e = rec({tm, pid, t:"REB", o: R.lastMiss === tm}); break;
    case "ast": e = rec({tm, pid, t:"AST"}); break;
    case "stl": {
      // Turnover already tapped on the other side? The steal goes with it instead of asking (and counting) it again.
      const last = lastPlay(g);
      if(last && last.t === "TO" && last.tm === OTHER(tm) && last.pid && !linked(g, "STL", last.id)){ e = rec({tm, pid, t:"STL", ref:last.id}); break; }
      e = rec({tm, pid, t:"STL"}); if(e){ ui.fu = [{k:"to", tm:OTHER(tm), ref:e.id}]; renderFu(); } break; }
    case "blk": {
      // The miss is already in the book: the block goes with it rather than adding a second shot.
      const last = lastPlay(g);
      if(last && last.t === "FG" && !last.m && last.tm === OTHER(tm) && !linked(g, "BLK", last.id)){ e = rec({tm, pid, t:"BLK", ref:last.id}); if(e && S.settings.extra){ ui.fu = [{k:"reb", miss:OTHER(tm)}]; renderFu(); } break; }
      e = rec({tm, pid, t:"BLK"}); if(e){ ui.fu = [{k:"blk", tm:OTHER(tm), ref:e.id, p:2}]; renderFu(); } break; }
    case "to": e = rec({tm, pid, t:"TO"}); if(e && pid && S.settings.extra){ ui.fu = [{k:"stl", tm:OTHER(tm), ref:e.id}]; renderFu(); } break;
    case "pf": {
      e = rec({tm, pid, t:"PF"}); if(!e) return;
      const R2 = replay(g), ln = R2.box[tm][pid];
      if(teamFouls(g, R2, tm) === S.settings.bonus) toast(tmName(g, OTHER(tm)) + " in the bonus.", 3000);
      if(ln && ln.pf === 4) toast(pLabel(g, tm, pid) + " has 4 fouls.");
      if(ln && ln.pf >= 5) toast(pLabel(g, tm, pid) + " FOULED OUT. Get a sub to the table.", 4000);
      break; }
    case "tf": {
      e = rec({tm, pid, t:"TF"}); if(!e) return;
      const R2 = replay(g), ln = pid && R2.box[tm][pid];
      if(teamFouls(g, R2, tm) === S.settings.bonus) toast(tmName(g, OTHER(tm)) + " in the bonus.", 3000);
      if(ln && ln.tf >= 2) toast(pLabel(g, tm, pid) + ": 2nd technical. EJECTED. Get a sub to the table.", 4500);
      else if(ln && ln.pf >= 5) toast(pLabel(g, tm, pid) + " FOULED OUT. Get a sub to the table.", 4000);
      break; }
  }
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
}
function undo(){
  const g = cur(); if(!g || !canEdit(g)) return;
  if(g.status === "final"){ toast("This game is final. Tap Reopen first, or fix plays under Plays."); return; }
  for(let i = g.ev.length - 1; i >= 0; i--){ const e = g.ev[i]; if(e.v) continue;
    // A sub (out + in) or a lineup batch undoes as one.
    const grp = e.grp ? g.ev.filter(x => x.grp === e.grp && !x.v) : [e], ed = Date.now();
    grp.forEach(x => { x.v = true; x.ed = ed; }); ui.fu = [];
    // Nothing real left (an accidental tap during warmups): back to pregame, so the PA's script and the fan page are too.
    // Its roster copy goes too, so roster changes before the real tip still make it in (unless it has tonight-only changes).
    // A called-off game an accidental tap brought back is called off again. A copy kept for tonight-only changes stays
    // (and catches up with Rosters); the practice game's players live only in its copy.
    if(g.status === "live" && !g.ev.some(x => !x.v && !PREGAME(x))){ g.status = "pre"; if(g.offWas) g.off = g.offWas; delete g.offWas; if(g.usOwn) lateAdds(g.team); else if(!g.practice) g.us = []; }
    toast("Undid: " + (grp.length > 1 && e.t === "IN" && grp.some(x => x.t === "OUT") ? pLabel(g, e.tm, e.pid) + " in for " + pLabel(g, e.tm, grp.find(x => x.t === "OUT").pid) : playText(g, e).replace(/<[^>]+>/g, "")));
    touch(g); return; }
  toast("Nothing to undo.");
}
function endPeriod(){
  const g = cur(); if(!g) return; const R = replay(g);
  if(!rec({tm:"us", pid:null, t:"PER", q:R.q})) return;
  toast("End of " + perLabel(g, R.q) + ". " + usName(g) + " " + R.sc.us + ", " + g.opp + " " + R.sc.them + ".");
}
// A sub is two plays, out then in, so +/- and the floor stay right. It also clears the player off the table.
function subIn(g, tm, pin, pout){
  if(!canEdit(g) || g.status === "final") return;
  const grp = rid();
  if(pout) rec({tm, pid:pout, t:"OUT", grp}, {quiet:true, keepFu:true});
  rec({tm, pid:pin, t:"IN", grp}, {quiet:true, keepFu:true});
  offTable(g, tm, pin);
  touch(g);
}

/* ---------- render ---------- */
const TABS = [["desk","Desk"],["ann","Announcer"],["box","Box score"],["plays","Plays"],["shots","Shots"],["games","Games"],["teams","Rosters"],["setup","Setup"]];
let pendingRender = false;
// Sync calls this: it waits while someone is typing in the page so a live update doesn't eat their words.
function softRender(){
  const a = document.activeElement;
  if(a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender = false; setTimeout(render, 0); } });
function keepOpen(fn){
  const y = window.scrollY;
  $$("details[data-keep]").forEach(d => { ui.open[d.dataset.keep] = d.open; });
  fn();
  $$("details[data-keep]").forEach(d => { const k = d.dataset.keep; if(k in ui.open) d.open = ui.open[k]; });
  if(Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
}
function render(){ keepOpen(draw); retitle(); }
function retitle(){
  let g = null, R = null;
  if(PUB){ const sn = PS.gid && PS.snap[PS.gid]; if(sn){ const p = pubGame(sn); g = p.g; R = p.R; } }
  else if(ui.tab === "ann" || ui.tab === "desk"){ g = cur(); if(g && g.ev.length) R = replay(g); }

function seasonLines(team){
  const by = {};
  for(const g of Object.values(S.games)){
    if(g.deleted || g.practice || g.team !== team || g.status !== "final") continue;
    const R = replay(g);
    for(const [pid, ln] of Object.entries(R.box.us)){ if(!ln.gp) continue; const a = by[pid] || (by[pid] = {...LINE(), g:0, x:{fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0}}); for(const k of Object.keys(LINE())) a[k] += ln[k]; a.g++;
      // Shooting percentages only from games where misses were kept.
      if(!ln.po) for(const k of Object.keys(a.x)) a.x[k] += ln[k]; }
  }
  return by;
}
// "Record 12-5 · District 3-1 · Home 7-2 · Away 5-3", from final games in the book.
function teamRecord(team){
  const r = {all:[0, 0], district:[0, 0], Home:[0, 0], Away:[0, 0]};
  for(const g of Object.values(S.games)){ if(g.team !== team) continue; const res = result(g); if(!res) continue; const i = res === "W" ? 0 : 1;
    r.all[i]++; if(g.district) r.district[i]++; if(r[g.ha]) r[g.ha][i]++; }

}

/* ---------- Bobcats Scorebook hand-off ----------
   Bobcats Scorebook keeps games at games/{YYYY-MM-DD-boys|girls} with gb, opp, top ("Name 22, Name 14"),
   periods{q1..q4,ot1,ot2:{gb,opp}} as the RUNNING score at the end of each period, and live_note (the shout-out line in
   its in-game posts, which already carry the score). Its paste box reads this. Game ids match: both apps name a game
   date-team, with -2 on a second game that day. Names go by last name, the way Bobcats Scorebook writes them. */
function scorebookPayload(g){
  const R = replay(g), Q = g.quarters || 4, final = g.status === "final", periods = {};
  // Periods that are over. The period a final game ends in is the final itself; Bobcats Scorebook only keeps the end of
  // regulation (q4) and OT when the game went past them. An "End of" tapped just before Make it final doesn't count.
  let last = R.q;
  if(final && R.q > Q){ const live = R.plays.filter(p => !p.void && p.e.t !== "NOTE"); if(live.length && live[live.length - 1].e.t === "PER") last = R.q - 1; }
  let cu = {gb:0, opp:0};
  for(let q = 1; q < last && q <= Q + 2; q++){
    cu = {gb: cu.gb + (R.qs.us[q-1] || 0), opp: cu.opp + (R.qs.them[q-1] || 0)};
    periods[q <= Q ? "q" + q : "ot" + (q - Q)] = {...cu};
  }
  const named = roster(g, "us").filter(p => /^[A-Za-z]/.test(pShort(p)));
  const nm = p => named.filter(x => pShort(x).toLowerCase() === pShort(p).toLowerCase()).length > 1 ? p.name.trim() : pShort(p);
  const top = named.map(p => ({p, pts:(R.box.us[p.pid] || LINE()).pts})).filter(x => x.pts > 0).sort((a, b) => b.pts - a.pts);
  const keep = top.filter((x, i) => i < 3 || x.pts >= 10).slice(0, 5);
  return {source:"brier-stats", v:1, id:g.practice ? "practice" : g.id, date:g.date, team:g.team === "girls" ? "Girls" : "Boys", opponent:g.opp,
    final, gb: final ? R.sc.us : null, opp: final ? R.sc.them : null, periods,
    top: keep.map(x => nm(x.p) + " " + x.pts).join(", "),
    live_note: final || g.status !== "live" ? "" : keep.slice(0, 2).map((x, i) => nm(x.p) + (i ? " " : " has ") + x.pts).join(", ")};
}
function sendSheet(){
  const g = cur(); if(!g) return;
  const p = scorebookPayload(g), txt = JSON.stringify(p);
  openSheet({html:() => `<h3>Send to Bobcats Scorebook</h3>
    <p style="margin:0 0 8px">${p.final ? `Final: <b>${esc(usName(g))} ${p.gb}, ${esc(g.opp)} ${p.opp}</b>${p.top ? `<br>Top scorers: ${esc(p.top)}` : ""}`
      : `<b>Not final yet.</b> This sends the quarter scores so far (${Object.keys(p.periods).map(k => k.toUpperCase()).join(", ") || "none yet"}) for an in-game post.${p.live_note ? `<br>Shout-out: ${esc(p.live_note)}` : ""}`}</p>
    <ol style="margin:0 0 10px;padding-left:20px;font-size:14px"><li>Tap <b>Copy</b>.</li><li>In Bobcats Scorebook open this game, tap <b>Paste from Brier Stats</b>, paste, then <b>Fill it in</b>.</li></ol>
    <textarea class="mono" rows="5" readonly id="sendtxt" style="width:100%">${esc(txt)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="copysend">Copy</button><button class="btn" data-close>Done</button></div>`});
}
async function copyText(t, ta){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}

/* ---------- the public copy of a game (hoopsPublic/{gid}) ----------
   Small on purpose: every fan's phone downloads it on every update. One JSON string, because Firestore can't hold lists
   inside lists. Box lines: [num, name, pos, year, height, pts, fgm, fga, tpm, tpa, ftm, fta, oreb, dreb, ast, stl, blk, to, pf, played, on floor]. */
const PUBK = ["pts","fgm","fga","tpm","tpa","ftm","fta","oreb","dreb","ast","stl","blk","to","pf"];
function noPub(g, tm, p){ return !!(p.nopub || (tm === "us" && ((S.teams[g.team] || {}).roster || []).some(r => r.pid === p.pid && r.nopub))); }
function pubSnap(g0){

}

  const lines = [cols.join(",")], pre = [g.id, g.date, g.opp, g.ha];

function normHt(h){ const m = String(h || "").trim().match(/^(\d)\s*(?:['’′-]|ft\.?)\s*(\d{1,2})\s*(?:["”″]|''|in\.?)?$/i); return m ? m[1] + "-" + m[2] : String(h || "").trim(); }
const GRADES = {fr:"Fr", freshman:"Fr", "9":"Fr", "9th":"Fr", so:"So", sophomore:"So", "10":"So", "10th":"So", jr:"Jr", junior:"Jr", "11":"Jr", "11th":"Jr", sr:"Sr", senior:"Sr", "12":"Sr", "12th":"Sr"};

const POSRX = /^(PG|SG|SF|PF|G|F|C|W|G\/F|F\/C|F\/G|C\/F|Guard|Forward|Center|Wing|Post)$/i;

    else if(k === "jr" && !p.pos && !p.ht && !POSRX.test(t[t.length - 2] || "")) break;
    else if(!p.grade && GRADES[k]) p.grade = GRADES[k];

low create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Which devices are running which version, so Coach can see the iPad is up to date.\n    match /devices/{dev} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.uid == request.auth.uid;\n      allow delete: if owner();\n    }\n    // One document per game. Our hitters' names never come here, only lineup slot and bats.\n    // A copy can't go backwards: rev never decreases. A game moves to another device only when Coach moves it\n    // or a signed-in coach taps Take over (that copy names them in takeover).\n    match /games/{gid} {\n      allow read: if member();\n      // Only Coach deletes a game for everyone, or brings a deleted one back.\n      allow create: if member() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if member()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (request.resource.data.writerDev == resource.data.writerDev || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // Opposing pitchers. A merged-away kid stays as a tombstone naming the record he joined (mergedInto).\n    match /pitchers/{pid} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.id == pid;\n      allow delete: if owner();\n    }\n\n    // ---------- Brier Stats (basketball) ----------\n    // Its own people list: being let into Brier Stats does not let anyone into Mound Book, and the other way round.\n    // Coach (the Mound Book owner) is in both. Scorers write games; viewers only watch.\n         const r = seasonRow(g), mineNow = g.writer === S.dev && g.status !== "pre";
        // After the write below the cloud holds this row for each game this device scored (keyed the way pubSend keys it).
        if(mineNow && (g.status === "final" || !h)) has[g.id] = [g.status + ":" + replay(g).q, r.status + ":" + r.us + "-" + r.them];
        if(!h){ add[g.id] = r; continue; }
        if(g.status === "pre"){ if(diff(h, r, ["status", ...KEYS])) add[g.id] = r; }
        else if(mineNow && (diff(h, r, ["status", ...KEYS]) || (g.status === "live" && diff(h, r, ["per"])) || (g.status === "final" && diff(h, r, ["us","them"])))){ add[g.id] = r; has[g.id] = [g.status + ":" + replay(g).q, r.status + ":" + r.us + "-" + r.them]; }
      }
      const off = S.settings.pub === false;
      if(Object.keys(add).length || !cur.exists() || !!(cur.exists() && cur.data().off) !== off) await fb.setDoc(fb.doc(db, "hoopsPublic", "_season"), {games:add, off, upd:Date.now()}, {merge:true});
      // A copy sent again later (a name taken off the public page) then leaves the list alone: every fan on the page reads
      // each write of it.
      for(const [id, [k, rk]] of Object.entries(has)) if(!(id in st.pub.rowk) || id in add){ st.pub.seen[id] = k; st.pub.rowk[id] = rk; }
      // A row that was missing or stale means the game's public copy is too (scored or fixed while sync wasn't up).
      for(const [id, r] of Object.entries(add)) if(r && S.games[id] && S.games[id].status !== "pre") pubQueue(id, true);
      st.seeded = true;
    }catch(e){ fail(e); }
  }
  function dirtyTeams(){ st.teamsDirty = true; kick(700); }
  function dirtySay(pids){ (pids || []).forEach(p => st.sayPend.add(p)); kick(700); }
  function kick(ms){ clearTimeout(st.timer); st.timer = setTimeout(push, ms); }
  const clean = o => JSON.parse(JSON.stringify(o));
  async function push(){
    if(!live() || st.pushing) return;
    st.pushing = true;
    const {fb, db} = st;
    try{
      if(canScore()) for(const id of [...st.dirty]){
        const g = S.games[id]; if(!g || g.practice || (g.writer && g.writer !== S.dev && st.role !== "owner")){ st.dirty.delete(id); continue; }
        if(!g.writer && (!st.gamesSeen || st.stale)) continue;   // an unclaimed copy waits to hear the cloud's: another device may have claimed the game
        const rev = g.rev;
        try{ await fb.setDoc(fb.doc(db, "hoopsGames", id), clean(g)); }
        catch(e){ if(!String((e && e.code) || "").includes("permission")) throw e;
          // A delete made while this device's role wasn't known yet: only Coach deletes, so the game comes back.
          if(g.deleted && st.role !== "owner"){ g.deleted = false;
            // The delete's own claim goes with it (claim and touch ran in the same tap); an earlier real claim stays.
            if(g.writer === S.dev && (g.upd || 0) - (g.writerAt || 0) < 1000){ g.writer = null; delete g.writerAt; }
            g.rev = (g.rev || 0) + 1; g.upd = Date.now(); save(); seedSeason(true); toast("Only Coach can delete a game: " + (g.opp || "it") + " is back on the schedule.", 5000); render(); continue; }
          sent(id); clearTimeout(st.pub.timer[id]); st.pub.timer[id] = null;
          toast("The cloud didn't take this device's copy of " + (g.opp || "the game") + ": another device is scoring it. Your plays stay on this device.", 5000); continue; }
        if(S.games[id] && S.games[id].rev === rev) sent(id);
        if(st.pub.retry[id]){ st.pub.retry[id] = false; pubQueue(id); }
      }
      for(const [id, f] of [...st.boothDirty]){ const b = S.booth[id]; st.boothDirty.delete(id); if(!b) continue;
        if(f.has("*")) await fb.setDoc(fb.doc(db, "hoopsBooth", id), clean(b));
        else { const part = {upd:b.upd || Date.now()}; f.forEach(k => { if(b[k] !== undefined) part[k] = b[k]; }); await fb.setDoc(fb.doc(db, "hoopsBooth", id), clean(part), {merge:true}); } }
      if(st.sayPend.size){ const part = {}; st.sayPend.forEach(pid => { part[pid] = S.say[pid] || ""; }); st.sayPend.clear();
        await fb.setDoc(fb.doc(db, "hoopsBooth", "_say"), clean({say:part, upd:S.sayUpd || Date.now()}), {merge:true}); }
      if(st.scriptDirty){ st.scriptDirty = false; await fb.setDoc(fb.doc(db, "hoopsBooth", "_script"), clean(S.script ? {segs:S.script.segs, upd:S.script.upd} : {segs:null, upd:Date.now()})); }
      if(st.teamsDirty && canScore() && st.teamsSeen){ st.teamsDirty = false; const rev = S.teamsRev || 0; st.teamsSent = rev; st.teamsSentJ = JSON.stringify(clean(S.teams));
        await fb.setDoc(fb.doc(db, "hoopsBook", "teams"), clean({teams:S.teams, rev, settings:cloudSettings(S.settings), opps:S.opps || {}, upd:Date.now()}));
        S.teamsBase = rev; save(); }
      st.err = "";
    }catch(e){ fail(e); }
    st.pushing = false;
    if(st.dirty.size || st.boothDirty.size) kick(3000);
  }
  setInterval(() => { if(live() && (st.dirty.size || st.boothDirty.size || st.teamsDirty || st.sayPend.size || st.scriptDirty)) kick(100); }, 8000);
  window.addEventListener("online", () => { if(st.phase === "error" && !st.fb){ st.phase = "off"; start(); } else kick(500); });

  async function approve(uid, role){ const {fb, db} = st; const r = st.reqs.find(x => x.uid === uid) || st.mems.find(x => x.uid === uid) || {};
    const b = fb.writeBatch(db); b.set(fb.doc(db, "hoopsMembers", uid), {role, email:r.email || "", name:r.name || "", at:Date.now()}); b.delete(fb.doc(db, "hoopsRequests", uid)); await b.commit(); }
  function authMsg(e){ const c = (e && e.code) || ""; if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "That email and password don't match. Same account as Mound Book, if you have one."; if(c.includes("email-already")) return "That email already has an account. Sign in instead."; if(c.includes("weak-password")) return "Password needs at least 6 characters."; if(c.includes("network")) return "No signal. Try again when you have some."; if(c.includes("too-many")) return "Too many tries. Wait a minute."; return (e && e.message) || "Didn't work."; }
  function panel(){
    let h = `<div class="card stack"><h3 style="font-size:22px">Live sync</h3>`;
    if(st.err) h += `<div class="flag bad">${esc(st.err)}</div>`;
    if(st.phase === "off") h += `<p style="margin:0">One device scores; everyone Coach lets in follows it live on the Announcer page. Same sign-in as Mound Book.</p><div class="row"><button class="btn primary" data-act="sy-start">Turn on live sync</button></div>`;
    else if(st.phase === "loading") h += `<p style="margin:0">Connecting…</p>`;
    else if(st.phase === "error") h += `<div class="row"><button class="btn" data-act="sy-retry">Try again</button>${st.fb && st.uid ? `<button class="btn" data-act="sy-out">Sign out</button>` : ""}</div>`;
    else if(st.phase === "signedout") h += `<form id="sy-auth" class="stack" style="max-width:420px">
      <div class="row"><button type="button" class="btn sm" data-act="sy-mode" data-m="in" aria-pressed="${st.mode === "in"}">Sign in</button><button type="button" class="btn sm" data-act="sy-mode" data-m="up" aria-pressed="${st.mode === "up"}">New account</button></div>
      ${st.mode === "up" ? `<label class="fld"><span>Your name</span><input type="text" name="name" autocomplete="name"></label>` : ""}
      <label class="fld"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="fld"><span>Password</span><input type="password" name="pw" autocomplete="${st.mode === "up" ? "new-password" : "current-password"}" required minlength="6"></label>
      <div class="row"><button class="btn primary" type="submit" ${st.busy ? "disabled" : ""}>${st.mode === "up" ? "Create account" : "Sign in"}</button>${st.mode === "in" ? `<button type="button" class="btn" data-act="sy-reset">Forgot password</button>` : ""}</div></form>`;
    else if(st.phase === "waiting") h += `<p style="margin:0">Signed in as <b>${esc(st.email)}</b>. Waiting for Coach to let you in. This page updates by itself.</p><div class="row"><button class="btn" data-act="sy-out">Sign out</button></div>`;
    else if(st.phase === "live"){
      h += `<p style="margin:0">Signed in as <b>${esc(st.email)}</b> · ${st.role === "owner" ? "Coach (owner)" : st.role === "scorer" ? "Scorer" : "Viewer"}. ${st.dirty.size ? st.dirty.size + " game(s) waiting to send." : "Everything's sent."}</p><div class="row"><button class="btn" data-act="sy-out">Sign out</button></div>`;
      if(st.role === "owner"){
        const row = (who, btns) => `<div class="row between" style="border-bottom:1px solid var(--grey);padding:6px 0"><span>${who}</span><span class="row">${btns}</span></div>`;
        h += `<div><div class="kicker" style="margin-bottom:4px">Asking to get in</div>${st.reqs.length ? st.reqs.map(r => row(`<b>${esc(r.name || r.email)}</b> ${esc(r.email)}`, `<button class="btn sm primary" data-act="sy-approve" data-uid="${r.uid}" data-role="scorer">Scorer</button><button class="btn sm primary" data-act="sy-approve" data-uid="${r.uid}" data-role="viewer">Viewer</button><button class="btn sm" data-act="sy-deny" data-uid="${r.uid}">No</button>`)).join("") : `<p style="margin:0">Nobody waiting.</p>`}</div>
          <div><div class="kicker" style="margin-bottom:4px">Let in</div>${st.mems.length ? st.mems.map(m => row(`<b>${esc(m.name || m.email)}</b> ${esc(m.email)} · ${m.role === "scorer" ? "Scorer" : "Viewer"}`, `<button class="btn sm" data-act="sy-approve" data-uid="${m.uid}" data-role="${m.role === "scorer" ? "viewer" : "scorer"}">Make ${m.role === "scorer" ? "viewer" : "scorer"}</button><button class="btn sm dark" data-act="sy-remove" data-uid="${m.uid}">Remove</button>`)).join("") : `<p style="margin:0">Just you so far.</p>`}</div>`;
      }
    }
    if(st.role === "owner" || st.phase === "error")
      h += `<details><summary style="font-weight:600;cursor:pointer">Firestore rules (Coach, one time)</summary><p style="font-size:14px">Firebase console › Firestore Database › Rules: replace everything with this and tap Publish. It's Mound Book's rules plus the basketball part. <b>Don't re-copy the rules from Mound Book afterward</b> or basketball loses access; copy them from here.</p>
        <textarea class="mono" rows="8" readonly id="rulestxt" style="width:100%">${esc(RULES)}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="sy-copyrules">Copy rules</button></div></details>`;
    return h + `</div>`;
  }
  async function click(act, a){
    const {fb, db} = st;
    try{
      if(act === "sy-start") await start();
      else if(act === "sy-retry"){ st.err = ""; if(st.fb) onUser(st.auth.currentUser); else { st.phase = "off"; await start(); } }
      else if(act === "sy-mode"){ st.mode = a.dataset.m; render(); }
      else if(act === "sy-out"){ clear(); await fb.signOut(st.auth); S.sync = false; S.role = null; save(); }
      else if(act === "sy-reset"){ const e = ($("#sy-auth [name=email]") || {}).value; if(!e){ toast("Type your email first."); return; } await fb.sendPasswordResetEmail(st.auth, e.trim()); toast("Check your email for a reset link."); }
      else if(act === "sy-approve"){ await approve(a.dataset.uid, a.dataset.role); toast("Done."); }
      else if(act === "sy-deny") await fb.deleteDoc(fb.doc(db, "hoopsRequests", a.dataset.uid));
      else if(act === "sy-remove"){ if(confirm("Remove this person from Brier Stats?")) await fb.deleteDoc(fb.doc(db, "hoopsMembers", a.dataset.uid)); }
      else if(act === "sy-copyrules"){ const ok = await copyText(RULES, $("#rulestxt")); toast(ok ? "Rules copied." : "Select the rules and copy them by hand."); }
    }catch(e){ toast(authMsg(e), 4000); }
  }
  async function submit(f){
    if(f.id !== "sy-auth") return;
    const d = new FormData(f), em = String(d.get("email")).trim(), pw = String(d.get("pw")), nm = String(d.get("name") || "").trim();
    st.busy = true; render();
    try{
      if(st.mode === "up"){ const c = await st.fb.createUserWithEmailAndPassword(st.auth, em, pw); if(nm){ try{ await st.fb.updateProfile(c.user, {displayName:nm}); st.name = nm; }catch(e){} } }
      else await st.fb.signInWithEmailAndPassword(st.auth, em, pw);
    }catch(e){ toast(authMsg(e), 5000); }
    st.busy = false; render();
  }
  return {start, live, dirty, pubResend, dirtyBooth, dirtyTeams, dirtySay, dirtyScript, seedSeason, panel, click, submit,
    phase:() => st.phase, role:() => st.role, uid:() => st.uid,
    stale:() => st.stale, label:() => (st.role === "owner" ? "Coach" : st.role === "scorer" ? "Scorer" : "Viewer") + (st.stale ? " · not updating" : " · live")};
})();

/* ---------- boot ---------- */
if(PUB){
  S = blank(); document.body.classList.add("pub");
  $(".brand b").innerHTML = "BRIER STATS<small>LIVE</small>";
  const mf = $('link[rel="manifest"]'); if(mf) mf.href = "live.webmanifest";
  render(); PubRead.start();
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}else{
load();
if(!ui.gid || !S.games[ui.gid]){
  const today = pubToday();
  const next = Object.values(S.games).filter(g => !g.practice && !g.deleted && !g.off && g.date >= today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
  ui.gid = next ? next.id : "practice";
}
render();
if(S.sync) Sync.start();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
