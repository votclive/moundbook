<html lang="en">

<style>
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
/* Greenbrier brand kit (same rules as the VOTC Live app): four colors only. Green leads, white is the ground, grey is for
   outlines and rules (never text on white), black is the working accent. Big Shoulders Display in caps for headlines,
   names, scores and labels; Barlow for sentences. Square blocks, 4px buttons, 8px cards, one hard black shadow per screen
   (the score). Layout follows Jim's ChatGPT draft: home team | scoreboard | away team, tap-a-stat buttons on each player. */
:root{
  --green:#094A28; --white:#FFFFFF; --grey:#A0A0A0; --black:#000000;
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--white);color:var(--black)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1}
.kicker{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.small{font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:0 12px}

/* Top bar: solid green block, Bobcat Head as drawn, tabs on the same row so the desk keeps its height. */
.top{background:var(--green);color:var(--white);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand img{width:38px;height:37px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--white);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:16px 9px 12px;border-bottom:4px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--white)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--white);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill i{width:8px;height:8px;background:var(--grey);display:inline-block}
.pill.live i{background:var(--white)}
.pill.bad{background:var(--black);border-color:var(--black)}
main{padding:6px 0 24px}
body.has-fu main{padding-bottom:260px}

/* Generic bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 12px;font-weight:600;min-height:38px;text-decoration:none;color:var(--black)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--green);color:var(--white);border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--white);border:1px solid var(--grey);border-radius:8px;padding:14px}
.stack{display:grid;gap:12px}
.flag{border:2px solid var(--black);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.flag.bad{background:var(--black);color:var(--white)}
.flag.ok{background:var(--green);color:var(--white);border-color:var(--green)}
.flag .btn{color:var(--black)}
label.fld{display:grid;gap:4px;font-size:14px}
label.fld span{font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--grey);background:var(--white);border-radius:4px;padding:7px 9px;min-height:38px;width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--grey);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
tr.tot td{font-weight:700;border-top:2px solid var(--black)}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--black);color:var(--white);padding:9px 16px;border-radius:4px;z-index:60;font-weight:600;max-width:92vw;text-align:center}
.tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--black)}
.tag.solid{background:var(--black);color:var(--white)}
.tag.green{background:var(--green);color:var(--white);border-color:var(--green)}

/* ---------- Desk: sized so an iPad in landscape (or a laptop) shows the whole game without scrolling ---------- */
.deskhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--black);margin-bottom:6px}
.deskhead .game{flex:1;min-width:200px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.deskhead h2{font-size:24px}
.periods{display:flex;gap:4px}
.periods button{min-width:44px;min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-family:var(--f-display);font-weight:800;font-size:17px}
.periods button.on{background:var(--green);color:var(--white);border-color:var(--green)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:12px;align-items:start}
/* A scaled desk (deskZoom, html.dz): a card over it is at most 90% of the window tall (--wh, the window's height in the
   page's own pixels; 90vh would be scaled too), the top bar keeps clear of an iPad's status bar, and a Windows scroll bar
   never comes and goes under the follow-up strip (the desk would jump sideways). Printing is never scaled. */
html.dz{scrollbar-gutter:stable}
html.dz .top{padding-top:calc(env(safe-area-inset-top) / var(--z))}
html.dz .sheet{max-height:calc(var(--wh) * .9)}
@media print{ html.dz{zoom:1!important} }
/* The desk with a mouse: a ring on the button under the pointer (only where there's a mouse, so an iPad never sticks in
   hover), a black ring where the keyboard is, a crosshair on the shot chart, and no words selected by a quick
   double-click on a card. */
:is(.deskhead,.desk,.fu,.flag) :is(button,[tabindex]):focus-visible{outline:3px solid var(--black);outline-offset:2px}
.desk .sb button:focus-visible{outline-offset:1px}
.flag.bad :is(button,[tabindex]):focus-visible{outline-color:var(--white)}
.fu [data-court="loc"]{cursor:crosshair}
.sheet label.row:has(input[type=checkbox]){cursor:pointer}
@media (hover:hover){
  .desk,.fu{-webkit-user-select:none;user-select:none}
  .desk input{-webkit-user-select:text;user-select:text}
  :is(.deskhead,.desk,.fu,.flag) :is(.btn,.chip,.periods button,.sb button,.tbox .grid button,.tbox .tmo):not(:disabled,.mk,.fl,.at,.dark,.primary,.on,[aria-pressed="true"]):hover{border-color:var(--black);box-shadow:inset 0 0 0 1px var(--black)}
  :is(.deskhead,.desk,.fu,.flag) :is(.btn.primary,.btn.dark,.btn[aria-pressed="true"],.periods button.on,.sb button.fl,.chip.dark):not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--white)}
  .desk :is(.sb button.mk,.chip.at,.pnum):not(:disabled):hover,.fu .chip.at:hover{box-shadow:inset 0 0 0 2px var(--ti,var(--white))}
  .desk button.tc-name:hover,.desk .plays li.tapfix:hover .pt{text-decoration:underline}
}
.tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tc-head img{width:34px;height:33px}
.tc-head .init,.orow .init{width:34px;height:34px;flex:none;border:2px solid var(--ta,var(--grey));border-radius:4px;background:var(--tf,var(--white));color:var(--ti,var(--black));display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:.02em}
.tc-head h3{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tl,var(--black))}
.tc-head h3 small{font-size:.62em;font-weight:700;letter-spacing:.04em}
button.tc-name{border:0;background:none;padding:0;text-align:left;cursor:pointer;text-transform:inherit;letter-spacing:inherit;font-weight:inherit}
.tc-head .side{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em}
.find{min-height:32px!important;padding:4px 8px!important;font-size:14px;margin-bottom:6px}

.table-bar{border:2px solid var(--tl,var(--green));border-radius:8px;padding:5px 7px;margin-bottom:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.table-bar .kicker{color:var(--tl,var(--green));margin-right:2px}
.pcard{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;border:1px solid var(--grey);border-radius:8px;padding:4px 6px;margin-bottom:4px;background:var(--white)}
.pcard.on{border-left:5px solid var(--tl,var(--green));padding-left:5px}
.pcard.fo{border-style:dashed}
/* A fouled-out or ejected player's card: her bench as one-tap subs in exactly the room her stat buttons had (two rows with
   every stat on, one in points-only scoring), so no card under it ever moves. In the one row the label takes two short
   lines and the chips narrow to fit a whole bench; a bigger bench than that scrolls sideways inside the row. */
.subout{display:flex;flex-wrap:wrap;gap:3px;align-items:center;align-content:flex-start;height:65px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.subout.one{height:31px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:2px}
.subout.one .kicker{flex:none;max-width:6.6em;font-size:10px;line-height:1.05;letter-spacing:.04em;margin-right:2px}
.subout.one .kicker span{white-space:nowrap}
.subout.one .chip{flex:1 0 auto;min-width:26px;max-width:46px;padding:0 2px}
.subout .kicker{margin-right:4px}
.subout .chip{min-height:31px;min-width:40px;padding:0 6px}
.subout .chip b{margin:0}
.pnum{width:42px;height:42px;border-radius:4px;border:2px solid var(--ta,var(--tf,var(--green)));background:var(--tf,var(--green));color:var(--ti,var(--white));font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;padding:0}
.pline{display:flex;gap:8px;align-items:baseline;min-width:0;margin-bottom:3px;height:20px}
/* A long name shrinks to fit (fitNames) instead of ending in "…", and may take more of the line than a short one. */
.pline b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;max-width:62%}
.pline b.fitx{white-space:nowrap;max-width:none}
.pline span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pfp{flex:none;align-self:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;letter-spacing:.04em;padding:3px 5px;border-radius:4px;border:1px solid transparent;color:var(--black)}
.pfp.box{border-color:var(--black)}
.pfp.solid{background:var(--black);color:var(--white);border-color:var(--black)}
/* Foul colors: 3 fouls yellow, 4 orange, 5 red (fouled out, or ejected on a second technical). One set for the scorer's
   cards, the PA page and Jim's page; the fan page never gets them. The orange is the bonus too. Text on the yellow and
   the orange is black (14:1 and 7.5:1), on the red white (5.3:1); the pale tints sit behind black text. */
:root{--f3:#FFD000;--f3t:#FFF4C2;--f4:#FF6F00;--f4t:#FFE1C2;--f5:#D7141A;--f5t:#FAD2D3}
.pfp.f3{background:var(--f3);border-color:var(--black);color:var(--black)}
.pfp.f4{background:var(--f4);border-color:var(--black);color:var(--black)}
.pfp.f5{background:var(--f5);border-color:var(--f5);color:var(--white)}
/* A player card in foul trouble, readable across the table: tinted, with a thick ring in the color (an inset shadow, so
   no card grows or moves). The stat buttons stay white. */
.pcard.f3{background:var(--f3t);border-color:var(--f3);box-shadow:inset 0 0 0 3px var(--f3)}
.pcard.f4{background:var(--f4t);border-color:var(--f4);box-shadow:inset 0 0 0 3px var(--f4)}
.pcard.f5{background:var(--f5t);border-color:var(--f5);border-style:solid;box-shadow:inset 0 0 0 3px var(--f5)}
/* Fouled out or ejected: the desk marks her bench and follow-up chips dark. They're red, like her card. */
.teamcol .bench .chip.dark,.fu .chip.dark{background:var(--f5);border-color:var(--f5);color:var(--white)}
/* The same colors on the desk's bench, "At the table" and sub chips. A white chip takes the tint and a ring in the color,
   like the PA's. A chip in its team's color (at the table) keeps it, with a black edge and the foul color on both sides of
   it (outside, an outline: clear of a two-line name), so the yellow and the orange read on any team's colors, gold, grey
   and red included. A sub chip is one number in a row that clips: its ring sits inside. 5 fouls is the red chip. */
.teamcol .chip.f3:not(.at,.dark){background:var(--f3t);border-color:var(--f3);box-shadow:inset 0 0 0 2px var(--f3)}
.teamcol .chip.f4:not(.at,.dark){background:var(--f4t);border-color:var(--f4);box-shadow:inset 0 0 0 2px var(--f4)}
.teamcol .chip.at:is(.f3,.f4){border-color:var(--black);outline:2px solid var(--f3);box-shadow:inset 0 0 0 2px var(--f3)}
.teamcol .chip.at.f4{outline-color:var(--f4);box-shadow:inset 0 0 0 2px var(--f4)}
.teamcol .subout .chip.at:is(.f3,.f4){outline:0;box-shadow:inset 0 0 0 3px var(--f3),inset 0 0 0 4px var(--black)}
.teamcol .subout .chip.at.f4{box-shadow:inset 0 0 0 3px var(--f4),inset 0 0 0 4px var(--black)}
.teamcol .chip.f5:not(.dark){background:var(--f5);border-color:var(--f5);color:var(--white)}
.pline .pts{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1;flex:none;margin-left:auto}
.sb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.sb + .sb{margin-top:3px}
.sb.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.sb button{min-height:31px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;padding:0 2px}
.sb button.mk{background:var(--tf,var(--green));border-color:var(--tf,var(--green));color:var(--ti,var(--white))}
.sb button.ms{border:1.5px solid var(--black)}
.sb button.fl{background:var(--black);border-color:var(--black);color:var(--white)}
.sb button:active{transform:scale(.96);outline:3px solid var(--black)}
.bench{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.bench .kicker{margin-right:2px}
.bench .kicker.full{width:100%}
.chip{min-height:34px;border-radius:4px;border:1px solid var(--grey);background:var(--white);font-weight:700;padding:3px 9px;font-size:14px}
.chip b{font-family:var(--f-display);font-weight:900;font-size:17px;margin-right:3px}
.chip.at{background:var(--tf,var(--green));border-color:var(--tf,var(--green));color:var(--ti,var(--white))}
.chip.dark{background:var(--black);border-color:var(--black);color:var(--white)}
.chip.skip{border-style:dashed}
/* Names that shrink to fit (fitNames): never "…". fitx: still too long at the smallest size, so it wraps. */
.fit{white-space:nowrap;overflow:hidden;text-overflow:clip!important}
.fit.fitx{white-space:normal!important;overflow-wrap:anywhere}
/* The desk ends at the bottom of the iPad's screen. A long roster's bench packs (pk) into two columns (c1), then two
   without its label (c2), then three (c3), then three with shorter chips (c4), then four (c5), each name on up to two
   lines. Still too tall (subs waiting at the table, a banner over the desk), the bench keeps the room that's left and
   scrolls inside it (bscroll), and last the "At the table" bar does too: the page never scrolls and the five cards never
   move (benchFit). */
main:has(.desk){padding-bottom:4px}
.bench.pk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}
.bench.c3,.bench.c4{grid-template-columns:repeat(3,minmax(0,1fr))}
.bench.c1 > .kicker{grid-column:1/-1;font-size:11px;line-height:1.1;margin:0}
.bench.pk:not(.c1) > .kicker{display:none}
.bench.pk .chip{display:flex;align-items:center;gap:5px;min-height:29px;padding:1px 6px;text-align:left}
.bench.pk .chip b{font-size:15px;margin:0;flex:none}
.bench.pk .nm{display:block;min-width:0;font-family:var(--f-display);font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.bench.c4{gap:2px}
.bench.c4 .chip{min-height:28px}
.bench.c5{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.bench.c5 .chip{min-height:28px;padding:1px 4px;gap:4px}
.bench.bscroll{border-bottom:2px dashed var(--grey);padding-bottom:2px}
.teamcol .bscroll{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:thin}
.teamcol .bscroll .chip{scroll-snap-align:start}
/* The desk's "At the table" bar: its label sits on its frame, Clear stays at its end, and each chip is the number and the
   whole name in the packed bench's caps (a long one on two lines), so three subs share a row and the bar stays slim. On a
   full screen a bar of two rows or more drops its "▸ IN"s (tight, benchFit). */
.teamcol .table-bar{position:relative;margin:8px 0 0;padding:6px 4px 2px;gap:3px;flex-wrap:nowrap;align-items:flex-end}
.teamcol .table-bar > .kicker{position:absolute;left:7px;top:-8px;padding:0 4px;background:var(--white);font-size:10.5px;line-height:12px;letter-spacing:.1em;margin:0}
.teamcol .table-bar .tbl{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.teamcol .table-bar .chip{display:inline-flex;align-items:center;gap:4px;min-height:29px;padding:1px 6px;text-align:left}
.teamcol .table-bar .chip b{font-size:15px;margin:0;flex:none}
.teamcol .table-bar .nm{max-width:8.6em;font-family:var(--f-display);font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.teamcol .table-bar .go{flex:none;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.04em}
.teamcol .table-bar .chip.skip{flex:none;font-size:13px;padding:1px 9px}
.teamcol .table-bar.tight .go{display:none}
/* A banner over the desk (FINAL, another device scoring, a viewer, NOT SAVING) keeps to one slim line where it can. */
#view:has(> .deskhead) > .flag{padding:3px 10px;margin-bottom:5px;gap:3px 10px;font-size:13.5px;line-height:1.3}
#view:has(> .deskhead) > .flag .btn.sm{min-height:26px;padding:2px 9px}
/* Two or three at once (NOT SAVING with FINAL, say): the short ones share a line, so they cost the desk less of the screen. */
#view:has(> .flag + .flag ~ .deskhead){display:flex;flex-wrap:wrap;column-gap:6px}
#view:has(> .flag + .flag ~ .deskhead) > *{flex:1 1 100%;min-width:0}
#view:has(> .flag + .flag ~ .deskhead) > .flag{flex:1 1 auto}

/* Scoreboards: no frame. Each half is solid in its team's colors, edge to edge (ours green by default, theirs from
   tvars), with the period and the possession arrow sitting on the seam. The left half is whoever sides() puts there. */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);position:relative;border-radius:8px;overflow:hidden}
.board .half{background:var(--tf,var(--green));color:var(--ti,var(--white));text-align:center;padding:8px 8px 10px;min-width:0}
.board .t{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .st{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .n{font-family:var(--f-display);font-weight:900;font-size:60px;line-height:1;margin-top:2px;text-shadow:-3px 4px 0 var(--ts,var(--black))}
.board .meta{font-size:13px;font-weight:600;margin-top:4px}
.board.quiet .n{opacity:.35}
.board .bonus{display:inline-block;margin-top:3px;background:var(--white);color:var(--black);border-radius:4px;padding:0 6px;font-family:var(--f-display);font-weight:800;letter-spacing:.06em}
.board .seam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;pointer-events:none}
.board .seam span{background:var(--white);color:var(--black);border:2px solid var(--black);border-radius:4px;font-family:var(--f-display);font-weight:900;line-height:1.1;padding:2px 6px;white-space:nowrap}
.board .q{font-size:17px;letter-spacing:.02em}
.board .poss{font-size:15px}
.board.big .half{padding:12px 10px 14px}
.board.big .t{font-size:30px}
.board.big .st{font-size:15px}
.board.big .n{font-size:120px;line-height:.9;margin-top:4px;text-shadow:-4px 5px 0 var(--ts,var(--black))}
.board.big .meta{font-size:15px;margin-top:8px}
.board.big .q{font-size:24px}
.board.big .poss{font-size:22px}
.bugcap{display:flex;justify-content:space-between;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
/* Line score: on white, each row starting with a block of its team's color. */
.linesc{max-width:560px;width:100%;margin:0 auto}
.linesc table{font-size:13px}
.linesc th,.linesc td{padding:3px 6px}
.linesc td.lsn{font-family:var(--f-display);font-weight:700;text-transform:uppercase;border-left:8px solid var(--tf,var(--green));padding-left:6px}
/* A long school name wraps at its spaces, then shrinks (lineFit). The letters (.lsa) only show on the fan page on a phone,
   when even that won't fit. */
.linesc td.lsn{white-space:normal}
.lsn .lsa,.lsn.ab .lsf{display:none}
.lsn.ab .lsa{display:inline}
/* A team name over a table's columns wraps rather than shrinking to its letters. */
th.tn{white-space:normal}
.tbox{border:1px solid var(--grey);border-radius:8px;padding:5px 7px;margin-top:8px}
.tbox .th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbox .th b{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbox .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0}
.tbox .fouls,.tbox .tmo{display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:36px;font-size:12.5px;font-weight:600;padding:2px 4px}
.tbox .tmo{border:1px solid var(--grey);border-radius:4px;background:var(--white)}
/* In the bonus (the other team has reached the bonus foul): a thick orange ring and BONUS on a tab above the box. The ring
   is a shadow and the tab sits in the gap over the box, so nothing on the desk moves when it lights up. */
.tbox{position:relative;margin-top:12px}
.tbox.bonus{border-color:var(--f4);box-shadow:0 0 0 3px var(--f4)}
.bonustab{position:absolute;top:-12px;right:10px;z-index:2;background:var(--f4);color:var(--black);font-family:var(--f-display);font-weight:900;font-size:16px;line-height:18px;letter-spacing:.14em;padding:0 8px 0 10px;border-radius:4px;pointer-events:none}
.tbox .fouls b,.tbox .tmo b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1}
.tbox .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tbox .grid button{min-height:30px;border:1px solid var(--grey);background:var(--white);border-radius:4px;font-weight:600;font-size:12.5px;padding:0 2px}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cact .btn{min-height:34px;font-size:13px;padding:4px 6px;line-height:1.15}
/* The arrow's team is spelled out: a long one moves to its own line rather than being cut to letters. */
.cact .an{display:inline-block}
.cact .wide{grid-column:span 2}
.mini{margin-top:8px;border-top:2px solid var(--black)}
.mini .plays li{padding:4px 2px;font-size:13px}
/* Real names wrap a play onto two lines: the list keeps to five short rows' room (newest on top) and scrolls inside, so the
   desk never grows past one iPad screen. */
.desk .mini{max-height:150px;overflow-y:auto}

/* Follow-up strip (assist / rebound / shot spot / sub): pinned to the bottom, never blocks the next tap. */
.fu{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:4px solid var(--green);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.fu .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0}
.fu .ask{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-right:6px}
.fu .chip{min-width:44px;min-height:40px}
/* A long name takes a second line inside its chip, so the strip stays short and clear of the five cards. */
.fu .chip .nm{display:inline-block;max-width:9.5em;white-space:normal;line-height:1.05;vertical-align:middle;text-align:left}
.fu .fu-side{padding:2px 6px;border-radius:4px;border:2px solid transparent}
.fu .fu-side.def{border-color:var(--black)}
.fu .fu-gap{width:14px}
.court{display:block;width:100%;max-width:520px;height:auto;touch-action:manipulation}
.court .fl{fill:var(--white);stroke:var(--black);stroke-width:3}
/* Court markings only (class ln): a miss's X keeps its team's color. */
.court .ln{fill:none;stroke:var(--grey);stroke-width:3}
.fu .court{max-width:240px}
@media (min-width:901px){
  .fu.loc{left:50%;right:auto;width:300px;transform:translateX(-50%);border:4px solid var(--green);border-bottom:0;border-radius:8px 8px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.28)}
  .fu.loc .wrap{justify-content:space-between}
  .fu.loc .court{max-width:none;width:100%}
}
@media (min-width:901px) and (max-width:1180px){ .fu.loc{width:272px} }

/* Plays */
.plays{list-style:none;margin:0;padding:0}
.plays li{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--grey)}
.plays .pq{font-family:var(--f-display);font-weight:800;min-width:30px}
.plays .ps{font-family:var(--f-display);font-weight:900;min-width:52px;text-align:center;font-size:16px}
.plays .pt{flex:1;min-width:0}
.plays li.void .pt{text-decoration:line-through}
.plays li.score .pt b{color:var(--tl,var(--green))}
.plays li.note .pt{font-style:italic}
.plays li.tapfix{cursor:pointer}
.plays li.tapfix .pt::after{content:" ✎";font-size:12px}

/* ---------- Announcer ---------- */
.ann .lastplay{font-size:20px;font-weight:600;text-align:center;padding:8px;border-bottom:2px solid var(--black)}
.ann-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ann > *,.ann-cols > *{min-width:0}
.plays .pq small{display:block;font-size:11px;font-weight:500;letter-spacing:0}
.plays .ptm{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.05em;padding:0 4px;border-radius:3px;background:var(--tf,var(--green));color:var(--ti,var(--white))}
.floor td{font-size:16px}
.floor td.nm{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;cursor:pointer}
.floor .say{font-family:var(--f-body);text-transform:none;font-weight:500;font-size:13px;font-style:italic;white-space:normal}
/* The team-fouls bar under the PA's and Jim's scoreboard, pinned with it: each team's fouls this quarter, BONUS on a tab
   over the team shooting it (with the thick orange ring), and everyone with 3 or more fouls in the foul colors. */
.tfbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:15px 0 4px}
.tfb{position:relative;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0;min-height:46px;border:1px solid var(--grey);border-radius:8px;padding:4px 10px;background:var(--white)}
.tfb.bonus{border-color:var(--f4);box-shadow:0 0 0 3px var(--f4)}
.tfb .bonustab{top:-12px;left:10px;right:auto;font-size:17px;line-height:19px;padding:0 10px 0 11px}
.tft{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.06em;line-height:1.2;padding:1px 6px;border-radius:4px;background:var(--tf,var(--green));color:var(--ti,var(--white))}
/* The team's whole name in the foul bar (a very long one shrinks to fit, fitNames); its letters only where the window is
   phone-narrow. */
.tft{text-transform:uppercase;min-width:0;max-width:100%}
.tft .tftn{display:block}
.tft .tfta{display:none}
@media (max-width:700px){ .tft .tftn{display:none} .tft .tfta{display:inline} }
.tfn{font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1}
.tfl{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tfp{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;justify-content:flex-end}
.tfp .pfp{font-size:15px;padding:3px 6px}
/* A player in foul trouble on the PA page: the row on the floor tinted, with a bar in the color; bench and table chips
   ringed (and tinted unless the chip is in the team's color or called). */
.floor tr:is(.f3,.f4,.f5) td{background:var(--fc-t)}
.floor tr:is(.f3,.f4,.f5) td:first-child{box-shadow:inset 6px 0 0 var(--fc)}
.floor tr:is(.f3,.f4,.f5) td.nm{padding-left:12px}
.f3{--fc:var(--f3);--fc-t:var(--f3t)}
.f4{--fc:var(--f4);--fc-t:var(--f4t)}
.f5{--fc:var(--f5);--fc-t:var(--f5t)}
:is(.ann,.livestrip) .chip:is(.f3,.f4,.f5){border-color:var(--fc);box-shadow:inset 0 0 0 2px var(--fc)}
:is(.ann,.livestrip) .chip:is(.f3,.f4,.f5):not(.at):not(.dark){background:var(--fc-t)}
/* The headline after a whistle: the foul count in its color, fouled out or ejected in red, the bonus in orange. */
.hlf.f3,.hlf.f4,.hlf.f5,.hl-bonus{border-radius:4px;padding:0 5px;background:var(--fc);color:var(--black)}
.hlf.f5{color:var(--white)}
.hl-bonus{background:var(--f4)}
.ann .lastplay .hl-out{background:var(--f5)}
.subs{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.subs li{padding:3px 0;border-bottom:1px solid var(--grey)}
.lead{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lead .card{padding:10px}
.lead .lr{display:flex;gap:8px;align-items:center;border-top:1px solid var(--grey);padding-top:4px;margin-top:4px;min-width:0}
.lead .lr b{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;color:var(--tl,var(--green));min-width:36px}
.lead .lr span{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.lead .lr small{display:block;font-weight:500;font-size:12px}
.ann .lastplay div{line-height:1.35}
.ann .lastplay .hl-k{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ann .lastplay .hl-prev{font-size:.8em;font-weight:500}
.hl-out{background:var(--black);color:var(--white);border-radius:4px;padding:0 6px;font-family:var(--f-display);font-weight:800;letter-spacing:.04em}
.ann .ago{text-align:center;padding:0 0 6px}
/* PA Live: the board stays pinned to the top while the PA scrolls down to the notes or the last plays. */
.annbug{position:sticky;top:0;z-index:15;background:var(--white);padding:4px 0}
.ann > .bugcap{margin-bottom:-8px}
table.glance td,table.glance th{text-align:center}
table.glance td.l,table.glance th.l{text-align:left}
.annbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
body.annfull .top .tabs{visibility:hidden}
.annmode{display:inline-flex;border:2px solid var(--green);border-radius:4px;overflow:hidden;flex:none}
.annmode button{border:0;background:var(--white);color:var(--green);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:5px 16px;min-height:36px}
.annmode button[aria-pressed="true"]{background:var(--green);color:var(--white)}
/* The PA and Jim pages on a laptop: a pointer on everything that clicks, a black ring where the keyboard is, no words
   selected by a double-click on a chip, and a hover only where there's a mouse (an iPad never sticks in hover). */
:is(.ann,.livestrip,.prep,.vis) [data-act]:not(button),.seg[data-act],.annbar label,.prep summary{cursor:pointer}
:is(.annbar,.ann,.livestrip,.prep,.seg,.sheet) :is(.chip,.btn,.bcrow,.bcteamnote,.annmode button),.seg.done:not(.peek),.floor td.nm{-webkit-user-select:none;user-select:none}
:is(.annbar,.ann,.livestrip,.prep,.seg,.vis,.sheet) :is(button,a,summary,input,textarea,select,[tabindex]):focus-visible,.seg[tabindex]:focus-visible{outline:3px solid var(--black);outline-offset:2px}
.toast .btn:focus-visible{outline:3px solid var(--white);outline-offset:2px}
@media (hover:hover){
  :is(.annbar,.ann,.livestrip,.prep,.vis,.seg,.sheet,.toast) :is(.btn,.chip,.bcrow,.bcteamnote,.annmode button):not(:disabled):hover{border-color:var(--black);box-shadow:inset 0 0 0 1px var(--black)}
  :is(.annbar,.ann,.livestrip,.prep,.vis,.seg,.sheet) :is(.btn.primary,.btn.dark,.btn[aria-pressed="true"],.chip.at,.chip.dark,.annmode button[aria-pressed="true"]):not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--white)}
  .floor td.nm:hover,.bcteamnote:hover,.prep summary:hover{text-decoration:underline}
  .seg.done:hover{border-color:var(--black)}
  .ann .bcrow.on:not(:disabled):hover{border-left-color:var(--tl,var(--green))}
}
.paundo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.undopair{display:inline-flex;gap:8px;max-width:100%;min-width:0}
.undopair .paundo{min-width:0}
.undopair .paredo{flex:none}
.toast .btn{margin-left:10px;min-height:28px;padding:2px 10px}
/* Prep: the PA's list of their players, two columns on a laptop. */
.vis{display:grid;gap:6px;margin:10px 0 4px;padding-top:8px;border-top:1px solid var(--grey)}
.vislist{columns:2 400px;column-gap:18px}
.visrow{display:grid;grid-template-columns:58px minmax(0,1.4fr) minmax(0,1fr) 48px;gap:6px;align-items:center;break-inside:avoid;margin-bottom:5px}
.visrow input[type=text]{min-height:34px;padding:4px 8px}
.visn{font-family:var(--f-display);font-weight:900;font-size:21px;text-align:center}
.visbook{display:grid;min-width:0;line-height:1.2}
.visbook .tag{margin-left:4px}
.visadd{padding-bottom:6px;border-bottom:1px solid var(--grey)}

/* ---------- Broadcast page (?broadcast) ---------- */
body.bcfull .brand b small{font-size:.6em;letter-spacing:.12em;margin-left:6px}
.bc{display:grid;gap:8px}
.bc [data-bc="bug"]{position:sticky;top:0;z-index:15;background:var(--white);padding:4px 0}
.bcgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px minmax(0,1fr);gap:10px;align-items:start}
.bcgrid > *,.bcrail > *{min-width:0}
.bcrail{display:grid;gap:8px}
.bcrail .card h3,.bcteam h3{margin:0 0 6px}
.bcteam{padding:10px}
.bcteamnote{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--black);background:var(--white);color:var(--black);padding:4px 8px;margin:4px 0 6px;font:inherit;font-size:15px;line-height:1.3;white-space:pre-wrap;cursor:pointer}
.bcteamnote.empty{border-left-color:var(--grey);font-weight:600}
.bck{margin:10px 0 4px;color:var(--tl,var(--green))}
.bcrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;text-align:left;border:1px solid var(--grey);border-radius:8px;padding:5px 6px;margin-bottom:4px;background:var(--white);color:var(--black);font:inherit;cursor:pointer}
.bcrow.on{border-left:5px solid var(--tl,var(--green));padding-left:5px}
.bcrow.fo{border-style:dashed}
.bcrow .pnum{display:grid;place-items:center}
.bcwho{display:grid;gap:1px;min-width:0}
.bcname{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;text-transform:uppercase;overflow-wrap:anywhere}
.bcdesc{font-size:13px;font-weight:600}
.bcwho .say{font-size:14px;font-style:italic;font-weight:500}
.bcnote{font-size:15px;line-height:1.3;border-left:3px solid var(--black);padding-left:6px;margin:2px 0;white-space:pre-wrap}
.bcline{font-size:13px}
.bcnum{display:grid;justify-items:end;gap:4px}
.bcpts{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1}
.bctot{font-size:13px;font-weight:600;border-top:2px solid var(--black);padding-top:6px;margin-top:6px}
.bcpad textarea{width:100%;font-size:16px;min-height:150px}
.bcpad p{margin:4px 0 0}
.drops{margin:0;padding-left:18px;display:grid;gap:6px;font-size:16px;line-height:1.35}
.bcinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:15px}
.bcinfo dt{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;padding-top:2px}
.bcinfo dd{margin:0;white-space:pre-wrap}
/* Jim's spotting rows in foul trouble: tinted, ringed, the pill in the color (as on the scorer's cards). */
.bcrow:is(.f3,.f4,.f5){background:var(--fc-t);border-color:var(--fc);border-style:solid;box-shadow:inset 0 0 0 3px var(--fc)}
/* Whose phonetic spelling shows on Jim's page: the PA's, or his own (his page only). */
.sayby{display:inline-block;margin-left:6px;font-family:var(--f-display);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--black);border-radius:3px;padding:0 4px;vertical-align:1px}
.bcsaynote{margin:-6px 0 0}
/* Jim's full box score under the spotting boards: both teams side by side on a laptop. A table wider than its card scrolls
   inside it with the names pinned; nothing scrolls the page sideways. */
.bcboxes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;scroll-margin-top:230px}
.bcboxes > *{min-width:0}
.bcboxes > .bchead{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px;padding-bottom:4px;border-bottom:2px solid var(--black)}
@media (max-width:1100px){ .bcboxes{grid-template-columns:minmax(0,1fr)} }
.bcbox{padding:10px}
.bcbox table{font-size:14px}
.bcbox th,.bcbox td{padding:4px 5px}
.bcbox th:first-child,.bcbox td:first-child{position:sticky;left:0;z-index:1;background:var(--white);white-space:normal;min-width:8.5em;max-width:11em;line-height:1.2}
.bcbox tr:is(.f3,.f4,.f5) td{background:var(--fc-t)}
.bcbox tr:is(.f3,.f4,.f5) td:first-child{background:var(--fc-t);box-shadow:inset 5px 0 0 var(--fc);padding-left:9px}
.bcbox .pn{font-weight:600}
.bcbox .pfp{font-size:13px;padding:1px 5px}
.bcbox .onf{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle;background:var(--tf,var(--green));border:1px solid var(--ta,var(--tf,var(--green)))}

/* ---------- PA script ---------- */
.livestrip{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:2px solid var(--black);padding:6px 0 8px;margin-bottom:10px;display:grid;gap:6px}
.ls-game{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:14px}
.ls-game .ls-sc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase}
.ls-game .ls-sc .tm{border-radius:4px;padding:1px 8px;background:var(--tf,var(--green));color:var(--ti,var(--white))}
.ls-game .ls-sc .tm b{font-weight:900;font-size:24px;margin-left:6px}
/* The whole team name; only a very long one shrinks (fitNames) so the strip keeps to its line on a laptop. */
.ls-game .ls-sc .tm .nm{display:inline-block;max-width:250px;vertical-align:bottom}
.lsfl{display:inline-flex;align-items:center;gap:8px}
.tfm{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--grey);border-radius:4px;padding:1px 7px;font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.15}

<script>
"use strict";
/* Brier Stats: basketball scorebook for Greenbrier (Bobcats / Lady Cats).
   One device scores a game; everyone else signed in follows it live on the Announcer page. Each device's own saved copy is the
   truth and the cloud is only a pipe, so scoring never waits on signal. Mirrors Mound Book's design and shares its Firebase project.

const BS_VERSION = "0.4.1";

const ANN_ONLY = !PUB && /[?&#]announcer\b/.test(location.search + location.hash);
const BC_ONLY = !PUB && !ANN_ONLY && /[?&#]broadcast\b/.test(location.search + location.hash);   // Jim's broadcast page

/* ---------- schedule (from the 2026-27 master sheet in the social kit) ---------- */
const SCHEDULE = [
 ["2026-11-16","19:30","boys","Watertown","Away",0,"Hall of Fame (preseason)"],["2026-11-17","18:00","girls","White House Heritage","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-17","19:30","boys","White House Heritage","Away",0,"Hall of Fame (preseason)"],["2026-11-19","18:00","girls","Wilson Central","Away",0,"Hall of Fame (preseason)"],
 ["2026-11-19","19:30","boys","Wilson Central","Away",0,"Hall of Fame (preseason)"],["2026-12-04","18:00","girls","Jo Byrns","Home",0,""],["2026-12-04","19:30","boys","Jo Byrns","Home",0,""],
 ["2026-12-07","18:00","girls","Merrol Hyde","Away",0,""],["2026-12-07","19:30","boys","Merrol Hyde","Away",0,""],["2026-12-08","18:00","girls","White House Heritage","Home",0,""],
 ["2026-12-08","19:30","boys","White House Heritage","Home",0,""],["2026-12-15","18:00","girls","KIPP Antioch","Away",0,""],["2026-12-15","19:30","boys","KIPP Antioch","Away",0,""],
 ["2026-12-18","18:00","girls","Gallatin","Away",0,"Christmas Classic"],["2026-12-18","19:30","boys","Gallatin","Away",0,"Christmas Classic"],
 ["2027-01-05","18:00","girls","East Robertson","Home",0,""],["2027-01-05","19:30","boys","East Robertson","Home",0,""],["2027-01-08","18:00","girls","Jo Byrns","Away",0,""],
 ["2027-01-08","19:30","boys","Jo Byrns","Away",0,""],["2027-01-12","18:00","girls","Springfield","Home",1,""],["2027-01-12","19:30","boys","Springfield","Home",1,""],
 ["2027-01-15","18:00","girls","White House","Home",1,""],["2027-01-15","19:30","boys","White House","Home",1,""],["2027-01-19","18:00","girls","Portland","Away",1,""],
 ["2027-01-19","19:30","boys","Portland","Away",1,""],["2027-01-22","18:00","girls","Liberty Creek","Away",1,""],["2027-01-22","19:30","boys","Liberty Creek","Away",1,""],
 ["2027-01-26","18:00","girls","Station Camp","Home",1,""],["2027-01-26","19:30","boys","Station Camp","Home",1,""],["2027-01-29","18:00","girls","Springfield","Away",1,""],
 ["2027-01-29","19:30","boys","Springfield","Away",1,""],["2027-02-02","18:00","girls","White House","Away",1,""],["2027-02-02","19:30","boys","White House","Away",1,""],
 ["2027-02-05","18:00","girls","Portland","Home",1,""],["2027-02-05","19:30","boys","Portland","Home",1,""],["2027-02-09","18:00","girls","Liberty Creek","Home",1,""],

/* ---------- saved data ----------
   S.games[id]: {id, date, time, team:"boys"|"girls", opp, ha:"Home"|"Away" (ours), district, event, quarters, qlen,
     us:[player] (our roster as of tip-off), them:[player], ev:[event], status:"pre"|"live"|"final", rev, upd, writer, takeover, deleted, practice}
   player: {pid, num, name, pos, grade ("Fr"|"So"|"Jr"|"Sr"), ht ("6-2")}
   event: {id, at, tm:"us"|"them", pid (null = team), t, ...}
     FG {p:2|3, m:bool, x?, y?}  FT {m}  REB {o:bool}  AST  STL  BLK  TO  PF  TF (technical; no pid = bench/coach)
     TMO {len:60|30}  IN  OUT  PER (ends the period)  POSS {to}  NOTE {txt}  v:true = voided (kept, struck through)
   S.booth[gid]: {table:{us:[pid], them:[pid]}, said:[pid], notes, info:{usCoach, oppCoach, officials, sponsor, honors},
     start:{us:[pid], them:[pid]}, done:[script line id], upd}: players waiting at the scorer's table, which of them the
     announcer has called, the booth's notes, and what the PA script needs (the starters the PA introduces, who coaches and
     officiates, tonight's sponsor, which script lines are read). Not stats, so the scorer and the announcer both change it.
   S.opps[name lowercased]: {mascot, girls, c1, c2, abbr}: what Coach changed about an opponent; OPP_PRESETS has the rest.
   S.script: {segs:[{id, at:"top"|"game"|"end", title, cue, text, need}], upd}: the PA's game-night script, null = the default.
   S.say[pid]: a player's phonetic spelling ("SHAY-vee-on"), set by the PA. Only the PA and broadcast pages show it. Our
     players keep their pid all season. booth(gid).vis: the PA's own list of the visitors (paRoster, paFold).
     The lists in booth(gid) (vis, table, said, done) are also kept by id (visBy, tableBy, saidBy, doneBy: see setBooth).
     S.boothOwe, S.sayOwe, S.scriptOwe: booth changes, spellings and the script still owed to the cloud (kept on the device).
   S.bc: {n:{key:text}, upd}: Jim's broadcast notes that last the season (keys in bcKey/bcTeamKey); S.bcDirty: keys owed to the cloud. */
const KEY = "brierstats.v1";
const SAVE = {ok: true, err: ""};
let S;
function blank(){
  return {v:1, dev:rid(), teams:{boys:{name:"Bobcats", roster:[]}, girls:{name:"Lady Cats", roster:[]}}, teamsRev:0,
    teamsBase:null, teamsPrev:null, strand:{}, games:{}, booth:{}, say:{}, sayUpd:0, bc:{n:{}, upd:0}, bcDirty:{}, opps:{}, script:null, settings:{bonus:5, to60:3, to30:2, quarters:4, qlen:8, otlen:4, chart:true, extra:true, pub:true, pubSec:30}, seeded:false, sync:false, unsent:{}, pubRedo:{}, role:null};
}
// The book is one small key for rosters and settings plus one key per game, so a tap rewrites only its own game. A book
// saved by an older version keeps every game inside the main key; it moves over on the first save that has room.
const GKEY = KEY + ".g.", onDisk = new Map(), finalSig = new WeakMap();   // game id -> the JSON last written (or read) for it
let mainHasGames = false, MONO = false;
function load(){
  try{ const t = localStorage.getItem(KEY); S = t ? JSON.parse(t) : blank(); }catch(e){ S = blank(); SAVE.ok = false; SAVE.err = "This browser won't save (private browsing?)."; }
  if(!S.games) S.games = {};
  mainHasGames = Object.keys(S.games).length > 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); if(!k || !k.startsWith(GKEY)) continue;
      const t = localStorage.getItem(k), id = k.slice(GKEY.length); let g; try{ g = JSON.parse(t); }catch(e){ continue; }
      const o = S.games[id];   // both copies after an interrupted move: the newer one wins
      if(!o || (g.rev || 0) > (o.rev || 0) || ((g.rev || 0) === (o.rev || 0) && (g.upd || 0) >= (o.upd || 0))) S.games[id] = g;
      onDisk.set(id, t);
    }
  }catch(e){}
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // ask the browser not to clear it
  const b = blank();
  if(S.teamsBase === undefined && S.sync) S.teamsBase = S.teamsRev || 0;
  for(const k of Object.keys(b)) if(S[k] === undefined) S[k] = b[k];
  for(const k of Object.keys(b.settings)) if(S.settings[k] === undefined) S.settings[k] = b.settings[k];
  if(!S.seeded){
    SCHEDULE.forEach(([date,time,team,opp,ha,dist,event]) => { const g = newGame({date,time,team,opp,ha,district:!!dist,event}); if(!S.games[g.id]) S.games[g.id] = g; });
    S.games.practice = practiceGame(); S.seeded = true; save();
  }
  else if(mainHasGames) save();   // move an older book to one key per game now, while nothing else is going on
}
const LOCAL_SET = ["extra", "chart", "flip"];
function cloudSettings(s){ const o = {...s}; LOCAL_SET.forEach(k => delete o[k]); return o; }
function save(){
  try{
    if(MONO) localStorage.setItem(KEY, JSON.stringify(S));
    else {
      for(const id of Object.keys(S.games)){
        const g = S.games[id], sig = g.status === "final" ? [g.rev, g.upd, g.ev.length, g.writer, g.writerAt, g.deleted].join("|") : "";
        if(sig && finalSig.get(g) === sig && onDisk.has(id)) continue;   // a final game nobody touched: skip re-reading it
        const t = JSON.stringify(g); if(onDisk.get(id) !== t){ localStorage.setItem(GKEY + id, t); onDisk.set(id, t); }
        if(sig) finalSig.set(g, sig);
      }
      for(const id of [...onDisk.keys()]) if(!S.games[id]){ localStorage.removeItem(GKEY + id); onDisk.delete(id); }
      const {games, ...rest} = S; localStorage.setItem(KEY, JSON.stringify(rest)); mainHasGames = false;
    }
    SAVE.ok = true; SAVE.err = "";
  }catch(e){
    // No room to move an older book to one key per game: keep it in one key, as before, then clear the half-made copy.
    if(!MONO && mainHasGames){ try{ localStorage.setItem(KEY, JSON.stringify(S)); MONO = true; for(const id of onDisk.keys()) localStorage.removeItem(GKEY + id); onDisk.clear(); SAVE.ok = true; SAVE.err = ""; return; }catch(e2){} }
    SAVE.ok = false; SAVE.err = "This device stopped saving (" + (e.name || "storage full") + "). Back up the game from Setup now.";
  }

// Nothing in this book yet: no players and no game with plays (a Home Screen app opened for the first time).
function emptyBook(){ return !Object.values(S.teams || {}).some(t => t && t.roster && t.roster.length) && !Object.values(S.games).some(g => !g.practice && g.ev.length); }
// What this site keeps on this device (Mound Book shares the space), in bytes the way Safari counts them, against its
// limit of about 5 MB.
function storeUse(){
  let b = 0;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i), v = localStorage.getItem(k) || ""; b += (k.length + v.length) * (/[^\u0000-\u00ff]/.test(v) ? 2 : 1); } }catch(e){}
  return b;
}
function newGame(o){
  let id = o.id || (o.date + "-" + o.team);

function playText(g, e){
  const who = esc(pLabel(g, e.tm, e.pid)), team = esc(tmName(g, e.tm));
  switch(e.t){
    case "FG": return e.m ? "<b>" + who + " makes " + e.p + "</b>" : who + " misses " + e.p;
    case "FT": return e.m ? "<b>" + who + " makes free throw</b>" : who + " misses free throw";
    case "REB": return (e.pid ? who : team + " team") + (e.o ? " offensive" : " defensive") + " rebound";
    case "AST": return who + " assist";
    case "STL": return who + " steal";
    case "BLK": return who + " block";
    case "TO": return (e.pid ? who : team + " team") + " turnover";
    case "PF": return who + " foul";
    case "TF": return (e.pid ? who : team + " bench/coach") + " technical foul";
    case "TMO": return "Timeout " + team + ", " + (e.len === 30 ? "30 seconds" : "60 seconds");

function tableIds(g, tm){ return ((booth(g.id).table || {})[tm] || []).slice(); }

/* ---------- recording ---------- */
function touch(g){ g.rev = (g.rev || 0) + 1; g.upd = Date.now(); save(); Sync.dirty(g.id); render(); }
function claim(g){ if(!g.writer){ g.writer = S.dev; g.writerAt = Date.now(); } }
// The game fields the edit sheet, Final and Reopen change. g.fed keeps when each was last changed, so two devices fixing a

const GFIELDS = ["date", "time", "opp", "ha", "event", "district", "off", "forfeit", "ppdFrom", "offWas", "status", "quarters", "qlen"];

// stamp ed, game fields by g.fed, numbers the PA's list put in). Where neither side's change is newer, base's stands.

// Foul trouble, Kevin's way, the same for the scorer, the PA and Jim (never the fan page): 3 fouls yellow, 4 orange, 5 red.
// A technical counts as a personal foul, and a second one is an ejection: red too. foulLvl gives 0, 3, 4 or 5; fcls the
// class (f3, f4, f5) that puts a card, row, chip or pill in that color.
function foulLvl(ln){ return !ln ? 0 : ln.tf >= 2 || ln.pf >= 5 ? 5 : ln.pf >= 3 ? ln.pf : 0; }
const fcls = ln => { const n = foulLvl(ln); return n ? " f" + n : ""; };
function foulPill(g, R, ln){
  if(ln.tf >= 2) return `<i class="pfp f5" title="Two technicals: ejected">EJECTED</i>`;
  if(ln.pf >= 5) return `<i class="pfp f5" title="Five fouls: fouled out">OUT · 5F</i>`;
  return `<i class="pfp${fcls(ln)}" title="${ln.pf} personal foul${ln.pf === 1 ? "" : "s"}${ln.tf ? ", " + ln.tf + " technical" : ""}">${ln.pf}F${ln.tf ? " · T" : ""}</i>`;
}
function pcard(g, R, tm, p, edit, onFloor){
  const ln = R.box[tm][p.pid] || LINE(), fo = ln.pf >= 5 || ln.tf >= 2, dis = edit ? "" : "disabled";
  const B = (k, lbl, cls) => `<button class="${cls || ""}" data-st="${k}" data-tm="${tm}" data-pid="${p.pid}" ${dis}>${lbl}</button>`;
  let h = `<div class="pcard${onFloor ? " on" : ""}${fo ? " fo" : ""}${fcls(ln)}"><button class="pnum" data-act="pmenu" data-tm="${tm}" data-pid="${p.pid}" aria-label="More for #${esc(p.num)}">${esc(p.num)}</button><div>
    <div class="pline"><b class="fit">${esc(pShort(p) || "#" + p.num)}</b>${foulPill(g, R, ln)}<span>${statLine(ln, true)}</span><span class="pts">${ln.pts}</span></div>`;
  // Fouled out or ejected and still on the floor: her stat buttons give way to the bench (the ones at the table first), so
  // a missed toast can't put the next plays on her, and one tap brings in the sub. Same height, so no card moves; each sub
  // chip in her foul color, so a sub already at 3 or 4 shows.
  if(fo && onFloor && edit && g.status !== "final"){ const tb = atTable(g, tm), ok = x => { const l = R.box[tm][x.pid] || LINE(); return !R.court[tm].has(x.pid) && l.pf < 5 && l.tf < 2; };
    const bench = sortRoster(roster(g, tm)).filter(ok).sort((a, b) => tb.includes(b.pid) - tb.includes(a.pid));
    return h + `<div class="subout${S.settings.extra ? "" : " one"}"><span class="kicker">${ln.tf >= 2 ? "Ejected" : "Fouled out"} · <span>sub in</span></span>${bench.map(x => `<button class="chip${tb.includes(x.pid) ? " at" : ""}${fcls(R.box[tm][x.pid])}" data-act="subfor" data-tm="${tm}" data-pid="${x.pid}" data-out="${p.pid}" ${dis} aria-label="#${esc(x.num)} ${esc(x.name || "")} in for #${esc(p.num)}"><b>${esc(x.num)}</b></button>`).join("") || `<span class="small">Nobody left on the bench.</span>`}</div></div></div>`; }
  if(S.settings.extra){
    h += `<div class="sb">${B("ft","+1 FT","mk")}${B("2","+2","mk")}${B("3","+3","mk")}${B("ftx","FT ✗","ms")}${B("2x","2 ✗","ms")}${B("3x","3 ✗","ms")}</div>
      <div class="sb">${B("reb","REB")}${B("ast","AST")}${B("stl","STL")}${B("blk","BLK")}${B("to","TO")}${B("pf","FOUL","fl")}</div>`;
  }else h += `<div class="sb four">${B("ft","FT +1","mk")}${B("2","2PT +2","mk")}${B("3","3PT +3","mk")}${B("pf","FOUL","fl")}</div>`;
  return h + `</div></div>`;
}
// Under a team on the PA's and Jim's scoreboards: its timeouts by length (gone at the final). Its team fouls and the bonus

function boardMeta(g, R){ if(g.status === "final") return null;

// BONUS on a tab above a team's box: the scorer's team box, the PA's and Jim's foul bar.
const bonusTab = (g, tm) => `<span class="bonustab" title="${esc(tmName(g, tm))} shoots free throws on every foul: ${esc(tmName(g, OTHER(tm)))} has ${S.settings.bonus} or more team fouls">BONUS</span>`;
// The team-fouls bar under the PA's and Jim's scoreboard, pinned with it. Each team's fouls this quarter (overtime counts

    return `<div class="tfb${on ? " bonus" : ""}" style="${tvars(g, tm)}" title="${esc(tmName(g, tm))}: ${n} team foul${n === 1 ? "" : "s"} this ${R.q > (g.quarters || 4) ? "overtime (with the 4th)" : "quarter"}${on ? ", in the bonus" : ""}">${on ? bonusTab(g, tm) : ""}<span class="tft"><span class="tftn fit" data-min="11">${esc(tmName(g, tm))}</span><span class="tfta">${esc(tm === "us" ? "GHS" : oppInfo(g.opp, g).abbr)}</span></span><b class="tfn">${n}</b><span class="tfl">team foul${n === 1 ? "" : "s"}</span>${tr.length ? `<span class="tfp">${tr.map(pill).join("")}</span>` : ""}</div>`; };

// The scoreboard every page shares: each half solid in its team's colors, the period and the arrow on the seam.

function bug(g, R, o = {}){

// Points by quarter, the left-hand team on top. Each row starts with a block of that team's color.
function lineScore(g, R){

/* follow-up strip */
function renderFu(){
  const el = $("#fu"), g = cur();
  // A follow-up waits through a look at another tab (Box score, Plays), but not past a switch to another game, or for a
  // play that's been removed or changed since.
  if(ui.fu.length && (!g || (ui.fuG && ui.fuG !== g.id))) ui.fu = [];
  if(ui.fu.length){ const live = id => g.ev.find(e => e.id === id && !e.v), on = replay(g).court;
    ui.fu = ui.fu.filter(f => f.k === "loc" ? !!live(f.id) : f.k === "ast" ? (x => !!x && x.m && x.tm === f.tm && x.pid === f.shooter)(live(f.ref)) : f.ref ? !!live(f.ref) : f.k !== "out" || !on[f.tm].has(f.pin)); }
  if(g && ui.tab === "desk") ui.fuG = g.id;   // the game the strip's questions are about
  if(ui.tab !== "desk" || !g || !ui.fu.length || !canEdit(g)){ el.innerHTML = ""; document.body.classList.remove("has-fu"); return; }
  const f = ui.fu[0], R = replay(g), outNow = (tm, pid) => { const l = R.box[tm][pid]; return !!l && (l.pf >= 5 || l.tf >= 2); };
  const chips = (tm, excl, pool) => {
    const c = R.court[tm], list = sortRoster(roster(g, tm)).filter(p => p.pid !== excl);
    const use = pool || (c.size ? list.filter(p => c.has(p.pid)) : list);
    return use.map(p => { const out = outNow(tm, p.pid); return `<button class="chip${tm === "them" ? " skip" : ""}${out ? " dark" : ""}" style="${tm === "them" ? "border-color:" + teamInk(g, tm).line : ""}" data-fu="pick" data-tm="${tm}" data-pid="${p.pid}"><b>${esc(p.num)}</b><span class="nm">${esc(pShort(p))}${out ? " · OUT" : ""}</span></button>`; }).join("");
  };
  let h = "";
  if(f.k === "loc") h = `<span class="ask">Where was the shot?</span><button class="chip skip" data-fu="skip">Skip</button>${courtSvg([], "loc")}`;
  else if(f.k === "ast") h = `<span class="ask">Assist?</span>${chips(f.tm, f.shooter)}<button class="chip skip" data-fu="skip">No assist</button>`;
  // Rebounds keep one order whoever missed: the left column's team on the left, the right's on the right, so the book
  // learns where each chip lives. The side that's defending is marked, not moved.
  else if(f.k === "reb"){ const sd = sides(g), team = tm => `<button class="chip" data-fu="pick" data-tm="${tm}" data-pid=""><span class="nm">${esc(tmName(g, tm))} team</span></button>`, tag = tm => `<span class="kicker fu-side${tm === f.miss ? "" : " def"}">${tm === f.miss ? "Off" : "Def"}</span>`;
    h = `<span class="ask">Rebound?</span>${tag(sd.left)}${team(sd.left)}${chips(sd.left, null)}<span class="fu-gap"></span>${chips(sd.right, null)}${team(sd.right)}${tag(sd.right)}<button class="chip skip" data-fu="skip">Skip</button>`; }
  else if(f.k === "stl") h = `<span class="ask">Stolen by?</span>${chips(f.tm, null)}<button class="chip skip" data-fu="skip">No steal</button>`;
  else if(f.k === "to") h = `<span class="ask">Turnover by?</span>${chips(f.tm, null)}<button class="chip" data-fu="pick" data-tm="${f.tm}" data-pid="">Team</button><button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "blk") h = `<span class="ask">Whose shot got blocked?</span><button class="chip${f.p === 2 ? " at" : ""}" data-fu="bp" data-p="2">2PT</button><button class="chip${f.p === 3 ? " at" : ""}" data-fu="bp" data-p="3">3PT</button>${chips(f.tm, null)}<button class="chip skip" data-fu="skip">Skip</button>`;
  else if(f.k === "out"){ const p = player(g, f.tm, f.pin);
    h = `<span class="ask">#${esc(p.num)} ${esc(pShort(p))} in for</span>${chips(f.tm, null, sortRoster(roster(g, f.tm)).filter(x => R.court[f.tm].has(x.pid)).sort((a, b) => outNow(f.tm, b.pid) - outNow(f.tm, a.pid)))}<button class="chip skip" data-fu="skip">Cancel</button>`; }
  el.innerHTML = `<div class="fu no-print${f.k === "loc" ? " loc" : ""}"><div class="wrap">${h}</div></div>`;
  document.body.classList.add("has-fu");
}
function fuPick(tm, pid){
  const g = cur(), f = ui.fu[0]; if(!g || !f) return;
  ui.fu.shift();
  if(f.k === "ast") rec({tm, pid, t:"AST", ref:f.ref}, {keepFu:true});
  else if(f.k === "reb") rec({tm, pid, t:"REB", o: tm === f.miss}, {keepFu:true});
  else if(f.k === "to") rec({tm, pid, t:"TO", ref:f.ref}, {keepFu:true});
  else if(f.k === "stl") rec({tm, pid, t:"STL", ref:f.ref}, {keepFu:true});
  else if(f.k === "blk"){ const e = rec({tm, pid, t:"FG", p:f.p, m:false, ref:f.ref}, {keepFu:true}); if(e){ ui.fu.unshift({k:"reb", miss:tm}); if(S.settings.chart) ui.fu.unshift({k:"loc", id:e.id}); render(); } }
  else if(f.k === "out") subIn(g, tm, f.pin, pid);
  else render();
}

/* court: NFHS half court, 50 ft wide x 47 ft deep, basket at top. 10 svg units per foot. x,y saved as 0..1. */
function courtSvg(shots, mode, g){
  let s = `<svg class="court" viewBox="0 0 500 470" ${mode === "loc" ? 'data-court="loc"' : ""} role="img" aria-label="Half court">
    <rect class="fl" x="1.5" y="1.5" width="497" height="467"/><rect class="ln" x="190" y="0" width="120" height="190"/><circle class="ln" cx="250" cy="190" r="60"/>
    <line class="ln" x1="220" y1="40" x2="280" y2="40"/><circle class="ln" cx="250" cy="52.5" r="7.5"/><path class="ln" d="M52.5 0 V52.5 A197.5 197.5 0 0 0 447.5 52.5 V0"/><path class="ln" d="M190 470 A60 60 0 0 1 310 470"/>`;
  for(const sh of shots){
    const e = sh.e; if(e.x == null) continue;
    const x = e.x * 500, y = e.y * 470, k = g ? teamInk(g, e.tm) : US_INK;
    s += e.m ? `<circle cx="${x}" cy="${y}" r="10" fill="${k.fill}" stroke="${contrast(k.fill, "#FFFFFF") < 1.5 ? "#000" : k.alt || k.fill}" stroke-width="2.5"><title>${esc(sh.t || "")}</title></circle>`
             : `<g stroke="${k.line}" stroke-width="4"><line x1="${x-8}" y1="${y-8}" x2="${x+8}" y2="${y+8}"/><line x1="${x-8}" y1="${y+8}" x2="${x+8}" y2="${y-8}"/><title>${esc(sh.t || "")}</title></g>`;
  }

// Tap a player on Rosters: his season game by game, newest first, from the same games the Rosters line counts, with

  const rows = seasonGames(team).map(g => { const R = replay(g), ln = R.box.us[pid]; return ln && ln.gp ? {g, R, ln, pm:R.plays.some(x => !x.void && x.e.t === "IN")} : null; }).filter(Boolean).reverse();
  const n = rows.length, t = sumLines(rows.map(r => r.ln)), x = sumLines(rows.filter(r => !r.ln.po).map(r => r.ln)), pmr = rows.filter(r => r.pm), pmt = pmr.reduce((s, r) => s + r.ln.pm, 0);
  const pg = v => (v / n).toFixed(1), sg = v => (v > 0 ? "+" : "") + v, pgs = (m, a) => t.po ? pg(t[m]) : pg(t[m]) + "-" + pg(t[a]);
  const desc = [p.pos, p.grade, p.ht].filter(Boolean).join(" · ");
  const shots = rows.flatMap(r => r.R.shots.filter(s => s.e.tm === "us" && s.e.pid === pid).map(s => ({e:s.e, t:`${fmtDate(r.g.date)} ${r.g.ha === "Away" ? "at" : "vs"} ${r.g.opp}: ${s.e.m ? "made" : "missed"} ${s.e.p}`})));
  const placed = shots.filter(s => s.e.x != null), paint = e => e.x * 50 >= 19 && e.x * 50 <= 31 && e.y * 47 <= 19;
  const zone = (lbl, f) => { const z = placed.filter(s => f(s.e)); return `${lbl} <b>${z.filter(s => s.e.m).length}/${z.length}</b>`; };
  const cells = (l, pm) => `<td>${l.pts}</td><td>${cellOf(l, "fg")}</td><td>${cellOf(l, "tp")}</td><td>${cellOf(l, "ft")}</td><td>${l.oreb + l.dreb}</td><td>${l.ast}</td><td>${l.stl}</td><td>${l.blk}</td><td>${l.to}</td><td>${l.pf}</td><td>${pm}</td>`;

    ${rows.map(line).join("")}
    <tr class="tot"><td class="l">Season</td><td class="l">${n} game${n === 1 ? "" : "s"}</td>${cells(t, pmr.length ? sg(pmt) : "–")}</tr>
    <tr><td class="l">A game</td><td></td><td>${pg(t.pts)}</td><td>${pgs("fgm", "fga")}</td><td>${pgs("tpm", "tpa")}</td><td>${pgs("ftm", "fta")}</td><td>${pg(t.oreb + t.dreb)}</td><td>${pg(t.ast)}</td><td>${pg(t.stl)}</td><td>${pg(t.blk)}</td><td>${pg(t.to)}</td><td>${pg(t.pf)}</td><td>${pmr.length ? (pmt > 0 ? "+" : "") + (pmt / pmr.length).toFixed(1) : "–"}</td></tr>
    <tr><td class="l">Shooting</td><td></td><td></td><td>${pct(x.fgm, x.fga)}</td><td>${pct(x.tpm, x.tpa)}</td><td>${pct(x.ftm, x.fta)}</td><td colspan="7"></td></tr></table></div>`;

/* ---------- Bobcats Scorebook hand-off ----------
   Bobcats Scorebook keeps games at games/{YYYY-MM-DD-boys|girls} with gb, opp, top ("Name 22, Name 14"),
   periods{q1..q4,ot1,ot2:{gb,opp}} as the RUNNING score at the end of each period, and live_note (the shout-out line in
   its in-game posts, which already carry the score). Its paste box reads this. Game ids match: both apps name a game
   date-team, with -2 on a second game that day. Names go in whole (first and last), the way every screen here shows them. */
// Bobcats Scorebook can't change a game's date: a makeup there is a new game named for its new date and team
// (2027-01-07-boys, or -2 when that team already has a game that day). A game moved here keeps its id (the cloud's copy
// goes by it), so the copy names the Scorebook's game and carries ours as alt_id.
// The Scorebook deletes a game for good and gives the next one the lowest number free, so its names go to the games still on
// here: that team's games that day, in the order they were added (a moved game after the ones first scheduled that day), are
// date-team, -2, -3. A game added again after a delete here (our -2, the only one that day) is the Scorebook's date-team.
function sbId(g){
  if(g.practice) return g.id;
  const base = g.date + "-" + g.team, n = x => x.id === base ? 1 : x.id.startsWith(base + "-") ? parseInt(x.id.slice(base.length + 1), 10) || 1e6 : 1e9;
  const day = Object.values(S.games).filter(x => x.id !== g.id && !x.deleted && !x.practice && x.date === g.date && x.team === g.team).concat([g]).sort((a, b) => n(a) - n(b) || a.id.localeCompare(b.id));
  const i = day.indexOf(g); return i ? base + "-" + (i + 1) : base;
}
// What went to Bobcats Scorebook last, from any device (it rides with the game's booth notes), and whether a fix since
// has changed it: a Monday correction would otherwise leave the Scorebook's final and top scorers wrong.
function sbSent(g){ const s = (S.booth[g.id] || {}).sb; return s && s.at ? {at:s.at, changed:s.txt !== JSON.stringify(scorebookPayload(g))} : null; }
function sbWhen(at){ return new Date(at).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function scorebookPayload(g){
  // A forfeit goes over with no final: Bobcats Scorebook has no forfeit result, and a played score would post the wrong
  // winner. forfeit says which way the ruling went. A game that ended with nobody tapping Final is final here.
  const R = replay(g), Q = g.quarters || 4, ff = g.forfeit === "W" || g.forfeit === "L" ? g.forfeit : "", final = !ff && gameOver(g), periods = {};
  // Periods that are over. The period a final game ends in is the final itself; Bobcats Scorebook only keeps the end of
  // regulation (q4) and OT when the game went past them. An "End of" tapped just before Make it final doesn't count.
  let last = R.q;
  if((final || ff) && R.q > Q){ const live = R.plays.filter(p => !p.void && p.e.t !== "NOTE"); if(live.length && live[live.length - 1].e.t === "PER") last = R.q - 1; }
  let cu = {gb:0, opp:0};
  for(let q = 1; q < last && q <= Q + 2; q++){
    cu = {gb: cu.gb + (R.qs.us[q-1] || 0), opp: cu.opp + (R.qs.them[q-1] || 0)};
    periods[q <= Q ? "q" + q : "ot" + (q - Q)] = {...cu};
  }
  const named = roster(g, "us").filter(p => /^[A-Za-z]/.test(pShort(p))), nm = pShort;
  const top = named.map(p => ({p, pts:(R.box.us[p.pid] || LINE()).pts})).filter(x => x.pts > 0).sort((a, b) => b.pts - a.pts);
  const keep = top.filter((x, i) => i < 3 || x.pts >= 10).slice(0, 5);
  const sid = g.practice ? "practice" : sbId(g);
  return {source:"brier-stats", v:1, id:sid, ...(sid !== g.id && !g.practice ? {alt_id:g.id} : {}), date:g.date, team:g.team === "girls" ? "Girls" : "Boys", opponent:g.opp,
    final, gb: final ? R.sc.us : null, opp: final ? R.sc.them : null, periods, forfeit:ff,
    top: keep.map(x => nm(x.p) + " " + x.pts).join(", "),
    live_note: final || ff || g.status !== "live" ? "" : keep.slice(0, 2).map((x, i) => nm(x.p) + (i ? " " : " has ") + x.pts).join(", ")};
}
function sendSheet(){
  const g = cur(); if(!g) return;
  const p = scorebookPayload(g), txt = JSON.stringify(p), moved = p.id !== g.id && !g.practice && g.id.slice(0, 10) !== g.date;
  const day = d => { const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
  openSheet({gid:g.id, html:() => { const sb = sbSent(g); return `<h3>Send to Bobcats Scorebook</h3>
    ${sb ? `<p class="small" style="margin:0 0 8px">${sb.changed ? `<b>Changed since it went over</b> ${esc(sbWhen(sb.at))}: paste this copy there again so the Scorebook matches.` : `Sent ${esc(sbWhen(sb.at))}. Nothing has changed since.`}</p>` : ""}
    <p style="margin:0 0 8px">${p.forfeit ? `<b>Forfeit ${p.forfeit === "W" ? "win" : "loss"} (ruled).</b> Bobcats Scorebook has no forfeit result, so ${Object.keys(p.periods).length ? "this copy carries the quarter scores only. Set the result there yourself: the played score would post the wrong winner." : "there's nothing to copy. Set the result there yourself."}`
      : p.final ? `Final: <b>${esc(usName(g))} ${p.gb}, ${esc(g.opp)} ${p.opp}</b>${p.top ? `<br>Top scorers: ${esc(p.top)}` : ""}`
      : `<b>Not final yet.</b> This sends the quarter scores so far (${Object.keys(p.periods).map(k => k.toUpperCase()).join(", ") || "none yet"}) for an in-game post.${p.live_note ? `<br>Shout-out: ${esc(p.live_note)}` : ""}`}</p>
    <ol style="margin:0 0 10px;padding-left:20px;font-size:14px"><li>Tap <b>Copy</b>.</li><li>In Bobcats Scorebook open ${moved ? `the <b>${esc(day(g.date))}</b> ${g.team === "girls" ? "Girls" : "Boys"} game (this one moved from ${esc(day(g.id.slice(0, 10)))}: add the makeup there first if it isn't on its schedule yet)` : "this game"}, tap <b>Paste from Brier Stats</b>, paste, then <b>Fill it in</b>.</li></ol>
    ${p.forfeit && !Object.keys(p.periods).length ? "" : `<textarea class="mono" rows="5" readonly id="sendtxt" style="width:100%">${esc(txt)}</textarea>`}
    <div class="row" style="margin-top:10px">${p.forfeit && !Object.keys(p.periods).length ? "" : `<button class="btn primary" data-act="copysend">Copy</button>`}<button class="btn" data-close>Done</button></div>`; }});
}
async function copyText(t, ta){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  if(ta){ ta.select(); try{ return document.execCommand("copy"); }catch(e){} }
  return false;
}

/* ---------- the public copy of a game (hoopsPublic/{gid}) ----------
   Small on purpose: every fan's phone downloads it on every update. One JSON string, because Firestore can't hold lists
   inside lists. Box lines: [num, name, pos, year, height, pts, fgm, fga, tpm, tpa, ftm, fta, oreb, dreb, ast, stl, blk, to, pf, played, on floor]. */
const PUBK = ["pts","fgm","fga","tpm","tpa","ftm","fta","oreb","dreb","ast","stl","blk","to","pf"];
// A family's choice (number only) belongs to the player, not the game: Rosters decides for every game, so a final scored on
// a device that's gone follows it too. A player taken off Rosters keeps his choice in the team's hidden list (it syncs with
// the rosters). An opponent's or a practice player's flag is their own.
function noPub(g, tm, p){ if(tm !== "us") return !!p.nopub; const t = S.teams[g.team] || {}, r = (t.roster || []).find(x => x.pid === p.pid);
  return r ? !!r.nopub : !!(t.hidden || {})[p.pid] || !!p.nopub; }
function noPubMap(t){ const m = {...((t && t.hidden) || {})}; ((t && t.roster) || []).forEach(p => { m[p.pid] = !!p.nopub; }); for(const k in m) m[k] = !!m[k]; return m; }
// Rosters swapped in whole (Undo, Restore) never put a name back: a family's number-only choice carries over, on the roster
// or, for a player who isn't on it, in the team's hidden list. Only unticking it does.
function keepNoPub(from, to){ for(const k of Object.keys(to || {})){ const t = to[k]; if(!t) continue;
    for(const [pid, v] of Object.entries(noPubMap((from || {})[k]))){ if(!v) continue; const r = (t.roster || []).find(x => x.pid === pid); if(r) r.nopub = true; else t.hidden = {...(t.hidden || {}), [pid]:1}; } }
  return to; }
function pubSnap(g0){
  const R = replay(g0), o = oppInfo(g0.opp), b = booth(g0.id);
  const mask = tm => roster(g0, tm).map(p => noPub(g0, tm, p) ? {...p, name:""} : p), g = {...g0, us:mask("us"), them:mask("them")};
  const played = (tm, p) => (R.box[tm][p.pid] || {}).gp || R.court[tm].has(p.pid);
  const line = (tm, p) => { const l = R.box[tm][p.pid] || LINE(); return [p.num, p.name || "", "", "", ""].concat(PUBK.map(k => l[k]), [l.gp ? 1 : 0, R.court[tm].has(p.pid) ? 1 : 0, l.po ? 1 : 0, l.tf || 0]); };
  const all = R.plays.filter(p => !p.void && !["IN","OUT","POSS","NOTE"].includes(p.e.t)), fin = g.status === "final" || gameOver(g0);
  const plays = (fin ? all : all.slice(-40)).map(p => [p.q, p.sc.us, p.sc.them, playText(g, p.e).replace(/<[^>]+>/g, ""), p.scored ? 1 : 0, p.e.t === "PER" ? "" : p.e.tm, p.e.at || 0]);
  return {v:1, id:g.id, date:g.date, time:g.time || "", team:g.team, usName:usName(g), opp:g.opp, oi:{mascot:o.mascot, girls:o.girls, c1:o.c1, c2:o.c2, abbr:o.abbr},
    ha:g.ha, district:!!g.district, event:g.event || "", quarters:g.quarters || 4, status:g.forfeit || fin ? "final" : g.status, q:R.q, brk:R.brk, sc:R.sc, qs:R.qs,
    tf:{us:teamFouls(g, R, "us"), them:teamFouls(g, R, "them")}, bonus:{us:inBonus(g, R, "us"), them:inBonus(g, R, "them")},
    tol:{us:toLeft(g, R, "us"), them:toLeft(g, R, "them")}, poss:R.poss,
    box:{us:sortRoster(roster(g, "us")).filter(p => played("us", p)).map(p => line("us", p)), them:sortRoster(roster(g, "them")).filter(p => played("them", p)).map(p => line("them", p))},
    tt:{us:[R.team.us.oreb, R.team.us.dreb, R.team.us.to], them:[R.team.them.oreb, R.team.them.dreb, R.team.them.to]},
    plays, more:all.length > plays.length, fl:flowOf(R), x:extrasOf(g, R), sponsor:((b.info || {}).sponsor || "").trim(), every:S.settings.pubSec || 30, upd:Date.now()};
}
function seasonRow(g){
  const R = g.ev.length ? replay(g) : null, o = oppInfo(g.opp);
  return {date:g.date, time:g.time || "", team:g.team, usName:usName(g), opp:g.opp, c1:o.c1, c2:o.c2, abbr:o.abbr, ha:g.ha, district:!!g.district, event:g.event || "",
    status:g.forfeit || gameOver(g) ? "final" : g.status, us:R ? R.sc.us : 0, them:R ? R.sc.them : 0, per:R ? (gameOver(g) || g.forfeit ? "Final" : nowLabel(g, R)) : "", off:g.off || "", ff:g.forfeit || "",
    nb:g.forfeit && g.status === "pre" ? 1 : "", rec:g.status === "pre" && !g.off && g.date >= pubToday() ? recordOf(g) : "", upd:Date.now()};   // nb: a forfeit nobody played, so there's no box score

// Turns a public copy back into a game and a replay, so the public page draws the same scoreboard and box score.
function pubGame(sn){
  const mk = tm => sn.box[tm].map((a, i) => ({pid:tm + i, num:a[0], name:a[1], pos:a[2], grade:a[3], ht:a[4]}));
  const g = {id:sn.id, date:sn.date, time:sn.time, team:sn.team, usName:sn.usName, opp:sn.opp, oi:sn.oi, ha:sn.ha, district:sn.district, event:sn.event,
    quarters:sn.quarters, status:sn.status, us:mk("us"), them:mk("them"), ev:[], practice:false};
  const R = {q:sn.q, brk:!!sn.brk, sc:sn.sc, qs:sn.qs, poss:sn.poss, box:{us:{}, them:{}}, team:{us:LINE(), them:LINE()}, court:{us:new Set(), them:new Set()}, plays:[], shots:[]};
  for(const tm of ["us","them"]){
    sn.box[tm].forEach((a, i) => { const l = LINE(); PUBK.forEach((k, j) => { l[k] = a[5 + j] || 0; }); l.gp = a[19] || 0; l.po = a[21] || 0; l.tf = a[22] || 0; if(l.gp) R.box[tm][tm + i] = l; if(a[20]) R.court[tm].add(tm + i); });

/* ---------- files ---------- */
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvOf(g){
  const R = replay(g), cols = ["game_id","date","opponent","home_away","team","num","name","pos","pts","fgm","fga","tpm","tpa","ftm","fta","oreb","dreb","reb","ast","stl","blk","to","pf","tech","plus_minus"];
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
  const lines = [cols.join(",")], pre = [g.id, g.date, g.opp, g.ha];
  for(const tm of ["us","them"]){
    for(const p of sortRoster(roster(g, tm))){ const ln = R.box[tm][p.pid]; if(!ln) continue;
      lines.push(pre.concat([tmName(g, tm), p.num, p.name, p.pos || "", ln.pts, ln.fgm, ln.po ? "" : ln.fga, ln.tpm, ln.po ? "" : ln.tpa, ln.ftm, ln.po ? "" : ln.fta, ln.oreb, ln.dreb, ln.oreb + ln.dreb, ln.ast, ln.stl, ln.blk, ln.to, ln.pf, ln.tf, ln.pm]).map(q).join(",")); }
    const t = R.team[tm]; if(t.oreb + t.dreb + t.to + t.tf) lines.push(pre.concat([tmName(g, tm), "", "Team", "", "", "", "", "", "", "", "", t.oreb, t.dreb, t.oreb + t.dreb, "", "", "", t.to, "", t.tf, ""]).map(q).join(","));
  }
  return lines.join("\n") + "\n";
}
