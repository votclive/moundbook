function doImport(text){
  try{
    const r=importText(text); ui.report.pid=null; refreshGamePick(); setTab(ui.tab);
    // What a spreadsheet couldn't change here, said plainly.
    const gs=n=>n===1?"1 game":`${n} games`;
    const more=[r.cut?`The sheet left out rows of ${gs(r.cut)}. A sheet doesn't take pitches out by itself, so a copy without them is kept under Changed on two devices. Pick it there if you meant to take them out.`:"",
      r.stale?`${gs(r.stale)} changed here after the sheet was saved, so some of the sheet's changes weren't brought in. Save a new sheet and make them there.`:"",
      r.ignored?"A sheet doesn't change pitchers or the pitching team. Use the Teams tab or Edit game for those.":"",
      // The backup's pitch-count rules on a device whose rules come from Coach's book: said, not used.
      r.rulesLocked?"The backup's pitch-count rules weren't used: the team's rules come from Coach's device.":"",
      // Keep both on the other device made this device's last pitches a game of their own, and the chart moved to it.
      r.part?`The other device kept both copies of this game. Your last ${r.part.n===1?"pitch is":r.part.n+" pitches are"} now a game of their own, and ${r.part.ended?"the chart shows that one":"you're charting that one"}.`:""].filter(Boolean);
    let msg=[r.added?`${r.added} new`:"", r.updated?`${r.updated} updated`:"", r.kept?`${r.kept} already had`:"", r.conflicts?`${r.conflicts} changed on both: pick one below`:"", r.restored?`brought back your ${r.restored.join(" and ")}`:""].filter(Boolean).join(", ");
    msg=msg ? msg.charAt(0).toUpperCase()+msg.slice(1) : (more.length ? "" : "Nothing new");
    if(more.length) msg=[msg && msg+".", ...more].filter(Boolean).join(" ");
    // A backup with edited rules that differ from this device's edited rules: the coach picks.
    if(r.rulesDiffer) toast(msg+". The backup has different pitch-count rules than this device.", {ms:10000, action:"Use the backup's rules", fn:()=>{ if(!useRules(r.rulesDiffer)){ toast("The team's rules come from Coach's device."); return; } setTab(ui.tab); toast("The backup's rules are in. Check them on the Data tab."); }});
    else toast(msg, {ms:more.length?10000:4000});
    if(r.whose) whoseBookSheet(r.whose);
  }catch(e){ toast(e.message||"Couldn't read that"); }
}

const SYNC_BUILD = {"firebase": {"apiKey": "AIzaSyCyN6S8LZaMUMNvdzin07xP-TUe_585HBc", "authDomain": "moundbook-ghs.firebaseapp.com", "projectId": "moundbook-ghs", "storageBucket": "moundbook-ghs.firebasestorage.app", "messagingSenderId": "617364475301", "appId": "1:617364475301:web:04b8df85a146057a6c2c4c"}, "owner": "kevcriswell@gmail.com"};
const SYNC_RULES = "rules_version = '2';\n// Mound Book live sync. Only people Coach lets in can read or write anything.\n// The owner email below is filled in by Mound Book when it shows you these rules.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn() { return request.auth != null; }\n    function member() { return signedIn() && exists(/databases/$(db)/documents/members/$(request.auth.uid)); }\n    function role() { return get(/databases/$(db)/documents/members/$(request.auth.uid)).data.role; }\n    // Coach (the owner) and the Admins Coach names run Mound Book. Coach's own entry is the one nobody can change or remove.\n    function owner() { return member() && role() in ['owner', 'admin']; }\n    function isTheOwner(uid) { return get(/databases/$(db)/documents/config/owner).data.uid == uid; }\n    function ownerEmail() { return request.auth.token.email != null && request.auth.token.email.lower() == '__OWNER_EMAIL__'; }\n\n    // Claiming the program: only the owner email, only once, and only together with the owner's member record.\n    match /config/owner {\n      allow read: if signedIn();\n      allow create: if signedIn() && ownerEmail()\n        && request.resource.data.uid == request.auth.uid\n        && getAfter(/databases/$(db)/documents/members/$(request.auth.uid)).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    // Pitch-count rules and pitch types: everyone reads, Coach or an Admin sets them.\n    match /config/{name} {\n      allow read: if member();\n      allow write: if owner() && name != 'owner';\n    }\n    match /members/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || member());\n      allow create: if (owner() && request.resource.data.role in ['coach', 'admin'])\n        || (signedIn() && uid == request.auth.uid && ownerEmail()\n            && request.resource.data.role == 'owner'\n            && !exists(/databases/$(db)/documents/config/owner)\n            && existsAfter(/databases/$(db)/documents/config/owner));\n      allow update: if owner() && !isTheOwner(uid) && request.resource.data.role in ['coach', 'admin'];\n      allow delete: if owner() && !isTheOwner(uid);\n    }\n    // \"Let me in\" requests from a new phone. Coach or an Admin lets them in inside Mound Book.\n    match /requests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || owner());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Which devices are running which version, so Coach can see the iPad is up to date.\n    match /devices/{dev} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.uid == request.auth.uid;\n      allow delete: if owner();\n    }\n    // One document per game. Our hitters' names never come here, only lineup slot and bats.\n    // A copy can't go backwards: rev never decreases. A game moves to another device only when Coach or an Admin\n    // moves it, or a signed-in coach taps Take over (that copy names them in takeover).\n    match /games/{gid} {\n      allow read: if member();\n      // Only Coach or an Admin deletes a game for everyone, or brings a deleted one back.\n      allow create: if member() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if member()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (request.resource.data.writerDev == resource.data.writerDev || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // Opposing pitchers. A merged-away kid stays as a tombstone naming the record he joined (mergedInto).\n    match /pitchers/{pid} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.id == pid;\n      allow delete: if owner();\n    }\n    // Their catcher and defense, one document per opposing team. Any coach Coach let in can change it.\n    match /teams/{tk} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.key == tk && request.resource.data.by == request.auth.uid;\n      allow delete: if owner();\n    }\n\n    // ---------- Brier Stats (basketball) ----------\n    // Its own people list: being let into Brier Stats does not let anyone into Mound Book, and the other way round.\n    // Four groups, as levels: Admin 4 (Coach and Mound Book's Admins are Admins here too), Coach 3 (everything but the back\n    // end: rosters, schedule, opponents, settings, letting people in), Scorer 2 (scores games), Viewer 1 (watches).\n    // Coaches and Admins are kept as scorers with a tier, so whatever only checks for a scorer (an older copy of the app,\n    // the Drive backup script) still lets them score. Each rule works the level out once (four document reads at most).\n    function hoopsLevel() {\n      let me = /databases/$(db)/documents/hoopsMembers/$(request.auth.uid);\n      let rec = exists(me) ? get(me).data : {};\n      return owner() ? 4 : rec.get('role', '') == 'viewer' ? 1 : rec.get('role', '') != 'scorer' ? 0\n        : rec.get('tier', '') == 'admin' ? 4 : rec.get('tier', '') == 'coach' ? 3 : 2;\n    }\n    function hoopsIn() { return signedIn() && hoopsLevel() >= 1; }\n    function hoopsScorer() { return signedIn() && hoopsLevel() >= 2; }\n    function hoopsCoach() { return signedIn() && hoopsLevel() >= 3; }\n    function hoopsAdmin() { return signedIn() && hoopsLevel() >= 4; }\n    // A person's entry: a scorer (maybe with the Coach or Admin tier) or a viewer. Admins give and take away anything; a\n    // Coach anything but Admin.\n    function hoopsEntry(d) { return d.role in ['scorer', 'viewer'] && d.get('tier', '') in ['', 'coach', 'admin']\n        && (d.role == 'scorer' || d.get('tier', '') == ''); }\n    function hoopsMayGive(lvl, d) { return lvl >= 4 || (lvl == 3 && d.get('tier', '') != 'admin'); }\n    match /hoopsMembers/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || hoopsIn());\n      allow create: if signedIn() && hoopsEntry(request.resource.data) && hoopsMayGive(hoopsLevel(), request.resource.data);\n      allow update: if signedIn() && hoopsEntry(request.resource.data) && hoopsMayChange(hoopsLevel(), resource.data, request.resource.data);\n      allow delete: if signedIn() && hoopsMayGive(hoopsLevel(), resource.data);\n    }\n    function hoopsMayChange(lvl, was, now) { return hoopsMayGive(lvl, was) && hoopsMayGive(lvl, now); }\n    match /hoopsRequests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || hoopsCoach());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if signedIn() && (uid == request.auth.uid || hoopsCoach());\n    }\n    // Rosters, opponents and settings: Coaches and Admins. The back-end settings (the Google Drive backup link, the fan\n    // page switch and how often it updates) only an Admin changes: a Coach's save has to carry them as they were.\n    function hoopsAdminSet(d) { let s = d.get('settings', {}); return [s.get('drive', ''), s.get('pub', true), s.get('pubSec', 30)]; }\n    function hoopsBookWrite(lvl, was) { return lvl >= 4 || (lvl == 3 && hoopsAdminSet(request.resource.data) == was); }\n    match /hoopsBook/{name} {\n      allow read: if hoopsIn();\n      allow create: if signedIn() && hoopsBookWrite(hoopsLevel(), ['', true, 30]);\n      allow update: if signedIn() && hoopsBookWrite(hoopsLevel(), hoopsAdminSet(resource.data));\n      allow delete: if hoopsAdmin();\n    }\n    // One document per game, the whole play-by-play inside. A copy can't go backwards (rev never decreases), and a game\n    // moves to another device only when an Admin moves it or a scorer taps Take over (that copy names them in takeover).\n    // Only an Admin deletes a game or brings one back.\n    match /hoopsGames/{gid} {\n      allow read: if hoopsIn();\n      allow create: if signedIn() && hoopsGameNew(hoopsLevel(), gid);\n      allow update: if signedIn() && hoopsGameEdit(hoopsLevel());\n      allow delete: if hoopsAdmin();\n    }\n    function hoopsGameNew(lvl, gid) { return lvl >= 2 && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || lvl >= 4); }\n    function hoopsGameEdit(lvl) { return lvl >= 2\n        && request.resource.data.rev >= resource.data.rev\n        && ((request.resource.data.deleted == false && resource.data.deleted == false) || lvl >= 4)\n        && (resource.data.writer == null || request.resource.data.writer == resource.data.writer\n            || lvl >= 4 || request.resource.data.takeover == request.auth.uid); }\n    // The table (subs waiting to check in), booth notes, name notes, the opponent library and the PA's game-night script\n    // and prep: scorers and up write them, viewers read them.\n    match /hoopsBooth/{doc} {\n      allow read: if hoopsIn();\n      allow write: if hoopsScorer();\n    }\n    // The public page: a small copy of each game (score, box score, recent plays) and the season list. Anyone can read it\n    // with no sign-in; only scorers write it. Nothing private goes here: no notes, no table, no name notes.\n    match /hoopsPublic/{doc} {\n      allow read: if true;\n      allow create, update: if signedIn() && hoopsPublicWrite(hoopsLevel(), doc);\n      allow delete: if signedIn() && (doc == '_season' ? hoopsLevel() >= 4 : hoopsLevel() >= 2);\n    }\n    // A game's copy comes only from the device scoring it, so copies queued on a device that lost the game are refused.\n    // The season list's off switch (the fan page turned off) is an Admin's: anyone else's write leaves it as it was.\n    function hoopsPublicWrite(lvl, doc) { return lvl >= 2 && (doc == '_season'\n        ? lvl >= 4 || request.resource.data.get('off', false) == (resource == null ? false : resource.data.get('off', false))\n        : !exists(/databases/$(db)/documents/hoopsGames/$(doc))\n          || request.resource.data.w == get(/databases/$(db)/documents/hoopsGames/$(doc)).data.writer); }\n  }\n}\n";
Sync = (()=>{

  function box(){

  function guessDevice(){ const u=navigator.userAgent||""; return /iPad|Macintosh.*Mobile/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?"iPad":/iPhone/.test(u)?"iPhone":/Android/.test(u)?"Android phone":"Computer"; }

      const fb=await import(new URL("fb.js", document.baseURI).href);
      const c=conf();
      const app=fb.initializeApp(c.firebase, "moundbook");
      const auth=fb.initializeAuth(app, {persistence: fb.browserLocalPersistence});
      const db=fb.initializeFirestore(app, {localCache: fb.memoryLocalCache()});
      if(c.emulator){ fb.connectAuthEmulator(auth, c.emulator.auth, {disableWarnings:true}); fb.connectFirestoreEmulator(db, c.emulator.host, c.emulator.port); }
      Object.assign(st, {fb, auth, db});

      window.addEventListener("offline", ()=>{ st.net=false; paint(); });

        if(document.visibilityState==="hidden"){ st.hiddenAt=Date.now(); return; }
        // Back after a long nap: listen again from where we left off instead of re-reading everything.
        if(live() && st.hiddenAt && Date.now()-st.hiddenAt>10*60*1000) restartData();
        if(live()) kick(300);
      });
      // A redraw put off while a sheet was open or a box was in use runs once the sheet closes (any way: a button,
      // Escape, a tap outside) or the box is let go. While a finger is down it waits, so the tap lands first.
      new MutationObserver(()=>{ if(!sheetOpen()) pendSoon(); }).observe($("#modal-root"), {childList:true});
      document.addEventListener("focusout", ()=>pendSoon(), true);
      document.addEventListener("pointerdown", ()=>{ st.ptr=Date.now(); }, true);
      ["pointerup","pointercancel","click"].forEach(t=>document.addEventListener(t, ()=>{ st.ptr=0; }, true));

  }
  function stopAll(){ clearTimeout(st.memT); st.subs.forEach(f=>{ try{ f(); }catch(e){} }); st.subs=[]; stopData(); }
  function stopData(){ st.dataSubs.forEach(f=>{ try{ f(); }catch(e){} }); st.dataSubs=[]; unwatchWriter(); }
  function onUser(u){
    stopAll();
    if(!u){ Object.assign(st, {uid:null, email:"", role:null, phase:"signedout"}); paint(); return; }
    // Teams refused before (rules from before 3.1) are tried again from a new sign-in.
    Object.assign(st, {uid:u.uid, email:(u.email||"").toLowerCase(), name:u.displayName||"", phase:"checking", claimTried:false, memOk:false, memErr:false, memBack:0, err:"", teamsOff:false, teamsRulesOld:false});
    if(box().uid && box().uid!==u.uid){ box().pushed={}; box().since=0; box().ph={}; box().rh=""; box().role=null; box().delq={}; box().tm={}; }
    box().uid=u.uid; save(); paint();
    listenMembers();
  }
  // My member record says whether Coach has let me in, and as what. Only the server's copy counts: right after
  // Coach claims the program, the local copy of that write shows up first, and listening then would be refused.
  function listenMembers(){
    const {fb, db}=st; clearTimeout(st.memT); st.subs.forEach(f=>{ try{ f(); }catch(e){} }); st.subs=[];
    st.subs.push(fb.onSnapshot(fb.doc(db, "members", st.uid), {includeMetadataChanges:true}, snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists() && snap.metadata.fromCache){ st.net=false; paint(); return; }   // no signal yet: not the same as not let in
      const lk=bookLocked();
      if(!snap.metadata.fromCache){ st.memOk=true; st.memBack=0; heard(); }
      if(st.memErr){ st.memErr=false; st.err=""; }
      if(snap.exists()){
        // An Admin (Coach names them) runs Mound Book the way Coach does, so the app treats them as the owner; st.admin keeps the name.
        const given=snap.data().role||"coach", role=given==="admin"?"owner":given, was=st.role; st.admin=given==="admin"; st.role=role; if(box().role!==role){ box().role=role; save(); }
        if(st.phase!=="live" || was!==role){ st.phase="live"; goLive(); }
      } else {
        if(st.phase==="live") stopData();
        // Teams refused just now came from Coach taking this phone off the list, not from old rules: once he lets it back
        // in, the defense checklist syncs again without reopening the app.
        st.teamsOff=false; st.teamsRulesOld=false;
        st.role=null; st.phase="waiting"; waiting();
      }
      paint();
      // Let in as Coach, or no longer: the rules on the Data tab turn editable or read-only now, not at the next redraw.
      if(bookLocked()!==lk && ui.tab==="data") refresh([]);
    }, memberErr));
  }
  // The member record can't be read: the security rules were never published, or they refuse it. Say so with a way
  // out, and look again now and then (longer each time), so publishing the rules is enough: no reopening the app.
  function memberErr(err){
    handleErr(err); stopData(); st.subs=[];
    const denied=String((err && err.code)||"").includes("permission-denied");
    if(denied && !st.memOk) st.err=`The cloud won't let this device in. ${ownerHere()?"Did you publish the security rules? Copy them here, then paste them in Firebase console › Firestore Database › Rules and Publish.":"Did Coach publish the security rules?"}`;
    st.phase="error"; st.memErr=true; st.role=null;
    st.memBack=Math.min(60000, (st.memBack||2500)*2);
    clearTimeout(st.memT); st.memT=setTimeout(()=>{ if(st.memErr && st.uid && st.fb){ st.claimTried=false; listenMembers(); } }, st.memBack);
    paint();
  }
  function ownerHere(){ const o=String(conf().owner||"").toLowerCase(); return !!o && o===st.email; }
  async function waiting(){
    const {fb, db}=st, c=conf();
    if(c.owner && st.email===String(c.owner).toLowerCase() && !st.claimTried){
      st.claimTried=true;
      try{
        const b=fb.writeBatch(db);
        b.set(fb.doc(db,"members",st.uid), {role:"owner", email:st.email, name:st.name||"", at:Date.now()});
        b.set(fb.doc(db,"config","owner"), {uid:st.uid, email:st.email, at:Date.now()});
        await b.commit(); toast("This program is yours. Coaches can join now."); return;
      }catch(e){ /* already claimed: fall through and ask to be let in like anyone else */ }
    }
    try{ await fb.setDoc(fb.doc(db,"requests",st.uid), {email:st.email, name:st.name||"", at:Date.now()}); }catch(e){ handleErr(e); }
    paint();
  }

  /* ----- listening ----- */
  function sinceTs(){ return st.fb.Timestamp.fromMillis(Math.max(0, (box().since||0) - 120000)); }
  function bump(srv){ if(srv && srv.toMillis){ const t=srv.toMillis(); if(t>(box().since||0)) box().since=t; } }
  function goLive(){
    // This device's clock offset from the last time it went live, until this session measures it (clockFrom): the first
    // copies and beats that come in are late news, dated with it.
    if(!st.skewNow && typeof box().skew==="number") st.skew=box().skew;
    restartData();
    touchDevice(); loadDevices(true);
    S.games.forEach(g=>queue(g)); kick(800);
  }
  // A listener the server stopped (refused, or dropped) is started again after a pause, longer each time.
  function listenErr(err){
    handleErr(err); paint();

    st.relisten=setTimeout(()=>{ st.relisten=null; if(live()) restartData(); }, st.lisBack);
  }
  function restartData(){
    stopData(); const {fb, db}=st; const ds=st.dataSubs; let first=true;
    ds.push(fb.onSnapshot(fb.query(fb.collection(db,"games"), fb.where("srv",">",sinceTs())), snap=>{
      // What waited while this device couldn't hear the cloud: the first copies after (re)starting, or anything that comes while
      // it was cut off. It is not news from now (madeAt). Everything else arrives as it is sent, so it is.
      const touched=[], v0=view(), now=Date.now(), late=first || !st.net || st.stale; let who=false;
      if(!snap.metadata.fromCache) first=false;
      snap.docChanges().forEach(ch=>{ if(ch.type==="removed" || ch.doc.metadata.hasPendingWrites) return; const d=ch.doc.data(); bump(d.srv); noteName(d);
        // A device we haven't heard of charts this game (it joined after we went live): look up its name once.
        if(d.writerDev && d.writerDev!==S.device.id && !st.devices[d.writerDev] && !st.devTried[d.writerDev]){ st.devTried[d.writerDev]=true; who=true; }
        // When the charting device last sent this game.
        if(d.id) seenAt(d.id, d.srv, late, now);
        try{ const id=recvGame(d); if(id) touched.push(id); }catch(e){ console.warn("sync: bad game", d.id, e); } });
      st.net=!snap.metadata.fromCache; st.lastOk=Date.now(); st.lisBack=0; if(!snap.metadata.fromCache){ heard(); quotaOk(); }
      if(who) loadDevices(true);
      if(touched.length){ save(); refresh(touched, v0); } else paint();
    }, listenErr));
    ds.push(fb.onSnapshot(fb.query(fb.collection(db,"pitchers"), fb.where("srv",">",sinceTs())), snap=>{
      if(!snap.metadata.fromCache){ heard(); quotaOk(); }
      const list=[]; snap.docChanges().forEach(ch=>{ if(ch.type==="removed" || ch.doc.metadata.hasPendingWrites) return; const d=ch.doc.data(); bump(d.srv); list.push(d); });
      if(list.length && recvPitchers(list)){ save(); refresh([]); }
    }, listenErr));
    // Their catcher and defense: one document per opposing team, from every coach let in. Metadata changes too, so the
    // server's copy after a reconnect counts as heard; only then does this device send its own taps (teamsSeen). Refused
    // (the cloud still has the rules from before 3.1): the answers stay on this device and teams stop trying until the
    // app opens again or someone signs in (teamsErr). Games and pitchers carry on.
    st.teamsSeen=false;
    if(!st.teamsOff) ds.push(fb.onSnapshot(fb.collection(db,"teams"), {includeMetadataChanges:true}, s=>{
      if(!s.metadata.fromCache){ heard(); quotaOk(); }
      const n=recvTeams(s.docs); if(n){ save(); if(n>1) refresh([]); }
      if(!s.metadata.fromCache && !st.teamsSeen){ st.teamsSeen=true; if(teamsDirty()) kick(500); }
    }, teamsErr));
    // Metadata changes too: after a reconnect the first copy comes from the local cache, and the server's identical copy
    // only shows up as a metadata change. Coach's device pushes the book only once it has the server's.
    st.bookSeen=false;
    ds.push(fb.onSnapshot(fb.doc(db,"config","book"), {includeMetadataChanges:true}, s=>{
      if(s.metadata.hasPendingWrites) return;
      if(s.exists() && recvBook(s.data())){ save(); refresh([]); }
      if(!s.metadata.fromCache){ st.bookSeen=true; heard(); quotaOk(); }
    }, listenErr));
    // Devices aren't listened to as a whole (each charting device's beat would cost every phone a read): only the
    // one charting the game on screen (watchWriter), and the list is read when it's shown (loadDevices).
    watchWriter(cur());
    if(st.role==="owner"){
      ds.push(fb.onSnapshot(fb.collection(db,"requests"), s=>{ st.requests=[]; s.forEach(d=>st.requests.push({uid:d.id, ...d.data()})); paint(); }, listenErr));
      ds.push(fb.onSnapshot(fb.collection(db,"members"), s=>{ st.members=[]; s.forEach(d=>st.members.push({uid:d.id, ...d.data()})); paint(); }, listenErr));
    }
  }
  // sent: this device's clock as it writes, beside the server's (at). Read back once it is in (one read each time it goes
  // live), the two say how far this device's clock is from the server's (clockFrom). Only from a write that went straight up:
  // one that waited for signal (field Wi-Fi with no internet behind it) got its server time minutes later.
  function touchDevice(){
    const {fb, db}=st, ref=fb.doc(db,"devices",S.device.id), t0=Date.now(); if(!S.device.name){ S.device.name=guessDevice(); save(); }
    fb.setDoc(ref, {uid:st.uid, email:st.email, name:S.device.name, ver, at:fb.serverTimestamp(), sent:t0, app:ui.standalone?"home screen":"browser"}, {merge:true})
      .then(()=>{ heard(); quotaOk(); const t1=Date.now(); if(t1-t0>3000) return;
        fb.getDoc(ref).then(s=>{ if(!s.metadata.fromCache && s.exists()) clockFrom(s.data(), t0, t1); }, ()=>{}); }, handleErr);
  }
  // The server stamped it between sending (t0) and the answer (t1). A beat written since (another sent) says nothing.
  // It is kept (a device's clock offset rarely changes), so the next session dates its first late news with it. What came
  // in late before it was measured is dated again now.
  function clockFrom(d, t0, t1){ const a=d && d.at && d.at.toMillis ? d.at.toMillis() : 0; if(!(a && d.sent===t0)) return;
    st.skew=a-(t0+t1)/2; st.skewNow=true; const b=box(); if(b.skew!==Math.round(st.skew)){ b.skew=Math.round(st.skew); save(); }
    Object.entries(st.raw).forEach(([id, r])=>{ if(st.seen[id]===r.t && r.srv) st.seen[id]=Math.min(r.now, r.srv-st.skew); }); st.raw={}; paintWatch(); }
  // When game id was last sent by its charting device. late: it may have waited (madeAt); until this session knows its clock
  // offset, the server's time is kept so clockFrom can date it again.
  function seenAt(id, srv, late, now){
    const t=late ? madeAt(srv, now) : now; if(!(t>(st.seen[id]||0))) return;
    st.seen[id]=t; const s=srv && srv.toMillis ? srv.toMillis() : (typeof srv==="number" ? srv : 0);
    if(late && !st.skewNow && s) st.raw[id]={srv:s, now, t}; else delete st.raw[id];
  }
  // When something the server stamped (srv) really happened, on this device's clock, and never later than now. A change or
  // beat that waited while this device had no signal arrives late: it is not news from now. With the clock offset not known

  function madeAt(srv, now){ const t=srv && srv.toMillis ? srv.toMillis() : (typeof srv==="number" ? srv : 0); return t ? Math.min(now, t-(st.skew||0)) : now; }

  function loadDevices(force){
    if(!live() || st.devBusy || Date.now()-(st.devAt||0)<(force?5000:120000)) return;

      const was=Object.keys(st.devices).length; s.forEach(d=>{ st.devices[d.id]={...st.devices[d.id], ...d.data()}; }); heard();
      paint(); if(Object.keys(st.devices).length!==was && (watching(cur()) || ui.tab==="log")) refresh([S.cur]);
    }, e=>handleErr(e)).finally(()=>{ st.devBusy=false; });
  }

  // Team devices on an older Mound Book than this one (names), for the warning on the paste and Official counts sheets. Their
  // versions come with the devices list. It is read again when it came back empty (going live with no signal) or is over
  // 2 min old (loadDevices waits 5 s between looks); the answer shows the next time. Only devices seen in the last 30 days

  // behind after moving to the Home Screen keeps its old version under the same name.

    if(!live()) return [];
    if(!Object.keys(st.devices).length || Date.now()-(st.devAt||0)>120000) loadDevices(true);
    const recent=d=>{ const t=d.at && d.at.toMillis ? d.at.toMillis() : 0; return !!t && Date.now()-t<30*86400000; };
    const parts=v=>String(v).split(".").map(x=>parseInt(x, 10)||0), older=(a, b)=>{ const x=parts(a), y=parts(b);
      for(let i=0;i<Math.max(x.length, y.length);i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)<(y[i]||0); } return false; };
    return Object.entries(st.devices).filter(([id, d])=>id!==S.device.id && d && recent(d) && /^\d+(\.\d+)*$/.test(String(d.ver||"")) && older(d.ver, ver))
      .map(([id, d])=>(d.name || d.email || "Another device")+(d.app==="browser" ? " (browser copy)" : ""));
  }

  /* ----- is anything still coming in? -----
     The device charting a game says so about every 25 s while that game is open on it: one tiny write to its own
     devices doc, at most 144 an hour (about 360 for a 2.5-hour game, 2 games a day well under 1,000 of the free
     plan's 20,000 writes). A phone watching the game listens to that one doc only. Nothing heard for a minute means
     either the charting device went quiet (closed, asleep, no signal) or this one can't reach the cloud even though
     the browser says it's online (field Wi-Fi with no internet behind it). One small read tells which: it either
     answers (the charting device is quiet, or our listeners missed its beat and start again) or doesn't (this device
     can't reach the cloud: the pill says so and the listeners start again, less often each time). */
  const BEAT=25000, QUIET=60000;
  function heard(){ st.heard=Date.now(); if(st.stale){ st.stale=false; st.staleBack=0; paint(); } }
  function watching(g){ return !!g && !g.example && !g.conflictOf && !g.endedAt && live() && !mine(g) && !!writerOf(g); }
  function charting(g){ return !!g && !g.example && !g.conflictOf && !g.endedAt && mine(g); }
  function tick(){
    if(document.visibilityState==="hidden") return;
    if(!live()){ paintWatch(); return; }   // out of live (refused, or the cloud limit ran out): the coach box still goes gray
    const g=cur();
    if(charting(g) && st.net && navigator.onLine!==false && !st.beatBusy && Date.now()-(st.beatAt||0)>=BEAT) beat(g);
    watchWriter(g);
    if(watching(g) && navigator.onLine!==false && Date.now()-(st.heard||0)>QUIET && !st.probing && Date.now()-(st.probeAt||0)>QUIET) probe(g);
    paintWatch();
  }
  function beat(g){
    const {fb, db}=st; st.beatBusy=true; st.beatAt=Date.now();
    // Only one at a time: with no signal the write waits in the SDK, and a pile of them would all go up later.
    fb.setDoc(fb.doc(db,"devices",S.device.id), {uid:st.uid, at:fb.serverTimestamp(), beat:fb.serverTimestamp(), sent:Date.now(), game:g.id}, {merge:true})
      .then(()=>{ heard(); quotaOk(); }, e=>{ handleErr(e); paint(); }).finally(()=>{ st.beatBusy=false; });
  }
  function unwatchWriter(){ if(st.bsub){ try{ st.bsub(); }catch(e){} } st.bsub=null; st.bw=null; }
  function watchWriter(g){

  // late: the first beat seen after (re)starting, or one read while this device couldn't hear the cloud. It may be old, so it
  // counts from when it was sent (madeAt). A beat that arrives as it is sent is news from that device now.
  function gotBeat(w, d, late){

  async function probe(g){
    const {fb, db}=st, w=writerOf(g), known=st.bt[w];

      if(!st.probeP) st.probeP=fb.getDocs(fb.query(fb.collection(db,"devices"), fb.where("game","==",g.id))).finally(()=>{ st.probeP=null; });

    }catch(e){
      st.stale=true;

    }
    st.probing=false; paint();
  }
  // The watch box's last line: what this device knows, and how long the charting device has been quiet.
  function watchLine(g){
    if(!watching(g)) return statusText();
    const age=Date.now()-(st.seen[g.id] || (g.edited && g.edited.t) || Date.now()), mins=Math.max(1, Math.round(age/60000));
    if(age<=QUIET) return statusText();
    if(st.stale || !st.net || navigator.onLine===false) return `No update for ${mins} min. This device can't reach the cloud right now: check its Wi-Fi or signal.`;
    return `No update from ${devName(writerOf(g))} for ${mins} min. It may be closed, asleep or out of signal.`;
  }
  // How long since the charting device last sent this game (a change or a beat), on this device's clock.
  function watchAge(g){ return g ? Date.now()-(st.seen[g.id] || (g.edited && g.edited.t) || Date.now()) : null; }
  // The coach box (box.js) goes gray with LAST KNOWN once nothing has come for a minute.
  function paintWatch(){ const el=$("#view-chart .watch-st"); if(!el) return; const g=cur(); const t=watchLine(g); if(el.textContent!==t) el.textContent=t;
    const cb=$("#view-chart .cbox"); if(cb) boxPaint(cb); }

  /* ----- receiving ----- */
  // Returns the game id when something on this device changed.
  // A game deleted here, or taken off with its season, stays off: the team copy never brings it back.
  function recvGame(d){
    const b=box(); const id=d.id; if(!id || b.hidden[id]) return null;
    if((S.deletedIds||[]).includes(id)){
      // Only a game the cloud deleted comes back, when Coach brings it back. One deleted or archived here never does.
      if(d.deleted || !(b.cloudDel||{})[id]) return null;
      S.deletedIds=S.deletedIds.filter(x=>x!==id); delete b.cloudDel[id];
    }
    const at=S.games.findIndex(x=>x.id===id && !x.conflictOf); const loc=at>=0?S.games[at]:null;
    if(d.deleted){
      if(!loc) return null;
      if(mine(loc) && (loc.rev||0)>(b.pushed[id]||0)) keepCopy(loc);
      dropGame(id); delete b.pushed[id]; b.cloudDel=b.cloudDel||{}; b.cloudDel[id]=true; if(S.cur===id) S.cur=null; return id;
    }
    // Our own write coming back (the server's echo of a push or a take over, or a re-read once the signal returns):
    // this device already has that copy, or something newer (an undo, a Log fix), so it is never taken again.
    const h=b.heads[id], pd=b.pend[id];
    if(d.head && ((h && h.head===d.head && (d.rev||0)<=(h.rev||0)) || (pd && pd.head===d.head && (d.rev||0)<=(pd.rev||0)))) return null;
    let inc; try{ inc=unpack(d); }catch(e){ console.warn("sync: skipped a game that isn't whole", id); return null; }
    if(!loc){ S.games.push(inc); b.pushed[id]=inc.rev||0; landed(inc, false); saveGame(inc); announce(inc); return id; }
    const iWrite=mine(loc) && !!writerOf(loc);
    // Older than what this device sent (the cloud's copy from just before our own push or take over, arriving late):
    // nothing in it is new here. A real take over always comes in above anything this device sent.
    if(iWrite && (inc.rev||0)<(b.pushed[id]||0) && (inc.rev||0)<(loc.rev||0)) return null;

  // Draws the tab off screen and compares it with what's showing, leaving out what changes by itself (the storage

  function sameView(tab){

    const tmp=document.createElement("div"); tmp.hidden=true; tmp.className=el.className;
    el.id=""; tmp.id="view-"+tab; el.after(tmp);
    try{ RENDER[tab](); }catch(e){ console.warn("sync: redraw", e); }

  // Text typed into a box and not saved yet stays through a redraw, when the box is still there and what it started

  function keepTyped(el, draw){

      else if(!/^(file|button|submit)$/.test(f.type) && f.value!==f.defaultValue) typed.push([f.id, f.defaultValue, f.value]); });

  // The free plan's daily limit ran out. Try again every 10 minutes and just after midnight Pacific, when it resets.

  function quotaWait(){

      const v=k=>+((p.find(x=>x.type===k)||{}).value||0); ms=Math.min(ms, ((24-v("hour"))*3600-v("minute")*60-v("second"))*1000+60000); }catch(e){}

  function quotaRetry(){ clearTimeout(st.qt); st.qt=setTimeout(()=>{ if(!st.quota) return; st.quota=false; kick(0); }, quotaWait()); }
  function quotaOk(){ if(!st.quota) return; st.quota=false; clearTimeout(st.qt); if(/cloud limit/.test(st.err)) st.err=""; kick(500); paint(); }
  function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("No signal"),{code:"unavailable"})), ms))]); }
  async function pushAll(){

      if(navigator.onLine===false) throw Object.assign(new Error("No signal"), {code:"unavailable"});
      await pushDeletes();
      for(const id of [...st.dirty]){
        const g=S.games.find(x=>x.id===id && !x.conflictOf);
        if(!g || box().hidden[id] || st.adopt[id] || ((g.rev||0)<=(box().pushed[id]||0) && !g.takeover)){ st.dirty.delete(id); continue; }
        const v0=view();

        // A pitch charted while that went up is still waiting: keep it dirty so this round sends it too.
        const now=S.games.find(x=>x.id===id && !x.conflictOf);

      }

  async function pushGame(g){
    const {fb, db}=st; const ref=fb.doc(db,"games",g.id);
    // What goes up is the game as it is now; pitches charted while it's on the way go next round.
    const rev=g.rev||0, et=(g.edited&&g.edited.t)||0;
    const body=pack(g); if(!g.writerDev) g.writerDev=body.writerDev;
    const take=!!g.takeover, str=JSON.stringify(body), head=hash(str), seen=box().pushed[g.id]||0;
    box().pend[g.id]={head, rev};   // its echo can arrive before the transaction says it went
    const res=await fb.runTransaction(db, async tx=>{
      const snap=await tx.get(ref); let wrev=rev;
      if(snap.exists()){
        const r=snap.data();
        if(r.deleted){
          // Coach brought back a game the team book had deleted (Receive): it goes back up. Anyone else's copy stays here.
          if(!(g.undelete && st.role==="owner")) return {k:"deleted"};
          wrev=Math.max(rev, (r.rev||0)+1);
        } else {
          if(r.writerDev!==body.writerDev && !take) return {k:"moved", r};
          if(take && (r.rev||0)>seen) return {k:"moved", r};   // it moved on since this device looked: never overwrite unseen pitches
          // Nor does a relayed copy (a file, a fix, or what went along after a take over): it joins the team copy first (below).
          if(g.relay && (r.rev||0)>seen) return {k:"behind", r};
          if((r.rev||0)>rev) return {k:"behind", r};
          if((r.rev||0)===rev && !take){ if(r.writerDev===body.writerDev && r.head===head) return {k:"same"}; return {k:"behind", r}; }   // same number, different game: a second tab
        }
      }

      // The charting device's name, only from that device. A relayed fix leaves it out: the name already on the doc may be
      // old (a team rename relays games ended long ago), and every phone would take it as that device's name now.
      if(body.writerDev===S.device.id && S.device.name) doc.writerName=S.device.name;
      if(take) doc.takeover=st.uid;
      tx.set(ref, doc); return {k:"ok", wrev};
    });
    const b=box();
    if(res.k==="ok" || res.k==="same"){
      b.heads[g.id]={head, rev:res.wrev||rev}; delete b.pend[g.id];
      if(res.wrev && res.wrev>(g.rev||0)) g.rev=res.wrev;
      if(g.undelete){ delete g.undelete; delete b.hidden[g.id]; saveGame(g); }
      b.pushed[g.id]=Math.max(b.pushed[g.id]||0, res.wrev||rev);
      // In the team book counts as sent to Coach (the pregame line and Game over say so).
      const sent=mine(g) && !g.relay && et>(g.sentAt||0);
      if(sent) g.sentAt=et;
      if(g.relay && st.along[g.id]) st.along[g.id].sent=true;   // in the team copy: the charting device's next copy says if it took it
      if(g.relay||g.takeover||sent||g.adoptFrom){ if((g.rev||0)<=rev){ delete g.relay; } delete g.takeover; delete g.adoptFrom; saveGame(g); }
      save(); if(sent && g.endedAt) refresh([g.id]);   // Game over and the pregame list say it's sent now
      return;
    }
    // Deleted from the team book: this copy stays on this device and stops trying.
    if(res.k==="deleted"){ b.hidden[g.id]=true; b.pushed[g.id]=Math.max(b.pushed[g.id]||0, g.rev||0); delete g.relay; delete g.undelete; st.dirty.delete(g.id); save(); return res.k; }
    const r=res.r; noteName(r); const loc=S.games.find(x=>x.id===g.id && !x.conflictOf);
    if(!loc) return res.k;
    let inc; try{ inc=unpack(r); }catch(e){ inc=null; }
    if(!inc){
      // The cloud's copy isn't a whole game: ours goes up above it when this device charts the game; nothing else here can fix it.
      if(res.k==="behind" && mine(loc) && !loc.relay){ loc.rev=Math.max(loc.rev||0, r.rev||0); touch(loc, dev()); saveGame(loc); }
      else { delete loc.relay; st.dirty.delete(g.id); }

    if(res.k==="behind" && mine(loc) && !loc.relay && r.writerDev===S.device.id){ reconcile(loc, inc); refresh([g.id]); return res.k; }
    // A file or a sheet's fix relayed from here, and the charting device sent more meanwhile (or someone took the game
    // over): the two join and go up again, unless the logs split.
    if(loc.relay && !loc.takeover && mergeGame(loc, inc).kind!=="conflict"){

    // adds joins theirs (joinTaken). Otherwise take theirs, keeping ours as a second copy if it had anything new.
    // What went along is said once the charting device has it (alongIn); a relay of it that went a different way says so here.
    const moved=res.k==="moved" && !loc.relay && !loc.takeover && mine(loc), al=!moved && loc.relay && st.along[g.id];

    b.pushed[g.id]=Math.max(b.pushed[g.id]||0, inc.rev||0); landed(loc, false); saveGame(loc); refresh([g.id]);

    return res.k;
  }
  // Coach's deletes wait here (saved with the book) until they reach the cloud, so a delete with no signal isn't lost.
  async function pushDeletes(){

      const d=q[id], ref=fb.doc(db,"games",id);

  async function pushPitchers(){
    const {fb, db}=st, b=box(); let took=false, nm=null;
    const names=()=>nm||(nm=ourNames());   // our players' names, worked out once a pass (only when a record changed)
    for(const id of Object.keys(S.pitchers)){
      const p=S.pitchers[id]; if(!p || p.example) continue;
      if(b.ph[id]===hash(p)) continue;
      // Our own kids (a practice-only record, our team, or one of our players' whole names), whatever box-score lines they
      // carry, stay on this device. One already in the cloud stays there: no tombstone, which would take him off the other
      // phones. Watching phones show a stand-in for him.
      if(homeOnly(p, names())) continue;
      const ref=fb.doc(db,"pitchers",id), seen=b.ph[id];
      const res=await fb.runTransaction(db, async tx=>{
        const s=await tx.get(ref); const m=JSON.parse(JSON.stringify(p));
        if(s.exists()){ const r=s.data();
          // Merged into another record somewhere else: do that merge here instead of bringing him back. When two
          // devices merged the pair opposite ways, the smaller id is the survivor.
          if(r.deleted && r.mergedInto && !(resolvePid(r.mergedInto)===id && id<r.mergedInto)) return {into:r.mergedInto};
          // The cloud copy is the one this device last sent or got: nobody changed him since, so ours goes up as it is
          // (a pitch unchecked or a tell taken off stays off). Otherwise each part comes from the copy that changed it last,
          // and a stub here only adds what was typed on it to his real record.
          if(!r.deleted){ try{ const c=JSON.parse(r.body); if(!(hash(c)===seen && !m.stub)) mergeRec(m, c); }catch(e){} } }
        tx.set(ref, {id, deleted:false, mergedInto:null, by:st.uid, srv:fb.serverTimestamp(), body:JSON.stringify(m)}); return {m};
      });
      // As a receive does: a merge made elsewhere redraws, his pitch types are learned, his games take a hand fixed elsewhere
      // (mergeRec with hand), and a team renamed elsewhere moves the games charted here (teamRenamed, below).
      if(res.into){ delete b.ph[id]; if(applyMerge(id, res.into)) took=true; st.again=true; continue; }
      const merged=res.m, now=S.pitchers[id]; b.ph[id]=hash(merged);
      if(!now){ st.again=true; continue; }   // deleted or merged away meanwhile: that goes up next round
      const h0=hash(now); learnTypes(merged.arsenal); mergeRec(now, merged, true);
      if(hash(now)!==h0) took=true;   // another device's change came in with this send: the screen shows it
      if(hash(now)!==b.ph[id]) st.again=true;
    }
    for(const id of Object.keys(b.ph)){
      if(S.pitchers[id]) continue;
      const to=resolvePid(id);
      await fb.setDoc(fb.doc(db,"pitchers",id), {id, deleted:true, mergedInto:to!==id && S.pitchers[to] ? to : null, by:st.uid, srv:fb.serverTimestamp(), body:""}); delete b.ph[id];
    }

    if(took) teamRenamed();
    save(); if(took) refresh([]);
  }
  // In one transaction with the cloud's book: Coach's other device may have changed a level or added a pitch type
  // since this one last looked, and that is kept (mergeBook). Unchanged since then: ours goes up as it is.
  async function pushBook(){
    const {fb, db}=st, b=box(); const o=bookOf(), h=hash(o); if(b.rh===h || !st.bookSeen) return;
    const ref=fb.doc(db,"config","book"), seen=b.rh;

  // Each team's record that changed here since it was last sent or got, in one transaction with the cloud's copy: another
  // coach may have tapped since, and each answer comes from whoever tapped it last (ours only on a tie). A rename sends
  // both keys: the old one holds only where the team went. Refused: teamsRefused, and nothing else stops.
  async function pushTeams(){

      const T={...(S.teams||{})}, now=T[key]; T[key]=now && !now.example ? mergeTeamRec(now, m, true) : m; S.teams=settleForwards(T);
      if(teamHashOf(S.teams[key])!==b.tm[key]) st.again=true;

  function handleErr(e){
    const c=String((e && e.code) || "");
    if(c.includes("resource-exhausted")){ st.quota=true; st.err="The free cloud limit ran out. Everything still saves on this device. It tries again every 10 minutes, and the limit resets at midnight Pacific."; quotaRetry(); }
    else if(c.includes("permission-denied")){ st.err="The cloud refused that. Coach may have removed this login, or this device is on an old version: reopen Mound Book."; }
    else if(c.includes("unavailable") || c.includes("deadline") || navigator.onLine===false){ st.net=false; st.err=""; }
    else if(c.includes("unauthenticated")){ st.err="Signed out. Sign in again."; }
    else st.err="Live sync hit a problem. Everything still saves on this device.";   // the details go to the console, not the screen
    if(e && !c.includes("unavailable")) console.warn("sync:", e);

  /* ----- what a coach can do ----- */
  // Why Take over can't run right now, in words a coach can act on.
  function notLiveText(){
    if(st.phase==="signedout") return "Sign in on the Data tab first. Then you can take over this game.";
    if(st.phase==="waiting") return "Coach hasn't let you in yet. You can take over once Coach does.";
    if(navigator.onLine===false || !st.net) return "You need signal to take over a game.";
    if(st.phase==="loading" || st.phase==="checking") return "Still connecting. Try again in a few seconds.";
    if(st.phase==="error" && st.err) return st.err;
    return "You need signal to take over a game.";
  }
  // The new copy is built inside the transaction from the cloud copy as it is at that moment (the transaction reruns if
  // the charting device pushes a pitch meanwhile), so the pitch it charted a second ago comes along. This device's copy
  // (as it is now, not when the button was drawn) joins in only when it holds something not sent: a relay, or changes
  // above the last cloud copy. A copy that only lags behind never does, so a pitch the charting device took back stays out.
  async function takeOver(x, o){
    const id=typeof x==="string" ? x : x && x.id; o=o||{};
    if(!live() || navigator.onLine===false){ toast(notLiveText(), {ms:4500}); return false; }
    const now=()=>S.games.find(y=>y.id===id && !y.conflictOf);
    if(!id || !now()) return false;
    const {fb, db}=st; const ref=fb.doc(db,"games",id);
    try{
      const res=await withTimeout(fb.runTransaction(db, async tx=>{
        const s=await tx.get(ref); const r=s.exists()?s.data():null;
        if(r && r.deleted) return {k:"deleted"};
        const g=now(); if(!g) return {k:"gone"};
        const unsent=!!g.relay || (g.rev||0)>(box().pushed[id]||0);
        let inc=null; if(r){ try{ inc=unpack(r); }catch(e){ inc=null; } }
        let base, split=false;
        if(!inc) base=clone(g);
        else if(!unsent) base=inc;
        else { const m=mergeGame(leftOut(inc, clone(g)), inc); if(m.kind==="conflict"){ base=inc; split=true; } else base=clone(m.game); }
