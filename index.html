<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mound Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mound Book</title>
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
/* Layout: dugout clipboard. Scoreboard strip on top, big tap targets below, result bar pinned to the bottom on upright tablets and phones. Report is a letter-size scouting sheet. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#16211B; --muted:#5A6A61; --line:#D3DBD5;
  --accent:#1F3A68; --accent-ink:#FFFFFF; --ball:#2C7A4B; --strike:#B83227; --out:#B7790A; --warn-bg:#FFF4D6; --bad-bg:#FBE3E0;
  --band0:#2C7A4B; --band1:#7A8F1F; --band2:#B7790A; --band3:#C2410C; --band4:#B83227;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:10px; --bw:1px; --barh:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sun"]){
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2621; --ink:#E5ECE7; --muted:#97A79E; --line:#2B3731;
  --accent:#9DB9EE; --accent-ink:#0E1411; --ball:#5CC488; --strike:#F06A5D; --out:#E6AE3A; --warn-bg:#3A3118; --bad-bg:#3D1C19;
  --band0:#5CC488; --band1:#B5CC4A; --band2:#E6AE3A; --band3:#F08A3C; --band4:#F06A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2621; --ink:#E5ECE7; --muted:#97A79E; --line:#2B3731;
  --accent:#9DB9EE; --accent-ink:#0E1411; --ball:#5CC488; --strike:#F06A5D; --out:#E6AE3A; --warn-bg:#3A3118; --bad-bg:#3D1C19;
  --band0:#5CC488; --band1:#B5CC4A; --band2:#E6AE3A; --band3:#F08A3C; --band4:#F06A5D; color-scheme:dark}
/* Sun mode: black on white, thick borders, solid buttons. Readable in glare. */
:root[data-theme="sun"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --ink:#000000; --muted:#222222; --line:#000000;
  --accent:#0033A0; --accent-ink:#FFFFFF; --ball:#006B2D; --strike:#C00000; --out:#8A5A00; --warn-bg:#FFF0A8; --bad-bg:#FFD6D1;
  --band0:#006B2D; --band1:#4F6B00; --band2:#8A5A00; --band3:#B03A00; --band4:#C00000; --bw:2.5px; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* No double-tap zoom: two quick taps are two taps (and a bounced one is caught in app.js), never a zoom. Pinch zoom still works. */
html,button,input,select,label,.zc,.base{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(40px + var(--barh))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.gamepick{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.gamepick select{max-width:280px;min-width:0}
.mode{position:relative;overflow:hidden;border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;user-select:none;-webkit-user-select:none;touch-action:none;min-height:36px}
.mode .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 30%,transparent);transform-origin:left;transform:scaleX(0)}
.mode.holding .fill{transition:transform 2s linear;transform:scaleX(1)}
.mode span{position:relative}
.mode.coach{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

select,input[type=text],input[type=number],input[type=date],input[type=search]{background:var(--surface);border:var(--bw) solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px;min-width:0}
.btn{border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--strike);border-color:color-mix(in srgb,var(--strike) 45%,var(--line))}
.btn.small{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default}
.label{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.h3note{font-family:var(--f-body);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.flag{background:var(--warn-bg);border:var(--bw) solid color-mix(in srgb,var(--out) 50%,var(--line));border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flag.bad{background:var(--bad-bg);border-color:var(--strike);font-weight:600}
.banners{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.banners:empty{display:none}

.chart-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:860px){.chart-grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

.board{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px 14px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px 14px}
@media (max-width:600px){.board{grid-template-columns:1fr 1fr}}
.cell-lab{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.inning{display:flex;align-items:center;gap:6px}
.inning .num{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:30px;text-align:center}
.step{width:36px;height:36px;border-radius:8px;border:var(--bw) solid var(--line);background:var(--surface-2);font-weight:700}
.count{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;display:flex;align-items:baseline;gap:4px}
.count .b{color:var(--ball)} .count .s{color:var(--strike)} .count .dash{color:var(--muted);font-size:34px}
/* Sun: the count and the pitch count are what the charter reads in glare, so they go bigger and heavier. */
:root[data-theme="sun"] .count{font-size:66px;-webkit-text-stroke:1.5px currentColor;gap:6px}
:root[data-theme="sun"] .count .b{-webkit-text-stroke-color:var(--ball)} :root[data-theme="sun"] .count .s{-webkit-text-stroke-color:var(--strike)}
:root[data-theme="sun"] .count .dash{font-size:44px;-webkit-text-stroke:0}
.lights{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.lights .grp{display:flex;align-items:center;gap:4px}
.lights .grp span{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-right:2px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0}
.dot.on.b{background:var(--ball);border-color:var(--ball)} .dot.on.s{background:var(--strike);border-color:var(--strike)} .dot.on.o{background:var(--out);border-color:var(--out)}
.diamond{width:96px;height:80px}
.diamond .base{cursor:pointer;stroke:var(--muted);stroke-width:2;fill:var(--surface-2)}
.diamond .base.on{fill:var(--out);stroke:var(--out)}
.diamond .plate{fill:var(--line)}
.diamond.big{width:132px;height:110px}
.pcount{text-align:center;min-width:104px}
.pcount .n{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;color:var(--band)}
:root[data-theme="sun"] .pcount .n{font-size:66px;-webkit-text-stroke:1.5px var(--band)}
:root[data-theme="sun"] .pcount .hint{font-size:14px;color:var(--ink);font-weight:600}
.pcount .hint{font-size:12.5px;color:var(--muted);line-height:1.2}
.pcount .book{margin-top:4px}
.pcount .book.ok{color:var(--ball);border-color:var(--ball)}
.pcount .book.off{color:var(--strike);border-color:var(--strike)}
@media (max-width:600px){.pcount{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:center;text-align:left}}
.batbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border-top:var(--bw) solid var(--line);padding-top:10px}
.batbar .who{flex:1;min-width:140px}
.batbar .who b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.hand{display:flex;gap:6px}
.hand button{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:24px}
.hand button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hand.pulse button{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.hand.pulse button{animation:none}.mode.holding .fill{transition:none}}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.type{position:relative;min-height:62px;border-radius:10px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:8px 10px 8px 16px;display:flex;flex-direction:column;justify-content:center}
.type::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--pc)}
.type b{font-family:var(--f-display);font-size:22px;line-height:1;letter-spacing:.03em}
.type small{color:var(--muted);font-size:12px;line-height:1.2;margin-top:2px}
.type[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,var(--surface))}
:root[data-theme="sun"] .type[aria-pressed="true"]{background:var(--pc);color:#fff}
:root[data-theme="sun"] .type[aria-pressed="true"] small{color:#fff}
.type.add{border-style:dashed;align-items:center;text-align:center;padding:8px}
.type.add::before{display:none}
.heights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.heights button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.heights button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.zone-wrap{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:start;margin-top:8px}
@media (max-width:420px){.zone-wrap{grid-template-columns:minmax(0,1fr)}}
.zone svg{width:100%;max-width:190px;height:auto;display:block;touch-action:manipulation}
.zsel rect.zc{cursor:pointer}

.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.res{min-height:64px;border-radius:10px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,var(--surface));font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;padding:6px;color:var(--ink)}
.res small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--muted)}
.res:active{background:color-mix(in srgb,var(--rc) 28%,var(--surface))}
:root[data-theme="sun"] .res{background:var(--rc);color:#fff;border-color:#000}
:root[data-theme="sun"] .res small{color:#fff}
.res:disabled{opacity:.35}
.res.undo{--rc:var(--muted)}
/* Upright tablets and phones, and touch tablets held sideways: results and Undo pinned to the bottom so nothing scrolls away. */
.resbar{display:none}
@media (max-width:860px), (orientation:landscape) and (max-height:900px) and (pointer:coarse){
  body.charting{--barh:150px}
  body.charting .results-panel{display:none}
  body.charting .resbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:var(--bw) solid var(--line);
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  body.charting .resbar .res{min-height:56px;font-size:16px;padding:4px}
  body.charting .resbar .res small{display:none}
}
/* Sideways iPad: one row of ten, so the bar stays short. */
@media (orientation:landscape) and (max-height:900px) and (pointer:coarse) and (min-width:861px){
  body.charting{--barh:96px}
  body.charting .resbar{grid-template-columns:repeat(10,minmax(0,1fr))}
}

.run-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.watch{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.watch .t{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:80px}
.watch .go{min-height:52px;min-width:150px;border-radius:10px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.watch .go.live{background:var(--accent);color:var(--accent-ink)}

.pa-strip{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;border:var(--bw) solid var(--line);border-radius:999px;padding:3px 9px 3px 6px;font-size:13px;background:var(--surface-2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.chip.ev{border-style:dashed}
.chip.est{opacity:.7;border-style:dotted}
button.chip{cursor:pointer}
.star{font-size:20px;line-height:1;border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;min-height:36px}
.star[aria-pressed="true"]{background:var(--out);color:#fff;border-color:var(--out)}
.dugout{border:2px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.dugout p{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.dugout.told{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--barh) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;pointer-events:none}
/* Taps go through the toast to the buttons under it; only its own button takes a tap. */
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:6px;padding:6px 10px;font-weight:700;pointer-events:auto;min-height:36px}
/* Pregame: is this device ready to chart? */
.pregame{border:var(--bw) solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2);font-size:14px;margin:0 0 10px}
.pregame ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px}
.pregame li::before{content:"✓";color:var(--ball);font-weight:700;margin-right:5px}
.pregame li.warn{color:var(--strike);font-weight:600}
.pregame li.warn::before{content:"!";color:var(--strike)}
.pregame p{margin:6px 0 0;font-weight:600}
.sheet-modal .pregame{margin:0}
.pf{display:flex;flex-direction:column;gap:10px}

.mixbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.mixbar span{background:var(--pc);height:100%}
.mixlist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.mixlist .bar{height:10px;border-radius:3px;background:var(--pc);min-width:2px}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet-modal{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;border:var(--bw) solid var(--line)}
.sheet-modal h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.opt{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;padding:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
:root[data-theme="sun"] .opt[aria-pressed="true"]{background:var(--accent);color:#fff}
.opt:disabled{opacity:.35}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.lineup-ed{display:grid;grid-template-columns:40px 64px minmax(0,1fr) 96px 36px;gap:6px;align-items:center}
@media (max-width:520px){.lineup-ed{grid-template-columns:36px 54px minmax(0,1fr) 80px 32px}}
.picklist{display:flex;flex-wrap:wrap;gap:6px}
.picklist button{border:var(--bw) solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-weight:600}
.picklist button[disabled]{opacity:.35}
.stepper{display:flex;gap:6px;align-items:center}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:28px;text-align:center}

kbd{display:none;font-family:var(--f-body);font-size:11px;font-weight:600;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}
.kbd-help{display:none}

<script>
(function(){
"use strict";
const MB_VERSION="3.0.0";
/* ---------- constants ---------- */
const STORE_KEY = "moundbook.v1";
const CATALOG = [
  {code:"FB", name:"Fastball", color:"#D7263D"},
  {code:"2S", name:"2-Seam / Sinker", color:"#EE8A25"},
  {code:"CT", name:"Cutter", color:"#8A5A3B"},
  {code:"SL", name:"Slider", color:"#D9A600"},
  {code:"SW", name:"Sweeper", color:"#9C7BD6"},
  {code:"CB", name:"Curveball", color:"#2E6FD8"},
  {code:"BRK", name:"Breaking ball", color:"#5D4BD1"},
  {code:"CH", name:"Changeup", color:"#2BA84A"},
  {code:"SPL", name:"Splitter", color:"#17A2B8"},
  {code:"KN", name:"Knuckleball", color:"#7D5BA6"},
  {code:"UN", name:"Not sure", color:"#8C949A"}
];
const DEFAULT_ARSENAL = ["FB","CB","SL","CH"];
const EXTRA_COLORS = ["#E056A0","#6B7A8F","#A0522D","#3FA796","#C2185B","#4E7D2E"];
const RESULTS = {
  B:{label:"Ball", short:"Ball", abbr:"b"},
  CS:{label:"Called strike", short:"Called", abbr:"c"},
  SS:{label:"Swinging strike", short:"Whiff", abbr:"s"},
  F:{label:"Foul", short:"Foul", abbr:"f"},
  BF:{label:"Foul bunt", short:"Foul bunt", abbr:"fb"},
  IP:{label:"In play", short:"In play", abbr:"x"},
  HBP:{label:"Hit by pitch", short:"HBP", abbr:"hbp"},
  CI:{label:"Catcher's interference", short:"Catcher's int.", abbr:"ci"},
  ILL:{label:"Illegal pitch, bases empty (ball)", short:"Illegal pitch", abbr:"ip"},
  UNK:{label:"Missed pitch (estimated)", short:"Missed", abbr:"?"}
};
const IP_RESULTS = [["OUT","Out"],["1B","Single"],["2B","Double"],["3B","Triple"],["HR","Home run"],["E","Error"],["FC","Fielder's choice"],["DP","Double play"],["SAC","Sacrifice"]];
const ENDINGS = [["K","Strikeout"],["BB","Walk"],["HBP","Hit by pitch"],...IP_RESULTS];
const EVENTS = {PK:"Throw over", PO:"Picked off", SB:"Stolen base", CS:"Caught stealing", WP:"Wild pitch", PB:"Passed ball", BK:"Balk", IBB:"Intentional walk"};
const HITS = new Set(["1B","2B","3B","HR"]);
const HEIGHTS = {U:"Up", M:"Middle", D:"Down"};

const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
// JSON with sorted keys, so two copies of the same thing always compare equal.
const canon = o => JSON.stringify(o, (k,v)=> v && typeof v==="object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}) : v);
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- pitchers ----------
   Each kid has a stable id that never changes. Team, jersey number and name are details on his record, so a rename,
   renumber or team change never touches a game log. Older ids built from team + number (like "westlake#22") are just ids too. */
const slug = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
// A jersey number cleaned up for matching: "#07" -> "07".
function normNum(num){ return String(num==null?"":num).replace(/[^0-9a-z]/gi,"").toLowerCase(); }
// Matching key: same team and number, or same team and name when there's no number. Used to find a kid, never as his id.
function pitcherKey(team, num, name){ const t=slug(team)||"team"; const n=normNum(num); return n ? `${t}#${n}` : `${t}@${slug(name)||"unknown"}`; }
function newPitcherId(){ return "p-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }
function newPitcher(o){
  const p={id:o.id||newPitcherId(), team:o.team||"", num:String(o.num||""), name:o.name||"", hand:o.hand||"R",
    arsenal:o.arsenal||DEFAULT_ARSENAL.slice(), tells:o.tells||[], check:o.check||{}, notes:o.notes||[], velo:o.velo||{},
    plan:o.plan||null, card:o.card||null, outings:o.outings||[], example:!!o.example, mergedInto:null};
  // When each part last changed (ed, and edAt for older versions), box-score lines removed on purpose, kids the coach
  // said are someone else (apart), and stub: a stand-in made before his real record reached this device.
  if(o.edAt) p.edAt=o.edAt;
  if(o.ed && typeof o.ed==="object") p.ed={...o.ed};
  if(Array.isArray(o.boxGone) && o.boxGone.length) p.boxGone=o.boxGone.slice();
  if(Array.isArray(o.apart) && o.apart.length) p.apart=o.apart.slice();
  if(o.stub) p.stub=true;
  return p;
}
// Edit stamps. p.ed says when each part of his record last changed on purpose: team, num, name, hand, arsenal, tells, and
// "check.<item>" / "velo.<range>" for each checklist answer and velo range. Two devices' copies keep the newer of each
// part, so a fix or a removal made anywhere sticks. Older records only have edAt, for the four details.
const P_DETAILS=["team","num","name","hand"];
function edStamp(p, f){ if(!p) return 0; if(p.ed) return p.ed[f]||0; return P_DETAILS.includes(f) ? p.edAt||0 : 0; }
function stampP(p, ...fs){
  if(!p) return p;
  if(!p.ed){ p.ed={}; if(p.edAt) P_DETAILS.forEach(k=>{ p.ed[k]=p.edAt; }); }
  const t=Date.now(); fs.forEach(f=>{ p.ed[f]=Math.max(t, (p.ed[f]||0)+1); });
  const d=Math.max(0, ...P_DETAILS.map(k=>p.ed[k]||0)); if(d) p.edAt=d;   // older versions read edAt
  return p;
}
// He was moved into his team and number on purpose (a renumber or team change), not filed there. Filling in a number,
// team or name he didn't have yet is finishing his details, not a move: renamePitcher stamps that as fill.<detail> too.
const slotStampMoved=(p, k)=>edStamp(p,k)>edStamp(p,"fill."+k);
function slotMoved(p){ return !!p && (slotStampMoved(p,"team") || slotStampMoved(p,"num") || (!normNum(p.num) && slotStampMoved(p,"name"))); }
// A pitch or tell put on or taken off his lists gets its own stamp (ars.<code>, tell.<text>), so two devices that each
// add a different one both keep theirs, and a removal wins only over that same item. Returns how many changed.
const LIST_ITEM={arsenal:"ars", tells:"tell"};
function stampList(p, k, before, after){
  if(!p || !LIST_ITEM[k]) return 0; const b=new Set((before||[]).filter(Boolean)), a=new Set((after||[]).filter(Boolean));
  const ch=[...[...a].filter(x=>!b.has(x)), ...[...b].filter(x=>!a.has(x))];
  // The whole list is stamped too (k), for older builds that read only that, and k~ says this build wrote it along with
  // the items' own stamps. A later whole-list stamp with no k~ to match came from an older build (see mergePitcher).
  if(ch.length){ stampP(p, k, ...ch.map(x=>LIST_ITEM[k]+"."+x)); p.ed[k+"~"]=p.ed[k]; }
  return ch.length;
}
function pLabel(p){ if(!p) return "?"; const n=p.num?"#"+p.num:""; return [n, p.name].filter(Boolean).join(" ") || "Unknown"; }

/* ---------- pitch-count rules ---------- */
// One table per level. Numbers are loaded from the state association's current policy and stay editable.
function restDays(table, n){ if(!table||!table.bands) return null; for(const b of table.bands){ if(n<=b.upTo) return b.rest; } return table.bands.length?table.bands[table.bands.length-1].rest:null; }
// The first pitch count that lands in a band with more rest than he has now.
function nextBand(table, n){ if(!table||!table.bands) return null; const cur=restDays(table,n); const i=table.bands.findIndex(b=>b.rest>cur); if(i<0) return null; return {at:i>0?table.bands[i-1].upTo+1:0, rest:table.bands[i].rest}; }
function bandIndex(table, n){ if(!table||!table.bands) return 0; const i=table.bands.findIndex(b=>n<=b.upTo); return i<0?table.bands.length-1:i; }
function nearBandLine(table, n, within){ if(!table||!table.bands) return false; return table.bands.some(b=>Math.abs(n-(b.upTo+0.5))<=within+0.5); }
function addDays(date, d){ const t=new Date(date+"T12:00:00"); t.setDate(t.getDate()+d); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
// Rest days are calendar days after the game date; eligible the day after the last rest day.
function eligibleDate(date, rest){ return rest==null?null:addDays(date, rest+1); }
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }

/* ---------- game log + replay ----------
   A game is an ordered log of entries. Everything else (count, outs, runners, batter, pitch counts)
   is rebuilt by replaying the log, so any edit in the middle fixes everything after it. */
function newGame(p){
  const t=Date.now();
  return {v:3, id:uid(), date:p.date||today(), pTeam:p.pTeam||"", bTeam:p.bTeam||"", hitting:p.hitting||"us", level:p.level||"varsity",
    practice:!!p.practice, example:!!p.example, chartedBy:p.chartedBy||"", lineup0:p.lineup0||[], spot0:p.spot0==null?(p.lineup0&&p.lineup0.length?0:null):p.spot0,
    log:[], pop:[], created:{t, dev:p.dev||""}, edited:{t, dev:p.dev||""}, sentAt:null, endedAt:null, endReason:null, rev:0, conflictOf:null};
}
function entry(k, o, dev){ return Object.assign({id:uid(), k, t:Date.now(), dev:dev||""}, o); }
function newLive(g){
  return {inning:1, outs:0, r1:false, r2:false, r3:false, balls:0, strikes:0, hand:"R", batter:"", spot:g&&g.lineup0&&g.lineup0.length?(g.spot0||0):null,
    paNo:1, pop:1, pitcher:null, phand:"R", lineup:g&&g.lineup0?clone(g.lineup0):[], starters:g&&g.lineup0?clone(g.lineup0):[], bf:{}, pc:{}, paOpen:false};
}
function setBatter(L){
  if(!L.lineup.length || L.spot==null) return;
  const b=L.lineup[L.spot]; if(!b) return;
  L.batter = b.name || (b.num?"#"+b.num:"Spot "+(L.spot+1));   // an unnamed spot isn't a jersey number
  L.hand = b.hand==="S" ? (L.phand==="R"?"L":"R") : (b.hand||"R");
}
function force(L){ if(L.r1){ if(L.r2){ L.r3 = true; } L.r2 = true; } L.r1 = true; }
function runnersUp(L){ L.r3=L.r2; L.r2=L.r1; L.r1=false; }
// Default guess at where runners end up on a ball in play. The charter fixes it in one tap when it's wrong.
function guessRunners(L, end){
  const r={r1:L.r1, r2:L.r2, r3:L.r3}; let outs=0;
  switch(end){
    case "1B": r.r1=true; r.r2=L.r1; r.r3=false; break;                                     // runners on 2nd/3rd score, runner on 1st to 2nd
    case "2B": r.r3=L.r1; r.r2=true; r.r1=false; break;                                    // runner on 1st to 3rd, others score
    case "3B": r.r1=r.r2=false; r.r3=true; break;
    case "HR": r.r1=r.r2=r.r3=false; break;
    case "E": r.r3=L.r2; r.r2=L.r1; r.r1=true; break;                                      // everybody moves up one
    case "FC": outs=1; if(L.r1){ const f={...r}; force(f); r.r1=true; r.r2=false; r.r3=f.r3; } else { if(L.r3) r.r3=false; else if(L.r2) r.r2=false; r.r1=true; } break; // force out at 2nd, batter safe
    case "DP": outs=2; if(L.r1){ r.r1=false; r.r2=false; r.r3=L.r2; } else { if(L.r3) r.r3=false; else if(L.r2) r.r2=false; } break; // 6-4-3: runner on 2nd moves to 3rd
    case "SAC": outs=1; r.r3=L.r2; r.r2=L.r1; r.r1=false; break;
    case "OUT": outs=1; break;
  }
  return {...r, outs};
}
function endPA(L, end, p){
  switch(end){
    case "K": if(p&&p.d3) force(L); else L.outs++; break;
    case "BB": case "IBB": case "HBP": case "CI": force(L); break;
    default: {
      const gr = guessRunners(L, end);
      const ra = p&&p.ra ? p.ra : gr;
      L.r1=!!ra.r1; L.r2=!!ra.r2; L.r3=!!ra.r3;
      L.outs += (p&&p.ra&&p.ra.outs!=null) ? p.ra.outs : gr.outs;
    }
  }
}
function checkInning(L){ if(L.outs>=3){ L.inning++; L.outs=0; L.r1=L.r2=L.r3=false; L.balls=0; L.strikes=0; L.pop=1; return true; } return false; }
function nextPA(L){
  L.balls=0; L.strikes=0; L.paNo++; L.pop=1; L.paOpen=false;
  if(L.lineup.length){ L.spot = L.spot==null?0:(L.spot+1)%L.lineup.length; setBatter(L); }
  else L.batter="";   // no lineup: a typed name is for one at-bat only
}
const sameBatter = (a, b) => !!a && !!b && String(a.num||"")===String(b.num||"") && String(a.name||"")===String(b.name||"");
function snap(L){ return {inning:L.inning, outs:L.outs, r1:L.r1, r2:L.r2, r3:L.r3, balls:L.balls, strikes:L.strikes, hand:L.hand, batter:L.batter, spot:L.spot, paNo:L.paNo, pop:L.pop, pitcher:L.pitcher, phand:L.phand}; }

const _replayCache = new WeakMap();
function replay(g){
  const c=_replayCache.get(g); if(c && c.rev===g.rev && c.len===g.log.length) return c.out;
  const L=newLive(g); setBatter(L);
  const pitches=[], events=[], books=[], adjs=[]; let n=0, seq=0;
  const order=[], lastInn={};
  // The innings each pitcher threw a pitch (or made a play) in, by number. Outs a fix adds or takes back count for the
  // pitcher on the mound only in those innings. Innings the charter skipped past (a late start, a stretch she missed)
  // have none of his pitches, so their outs aren't his to count.
  const threwIn={};
  const threw=pid=>{ (threwIn[pid]||(threwIn[pid]=new Set())).add(L.inning); };
  // a0, a1: outs in the game before and after the fix, counted from the first out of the 1st inning.
  const fixOuts=(pid, a0, a1)=>{ const set=threwIn[pid]; if(!set || a0===a1) return 0;
    const lo=Math.min(a0,a1), hi=Math.max(a0,a1); let k=0;
    set.forEach(i=>{ k+=Math.max(0, Math.min(hi, i*3)-Math.max(lo, (i-1)*3)); });
    return a1>a0 ? k : -k; };
  // Double steal entered trail runner first: the runner ahead was moved up with him. These are the bases those
  // lead runners came from, so their own steal (or caught stealing), if it is entered next, isn't applied twice.
  let ds=[];
  const toMound=(pid, hand)=>{ const same=L.pitcher===pid; L.pitcher=pid; L.phand=hand||"R"; if(!order.includes(pid)) order.push(pid); if(L.bf[pid]==null) L.bf[pid]=0; if(L.pc[pid]==null) L.pc[pid]=0; if(!same) L.paOpen=false; setBatter(L); };
  const starter=g.log.find(e=>e.k==="pitcher");
  // Book catch-up pitches saved before they were marked (extra): "?" pitches added in one tap (one grp) with the book's count
  // and nothing else. Only the official count sheet ever saved that. Without the count it can't be told: "Book has more
  // pitches" picked by itself looks the same as a "He's still up" tap whose count fix was deleted in the Log.
  const grp={}, oldExtra=new Set(); g.log.forEach(e=>{ if(e.grp) (grp[e.grp]||(grp[e.grp]=[])).push(e); });
  Object.values(grp).forEach(es=>{ const ps=es.filter(e=>e.k==="pitch");
    if(ps.length && es.some(e=>e.k==="book") && es.every(e=>e.k==="book" || (e.k==="pitch" && e.result==="UNK" && e.est))) ps.forEach(e=>oldExtra.add(e)); });
  // A v2 game moved over by an earlier v3 build (its entries lack the ids the move gives them now, <game id>.v1, .v2...).
  // That build kept a typed name for the next at-bat, so it wrote a batter fix only where v2's name changed: two at-bats in a
  // row with the same name got one fix. A name from one of those fixes still carries over to the next at-bat from v2 (within
  // 12 hours of its first pitch), as v2 had it. At-bats charted later start blank as usual.
  const v2end = g.legacyOpp!=null && !(g.lineup0&&g.lineup0.length) && !g.log.some(e=>String(e.id).startsWith(g.id+".v")) ? ((g.created&&g.created.t)||0)+12*3600000 : 0;
  let v2name=false, carried=false;
  const endPAhere=()=>{ const keep=v2name && !L.lineup.length ? L.batter : ""; nextPA(L); if(keep){ L.batter=keep; carried=true; } };
  g.log.forEach((e, idx)=>{
    if(carried && (e.t||0)>v2end){ L.batter=""; carried=false; v2name=false; }
    if(!(e.k==="ev" && (e.kind==="SB"||e.kind==="CS"))) ds=[];
    if(e.k==="pitcher"){ toMound(e.pitcher, e.phand); return; }
    // A pitch or play somehow ahead of the starting pitcher's entry (an older Log insert) is his.
    if((e.k==="pitch"||e.k==="ev") && L.pitcher==null && starter) toMound(starter.pitcher, starter.phand);
    if(e.k==="lineup"){ const before=L.lineup; L.lineup=clone(e.lineup||[]);
      // Before anything is charted these are the starters. Saved mid-game, the lineup fixes names or the order: a spot
      // whose starter was still in takes the new name as its starter, and a spot with a sub in keeps its starter, so he can re-enter.
      if(!seq) L.starters=clone(L.lineup);
      else L.lineup.forEach((x,i)=>{ const st=L.starters[i], was=before[i]; if(!st || !was || sameBatter(st,was)) L.starters[i]=clone(x); });
      L.spot=e.spot==null?(L.lineup.length?0:null):e.spot; setBatter(L); return; }
    if(e.k==="sub"){ if(L.lineup[e.spot]) { L.lineup[e.spot]=clone(e.player); if(e.spot===L.spot) setBatter(L); } return; }
    if(e.k==="adj"){
      // A fix only sets what it names. Changing just the batter (or his spot) relabels who is up: same count, same at-bat.
      const outs0=(L.inning-1)*3+L.outs;
      ["inning","outs","r1","r2","r3","balls","strikes","hand","batter","spot"].forEach(f=>{ if(e[f]!==undefined) L[f]=e[f]; });
      if(e.batter!==undefined){ v2name=!!v2end && e.why==="from older version"; carried=false; }
      if(e.spot!==undefined) setBatter(L); if(e.hand!==undefined) L.hand=e.hand;
      if(e.outs!==undefined && checkInning(L) && !L.paOpen) L.paNo++;
      // Outs added (or taken back) by a fix count for the pitcher on the mound, in the innings he threw in.
      // Where a game kept from a second copy picks up (why "split") is no fix: the outs before it are in the team copy.
      adjs.push({...e, idx, gameId:g.id, date:g.date, pitcher:L.pitcher, outsMade:e.why==="split" ? 0 : fixOuts(L.pitcher, outs0, (L.inning-1)*3+L.outs)});
      return; }
    if(e.k==="book"){ books.push({...e, idx, pitcher:L.pitcher, app:L.pc[L.pitcher]||0}); return; }
    const pid=L.pitcher;
    if(e.k==="pitch" && (e.extra || oldExtra.has(e))){
      // Added so our count matches the book. They count toward his pitch count only: no at-bat, no batter,
      // and they stay in the last inning he pitched.
      pitches.push(Object.assign({}, e, snap(L), {extra:true, idx, seq:++seq, gameId:g.id, date:g.date, n:++n, pc:L.pc[pid]||0, pa:null, paNo:null, pop:null, bf:L.bf[pid]||0, inning:lastInn[pid]||L.inning}));
      L.pc[pid]=(L.pc[pid]||0)+1;
      return;
    }
    if(e.k==="ev" && e.kind==="PK" && e.base) L["r"+e.base]=true;   // a throw to an empty base means somebody is standing there
    // His first pitch (or an intentional walk) starts the at-bat against this pitcher. Plays on the bases before that don't,
    // so a pitcher pulled after a throw-over, or an inning that ends on the bases, isn't charged with the batter.
    if((e.k==="pitch" || e.kind==="IBB") && !L.paOpen){ L.paOpen=true; L.bf[pid]=(L.bf[pid]||0)+1; }
    if(pid!=null) threw(pid);
    const ctx = {...snap(L), bf:(L.bf[pid]||0)+(L.paOpen?0:1), idx, seq:++seq, gameId:g.id, date:g.date};
    if(e.k==="pitch"){
      const p = Object.assign({}, e, ctx, {n:++n, pc:L.pc[pid]||0, pa:null});
      L.pc[pid]=(L.pc[pid]||0)+1; lastInn[pid]=L.inning;
      let b=L.balls, s=L.strikes, end=null;
      switch(e.result){
        case "B": case "ILL": b++; if(b>=4) end="BB"; break;
        case "CS": case "SS": s++; if(s>=3) end="K"; break;
        case "F": if(s<2) s++; break;
        case "BF": s++; if(s>=3) end="K"; break;
        case "IP": end=e.ip||"OUT"; break;
        case "HBP": end="HBP"; break;
        case "CI": end="CI"; break;
        case "UNK": break;
      }
      p.pa=end; p.d3 = end==="K" && !!e.d3;
      pitches.push(p);
      if(end){ const o0=L.outs; endPA(L, end, p); p.outsMade=Math.min(3,L.outs)-o0; checkInning(L); endPAhere(); }
      else { L.balls=b; L.strikes=s; L.pop++; }
      return;
    }
    if(e.k==="ev"){
      const x = Object.assign({}, e, ctx, {pa:null});
      switch(e.kind){
        case "PK": if(e.base) L["r"+e.base]=true; break;
        case "PO": L["r"+e.base]=false; L.outs++; break;
        case "SB": { const b=e.base, at=ds.indexOf(b);
          if(at>=0){ ds.splice(at,1); break; }   // already moved up with the runner behind him
          let top=b+1; while(top<=3 && L["r"+top]) ds.push(top++);   // runners right ahead of him go too
          L["r"+b]=false; for(let k=b+1;k<=Math.min(3,top);k++) L["r"+k]=true; break; }
        case "CS": { const b=e.base, at=ds.indexOf(b);
          if(at>=0){ ds.splice(at,1); if(b<3) L["r"+(b+1)]=false; }   // the lead runner, already moved up, is the one out
          else L["r"+b]=false;
          L.outs++; break; }
        case "WP": case "PB": case "BK": runnersUp(L); break;
        case "IBB": force(L); x.pa="IBB"; break;
      }
      x.outsMade = (e.kind==="PO"||e.kind==="CS") ? 1 : 0;
      events.push(x);
      if(e.kind==="IBB"){ checkInning(L); endPAhere(); }
      // A third out on the bases: the batter leads off next inning with a fresh count. If he hadn't seen a pitch yet,
      // that is a new at-bat (and whoever pitches to him then faces him).
      else if(checkInning(L) && !L.paOpen) L.paNo++;
      return;
    }
  });
  const out={live:L, pitches, events, books, adjs, order, last:g.log[g.log.length-1]||null};
  _replayCache.set(g,{rev:g.rev,len:g.log.length,out});
  return out;
}
function touch(g, dev){ g.rev=(g.rev||0)+1; g.edited={t:Date.now(), dev:dev||(g.edited&&g.edited.dev)||""}; }
// An entry changed in place (a Log fix, retype, star, a new pitcher id or hand). The stamp lets a merge keep the newer copy.
function markEdited(e){ if(e) e.ed=Date.now(); return e; }
// Game details (Edit game, practice, end, reopen, the lineup before the first pitch, a team rename). Each field
// remembers when it last changed (g.metaEd = {field: time}), so a merge keeps whichever device changed it last.
function setGameInfo(g, o, dev){
  const t=Date.now(), ms=Object.assign({}, metaStamps(g));
  for(const k in o){ if(canon(g[k])!==canon(o[k])){ g[k]=o[k]; ms[k]=t; } }
  g.metaEd=ms; touch(g, dev);
}
// A single time in g.metaEd (one stamp for the whole game) stands for the details Edit game sets.
const GAME_DETAILS = ["date","pTeam","bTeam","hitting","level","practice","chartedBy","brk"];
function metaStamps(g){
  const m=g&&g.metaEd; if(m && typeof m==="object") return m;
  const o={}; if(typeof m==="number" && m>0) GAME_DETAILS.forEach(k=>{ o[k]=m; }); return o;
}
function push(g, e, dev){ g.log.push(e); touch(g, dev); return e; }
// Entries taken out of a log (undo, Log delete) leave their id in g.cut, so an older copy that still has them (our own
// earlier push coming back, a file, a phone that lagged) can't put them back. Kept short: the last few hundred.
const CUT_MAX=300;
function cutOut(g, e){ if(e && e.id!=null) g.cut=(g.cut||[]).filter(c=>c && c.id!==e.id).concat({id:e.id, t:Date.now()}).slice(-CUT_MAX); return e; }
function cutIds(g){ return new Set(((g&&g.cut)||[]).map(c=>c&&c.id)); }
function mergeCut(x, y){ const m=new Map(); [...(x||[]), ...(y||[])].forEach(c=>{ if(c && c.id!=null && !m.has(c.id)) m.set(c.id, c); });
  return [...m.values()].sort((p,q)=>(p.t||0)-(q.t||0)).slice(-CUT_MAX); }
function undoLast(g, dev){
  const i=g.log.length-1; if(i<0) return null;
  if(g.log[i].k==="pitcher" && !g.log.slice(0,i).some(x=>x.k==="pitcher")) return null;   // never undo the starting pitcher
  const e=cutOut(g, g.log.pop()); touch(g, dev); return e;
}
// Put in ahead of the end (ins): a merge then knows it was added here, not taken out on the other copy.
function insertAt(g, idx, entries, dev){ if(idx<g.log.length) entries.forEach(e=>{ e.ins=true; }); g.log.splice(idx, 0, ...entries); touch(g, dev); }
function removeAt(g, idx, dev){ const e=cutOut(g, g.log.splice(idx,1)[0]); touch(g, dev); return e; }
// Swap a game's contents in place. The chart, an open sheet or a timer may still hold this object, and whatever they
// record has to land in the game that gets saved, not in a copy nobody saves.
function replaceGame(g, src){ if(!g || !src || g===src) return g; Object.keys(g).forEach(k=>{ delete g[k]; }); Object.assign(g, src); _replayCache.delete(g); return g; }
function liveOf(g){ return replay(g).live; }
function isLegalD3(L){ return !L.r1 || L.outs===2; }

/* ---------- missed pitches ----------
   The charter looked away. Fill the gap with '?' pitches marked estimated: they count toward
   the pitch count and batters faced, but stay out of pitch mix and strike rates. Pitches added only to match
   the book count toward the pitch count alone. */
// The fewest pitches an at-bat that is at this count could still take to end this way: a strikeout needs the rest of
// his strikes, a walk the rest of his balls, anything else one pitch.
function fewestToEnd(L, end){ return end==="K" ? Math.max(1,3-L.strikes) : end==="BB" ? Math.max(1,4-L.balls) : 1; }
function missedEntries(L, o, dev){
  const out=[];
  const mk=(result, extra)=>entry("pitch", Object.assign({type:"UN", result, est:true}, extra||{}), dev);
  if(o.mode==="count"){
    const db=Math.max(0,(o.balls|0)-L.balls), ds=Math.max(0,(o.strikes|0)-L.strikes);
    const min = (o.balls<L.balls||o.strikes<L.strikes) ? 0 : db+ds;
    const n = Math.max(o.n==null?min:o.n|0, 0);
    for(let i=0;i<n;i++) out.push(mk("UNK"));
    out.push(entry("adj",{balls:o.balls|0, strikes:o.strikes|0, why:"missed"},dev));
    return out;
  }
  if(o.mode==="ended"){
    // Blank means the fewest it could be. A number lower than that can't be right, so it is raised to it.
    const end=o.outcome, min=fewestToEnd(L, end);
    const n = Math.max(min, o.n==null?min:o.n|0);
    for(let i=0;i<n-1;i++) out.push(mk("UNK"));
    if(end==="K"){ out.push(entry("adj",{strikes:2, why:"missed"},dev)); out.push(mk("SS")); }
    else if(end==="BB"){ out.push(entry("adj",{balls:3, why:"missed"},dev)); out.push(mk("B")); }
    else if(end==="HBP") out.push(mk("HBP"));
    else out.push(mk("IP",{ip:end}));
    return out;
  }
  // The book has more pitches than we do: they were missed somewhere earlier, so they join no at-bat (see replay).
  if(o.mode==="extra"){ for(let i=0;i<(o.n|0);i++) out.push(mk("UNK",{extra:true})); return out; }
  return out;
}

/* ---------- merging copies of the same game from different devices ----------
   Never overwrite silently. When one log is the other plus more entries (or the same entries), the copies are merged:
   the longer log, and for each shared entry whichever copy was changed later (e.ed). Game details are merged the same
   way, field by field (g.metaEd). An entry taken out on either copy (g.cut) is out of the result, and entries put in with
   Log insert join it where they were put. Only logs that split apart (both went on with different entries, or an unmarked
   entry is missing from the middle of one) are a conflict, and then both copies are kept. Where nothing is stamped (older data), the longer copy, or else the one saved later, wins. */
// Two copies of one entry say the same thing. Which device wrote it (dev) and when it was made (t) are only notes, never
// changed in place: the same v2 data moved over on two devices, or a game rebuilt from a sheet, differ only there.
const sameEntry = (a, b) => a===b || (!!a && !!b && canon({...a, dev:"", t:0})===canon({...b, dev:"", t:0}));
function mergeGame(local, incoming){
  if(!local) return {kind:"new", game:incoming};
  const conflict={kind:"conflict", game:local, other:incoming};
  // An entry either copy took out (undo, Log delete) is out of both.
  const gone=new Set([...cutIds(local), ...cutIds(incoming)]);
  const a=(local.log||[]).filter(e=>!gone.has(e.id)), b=(incoming.log||[]).filter(e=>!gone.has(e.id));
  const inA=new Map(a.map((e,i)=>[e.id,i])), inB=new Map(b.map((e,i)=>[e.id,i]));
  const sa=a.filter(e=>inB.has(e.id)), sb=b.filter(e=>inA.has(e.id));
  if(sa.length!==sb.length || sa.some((e,i)=>e.id!==sb[i].id)) return conflict;

const IDB_NAME="moundbook", LS_V3="moundbook.v3", LS_BOOT="moundbook.boot";

    const t=setTimeout(()=>end(rej, new Error("IndexedDB timed out")), ms||5000);

      if(!end(res, db)){ try{ db.close(); }catch(e){} return; }   // it answered after we stopped waiting
      // A connection the browser closes (iPad Safari does this) is dropped, so the next save opens a fresh one.
      const lost=()=>{ if(_db===db) _db=null; };

    };
    r.onerror=()=>end(rej, r.error||new Error("IndexedDB open failed")); r.onblocked=()=>end(rej, new Error("IndexedDB blocked"));

      ids.forEach(id=>{ const g=S.games.find(x=>x.id===id); if(g) st.put(JSON.parse(JSON.stringify(g)), "g:"+id); });

  CATALOG.forEach(a=>{ if(!s.catalog.some(c=>c.code===a.code)) s.catalog.splice(Math.max(0,s.catalog.findIndex(c=>c.code==="UN")),0,{...a}); });

  // The id comes from the v2 name and school, so the same v2 data gives the same ids on every device.

  // moved over twice, or on two devices, gives one note, not two.
  const lastT=Math.max(0, ...real.map(g=>Math.max(Date.parse((g.date||"")+"T12:00:00")||0, ...(g.pitches||[]).concat(g.events||[]).map(x=>+x.t||0))));

function backupAll(){ return JSON.stringify({mb:3, kind:"backup", from:{dev:S.device.id}, at:Date.now(), games:S.games.filter(g=>!g.example), pitchers:Object.fromEntries(Object.entries(S.pitchers).filter(([k,p])=>!p.example)), pitcherAlias:S.pitcherAlias||{}, roster:S.roster, catalog:S.catalog, setAside:S.setAside||[], settings:{rules:S.settings.rules, ourName:S.settings.ourName}}); }

    const nt=(S.needsTeam||[]).filter(id=>S.pitchers[id]&&!S.pitchers[id].team).length; if(nt && ui.tab!=="chart") out.push(`<div class="flag"><span>${nt} pitcher${nt>1?"s":""} from older games need${nt>1?"":"s"} a team.</span><button class="btn small" data-ban="team">Fix it</button></div>`); }

function arsenalFor(g, pid){
  let a=(P(pid).arsenal||[]).filter(c=>c!=="UN");
  if(g.brk){ const had=a.some(c=>BRK_SET.has(c)); a=a.filter(c=>!BRK_SET.has(c)); if(had && !a.includes("BRK")) a.splice(Math.min(1,a.length),0,"BRK"); }
  return [...new Set(a), "UN"];
}
function isCharter(){ return S.settings.mode==="charter"; }
// The last pitch thrown. Pitches added only to match the book aren't on the chip strip, so they never count as the last one.
// The last real pitch: book catch-up pitches (replay marks older ones too) are never it.
function lastPitchEntry(g){ const p=replay(g).pitches.filter(x=>!x.extra).pop(); return p ? g.log[p.idx] : null; }
/* A sheet or button holds the game it was drawn for. Live sync updates a game in place, so that is still the saved game,
   unless this device stopped charting it while the sheet was open (taken over elsewhere) or it was deleted. Then the
   change is kept as a second copy on the Data tab and the coach is told, never dropped behind a "recorded" toast. */
function editTarget(g){ const now=g && S.games.find(x=>x.id===g.id); return now && Sync.canEdit(now) ? now : null; }
// change(x) makes the change on whichever game it is given. Returns the game it went into, or null when it was kept aside.
function change(g, fn){
  const t=editTarget(g); if(t){ fn(t); saveGame(t); return t; }
  const now=S.games.find(x=>x.id===g.id), c=JSON.parse(JSON.stringify(g));
  fn(c); Object.assign(c, {id:uid(), conflictOf:now ? (now.conflictOf||now.id) : g.id, mine:true}); delete c.relay; delete c.takeover; delete c.undelete;
  S.games.push(c); saveGame(c);
  toast(now ? `Charting for this game moved to ${Sync.devName(Sync.writerOf(now))}. What you just entered is kept as a second copy on the Data tab.`
    : "This game was deleted. What you just entered is kept as a second copy on the Data tab.", {ms:6000});
  return null;
}

function act(g, entries, label){ const grp=entries.length>1?uid():null; entries.forEach(e=>{ if(grp) e.grp=grp; });
  return change(g, x=>{ entries.forEach(e=>x.log.push(e)); touch(x, dev()); }) ? entries : null; }
function fixState(g, o, why){ const r=act(g, [entry("adj", Object.assign({why:why||"fix"}, o), dev())]); renderChart(); return r && r[0]; }

function boardPC(g, R){
  const L=R.live, pid=L.pitcher, T=rulesFor(g.level);
  const {gameN, earlier, dayN}=boardCount(g, pid, T, R);
  const bi=Math.min(4,bandIndex(T,dayN));
  let hint;
  if(dayN>T.max) hint=`Over the ${T.max} max`;
  else if(dayN===T.max) hint=`At the max (${T.max}). He's done${T.finishBatter?" after this batter":", even mid at-bat"}.`;
  else { const nb=nextBand(T,dayN), left=T.max-dayN; const add=nb?nb.rest-restDays(T,dayN):0;
    hint = left<=10 ? `${left} to the max (${T.max})` : nb ? `next band at ${nb.at} (+${add} day${add===1?"":"s"})` : `max ${T.max}`; }
  const sub = earlier ? `${gameN} this game + ${earlier} earlier today${T.dh==="add"?"":" (separate)"}` : `${L.bf[pid]||0} batter${(L.bf[pid]||0)===1?"":"s"} · ${restDays(T,dayN)} day${restDays(T,dayN)===1?"":"s"} rest now`;
  const bk=R.books.filter(b=>b.pitcher===pid).pop();
  const chip = bk ? (bk.n===bk.app?`Book ${bk.n} ✓`:`Book ${bk.n} (you had ${bk.app})`) : "Official count";
  return `<div class="pcount" style="--band:var(--band${dayN>=T.max?4:bi})"><div><div class="cell-lab">Pitch count · ${esc(T.name)}</div><div class="n" aria-live="polite">${dayN}</div></div>
    <div><div class="hint">${esc(hint)}</div><div class="hint">${esc(sub)}</div><button class="btn small book ${bk?(bk.n===bk.app?"ok":"off"):""}" data-act="book">${esc(chip)}</button></div></div>`;
}

function coachDrawer(g, R){

  const cm=mix(inCount), co=typeOrder(inCount);

let watchTimer=null;
// Time to the plate runs about 1.0 to 1.8 seconds. Anything outside 0.9 to 2.5 was a missed stop or a stray tap, so it isn't saved.
const TTP_MIN=0.9, TTP_MAX=2.5;
function stopWatch(){ ui.watchStart=null; clearInterval(watchTimer); watchTimer=null; }
function toggleWatch(){
  if(ui.watchStart){ const s=Math.round((performance.now()-ui.watchStart)/10)/100; stopWatch();
    if(s<TTP_MIN || s>TTP_MAX){ ui.ttp=null; toast(`${s.toFixed(2)} seconds isn't a time to the plate. Not saved.`); } else ui.ttp=s;
    renderChart(); }
  else { stopWatch(); ui.watchStart=performance.now(); ui.ttp=null; renderChart(); watchTimer=setInterval(()=>{ const t=$("#watch-t"); if(t&&ui.watchStart) t.textContent=((performance.now()-ui.watchStart)/1000).toFixed(2); },30); }
}
// A second tap on the same button within a blink (a bounced finger or a double tap) is dropped.
function bounced(key, ms){ const now=performance.now(), b=ui.lastTapKey; if(b && b.k===key && now-b.t<(ms||350)) return true; ui.lastTapKey={k:key, t:now}; return false; }

function commitPitch(g, o){

  if(e.dirt) e.h="D";

  if(!done){ renderChart(); return; }

  if(p.pa==="K" && e.result!=="BF" && legalD3) toast(`${lab}: strikeout`, {action:"He reached (dropped 3rd)", ms:5000, fn:()=>{ if(change(g, x=>{ const y=x.log.find(z=>z.id===e.id); if(y){ y.d3=true; markEdited(y); } touch(x,dev()); })) toast("Dropped 3rd: batter on first"); renderChart(); }});
  else toast(p.pa ? `${lab}: ${paLabel(p.pa)}` : `${lab} · now ${R.live.balls}-${R.live.strikes}`);
}
function addEvent(g, kind, base, extra){ if(!act(g,[entry("ev", clean(Object.assign({kind, base}, extra||{})), dev())])){ renderChart(); return; } const R=replay(editTarget(g)||g); const x=R.events[R.events.length-1]; renderChart(); toast(evLabel(x)); }

function tapType(c){ const keep=!!ui.undoType && ui.undoType===ui.type && ui.type===c; ui.undoType=null; if(!keep) ui.type = ui.type===c ? null : c; }
function undoAction(g){
  if(!editTarget(g)){ toast(`Charting for this game moved to ${Sync.devName(Sync.writerOf(g))}. Nothing was undone here.`, {ms:5000}); renderChart(); return; }
  g=editTarget(g);

  const grp=last.grp; let x=null, n=0;

  else toast(n>1?`Removed ${n} entries`:x.k==="ev"?`Removed ${evLabel(x)}`:x.k==="pitcher"?"Removed the pitching change":x.k==="adj"?"Removed a fix":"Removed");

function bindChart(el, g, R){
  const L=R.live;
  const on=(sel,fn)=>$$(sel,el).forEach(b=>b.onclick=()=>fn(b));
  on("[data-type]", b=>{ if(bounced("type:"+b.dataset.type)) return; tapType(b.dataset.type); renderChart(); });
  on("[data-h]", b=>{ ui.h = ui.h===b.dataset.h?null:b.dataset.h; renderChart(); });
  $$(".zsel .zc",el).forEach(r=>bindTap(r, ()=>{ const z=+r.dataset.z; ui.zone=ui.zone===z?null:z; renderChart(); }));
  on("[data-hand]", b=>{ ui.pulseHand=false; if(L.hand!==b.dataset.hand) fixState(g,{hand:b.dataset.hand},"side"); else renderChart(); });
  $$("[data-base]",el).forEach(b=>bindTap(b, ()=>{ const k=b.dataset.base; fixState(g,{[k]:!L[k]},"runner"); }));

    bat.onchange=()=>act(g,[entry("adj",{batter:bat.value.trim(), why:"batter", ...(ownNames(g)&&bat.value.trim()?{own:true}:{})},dev())]);

    if(r==="MORE") return moreSheet(g);

    commitPitch(g,{result:r});
  });
  on("[data-pk]", b=>addEvent(g,"PK",+b.dataset.pk));

    // ‹ / › fix who is up: same count, same at-bat. If his at-bat really ended, the toast takes it back and opens Missed pitches.
    if(a==="bat-"||a==="bat+"){ const n=L.lineup.length; const e=fixState(g,{spot:((L.spot==null?0:L.spot)+(a==="bat+"?1:-1)+n)%n},"batter");
      if(!e) return;   // kept aside: that toast says so
      if(L.pop>1 && a==="bat+") toast(`Same at-bat, count stays ${L.balls}-${L.strikes}.`, {action:"His at-bat ended", ms:5000, fn:()=>{ const t=editTarget(g); if(!t || !e){ renderChart(); return; } if(t.log[t.log.length-1]===e){ undoLast(t,dev()); saveGame(t); } renderChart(); missedSheet(t,{mode:"ended"}); }});
      else if(L.pop>1) toast(`Same at-bat, count stays ${L.balls}-${L.strikes}.`); }
    if(a==="undo") undoAction(g);
    if(a==="missed") missedSheet(g);
    if(a==="book") officialSheet(g);
    if(a==="newgame") gameSheet(null);
    if(a==="editgame") gameSheet(g);
    if(a==="lineup") lineupSheet(g);
    if(a==="sub") subSheet(g);
    if(a==="changep") pitcherSheet(g,"change");
    if(a==="arsenal") pitcherSheet(g,"edit");
    if(a==="addtype") addTypeSheet(g);
    if(a==="runsheet") runSheet(g);
    if(a==="watch") toggleWatch();
    if(a==="ttpclear"){ ui.ttp=null; renderChart(); }
    if(a==="retype") retypeSheet(g);
    if(a==="star"){ const e=lastPitchEntry(g); if(e){ const on=!e.star; if(change(g, x=>{ const y=x.log.find(z=>z.id===e.id); if(y){ if(on) y.star=true; else delete y.star; markEdited(y); } touch(x,dev()); })) toast(on?"Flagged for Coach":"Flag removed"); renderChart(); } }

function inPlaySheet(g){

    sheet(`<h3>Ball in play · ${pname(ui.type||"UN")}</h3>
    <div class="opts">${IP_RESULTS.map(([k,l],i)=>`<button class="opt" data-ip="${k}" aria-pressed="${res===k}"><kbd>${i+1}</kbd>${l}</button>`).join("")}</div>
    <div class="opts"><button class="opt" data-hh aria-pressed="${hh}"><kbd>K</kbd>Hit hard</button></div>
    ${res?`<div class="row" style="align-items:flex-start;gap:16px"><div><div class="label">Runners after the play</div>${diamondSVG(st,"big")}<div class="muted" style="font-size:12.5px">Tap a base if it's wrong.</div></div>

      $$("[data-base]",m).forEach(b=>bindTap(b,()=>{ const cur=ra||{r1:guess.r1,r2:guess.r2,r3:guess.r3}; ra={...cur, [b.dataset.base]:!cur[b.dataset.base]}; draw(); }));
      $$("[data-o]",m).forEach(b=>b.onclick=()=>{ outs=Math.max(0,Math.min(3,o+(+b.dataset.o))); draw(); });

// Every name in a game we were hitting in is ours (games from before names were marked, too).
function eachName(g, fn){ (g.lineup0||[]).forEach(p=>{ if(p && (p.name||p.num)) fn(p); });
  g.log.forEach(e=>{ if(e.k==="lineup") (e.lineup||[]).forEach(p=>{ if(p && (p.name||p.num)) fn(p); }); if(e.k==="sub" && e.player && (e.player.name||e.player.num)) fn(e.player); if(e.k==="adj" && e.batter) fn(e); }); }
function markOwn(g){ eachName(g, p=>{ p.own=true; }); }
function ownedNames(g){ let n=0; eachName(g, p=>{ if(p.own) n++; }); return n; }
// The coach said the names are the other team's. Stamped (metaEd.names), so this answer wins over an older copy that still
// holds the names as ours (engine.js keepOwn).
function releaseNames(x){ eachName(x, p=>{ delete p.own; }); x.metaEd={...metaStamps(x), names:Date.now()}; }

function entryText(e){

    case "pitcher": return `Pitching change: ${pLabel(P(e.pitcher))} (${e.phand}HP)`;
    case "adj": { const parts=[]; if(e.inning!=null) parts.push("inning "+e.inning); if(e.outs!=null) parts.push(e.outs+" out"+(e.outs===1?"":"s")); ["r1","r2","r3"].forEach((r,i)=>{ if(e[r]!=null) parts.push((e[r]?"runner on ":"nobody on ")+BASE[i+1]); }); if(e.balls!=null||e.strikes!=null) parts.push(`count ${e.balls!=null?e.balls:"?"}-${e.strikes!=null?e.strikes:"?"}`); if(e.hand) parts.push("bats "+e.hand); if(e.spot!=null) parts.push("spot "+(e.spot+1)+" up"); if(e.batter!=null) parts.push("batter "+(e.batter||"(blank)")); return "Fix: "+(parts.join(", ")||"(nothing)")+(e.why?` · ${e.why}`:""); }
    case "lineup": return `New lineup (${(e.lineup||[]).length} spots)`;
    case "sub": return `Sub: ${batterText(e.player)} into spot ${e.spot+1}`;
    case "book": return `Official count from the book: ${e.n}`;
    case "ev": return evLabel(e);
    default: return e.k;
  }
}

      <div><div class="label">Outs on the play</div><div class="stepper"><button class="step" data-o="-1" aria-label="Fewer outs">−</button><b>${outs}</b><button class="step" data-o="1" aria-label="More outs">+</button></div></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button>${e.ra?`<button class="btn" data-guess>Use the usual guess</button>`:""}<button class="btn primary" data-ok>Save</button></div>`, (m, close)=>{
      $$("[data-base]",m).forEach(b=>bindTap(b,()=>{ st={...st, [b.dataset.base]:!st[b.dataset.base]}; draw(); }));
      $$("[data-o]",m).forEach(b=>b.onclick=()=>{ outs=Math.max(0,Math.min(3,outs+(+b.dataset.o))); draw(); });
      const gu=$("[data-guess]",m); if(gu) gu.onclick=()=>{ close(); done(y=>{ delete y.ra; }, "Back to the usual guess. Everything after it replayed."); };

    });

}

}

function planAction(pid, d, a){
  const p=ensurePitcher(P(pid)); p.plan=p.plan||{}; const now=planNow(p,d); const by=S.settings.lastInitials||"";
  if(a==="approve"){ if(!p.plan.R) p.plan.R={text:now.R.join("\n"), at:Date.now()}; if(!p.plan.L) p.plan.L={text:now.L.join("\n"), at:Date.now()}; if(p.plan.approach==null) p.plan.approach=now.approach; p.plan.approved={at:Date.now(), by}; p.plan.at=Date.now(); save(); renderReport(); toast("Plan approved"); return; }

        const put=appr=>{ p.plan.R={text:$("#pl-R",m).value.trim(), at:Date.now()}; p.plan.L={text:$("#pl-L",m).value.trim(), at:Date.now()}; p.plan.approach=$("#pl-a",m).value.trim(); p.plan.approved=appr?{at:Date.now(), by}:null; p.plan.at=Date.now(); save(); close(); renderReport(); toast(appr?"Plan approved":"Saved as a draft"); };
        $("[data-save]",m).onclick=()=>put(false); $("[data-appr]",m).onclick=()=>put(true);
      });
    return;
  }
  if(a==="rebuild"){

      <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Done</button></div>`, (m, close)=>{
        $$("[data-use]",m).forEach(b=>b.onclick=()=>{ const h=b.dataset.use; p.plan[h]={text:dr[h].join("\n"), at:Date.now()}; p.plan.approved=null; p.plan.at=Date.now(); save(); b.textContent="Using new draft ✓"; b.disabled=true; renderReport(); });
        $$("[data-keep]",m).forEach(b=>b.onclick=()=>{ b.textContent="Kept ✓"; });

/* ---------- hitter's card: at most four lines a 16-year-old will read at the fence ---------- */
function cardData(pid, d){
  const p=P(pid), ps=d.ps, f=typed(ps), r=real(ps); const plan=planNow(p,d);
  const ars=typeOrder(f).filter(k=>k!=="UN"); const n=d.games.length;
  const head=`${p.num?"#"+p.num:pLabel(p)} ${p.hand}HP, ${ars.join("/")||"?"}, ${n===1?"seen once":n===2?"seen twice":"seen "+n+" times"}`;
  const auto=[];
  if(plan.approach) auto.push({key:"approach", text:plan.approach});
  const fp=f.filter(x=>x.balls===0&&x.strikes===0), rfp=r.filter(x=>x.balls===0&&x.strikes===0);
  if(fp.length>=MIN_ROW){ const t=topOf(mix(fp)); const st=rfp.filter(x=>isStrike(x.result)).length; auto.push({key:"first", text:`First pitch: ${t.type}, ${xofy(t.n,t.tot)}. ${st/rfp.length>=0.6?"He throws it for strikes. Be ready.":"He misses here. Make him throw a strike."}`}); }
  const two=f.filter(x=>x.strikes===2);
  if(two.length>=MIN_ROW){ const t=topOf(mix(two)); const hw=heightWord(two.filter(x=>x.type===t.type)); auto.push({key:"two", text:`Two strikes: ${t.type}, ${xofy(t.n,t.tot)}${hw?`, ${hw.split(",")[0]}`:""}. Shorten up and protect.`}); }
  const R=running(ps,d.evs), rv=runVerdict(R,popTime(d.games)), dl=dirtLine(ps);
  if(rv||dl) auto.push({key:"base", text:`On base: ${[rv,dl].filter(Boolean).join(" ")}`});
  const tR=f.filter(x=>x.hand==="R"&&x.strikes===2), tL=f.filter(x=>x.hand==="L"&&x.strikes===2);
  if(tR.length>=MIN_ROW && tL.length>=MIN_ROW){ const a=topOf(mix(tR)), b=topOf(mix(tL)); if(a.type!==b.type && a.share>=0.4 && b.share>=0.4){
    // A real split beats the blended number: replace the two-strike line with the per-side one.
    const i=auto.findIndex(x=>x.key==="two"); const line={key:"two", text:`Two strikes: righties get the ${a.type} (${xofy(a.n,a.tot)}), lefties get the ${b.type} (${xofy(b.n,b.tot)}). Shorten up and protect.`};
    if(i>=0) auto[i]=line; else auto.push(line); } }
  const c=p.card||{}; const hide=new Set(c.hide||[]); const extra=(c.extra||[]).map((t,i)=>({key:"x"+i, text:t, extra:true}));
  const ordered=[...auto.filter(x=>x.key==="approach"), ...extra, ...auto.filter(x=>x.key!=="approach")].filter(x=>!hide.has(x.key));
  // Only when the pitches gave nothing to say and the coach added nothing. Lines he hid stay hidden: that's his call.
  if(!auto.length && !extra.length) ordered.push({key:"thin", text:`Thin book: ${plural(r.length,"pitch","pitches")} charted on him. Not enough to call his patterns yet, so hunt your pitch and trust what you see.`});
  return {p, head, tells:p.tells||[], lines:ordered.slice(0,4), dropped:ordered.slice(4), hidden:auto.filter(x=>hide.has(x.key)), includeTells:!!c.includeTells, approved:plan.approved};
}
// The printed card is half a sheet. A long one prints in smaller type (k, from cardFit) so no line is cut off.
function cardHTML(C, ex, k){ return `<div class="hcard"${k&&k<1?` style="--k:${k}"`:""}><div class="hl">HITTER'S CARD${ex?" · EXAMPLE":""}${C.approved?"":" · DRAFT"}</div><h2>${esc(C.head)}</h2>${C.tells.length?`<div class="tl">Tell: ${C.tells.map(esc).join(" · ")}</div>`:""}<ul>${C.lines.map(x=>`<li>${x.key==="approach"?`<span class="appr">${esc(x.text)}</span>`:esc(x.text)}</li>`).join("")}</ul></div>`; }
// About how tall the printed card runs, in points. The half sheet gives it 340pt inside its padding; h keeps a little
// back. The sizes follow the print styles (17pt text, 26pt heading, 20pt team approach, 12pt label, each times k), and
// the width follows the page: letter paper, .32in margins, the body margin and .25in card padding leave 518pt.
// em is how wide an average letter is, measured in Chromium with Barlow and then padded about 10% for other fonts.
const CARD_PAPER = {h:334, w:518, ul:16.5, box:[18,12], gap:6, li:4.5, em:{text:.46, appr:.51, tell:.56, head:.5}, ks:[1,.92,.85,.78,.72,.66]};
function cardTall(C, k){
  const c=CARD_PAPER, lines=(t, pt, em, w)=>Math.max(1, Math.ceil(String(t).length*pt*em*1.06/w));   // 1.06: wrapping leaves some of each line empty
  let h = 12*k*1.3 + c.gap;                                              // HITTER'S CARD label
  h += lines(C.head, 26*k, c.em.head, c.w)*26*k + c.gap;                      // heading (line height 1)
  if(C.tells.length) h += lines("Tell: "+C.tells.join(" · "), 17*k, c.em.tell, c.w-c.box[0])*17*k*1.3 + c.box[1] + c.gap;
  C.lines.forEach((x,i)=>{ const ap=x.key==="approach", pt=(ap?20:17)*k; h += lines(x.text, pt, ap?c.em.appr:c.em.text, c.w-c.ul)*pt*1.3 + (i?c.li:0); });
  return h;
}
// The biggest type size that fits on the half sheet: {k, fits}. fits is false when even the smallest is too long.
function cardFit(C){ for(const k of CARD_PAPER.ks) if(cardTall(C,k)<=CARD_PAPER.h) return {k, fits:true}; return {k:CARD_PAPER.ks[CARD_PAPER.ks.length-1], fits:false}; }
function fitNote(F, C){
  if(!F.fits) return `<div class="flag" style="margin:6px 0"><span>Too long for the printed card, so the end gets cut off. Hide a line${C.tells.length?", or shorten his tells on the Teams tab":""}.</span></div>`;
  return F.k<1 ? `<p class="muted" style="margin:6px 0;font-size:13px">This card is long, so it prints in smaller type.</p>` : "";
}
function chatText(C, short){
  const team=C.p.team?C.p.team+" ":"";
  const lines=[`${team}${C.head}`]; if(C.includeTells && C.tells.length) lines.push("Tell: "+C.tells.join("; "));
  C.lines.forEach(x=>lines.push("- "+x.text));
  if(!short) return lines.join("\n");
  let out=lines[0]; for(const l of lines.slice(1)){ if((out+"\n"+l).length>280) break; out+="\n"+l; }
  return out.length>280?out.slice(0,277)+"...":out;
}
function cardView(pid, d){

      ${C.lines.map(x=>`<div class="row" style="margin-bottom:6px"><span style="flex:1;min-width:0">${esc(x.text)}</span>${x.key==="thin"?"":`<button class="btn small" data-cd-hide="${esc(x.key)}">${x.extra?"Remove":"Hide"}</button>`}</div>`).join("")}

      <form id="cd-add" class="row" style="margin-top:8px"><input type="text" id="cd-t" placeholder="Add your own line" style="flex:1;min-width:160px" maxlength="90"><button class="btn small" type="submit">Add</button></form>
      <h3 style="margin-top:16px">Copy for team chat</h3>
      <label class="checks"><label><input type="checkbox" id="cd-tells" ${C.includeTells?"checked":""}> Include tells <span class="muted">(off by default: a screenshot travels, and then the tell stops working)</span></label></label>

    </div></div>`;
}
function bindCard(el, pid, d){
  const p=()=>{ const x=ensurePitcher(P(pid)); x.card=x.card||{extra:[],hide:[]}; x.card.extra=x.card.extra||[]; x.card.hide=x.card.hide||[]; return x; };
  $$("[data-cd-hide]",el).forEach(b=>b.onclick=()=>{ const x=p(), k=b.dataset.cdHide; if(k[0]==="x") x.card.extra.splice(+k.slice(1),1); else x.card.hide.push(k); x.card.at=Date.now(); save(); renderReport(); });
  $$("[data-cd-show]",el).forEach(b=>b.onclick=()=>{ const x=p(); x.card.hide=x.card.hide.filter(k=>k!==b.dataset.cdShow); x.card.at=Date.now(); save(); renderReport(); });
  const f=$("#cd-add",el); if(f) f.onsubmit=e=>{ e.preventDefault(); const t=$("#cd-t",el).value.trim(); if(!t) return; const x=p(); x.card.extra.push(t); x.card.at=Date.now(); save(); renderReport(); };

function printButtons(){
  if(EMBEDDED) return `<p class="muted" style="margin:0;font-size:14px;max-width:640px">Printing is blocked inside the Claude viewer. Open Mound Book from its own web address (or the Home Screen icon) to print the report, the hitter's card, a blank chart or the charter sheet. Copy the card text works here.</p>`;

// What is on the print sheet, and which Report view it was made for. The sheet stays filled until printing is done,

// A print the app didn't start (Share > Print, or the browser's own Print) gets what the Report tab shows.

// Paper chart: the codes are the keyboard keys, so a night-of typing pass is digit then letter for every pitch.

  const hand=i=>lu.length&&i<lu.length*2?(lu[i%lu.length].hand||""):"";
  return `<div class="paper"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px"><b style="font-family:var(--f-display);font-size:18px;letter-spacing:.04em">MOUND BOOK PAPER CHART</b>

    <div style="font-size:10.5px;margin-bottom:4px">Each pitch is number + letter: <b>1C</b> = ${esc(ars[0]||"FB")} called strike, <b>0B</b> = not sure, ball. Time to plate goes in small numbers under the pitch. Pitching change: draw a line across and write the new #.</div>

function cheatSheet(){

/* ---------- same kid? ----------
   A rename, renumber or team change only edits his record: games point at his id, so nothing moves and two kids are never
   merged by accident. When his new details match another kid on file, the coach says whether it's the same kid:
   "Merge them" joins the two records (mergeInto), "Keep separate" keeps both. */
// Would a kid with these details be looked up as rec? Same team, and the same jersey number (or rec has no number yet and
// the same name). With no number, the same name.
function sameSlot(rec, team, num, name){
  if(slug(rec.team)!==slug(team)) return false;
  const n=normNum(num), nm=slug(name);
  if(n) return normNum(rec.num)===n || (!normNum(rec.num) && !!nm && slug(rec.name)===nm);
  return !!nm && slug(rec.name)===nm;
}
// Kids on file that his new details run into: they match now and didn't before. Kept separate once, they aren't asked about again.
function detailClashes(pid, f){
  const p=S.pitchers[pid]; if(!p) return [];
  const team=f.team!=null?f.team:p.team, num=f.num!=null?f.num:p.num, name=f.name!=null?f.name:p.name;
  if(!normNum(num) && !slug(name)) return [];
  return Object.values(S.pitchers).filter(x=>x && x.id!==pid && !x.mergedInto && !x.example===!p.example && !keptApart(p, x) && sameSlot(x, team, num, name) && !sameSlot(x, p.team, p.num, p.name));
}
// Same kid: src's games, notes and box-score lines join dst, and src's id leads to dst from now on (a later Send too).
// ch: what the coach changed in the form (name, number, hand), put on the kid who stays. One kid has one hand, so every
// game he pitched in reads that hand.
function mergeKids(src, dst, ch){
  if(src===dst || !S.pitchers[src] || !S.pitchers[dst]) return dst;
  ch=ch||{};
  mergeInto(src, dst);
  const d=S.pitchers[dst], r={};
  if(ch.name) r.name=ch.name;
  if(ch.num && !normNum(d.num)) r.num=ch.num;
  if(Object.keys(r).length) renamePitcher(dst, r);
  setPitcherHand(dst, ch.hand||d.hand);
  return dst;
}
const handWordP = h => h==="L" ? "throws left" : "throws right";
function seenWord(x){
  const n=pitcherData(x.id,null).ps.length, os=outingsOf(x.id);
  return n||os.length ? `${n} pitch${n===1?"":"es"} charted${os[0]?`, last out ${shortDate(os[0].date)} ${os[0].date.slice(0,4)}`:""}.` : "Nothing charted yet.";
}
// A "same kid?" sheet opens right under the finger that tapped Save. For a moment it ignores taps, so a double tap
// can't answer for the coach (a merge can't be split).
function settled(fn){ const t0=performance.now(); return e=>{ if(performance.now()-t0<450) return; fn(e); }; }
// Close the sheet without choosing (Cancel, or a tap outside it).
function onSheetCancel(m, fn){
  const ov=m.parentElement, x=$("[data-x]",m);
  if(x) x.addEventListener("click", fn);
  if(ov) ov.addEventListener("click", e=>{ if(e.target===ov) fn(); });
}
// Save new details for a kid on file: any of team, num, name, hand. Asks first when they run into another kid on file.
// o.filed(id): runs once his details are saved, before any merge (Needs a team files his old games here).
// o.done(id, merged): after saving, with the id he's filed under now. o.cancel(): the coach backed out; nothing changed.
function savePitcherDetails(pid, fields, o){
  o=o||{};
  const p=S.pitchers[pid]; if(!p) return;
  const f={}; ["team","num","name","hand"].forEach(k=>{ if(fields[k]!=null) f[k]=String(fields[k]).trim(); });
  if(f.num!=null) f.num=f.num.replace(/^#/,"");
  if(f.hand!=null && f.hand!=="L" && f.hand!=="R") delete f.hand;
  const ch={};   // what the coach changed
  if(f.name!=null && f.name && f.name!==p.name) ch.name=f.name;
  if(f.num!=null && normNum(f.num) && normNum(f.num)!==normNum(p.num)) ch.num=f.num;
  if(f.hand && f.hand!==p.hand) ch.hand=f.hand;
  const keep=()=>{
    const r={}; ["team","num","name"].forEach(k=>{ if(f[k]!=null) r[k]=f[k]; });
    renamePitcher(pid, r);
    if(f.hand) setPitcherHand(pid, f.hand);   // his record, and every game he pitched in reads it (switch hitters)
    if(o.filed) o.filed(pid);
    save(); if(o.done) o.done(pid, false);
  };
  const merge=dst=>{
    if(o.filed) o.filed(pid);
    const id=mergeKids(pid, dst, {name:ch.name, num:f.num!=null?f.num:p.num, hand:ch.hand});
    save(); if(o.done) o.done(id, true);
  };
  const clashes=detailClashes(pid, f);
  if(!clashes.length){ keep(); return; }
  const team=f.team!=null?f.team:p.team, num=f.num!=null?f.num:p.num, after={...p, ...f};
  const byNum=!!normNum(num) && clashes.every(x=>normNum(x.num)===normNum(num));
  const head=byNum ? `#${num} is already on file${team?" for "+team:""}` : `${pLabel(after)} may already be on file${team?" for "+team:""}`;
  const kept=x=>{ const name=ch.name||x.name||p.name; return `${pLabel({num:x.num||num, name})}, ${handWordP(ch.hand||x.hand)}`; };
  const likely=x=>!slug(x.name) || !slug(after.name) || slug(x.name)===slug(after.name);   // a name that differs: probably a new kid
  const one=clashes.length===1, moved=slug(team)!==slug(p.team), relabel=pLabel(after)!==pLabel(p);
  const doing=relabel ? `You're changing ${esc(pLabel(p))} to ${esc(pLabel(after))}${moved?` on ${esc(teamName(team))}`:""}.` : `You're moving ${esc(pLabel(p))} to ${esc(teamName(team))}.`;
  sheet(`<h3>${esc(head)}</h3>
    <p style="margin:0">${doing} ${one?"This kid is":"These kids are"} on file already:</p>
    ${clashes.map(x=>`<div class="flag" style="justify-content:space-between"><span><b>${esc(pLabel(x))}</b>, ${handWordP(x.hand)}. ${esc(seenWord(x))}<br><span class="muted" style="font-size:13px">If you merge, he stays on file as ${esc(kept(x))}.</span></span>${one?"":`<button type="button" class="btn small" data-merge="${esc(x.id)}">Same kid. Merge them</button>`}</div>`).join("")}
    <p class="muted" style="margin:0;font-size:14px">Same kid? Merge them. His games, pitch counts, notes and box-score lines go on one record. This can't be split later.</p>
    <p class="muted" style="margin:0;font-size:14px">A different kid? Keep them separate. Both stay on file.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn ${one&&!likely(clashes[0])?"primary":""}" data-keep>Keep separate</button>${one?`<button type="button" class="btn ${likely(clashes[0])?"primary":""}" data-merge="${esc(clashes[0].id)}">Merge them</button>`:""}</div>`,
    (m, close)=>{
      onSheetCancel(m, ()=>{ if(o.cancel) o.cancel(); });
      // Different kids: both records remember it, so no device joins them later as one kid filed twice.
      $("[data-keep]",m).onclick=settled(()=>{ close(); clashes.forEach(x=>setApart(pid, x.id)); keep(); });
      $$("[data-merge]",m).forEach(b=>b.onclick=settled(()=>{ close(); merge(b.dataset.merge); }));
    });
}
// Move kids to a team: a team rename, or a game's pitching team fixed. Each kid who runs into one on file there (same
// number) is shown as a pair, and the coach picks same kid (merge) or different kids (keep both) for each. It starts at
// different kids, since a merge can't be split. o.done(merged count) after saving; o.cancel() when he backs out.
function moveArmsToTeam(ids, team, o){
  o=o||{};
  const moving=[...new Set(ids.map(id=>resolvePid(id)))].map(id=>S.pitchers[id]).filter(Boolean), set=new Set(moving.map(p=>p.id));
  const pairs=[];
  moving.forEach(a=>Object.values(S.pitchers).forEach(x=>{
    if(!x || set.has(x.id) || x.mergedInto || !x.example!==!a.example) return;
    if(sameSlot(x, team, a.num, a.name) && !sameSlot(x, a.team, a.num, a.name) && !keptApart(a, x)) pairs.push({a:a.id, b:x.id});
  }));
  const go=pick=>{
    moving.forEach(p=>renamePitcher(p.id,{team}));
    let n=0;
    pairs.forEach((pr,i)=>{ if(!pick[i]){ setApart(pr.a, pr.b); return; } const s=resolvePid(pr.a), d=resolvePid(pr.b); if(s!==d && S.pitchers[s] && S.pitchers[d]){ mergeKids(s, d); n++; } });
    save(); if(o.done) o.done(n);
  };
  if(!pairs.length){ go([]); return; }
  const pick=pairs.map(()=>false);
  const lab=id=>{ const x=S.pitchers[id]; return `<b>${esc(pLabel(x))}</b> (${x.hand}HP, ${esc(teamName(x.team))})`; };
  sheet(`<h3>${pairs.length===1?"A number is":"Some numbers are"} already on file for ${esc(team)}</h3>
