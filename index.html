  return out;
}
// A title row: 2+ title words that make up at least 2/3 of it, and no number. A single letter (P, K, H, R, B, T) counts
// only next to another title word, so 'R Lee', 'K Jones 12' and 'Smith P' are rows.
function pasteHeadTokens(cells){
  const out=[];
  (cells||[]).forEach(c=>{ const s=String(c==null?"":c).trim(); if(!s) return; const w=pasteNorm(s);
    if(PASTE_WORDS.has(w)){ out.push(w); return; } s.split(/\s+/).forEach(t=>{ if(t) out.push(pasteNorm(t)); }); });
  for(let i=0;i<out.length-1;i++) if(out[i]==="pitch" && out[i+1]==="count") out.splice(i, 2, "pitch count");
  return out;
}
function isHeaderRow(cells){
  const t=pasteHeadTokens(cells); if(t.length<2 || t.some(x=>/^[#(]?\d+(\.\d+)?\)?$/.test(x))) return false;
  const one=x=>/^[a-z]$/.test(x), ok=t.map(x=>PASTE_WORDS.has(x) && !one(x));
  for(let more=true; more;){ more=false; t.forEach((x,i)=>{ if(!ok[i] && one(x) && PASTE_WORDS.has(x) && (ok[i-1] || ok[i+1])){ ok[i]=true; more=true; } }); }
  const n=ok.filter(Boolean).length; return n>=2 && n*3>=t.length*2;
}
// A section title: words ending in Pitching, Pitchers or Batting, or a plain wordy line just before a title row.
function pasteTitle(x, beforeHead, cells){
  let s=x.text.replace(/:\s*$/,"").trim();
  // 'Greene Co 3/10 Pitching': the date is left off.
  if(/(pitching|pitchers|batting)$/i.test(s)) s=s.replace(/(^|\s)\d{1,2}\/\d{1,2}(\/\d{2,4})?(?=\s|$)/g, " ").replace(/\s+/g, " ").trim();
  if(!s || /\d/.test(s) || s.length>60 || !/[a-z]/i.test(s)) return null;
  if(cells && cells.filter(Boolean).length>1) return null;
  if(/(pitching|pitchers|batting)$/i.test(s)) return s;
  return beforeHead && s.split(/\s+/).length<=6 ? s : null;
}
// RHP/LHP set the hand, a class goes to cls, and a P at the end is his position. None of them stays in the name.
function pasteTags(t, o){
  for(let i=t.length-1;i>=0;i--){ const h=/^(r|l)hp$/i.exec(t[i]); if(h){ if(!o.hand) o.hand=h[1].toUpperCase(); t.splice(i,1); } }
  for(let i=0;i<t.length;i++){ const c=pasteCls(t[i]); if(c){ if(!o.cls) o.cls=c; t.splice(i,1); i--; } }
  if(t.length>1 && /^p$/i.test(t[t.length-1])){ o.pos="P"; t.pop(); }
  return t;
}
// '#12', '(12)', 'No. 12' anywhere, or a 1-2 digit (or 00) first word with more after it: the number. Returns its index.
function pasteNum(t, o, lead){
  for(let i=0;i<t.length;i++){ const m=/^#(\d{1,2})$/.exec(t[i]) || /^\((\d{1,2})\)$/.exec(t[i]); if(m){ o.num=m[1]; t.splice(i,1); return; } }
  for(let i=0;i<t.length-1;i++) if(/^(no|num|#)$/i.test(t[i]) && pasteJersey(t[i+1])){ o.num=t[i+1]; t.splice(i,2); return; }
  if(pasteJersey(t[0]) && (lead || t.length>1)){ o.num=t[0]; t.splice(0,1); }
}
// A name cell: 'J Smith #12', 'Smith (12)', '12 Smith', '7' (just the number), with class, hand and position left out.
function pasteNameCell(s){
  const o={num:"", name:"", cls:"", hand:"", pos:""};
  let t=String(s||"").split(/\s+/).map(pasteTok).filter(x=>/[a-z0-9#]/i.test(x));
  pasteNum(t, o, t.length===1); t=pasteTags(t, o);
  o.name=t.filter(x=>/[a-z]/i.test(x)).join(" "); return o;
}
// A typed line: number, name, count. The count is the last number after the number; a second one means it isn't a
// pitching line ('12 Smith 5.0 4 2 2 1 6'). Pitches-strikes ('87-55', '87 - 55', '87/55') and '87p' or '87 pitches' read 87.
function pasteTyped(s){
  const o={num:"", name:"", pitches:null, cls:"", hand:"", pos:"", why:""};
  s=String(s||"").replace(/(\d{1,3})\s*[-–—\/]\s*\d{1,3}(?!\d)/g, "$1");
  let t=s.split(/[\s,]+/).map(pasteTok).filter(x=>/[a-z0-9#]/i.test(x));
  pasteNum(t, o, false);
  const nums=[];
  t.forEach((x, i)=>{ let m;
    if((m=/^(\d{1,3})p$/i.exec(x))) nums.push({i, n:+m[1], mark:true});
    else if(/^\d+$/.test(x)) nums.push({i, n:+x, mark:/^(pitches|pitch|pc|np|#p)$/i.test(t[i+1]||""), word:/^(pitches|pitch|pc|np|#p)$/i.test(t[i+1]||"")});
    else if(/^\d*\.\d+$/.test(x)) nums.push({i, n:null, dec:true}); });
  const marked=nums.filter(x=>x.mark);
  let pick=marked.length ? marked[marked.length-1] : null;
  if(!pick){
    if(nums.length>1){ o.why=PASTE_TOO_MANY; return o; }
    if(nums.length===1 && nums[0].dec){ o.why="Pitches are a whole number. Type it like 12 Smith 87."; return o; }
    pick=nums[0]||null;
  }
  if(pick){ o.pitches=pick.n; t.splice(pick.i, pick.word ? 2 : 1); }
  t=pasteTags(t, o);
  o.name=t.filter(x=>/[a-z]/i.test(x)).join(" ");
  return o;
}
// A row into a section, or a skipped line with why.
function pasteAdd(sec, x, r, ctx){
  const skip=why=>{ sec.skipped.push({line:x.line, raw:x.raw, why}); return null; };
  if(r.why) return skip(r.why);
  if(/^(team\s+)?totals?$/i.test(r.name||"")) return skip("Team totals.");
  if(!r.num && !r.name) return skip("No number or name.");
  if(r.pitches!=null && r.pitches>200) return skip("Over 200. Check it.");
  const row={line:x.line, raw:x.raw, num:r.num||"", name:r.name||"", pitches:r.pitches==null ? null : r.pitches, cls:r.cls||"", hand:r.hand||"", pos:r.pos||"", warn:[], err:""};
  if(row.pitches===0){ row.pitches=null; row.warn.push("0 pitches isn't saved as an outing. Check the book if he took the mound."); }
  // Over the max: the warning, the table's rest when the table came along (ctx.table: its top band), and the book.
  const T=ctx && ctx.table && ctx.table.bands ? ctx.table : null, max=+(ctx && ctx.max)||(T ? +T.max : 0)||0;
  if(row.pitches!=null && max>0 && row.pitches>max) row.warn.push(`${T && +T.max===max ? overMaxText(T, row.pitches) : `Over the ${max} max.`} Check the book.`);
  sec.rows.push(row); return row;
}
// The same number twice in one section: an error on both when the names match or one is blank, else both kept with a warning.
function pasteTwins(sec){
  const last=n=>{ const w=String(n||"").toLowerCase().split(/[\s.]+/).filter(Boolean); return w.length ? w[w.length-1] : ""; }, by={};
  sec.rows.forEach(r=>{ if(r.num) (by[r.num]=by[r.num]||[]).push(r); });
  Object.values(by).forEach(rs=>{ if(rs.length<2) return;
    for(let i=0;i<rs.length;i++) for(let j=i+1;j<rs.length;j++){ const a=rs[i], b=rs[j], la=last(a.name), lb=last(b.name);
      if(!la || !lb || la===lb) a.err=b.err=`#${a.num} is on two lines. Fix one.`; }
    rs.forEach(r=>{ const w=`Two #${r.num}s. Check which one is theirs.`; if(!r.err && !r.warn.includes(w)) r.warn.push(w); }); });

function pasteDone(out, data, many){
  out.sections.forEach(pasteTwins); out.sections=out.sections.filter(s=>s.rows.length || s.skipped.length);
  out.wholeBox=data>0 && many*2>data; return out;
}
// The kind of a table column, from its title.
function pasteColKind(c){
  const w=pasteNorm(c);

  if(["name","player","pitcher","pitchers","player name","pitching"].includes(w)) return "name";
  if(["first","first name"].includes(w)) return "first";
  if(["last","last name"].includes(w)) return "last";
  const cnt={"np":1,"#p":1,"pc":2,"pitches":3,"pitch count":3,"pitch-count":3,"#pitches":3,"total pitches":3,"tp":4,"pitches-strikes":5,"p-s":5,"p":6}[w];
  if(cnt) return "count"+cnt;
  if(["throws","t","hand","throw"].includes(w)) return "throws";
  if(w==="b/t") return "bt";
  if(["bats","b","bat"].includes(w)) return "bats";
  if(["class","yr","grade","year","grad"].includes(w)) return "cls";
  if(["pos","position"].includes(w)) return "pos";
  return PASTE_WORDS.has(w) ? "stat" : "?";
}
// A title row's columns. lead: empty tab cells in front (rows lose as many). A team name heading the name column titles
// the section ('CENTRAL  IP  H ... NP').
function pasteHead(cells){
  let lead=0; while(lead<cells.length && !String(cells[lead]).trim()) lead++;
  const c=cells.slice(lead); while(c.length && !String(c[c.length-1]).trim()) c.pop();
  if(!isHeaderRow(c)) return null;
  const cols=c.map(pasteColKind); let title="";
  if(cols[0]==="?" && !cols.some(k=>k==="name" || k==="first" || k==="last")){ cols[0]="name"; title=String(c[0]).trim(); }
  return {lead, cols, title};

function pasteTableHead(cells){
  const h=pasteHead(cells); if(!h) return null;
  let count=-1, best=99; h.cols.forEach((k,i)=>{ const m=/^count(\d)$/.exec(k); if(m && +m[1]<best){ best=+m[1]; count=i; } });
  if(count<0 || !h.cols.some(k=>["num","name","first","last"].includes(k))) return null;

// A row by its columns. Spaces: the name takes the extra words, columns after it line up from the end. Fewer words than

function pasteTableRow(x, T, tabs){

  const get=k=>{ const i=T.cols.indexOf(k); return i>=0 && i<cells.length ? String(cells[i]||"").trim() : ""; };
  let nm=get("name"); if(!nm) nm=[get("first"), get("last")].filter(Boolean).join(" ");
  const o={...pasteNameCell(nm), pitches:null, why:""};
  const nn=get("num").replace(/^#/,""); if(pasteJersey(nn)) o.num=nn;

// Take over: this device charts the game from here on, and the other one switches to watching.
// The game is looked up when tapped, not taken from when the button was drawn: the confirm can sit open while pitches come in.
function bindTakeover(el, g){
  const id=g.id;
  $$('[data-act="takeover"]', el).forEach(b=>b.onclick=async()=>{
    const now=S.games.find(x=>x.id===id && !x.conflictOf)||g;
    if(!confirm(`Take over charting this game here? ${Sync.devName(Sync.writerOf(now))} will switch to watching.`)) return;
    b.disabled=true; const ok=await Sync.takeOver(id); if(!ok) b.disabled=false;
  });
}

// Before a game: is this device ready? Games saved here, the last Send, games not sent, saving, and the Home Screen.
function pregameHTML(){
  const st=deviceStatus(), items=[];
  items.push([true, `${st.games} game${st.games===1?"":"s"} saved on this device`]);
  items.push([true, st.lastSent ? `Last sent to Coach ${whenText(st.lastSent)}` : "Nothing sent to Coach from here yet"]);
  items.push([!st.unsent, st.unsent ? `${st.unsent} game${st.unsent===1?"":"s"} not sent to Coach` : "Every game is sent"]);
  items.push([st.saving, st.saving ? (st.saveMode==="idb" ? "Saving works" : "Saving works (browser storage only)") : "NOT SAVING"]);
  if(st.sync) items.push([true, st.sync]);
  items.push([st.standalone, st.standalone ? "Running from the Home Screen" : st.embedded ? "Preview only" : "Not on the Home Screen"]);
  const tip = st.standalone ? "" : st.embedded ? "For a real game, open Mound Book from its own web address and add it to the Home Screen."
    : "Add it to the Home Screen before the game: in Safari tap Share, then Add to Home Screen, and chart from that icon.";
  return `<div class="pregame" role="status" aria-label="Ready to chart?"><ul>${items.map(([ok,t])=>`<li class="${ok?"ok":"warn"}">${esc(t)}</li>`).join("")}</ul>${tip?`<p>${esc(tip)}</p>`:""}</div>`;
}

let watchTimer=null;
// Time to the plate runs about 1.0 to 1.8 seconds. Anything outside 0.9 to 2.5 was a missed stop or a stray tap, so it isn't saved.
const TTP_MIN=0.9, TTP_MAX=2.5;
function stopWatch(){ ui.watchStart=null; clearInterval(watchTimer); watchTimer=null; }
function toggleWatch(){
  if(ui.watchStart){ const s=Math.round((performance.now()-ui.watchStart)/10)/100; stopWatch();
    if(s<TTP_MIN || s>TTP_MAX){ ui.ttp=null; toast(`${s.toFixed(2)} seconds isn't a time to the plate. Not saved.`); } else ui.ttp=s;
    renderChart(); }
  else { stopWatch(); ui.watchStart=performance.now(); ui.ttp=null; renderChart(); watchTimer=setInterval(()=>{ const t=$("#watch-t"); if(t&&ui.watchStart) t.textContent=((performance.now()-ui.watchStart)/1000).toFixed(2); },30); }
}
// A second tap on the same button within a blink (a bounced finger or a double tap) is dropped.
function bounced(key, ms){ const now=performance.now(), b=ui.lastTapKey; if(b && b.k===key && now-b.t<(ms||350)) return true; ui.lastTapKey={k:key, t:now}; return false; }
function clean(o){ for(const k in o) if(o[k]===undefined||o[k]===null||o[k]===false||o[k]==="") delete o[k]; return o; }
function commitPitch(g, o){
  if(ui.watchStart) stopWatch();   // never stopped at the mitt: that time is no good, so it doesn't go on this pitch
  const L0=replay(g).live, legalD3=isLegalD3(L0), before=L0.paNo;
  const e=entry("pitch", clean(Object.assign({type:ui.type||"UN", ttp:ui.ttp==null?undefined:ui.ttp}, o)), dev());
  if(!isCharter()){ if(S.settings.loc==="height" && ui.h && !e.h) e.h=ui.h; if(S.settings.loc==="zone" && ui.zone) e.zone=ui.zone; }
  if(e.dirt) e.h="D";
  const done=act(g,[e]);
  ui.type=null; ui.undoType=null; ui.h=null; ui.zone=null; ui.ttp=null;
  if(!done){ renderChart(); return; }
  g=editTarget(g)||g;
  const R=replay(g); const p=R.pitches[R.pitches.length-1];
  ui.pulseHand = R.live.paNo!==before && !R.live.lineup.length;
  renderChart();
  const lab=`${pname(p.type)} · ${resLabel(p)}`;
  if(p.pa==="K" && e.result!=="BF" && legalD3) toast(`${lab}: strikeout`, {action:"He reached (dropped 3rd)", ms:5000, fn:()=>{ if(change(g, x=>{ const y=x.log.find(z=>z.id===e.id); if(y){ y.d3=true; markEdited(y); } touch(x,dev()); })) toast("Dropped 3rd: batter on first"); renderChart(); }});
  else toast(p.pa ? `${lab}: ${paLabel(p.pa)}` : `${lab} · now ${R.live.balls}-${R.live.strikes}`);
}
function addEvent(g, kind, base, extra){ if(!act(g,[entry("ev", clean(Object.assign({kind, base}, extra||{})), dev())])){ renderChart(); return; } const R=replay(editTarget(g)||g); const x=R.events[R.events.length-1]; renderChart(); toast(evLabel(x)); }
// Tapping a pitch type picks it, and tapping it again clears it. Right after Undo the undone pitch's type is picked already,
// so the charter's habit (type, then result) keeps it picked for that one tap instead of clearing it.
function tapType(c){ const keep=!!ui.undoType && ui.undoType===ui.type && ui.type===c; ui.undoType=null; if(!keep) ui.type = ui.type===c ? null : c; }
function undoAction(g){
  if(!editTarget(g)){ toast(`Charting for this game moved to ${Sync.devName(Sync.writerOf(g))}. Nothing was undone here.`, {ms:5000}); renderChart(); return; }
  g=editTarget(g);
  const last=g.log[g.log.length-1]; if(!last) return;
  const grp=last.grp; let x=null, n=0;
  do { x=undoLast(g, dev()); if(x) n++; } while(x && grp && g.log.length && g.log[g.log.length-1].grp===grp);
  if(!x){ toast("Nothing to undo"); return; }
  saveGame(g);
  if(x.k==="pitch" && !x.est){ ui.type=x.type!=="UN"?x.type:null; ui.undoType=ui.type; ui.h=x.h||null; ui.zone=x.zone||null; ui.ttp=x.ttp||null; toast(`Removed ${pname(x.type)} · ${resLabel(x)}`); }
  else toast(n>1?`Removed ${n} entries`:x.k==="ev"?`Removed ${evLabel(x)}`:x.k==="pitcher"?"Removed the pitching change":x.k==="adj"?"Removed a fix":"Removed");
  renderChart();
}
function bindChart(el, g, R){
  const L=R.live;
  const on=(sel,fn)=>$$(sel,el).forEach(b=>b.onclick=()=>fn(b));
  on("[data-type]", b=>{ if(bounced("type:"+b.dataset.type)) return; tapType(b.dataset.type); renderChart(); });
  on("[data-h]", b=>{ ui.h = ui.h===b.dataset.h?null:b.dataset.h; renderChart(); });
  $$(".zsel .zc",el).forEach(r=>bindTap(r, ()=>{ const z=+r.dataset.z; ui.zone=ui.zone===z?null:z; renderChart(); }));
  on("[data-hand]", b=>{ ui.pulseHand=false; if(L.hand!==b.dataset.hand) fixState(g,{hand:b.dataset.hand},"side"); else renderChart(); });
  $$("[data-base]",el).forEach(b=>bindTap(b, ()=>{ const k=b.dataset.base; fixState(g,{[k]:!L[k]},"runner"); }));
  on("[data-dot]", b=>{ if(b.dataset.dot==="o") outsSheet(g); else missedSheet(g); });
  const bat=$("#batter",el);
  if(bat){
    // Saved without redrawing: "change" fires on the blur caused by the next tap, and redrawing here would throw that tap away.
    // The field already shows the name; whatever the next tap does redraws the chart from the log.
    bat.onchange=()=>act(g,[entry("adj",{batter:bat.value.trim(), why:"batter", ...(ownNames(g)&&bat.value.trim()?{own:true}:{})},dev())]);
    bat.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); bat.blur(); } };
  }
  on("[data-res]", b=>{
    const r=b.dataset.res;
    if(bounced("res:"+r)) return;   // the same result twice in a blink is a bounced or double tap, not two pitches
    if(r==="IP") return inPlaySheet(g);
    if(r==="MORE") return moreSheet(g);
    if(r==="BD") return commitPitch(g,{result:"B", dirt:true});
    commitPitch(g,{result:r});
  });
  on("[data-pk]", b=>addEvent(g,"PK",+b.dataset.pk));
  // The note goes on his saved record (a stub when his record hasn't reached this device yet: sync joins it to the real one).
  // A note naming one of our players asks first, as on the Teams tab: it goes to the team book.
  const nf=$("#note-f",el); if(nf) nf.onsubmit=e=>{ e.preventDefault(); const t=$("#note-t",el).value.trim(), pid=L.pitcher; if(!t || !pid) return;
    namesCheck([["note-t", t]], ()=>{ const pp=ensurePitcher(P(pid)); (pp.notes=pp.notes||[]).push({t:Date.now(), by:S.settings.lastInitials||"", text:t}); save(); renderChart(); toast("Note added"); }); };
  on("[data-act]", b=>{
    const a=b.dataset.act;
    // A bounced tap must not undo twice, flag and unflag, or start and stop the watch. The steppers count each tap.
    if(!/^(inn|bat)[-+]$/.test(a) && bounced("act:"+a)) return;
    if(a==="inn-") fixState(g,{inning:Math.max(1,L.inning-1)},"inning");
    if(a==="inn+") fixState(g,{inning:L.inning+1, outs:0, r1:false, r2:false, r3:false, balls:0, strikes:0},"inning");
    // ‹ / › fix who is up: same count, same at-bat. If his at-bat really ended, the toast takes it back and opens Missed pitches.
    if(a==="bat-"||a==="bat+"){ const n=L.lineup.length; const e=fixState(g,{spot:((L.spot==null?0:L.spot)+(a==="bat+"?1:-1)+n)%n},"batter");
      if(!e) return;   // kept aside: that toast says so
      if(L.pop>1 && a==="bat+") toast(`Same at-bat, count stays ${L.balls}-${L.strikes}.`, {action:"His at-bat ended", ms:5000, fn:()=>{ const t=editTarget(g); if(!t || !e){ renderChart(); return; } if(t.log[t.log.length-1]===e){ undoLast(t,dev()); saveGame(t); } renderChart(); missedSheet(t,{mode:"ended"}); }});
      else if(L.pop>1) toast(`Same at-bat, count stays ${L.balls}-${L.strikes}.`); }
    if(a==="undo") undoAction(g);
    if(a==="missed") missedSheet(g);
    if(a==="book") officialSheet(g);
    if(a==="official") officialCountsSheet(g);
    if(a==="newgame") gameSheet(null);
    if(a==="editgame") gameSheet(g);
    if(a==="lineup") lineupSheet(g);
    if(a==="sub") subSheet(g);
    if(a==="changep") pitcherSheet(g,"change");
    if(a==="arsenal") pitcherSheet(g,"edit");
    if(a==="addtype") addTypeSheet(g);
    if(a==="runsheet") runSheet(g);
    if(a==="watch") toggleWatch();
    if(a==="ttpclear"){ ui.ttp=null; renderChart(); }
    if(a==="retype") retypeSheet(g);
    if(a==="star"){ const e=lastPitchEntry(g); if(e){ const on=!e.star; if(change(g, x=>{ const y=x.log.find(z=>z.id===e.id); if(y){ if(on) y.star=true; else delete y.star; markEdited(y); } touch(x,dev()); })) toast(on?"Flagged for Coach":"Flag removed"); renderChart(); } }
    if(a==="told"){ const dug=dugoutLines(R.pitches.filter(x=>x.pitcher===L.pitcher)); const k=g.id+"|"+dug.join("|"); ui.told[k]=!ui.told[k]; renderChart(); }
    if(a==="end") endSheet(g);
    if(a==="reopen"){ change(g, x=>setGameInfo(x,{endedAt:null, endReason:null},dev())); renderChart(); }
    if(a==="sendone") sendSheet([g]);
    if(a==="game2") game2Sheet(g);
    if(a==="pop") popSheet(g, "warm");
    if(a==="box"){ S.settings.box=true; save(); renderChart(); }
  });
}

/* ---------- chart sheets ---------- */
function inPlaySheet(g){
  const L=replay(g).live; let res=null, hh=false, ra=null, outs=null;
  const draw=()=>{
    const guess = res ? guessRunners(L,res) : null;
    const st = ra || guess;
    const o = outs!=null ? outs : guess ? guess.outs : 0;
    sheet(`<h3>Ball in play · ${pname(ui.type||"UN")}</h3>
    <div class="opts">${IP_RESULTS.map(([k,l],i)=>`<button class="opt" data-ip="${k}" aria-pressed="${res===k}"><kbd>${i+1}</kbd>${l}</button>`).join("")}</div>
    <div class="opts"><button class="opt" data-hh aria-pressed="${hh}"><kbd>K</kbd>Hit hard</button></div>
    ${res?`<div class="row" style="align-items:flex-start;gap:16px"><div><div class="label">Runners after the play</div>${diamondSVG(st,"big")}<div class="muted" style="font-size:12.5px">Tap a base if it's wrong.</div></div>
      <div><div class="label">Outs on the play</div><div class="stepper"><button class="step" data-o="-1" aria-label="Fewer outs">−</button><b>${o}</b><button class="step" data-o="1" aria-label="More outs">+</button></div></div></div>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok ${res?"":"disabled"}>Record <kbd>⏎</kbd></button></div>`, (m, close)=>{
      $$("[data-ip]",m).forEach(b=>b.onclick=()=>{ res=b.dataset.ip; ra=null; outs=null; draw(); });
      $("[data-hh]",m).onclick=()=>{ hh=!hh; draw(); };
      $$("[data-base]",m).forEach(b=>bindTap(b,()=>{ const cur=ra||{r1:guess.r1,r2:guess.r2,r3:guess.r3}; ra={...cur, [b.dataset.base]:!cur[b.dataset.base]}; draw(); }));
      $$("[data-o]",m).forEach(b=>b.onclick=()=>{ outs=Math.max(0,Math.min(3,o+(+b.dataset.o))); draw(); });
      const ok=()=>{ close(); const fix = (ra || outs!=null) ? {r1:!!st.r1, r2:!!st.r2, r3:!!st.r3, outs:o} : undefined; commitPitch(g,{result:"IP", ip:res, hh:hh||undefined, ra:fix}); };
      $("[data-ok]",m).onclick=ok;
      ui.keyHandler = k => { if(/^[1-9]$/.test(k)){ res=IP_RESULTS[+k-1][0]; ra=null; outs=null; draw(); return true; } if(k==="Enter"&&res){ ok(); return true; } if(k.toLowerCase()==="k"){ hh=!hh; draw(); return true; } return false; };
    });
  };
  draw();
}
function moreSheet(g){
  const L=replay(g).live, empty=!L.r1&&!L.r2&&!L.r3;
  sheet(`<h3>More</h3><div class="opts">
    <button class="opt" data-m="BF"><kbd>N</kbd>Foul bunt<br><small>strike 3 with 2 strikes</small></button>
    <button class="opt" data-m="IBB"><kbd>I</kbd>Intentional walk<br><small>no pitch</small></button>
    <button class="opt" data-m="CI">Catcher's interference<br><small>batter to 1st</small></button>
    <button class="opt" data-m="${empty?"ILL":"BK"}">Illegal pitch<br><small>${empty?"bases empty: adds a ball":"runners on: it's a balk"}</small></button></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Close</button></div>`, (m, close)=>{
      $$("[data-m]",m).forEach(b=>b.onclick=()=>{ close(); const k=b.dataset.m; if(k==="IBB"){ addEvent(g,"IBB"); ui.pulseHand=!replay(g).live.lineup.length; } else if(k==="BK") addEvent(g,"BK"); else commitPitch(g,{result:k}); });
    });
}
function runSheet(g){
  const L=replay(g).live; let pop="";
  sheet(`<h3>Runners</h3>
    <div class="label">Stolen base</div><div class="opts">${[1,2,3].map(b=>`<button class="opt" data-ev="SB" data-b="${b}" ${L["r"+b]?"":'aria-pressed="false"'}>${b===3?"Steals home":"Steals "+BASE[b+1]}${L["r"+b]?"":"<br><small>nobody there now</small>"}</button>`).join("")}</div>

    <div class="cb-l"><div class="cb-blk cb-o1">${line}</div>${thisCount}${pitcher}${todayB}</div>

function entryText(e){

    case "adj": { const parts=[]; if(e.inning!=null) parts.push("inning "+e.inning); if(e.outs!=null) parts.push(e.outs+" out"+(e.outs===1?"":"s")); ["r1","r2","r3"].forEach((r,i)=>{ if(e[r]!=null) parts.push((e[r]?"runner on ":"nobody on ")+BASE[i+1]); }); if(e.balls!=null||e.strikes!=null) parts.push(`count ${e.balls!=null?e.balls:"?"}-${e.strikes!=null?e.strikes:"?"}`); if(e.hand) parts.push("bats "+e.hand); if(e.spot!=null) parts.push("spot "+(e.spot+1)+" up"); if(e.batter!=null) parts.push("batter "+(e.batter||"(blank)")); return "Fix: "+(parts.join(", ")||"(nothing)")+(e.why?` · ${e.why}`:""); }
    case "lineup": return `New lineup (${(e.lineup||[]).length} spots)`;
    case "sub": return `Sub: ${batterText(e.player)} into spot ${e.spot+1}`;
    case "book": return `Official count from the book: ${e.n}`;
    case "ev": return evLabel(e);

  }
}

function insertSheet(g, idx){
  const at=g.log[idx] && g.log[idx].id;   // the entry it goes in front of, found again when saved
  const before={...g, log:g.log.slice(0,idx), rev:-1-idx};
  const L=replay(before).live; let kind="pitch", type="UN", result="B", ip="OUT", est=false, ev="PK", base=1;
  const draw=()=>sheet(`<h3>Insert before entry ${idx+1}</h3><p class="muted" style="margin:0;font-size:14px">At that point: inning ${L.inning}, ${L.outs} out${L.outs===1?"":"s"}, ${L.balls}-${L.strikes}, ${esc(L.batter||"batter")}.</p>
    <div class="seg">${[["pitch","A pitch"],["missed","A missed pitch"],["ev","A play"],["pitcher","Pitching change"]].map(([k,l])=>`<button data-kind="${k}" aria-pressed="${kind===k}">${l}</button>`).join("")}</div>
    ${kind==="pitch"?`<div class="types">${arsenalFor(g,L.pitcher).map(c=>`<button class="type" style="${pcStyle(c)}" data-t="${esc(c)}" aria-pressed="${type===c}"><b>${pname(c)}</b></button>`).join("")}</div>
      <div class="row"><select id="in-r">${["B","CS","SS","F","BF","IP","HBP","CI","ILL"].map(r=>`<option value="${r}" ${r===result?"selected":""}>${RESULTS[r].label}</option>`).join("")}</select>${result==="IP"?`<select id="in-ip">${IP_RESULTS.map(([k,l])=>`<option value="${k}" ${k===ip?"selected":""}>${l}</option>`).join("")}</select>`:""}</div>`:""}
    ${kind==="missed"?`<p style="margin:0">One "?" pitch marked estimated. It counts toward the pitch count and batters faced only.</p><select id="in-r">${["B","CS","SS","F","IP","UNK"].map(r=>`<option value="${r}" ${r===result?"selected":""}>${r==="UNK"?"Don't know the result":RESULTS[r].label}</option>`).join("")}</select>`:""}
    ${kind==="ev"?`<div class="row"><select id="in-ev">${Object.keys(EVENTS).map(k=>`<option value="${k}" ${k===ev?"selected":""}>${EVENTS[k]}</option>`).join("")}</select><select id="in-b">${[1,2,3].map(b=>`<option value="${b}" ${b===base?"selected":""}>runner from ${BASE[b]}</option>`).join("")}</select></div>`:""}
    ${kind==="pitcher"?pitcherFields(g.pTeam,null):""}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Insert</button></div>`, (m, close)=>{
      const keep=()=>{ const r=$("#in-r",m); if(r) result=r.value; const i=$("#in-ip",m); if(i) ip=i.value; const e=$("#in-ev",m); if(e) ev=e.value; const b=$("#in-b",m); if(b) base=+b.value; };
      $$("[data-kind]",m).forEach(b=>b.onclick=()=>{ keep(); kind=b.dataset.kind; if(kind==="missed") result="UNK"; else if(result==="UNK") result="B"; draw(); });
      $$("[data-t]",m).forEach(b=>b.onclick=()=>{ keep(); type=b.dataset.t; draw(); });
      const r=$("#in-r",m); if(r) r.onchange=()=>{ keep(); draw(); };
      if(kind==="pitcher") bindPitcherFields(m, {game:g});   // a typed number finds the kid the same way the save does
      $("[data-ok]",m).onclick=()=>{ keep(); let e;
        if(!L.pitcher && kind!=="pitcher"){ toast("Pick a row after the starting pitcher."); return; }

// Where the runners ended up, and how many outs, on one ball in play. Prefilled with what was set by hand, or the usual guess.
function raSheet(g, i, note){
  const e=g.log[i]; const d=replay(g).pitches.find(p=>p.idx===i); if(!e || !d || e.result!=="IP") return;
  const guess=guessRunners({r1:d.r1, r2:d.r2, r3:d.r3}, e.ip||"OUT");
  let st=e.ra?{r1:!!e.ra.r1, r2:!!e.ra.r2, r3:!!e.ra.r3}:{r1:guess.r1, r2:guess.r2, r3:guess.r3};
  let outs=e.ra&&e.ra.outs!=null?e.ra.outs:guess.outs;
  const on=x=>[x.r1?"1st":"",x.r2?"2nd":"",x.r3?"3rd":""].filter(Boolean).join(", ")||"nobody on";
  const done=(fn, msg)=>{ if(change(g, x=>{ const y=x.log.find(z=>z.id===e.id); if(y){ fn(y); markEdited(y); } touch(x,dev()); })) toast(msg); renderLog(); };
  const draw=()=>sheet(`<h3>Runners and outs: ${esc(paLabel(e.ip||"OUT"))}</h3>
    ${note?`<p style="margin:0;font-size:14px">${esc(note)}</p>`:""}
    <p class="muted" style="margin:0;font-size:14px">Before the play: ${d.outs} out${d.outs===1?"":"s"}, ${on(d)}. The usual guess: ${on(guess)}, ${guess.outs} out${guess.outs===1?"":"s"} on the play.</p>
    <div class="row" style="align-items:flex-start;gap:16px"><div><div class="label">Runners after the play</div>${diamondSVG(st,"big")}<div class="muted" style="font-size:12.5px">Tap a base to change it.</div></div>
      <div><div class="label">Outs on the play</div><div class="stepper"><button class="step" data-o="-1" aria-label="Fewer outs">−</button><b>${outs}</b><button class="step" data-o="1" aria-label="More outs">+</button></div></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button>${e.ra?`<button class="btn" data-guess>Use the usual guess</button>`:""}<button class="btn primary" data-ok>Save</button></div>`, (m, close)=>{
      $$("[data-base]",m).forEach(b=>bindTap(b,()=>{ st={...st, [b.dataset.base]:!st[b.dataset.base]}; draw(); }));
      $$("[data-o]",m).forEach(b=>b.onclick=()=>{ outs=Math.max(0,Math.min(3,outs+(+b.dataset.o))); draw(); });
      const gu=$("[data-guess]",m); if(gu) gu.onclick=()=>{ close(); done(y=>{ delete y.ra; }, "Back to the usual guess. Everything after it replayed."); };
      $("[data-ok]",m).onclick=()=>{ close(); const ra={r1:!!st.r1, r2:!!st.r2, r3:!!st.r3, outs}; done(y=>{ y.ra=ra; }, "Saved. Everything after it replayed."); };
    });
  draw();
}

function reportMeta(pid, d){

      <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn" data-save>Save as draft</button><button class="btn primary" data-appr>Save and approve</button></div>`, (m, close)=>{
        // The plan rides on his record to the team book, and its lines go into the card and the staff sheet's Copy. Words
        // that name one of our players ask first, right in the sheet: a second tap on the same button saves them, and any
        // edit takes the question away.
        let ask=null;
        const flag=$("#pl-flag",m), clear=()=>{ ask=null; flag.innerHTML=""; };
        $$("#pl-a, #pl-R, #pl-L",m).forEach(f=>f.addEventListener("input", clear));
        const put=appr=>{ const a=$("#pl-a",m).value.trim(), R=$("#pl-R",m).value.trim(), L=$("#pl-L",m).value.trim();
          const hits=[...new Set([a, R, L].flatMap(t=>namesInText(t)))], key=appr ? "appr" : "save";
          if(hits.length && !(ask && ask.key===key && performance.now()-ask.at>=450)){
            if(!(ask && ask.key===key)) ask={key, at:performance.now()};
            flag.innerHTML=`<div class="flag" role="alert"><span>This names one of our players (${esc(hits.join(", "))}). It goes to the team book. Keep it? Tap ${appr ? "Save and approve" : "Save as draft"} again to keep it.</span></div>`; return; }
          p.plan.R={text:R, at:Date.now()}; p.plan.L={text:L, at:Date.now()}; p.plan.approach=a; p.plan.approved=appr?{at:Date.now(), by}:null; p.plan.at=Date.now(); save(); close(); renderReport(); toast(appr?"Plan approved":"Saved as a draft"); };
        $("[data-save]",m).onclick=()=>put(false); $("[data-appr]",m).onclick=()=>put(true);
      });
    return;
  }
  if(a==="rebuild"){
    const dr=now.draft;
    sheet(`<h3>Rebuild from data</h3><p class="muted" style="margin:0;font-size:14px">Yours on the left, a fresh draft from the pitches now included on the right. Keep one for each side.</p>
      ${["R","L"].map(h=>`<div class="label">vs ${h==="R"?"righties":"lefties"}</div><div class="side-by-side"><div class="panel"><b>Yours</b><ul>${now[h].map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="btn small" data-keep="${h}" aria-pressed="true">Keep mine</button></div><div class="panel"><b>New draft</b><ul>${dr[h].map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="btn small" data-use="${h}">Use new draft</button></div></div>`).join("")}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Done</button></div>`, (m, close)=>{
        $$("[data-use]",m).forEach(b=>b.onclick=()=>{ const h=b.dataset.use; p.plan[h]={text:dr[h].join("\n"), at:Date.now()}; p.plan.approved=null; p.plan.at=Date.now(); save(); b.textContent="Using new draft ✓"; b.disabled=true; renderReport(); });
        $$("[data-keep]",m).forEach(b=>b.onclick=()=>{ b.textContent="Kept ✓"; });
      });
  }
}

/* ---------- hitter's card: at most four lines a 16-year-old will read at the fence ---------- */
// What the card is made from, as numbers (the staff sheet reads the same ones): his pitches by use (ars), games seen (n), the
// first pitch {type, n, tot, st: strikes on it, of: first pitches}, the two-strike pitch {type, n, tot, hw: its height
// word}, a real split with two strikes {R, L} (each {type, n, tot}), the running numbers (R), pop time, run call, dirt line.
function cardFacts(pid, d){
  const p=P(pid), ps=d.ps, f=typed(ps), r=real(ps), plan=planNow(p,d);
  const ars=typeOrder(f).filter(k=>k!=="UN"), n=d.games.length;
  const fp=f.filter(x=>x.balls===0&&x.strikes===0), rfp=r.filter(x=>x.balls===0&&x.strikes===0);
  let first=null; if(fp.length>=MIN_ROW){ const t=topOf(mix(fp)); first={type:t.type, n:t.n, tot:t.tot, st:rfp.filter(x=>isStrike(x.result)).length, of:rfp.length}; }
  const tw=f.filter(x=>x.strikes===2);
  let two=null; if(tw.length>=MIN_ROW){ const t=topOf(mix(tw)); two={type:t.type, n:t.n, tot:t.tot, hw:heightWord(tw.filter(x=>x.type===t.type))}; }
  const tR=f.filter(x=>x.hand==="R"&&x.strikes===2), tL=f.filter(x=>x.hand==="L"&&x.strikes===2);
  let split=null;
  if(tR.length>=MIN_ROW && tL.length>=MIN_ROW){ const a=topOf(mix(tR)), b=topOf(mix(tL));
    if(a.type!==b.type && a.share>=0.4 && b.share>=0.4) split={R:{type:a.type, n:a.n, tot:a.tot}, L:{type:b.type, n:b.n, tot:b.tot}}; }
  const R=running(ps,d.evs), pop=popTime(d.games);
  return {p, plan, ars, n, first, two, split, R, pop, run:runCall(R,pop), dl:dirtLine(ps)};
}
function cardData(pid, d){
  const F=cardFacts(pid, d), p=F.p, r=real(d.ps), plan=F.plan, ars=F.ars, n=F.n;
  const head=`${p.num?"#"+p.num:pLabel(p)} ${handKnown(p)?p.hand+"HP":"hand ?"}, ${ars.join("/")||"?"}, ${n===1?"seen once":n===2?"seen twice":"seen "+n+" times"}`;
  const auto=[];
  if(plan.approach) auto.push({key:"approach", text:plan.approach});
  const t1=F.first; if(t1) auto.push({key:"first", text:`First pitch: ${t1.type}, ${xofy(t1.n,t1.tot)}. ${t1.st/t1.of>=0.6?"He throws it for strikes. Be ready.":"He misses here. Make him throw a strike."}`});
  const t2=F.two; if(t2) auto.push({key:"two", text:`Two strikes: ${t2.type}, ${xofy(t2.n,t2.tot)}${t2.hw?`, ${t2.hw.split(",")[0]}`:""}. Shorten up and protect.`});
  const rv=runVerdict(F.R, F.pop), dl=F.dl;
  if(rv||dl) auto.push({key:"base", text:`On base: ${[rv,dl].filter(Boolean).join(" ")}`});
  if(F.split){ const a=F.split.R, b=F.split.L;
    // A real split beats the blended number: replace the two-strike line with the per-side one.
    const i=auto.findIndex(x=>x.key==="two"); const line={key:"two", text:`Two strikes: righties get the ${a.type} (${xofy(a.n,a.tot)}), lefties get the ${b.type} (${xofy(b.n,b.tot)}). Shorten up and protect.`};
    if(i>=0) auto[i]=line; else auto.push(line); }
  const c=p.card||{}; const hide=new Set(c.hide||[]); const extra=(c.extra||[]).map((t,i)=>({key:"x"+i, text:t, extra:true}));
  const ordered=[...auto.filter(x=>x.key==="approach"), ...extra, ...auto.filter(x=>x.key!=="approach")].filter(x=>!hide.has(x.key));
  // Only when the pitches gave nothing to say and the coach added nothing. Lines he hid stay hidden: that's his call.
  if(!auto.length && !extra.length) ordered.push({key:"thin", text:`Thin book: ${plural(r.length,"pitch","pitches")} charted on him. Not enough to call his patterns yet, so hunt your pitch and trust what you see.`});
  // Only confirmed tells print (tells); the screen shows every one (tellsAll), marking the others.
  return {p, head, tells:confirmedTells(p), tellsAll:(p.tells||[]).slice(), lines:ordered.slice(0,4), dropped:ordered.slice(4), hidden:auto.filter(x=>hide.has(x.key)), includeTells:!!c.includeTells, approved:plan.approved};
}
// The printed card is half a sheet. A long one prints in smaller type (k, from cardFit) so no line is cut off. On paper only
// confirmed tells print, with no counts. screen (the Report tab's card view): every tell, the ones not confirmed marked.
function cardHTML(C, ex, k, screen){
  const tl=screen ? (C.tellsAll||C.tells) : C.tells, tellText=t=>screen && !C.tells.includes(t) ? `${esc(t)} <span class="unok">not confirmed, won't print</span>` : esc(t);
  return `<div class="hcard"${k&&k<1?` style="--k:${k}"`:""}><div class="hl">HITTER'S CARD${ex?" · EXAMPLE":""}${C.approved?"":" · DRAFT"}</div><h2>${esc(C.head)}</h2>${tl.length?`<div class="tl">Tell: ${tl.map(tellText).join(" · ")}</div>`:""}<ul>${C.lines.map(x=>`<li>${x.key==="approach"?`<span class="appr">${esc(x.text)}</span>`:esc(x.text)}</li>`).join("")}</ul></div>`;
}
// About how tall the printed card runs, in points. The half sheet gives it 340pt inside its padding; h keeps a little
// back. The sizes follow the print styles (17pt text, 26pt heading, 20pt team approach, 12pt label, each times k), and
// the width follows the page: letter paper, .32in margins, the body margin and .25in card padding leave 518pt.
// em is how wide an average letter is, measured in Chromium with Barlow and then padded about 10% for other fonts.
const CARD_PAPER = {h:334, w:518, ul:16.5, box:[18,12], gap:6, li:4.5, em:{text:.46, appr:.51, tell:.56, head:.5}, ks:[1,.92,.85,.78,.72,.66]};
function cardTall(C, k){
  const c=CARD_PAPER, lines=(t, pt, em, w)=>Math.max(1, Math.ceil(String(t).length*pt*em*1.06/w));   // 1.06: wrapping leaves some of each line empty
  let h = 12*k*1.3 + c.gap;                                              // HITTER'S CARD label
  h += lines(C.head, 26*k, c.em.head, c.w)*26*k + c.gap;                      // heading (line height 1)
  if(C.tells.length) h += lines("Tell: "+C.tells.join(" · "), 17*k, c.em.tell, c.w-c.box[0])*17*k*1.3 + c.box[1] + c.gap;
  C.lines.forEach((x,i)=>{ const ap=x.key==="approach", pt=(ap?20:17)*k; h += lines(x.text, pt, ap?c.em.appr:c.em.text, c.w-c.ul)*pt*1.3 + (i?c.li:0); });
  return h;
}
// The biggest type size that fits on the half sheet: {k, fits}. fits is false when even the smallest is too long.
function cardFit(C){ for(const k of CARD_PAPER.ks) if(cardTall(C,k)<=CARD_PAPER.h) return {k, fits:true}; return {k:CARD_PAPER.ks[CARD_PAPER.ks.length-1], fits:false}; }
function fitNote(F, C){
  if(!F.fits) return `<div class="flag" style="margin:6px 0"><span>Too long for the printed card, so the end gets cut off. Hide a line${C.tells.length?", or shorten his tells on the Teams tab":""}.</span></div>`;
  return F.k<1 ? `<p class="muted" style="margin:6px 0;font-size:13px">This card is long, so it prints in smaller type.</p>` : "";
}
function chatText(C, short){
  const team=C.p.team?C.p.team+" ":"";
  const lines=[`${team}${C.head}`]; if(C.includeTells && C.tells.length) lines.push("Tell: "+C.tells.join("; "));
  C.lines.forEach(x=>lines.push("- "+x.text));
  if(!short) return lines.join("\n");
  let out=lines[0]; for(const l of lines.slice(1)){ if((out+"\n"+l).length>280) break; out+="\n"+l; }
  return out.length>280?out.slice(0,277)+"...":out;
}
function cardView(pid, d){
  const C=cardData(pid,d), ex=d.games.some(g=>g.example);
  return `<div class="two"><div class="cardsheet">${cardHTML(C,ex,undefined,true)}</div>
    <div class="panel"><h3>Edit the card</h3>
      <p class="muted" style="margin:0 0 8px;font-size:13px">Four lines, tops. A line you add pushes the lowest automatic line off. The first line comes from the approved game plan's team approach.</p>
      ${C.lines.map(x=>`<div class="row" style="margin-bottom:6px"><span style="flex:1;min-width:0">${esc(x.text)}</span>${x.key==="thin"?"":`<button class="btn small" data-cd-hide="${esc(x.key)}">${x.extra?"Remove":"Hide"}</button>`}</div>`).join("")}
      ${fitNote(cardFit(C), C)}
      ${C.dropped.length?`<p class="muted" style="margin:6px 0;font-size:13px">Dropped to keep it at four: ${C.dropped.map(x=>esc(x.text)).join(" / ")}</p>`:""}
      ${C.hidden.length?`<p style="margin:6px 0;font-size:13px">Hidden: ${C.hidden.map(x=>`<button class="btn small" data-cd-show="${esc(x.key)}">Show "${esc(x.text.slice(0,30))}…"</button>`).join(" ")}</p>`:""}
      <form id="cd-add" class="row" style="margin-top:8px"><input type="text" id="cd-t" placeholder="Add your own line" style="flex:1;min-width:160px" maxlength="90"><button class="btn small" type="submit">Add</button></form>
      <h3 style="margin-top:16px">Copy for team chat</h3>
      <label class="checks"><label><input type="checkbox" id="cd-tells" ${C.includeTells?"checked":""}> Include confirmed tells <span class="muted">(off by default: a screenshot travels, and then the tell stops working)</span></label></label>
      <div class="row" style="margin-top:8px"><button class="btn" data-cd-copy="full">Copy card text</button><button class="btn" data-cd-copy="short">Copy 280-character version</button></div>
      <textarea class="mono" readonly style="margin-top:8px;min-height:120px">${esc(chatText(C,false))}</textarea>
      <p class="muted" style="margin:4px 0 0;font-size:12px">Short version (${chatText(C,true).length} characters): ${esc(chatText(C,true))}</p>
    </div></div>`;
}
function bindCard(el, pid, d){
  const p=()=>{ const x=ensurePitcher(P(pid)); x.card=x.card||{extra:[],hide:[]}; x.card.extra=x.card.extra||[]; x.card.hide=x.card.hide||[]; return x; };
  $$("[data-cd-hide]",el).forEach(b=>b.onclick=()=>{ const x=p(), k=b.dataset.cdHide; if(k[0]==="x") x.card.extra.splice(+k.slice(1),1); else x.card.hide.push(k); x.card.at=Date.now(); save(); renderReport(); });
  $$("[data-cd-show]",el).forEach(b=>b.onclick=()=>{ const x=p(); x.card.hide=x.card.hide.filter(k=>k!==b.dataset.cdShow); x.card.at=Date.now(); save(); renderReport(); });
  // A card line rides on his record to the team book and into the team chat Copy: one naming our players asks first.
  const f=$("#cd-add",el); if(f) f.onsubmit=e=>{ e.preventDefault(); const t=$("#cd-t",el).value.trim(); if(!t) return;
    namesCheck([["cd-t", t]], ()=>{ const x=p(); x.card.extra.push(t); x.card.at=Date.now(); save(); renderReport(); }); };
  const tl=$("#cd-tells",el); if(tl) tl.onchange=()=>{ const x=p(); x.card.includeTells=tl.checked; x.card.at=Date.now(); save(); renderReport(); };
  // Copy checks the card's lines (the plan's approach, lines he added) for our players' names, so one typed before 3.1 asks
  // first. Not the arm's own label: an opposing pitcher who shares one of our last names would ask on every Copy.
  $$("[data-cd-copy]",el).forEach(b=>b.onclick=()=>{ const C=cardData(pid,d); namesCheck([[null, C.lines.map(x=>x.text).join("\n")]], ()=>copyText(chatText(C, b.dataset.cdCopy==="short"), "Card text"), "It goes to team chat."); });
}

/* ---------- PRINTING: coach report, hitter's card, blank paper chart, charter cheat sheet, staff sheet, copy for another coach ---------- */
function printButtons(){
  if(EMBEDDED) return `<p class="muted" style="margin:0;font-size:14px;max-width:640px">Printing is blocked inside the Claude viewer. Open Mound Book from its own web address (or the Home Screen icon) to print the report, the hitter's card, a blank chart or the charter sheet. Copy the card text works here.</p>`;
  return `<button class="btn primary" data-print="report">Print coach report</button><button class="btn" data-print="card">Print hitter's card</button><button class="btn" data-print="chart">Print blank chart</button><button class="btn" data-print="cheat">Print charter sheet</button>`;
}
// The coach report or the hitter's card (two copies, cut in half), ready for #print-root. A long card prints in smaller type.
function reportSheet(kind, pid, d){
  if(kind==="card"){ const C=cardData(pid,d), ex=d.games.some(g=>g.example), F=cardFit(C); return {html:`<div class="cardsheet">${cardHTML(C,ex,F.k)}${cardHTML(C,ex,F.k)}</div>`, fit:F}; }
  return {html:`<div class="report">${buildReport(pid,d,{})}</div>`};
}
function bindPrintButtons(el, pid, d){
  $$("[data-print]",el).forEach(b=>b.onclick=()=>{ const k=b.dataset.print;
    if(k==="staff" || k==="friend"){ staffPrint(k); return; }
    if(k==="report") doPrint(reportSheet("report",pid,d).html, "report");
    if(k==="card"){ const r=reportSheet("card",pid,d); doPrint(r.html, "card"); if(!r.fit.fits) toast("This card is too long for half a sheet. The end gets cut off.", {ms:4000}); }
    if(k==="chart") doPrint(paperChart(cur()), "chart");
    if(k==="cheat") doPrint(cheatSheet(), "cheat");
  });
}
// The staff sheet (staff.js) or the copy for another coach, from the Teams tab: one landscape page. The copy is checked again
// first (friendCheck and the names scan); when it doesn't pass, nothing prints.
function staffPrint(kind){ const html=staffSheetHTML(kind); if(html) doPrint(html, kind); return !!html; }
// What is on the print sheet, and which Report view (or staff sheet) it was made for. The sheet stays filled until printing
// is done, so when window.print() fails, Share > Print (what the toast says to use) still prints it.
const PRINTED = {view:null};
const printView = () => [ui.tab, ui.report.pid, ui.report.view||"report", ui.staff ? [ui.staff.team, ui.staff.date, ui.staff.friend?"friend":"staff"].join("|") : ""].join("|");
// The staff sheet and the copy for another coach print landscape on every page (named pages are not everywhere).
const LANDSCAPE = new Set(["staff","friend"]);
function pageStyle(kind){
  const old=document.getElementById("mb-page"); if(old) old.remove();
  if(!LANDSCAPE.has(kind)) return;
  const st=document.createElement("style"); st.id="mb-page"; st.textContent="@page{size:letter landscape;margin:.3in}"; document.head.appendChild(st);
}
function showPrint(html, kind){ $("#print-root").innerHTML=html; document.body.dataset.print=kind; pageStyle(kind); PRINTED.view=printView(); }
function clearPrint(){ const root=$("#print-root"); if(root) root.innerHTML=""; delete document.body.dataset.print; pageStyle(null); PRINTED.view=null; }
function doPrint(html, kind){
  showPrint(html, kind);
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast("This device won't print from here. Use Share > Print."); } }, 60);
}
// A print the app didn't start (Share > Print, or the browser's own Print) gets what the Report tab shows.
// The app's own sheet is kept while it still belongs to the view on screen.
function beforePrint(){
  if(document.body.dataset.print && PRINTED.view===printView()) return;
  clearPrint();
  // On the Teams tab with the staff sheet up: the staff sheet, or the copy for another coach when that's ticked.
  if(ui.tab==="teams" && ui.staff){ const kind=ui.staff.friend ? "friend" : "staff", html=staffSheetHTML(kind, true); if(html) showPrint(html, kind); return; }
  const R=ui.report; if(ui.tab!=="report" || !R.pid || !R.games) return;
  const d=pitcherData(R.pid, R.games); if(!d.ps.length) return;
  const kind=R.view==="card"?"card":"report"; showPrint(reportSheet(kind, R.pid, d).html, kind);
}
if(typeof window!=="undefined" && window.addEventListener){ window.addEventListener("beforeprint", beforePrint); window.addEventListener("afterprint", clearPrint); }
// Paper chart: the codes are the keyboard keys, so a night-of typing pass is digit then letter for every pitch.
function paperChart(g){
  const R=g?replay(g):null, L=R?R.live:null; const pid=L&&L.pitcher; const p=pid?P(pid):null;

      <div><b>Rare:</b> N foul bunt · I intentional walk · M missed pitch(es)</div><div><b>Runners:</b> O1 throw over to 1st · G2 steals 2nd · Q2 caught stealing at 2nd · J1 picked off 1st · W wild pitch · P passed ball · Z balk</div></div>
    <div style="font-size:10.5px;margin-bottom:4px">Each pitch is number + letter: <b>1C</b> = ${esc(ars[0]||"FB")} called strike, <b>0B</b> = not sure, ball. Time to plate goes in small numbers under the pitch. Pitching change: draw a line across and write the new #.</div>
    <table><colgroup><col style="width:4%"><col style="width:16%"><col style="width:4%">${'<col style="width:5%">'.repeat(10)}<col style="width:10%"><col style="width:16%"></colgroup><thead><tr><th>Inn</th><th>Batter</th><th>L/R</th>${Array.from({length:10},(_,i)=>`<th>${i+1}</th>`).join("")}<th>Result</th><th>Runners / notes</th></tr></thead>
    <tbody>${Array.from({length:rows},(_,i)=>`<tr><td></td><td style="text-align:left">${esc(bat(i))}</td><td>${esc(hand(i))}</td>${"<td></td>".repeat(10)}<td></td><td></td></tr>`).join("")}</tbody></table></div>`;

function cheatSheet(){
  return `<div class="cheat"><h2>Charting with Mound Book</h2><ol>
    <li><b>Before the game:</b> open Mound Book from the Home Screen icon. Settings › Display &amp; Brightness › Auto-Lock › Never (if the school lets you). Plug in if you can.</li>

function renderTeams(){

// The level a new box-score line starts at: the level of his latest charted game, else of his latest box-score line, else
// varsity. Never his team's latest game: that can be another level's game.
function boxLevel(p){
  const last=(p.outings||[]).filter(b=>b && b.level && b.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lv=lastLevel(p.id) || (last && last.level);

// The outing log: one row per day with that day's total, and a row for each box-score line under it, each with its own
// Remove. The words sit in the first column, so they get the room on a phone.
function outingRows(os){
  const rm=b=>`<button class="btn small" data-delout="${esc(b.id||"")}" aria-label="Remove this box-score line">Remove</button>`;
  return os.map(o=>{
    const box=o.box||[], solo=box.length===1 && !(o.games||[]).length;
    const lv=(o.levels||[]).length>1 ? "varsity and JV" : (o.levels||[])[0]==="jv" ? "Freshman/JV" : "";
    const src=(o.sources&&o.sources.length?o.sources:[o.source]).map(k=>OUT_SRC[k]||k).join(" and ");
    const what=[src+(o.est?`, ${o.est} estimated`:"")+(o.chart!=null?` (we charted ${o.chart})`:""), lv].filter(Boolean).join(" · ");
    // maybeSame (store.js outingsOf): a paste vs us, or one with no opponent typed, on a day we charted him vs us.
    const pastes=box.filter(b=>/^k-/.test(boxKey(b)||"") && !(o.over||[]).includes(b)), blank=pastes.some(b=>!String(b.vs||"").trim()), vsUs=pastes.some(b=>String(b.vs||"").trim());
    const notes=[o.lost ? "Official count for a game that isn't on this device. It adds to his day. Remove it if it's the same game as one we charted." : "",
      o.maybeSame && (vsUs || !blank) ? "Pasted game vs us on a day we charted a game vs us. Same game? Remove the pasted one and use Paste this game's box score." : "",
      o.maybeSame && blank ? "A pasted game with no opponent, on a day we charted him vs us. Same game? Remove the pasted one and use Paste this game's box score." : ""].filter(Boolean);
    const one=solo && box[0].via==="paste" ? ` · ${boxLineWord(box[0], o)}` : "";
    return `<tr><td class="l wrap"><b>${esc(shortDate(o.date))} ${o.date.slice(0,4)}</b><br><span class="muted" style="font-size:13px">${esc(what+one)}</span>${notes.map(t=>`<br><span class="muted" style="font-size:13px">${esc(t)}</span>`).join("")}</td><td><b>${o.pitches}</b></td><td>${solo?rm(box[0]):""}</td></tr>`
      + (solo?"":box.map(b=>`<tr><td class="l wrap muted" style="padding-left:20px;font-size:13px">Box line: ${esc(boxLineWord(b, o))}</td><td class="muted">${+b.pitches||0}</td><td>${rm(b)}</td></tr>`).join(""));
  }).join("");
}
function boxLineWord(b, o){
  const lv=b.level==="jv"?", Freshman/JV":"";
  if((o.over||[]).includes(b)) return "Older copy of this game, not counted";
  // A pasted game: who they played, whether he started, and the coach who told us.
  if(b.via==="paste"){ const src=String(b.src||"").trim();
    return "a game we didn't chart"+(b.vs?`, vs ${b.vs}`:"")+(b.ord===1?", started":b.ord>1?", came in":"")+(src?`, per ${coachName(src)}`:"")+lv; }
  if(b.replaces===true && b.game) return "official count for a game we charted"+lv;
  if(b.replaces===true || (b.replaces==null && (o.games||[]).length)) return "official count for the whole day"+lv;   // older lines stand in for the day
  return "a game we didn't chart"+lv;
}

// Free text that names one of our players asks before it is saved: it goes to the team book. fields: [[input id, text]]
// (id null: text being copied, with no box to go back to). Fix it goes back to the box with the name; Keep it saves (go).
// where: what happens to it, when it isn't the team book (a Copy for team chat).
function namesCheck(fields, go, where){
  const hits=[], at=[];
  fields.forEach(([id, text])=>{ const h=namesInText(text); if(!h.length) return; at.push(id); h.forEach(x=>{ if(!hits.includes(x)) hits.push(x); }); });
  if(!hits.length){ go(); return; }
  sheet(`<h3>One of our players?</h3><p style="margin:0">This names one of our players (${esc(hits.join(", "))}). ${esc(where||"It goes to the team book.")} Keep it?</p>

    $("[data-fix]",m).onclick=settled(()=>{ close(); const f=at[0] ? document.getElementById(at[0]) : null; if(f){ try{ f.focus(); }catch(e){} } });
    $("[data-keepit]",m).onclick=settled(()=>{ close(); go(); });
  });
}

/* ---------- same kid? ----------
   A rename, renumber or team change only edits his record: games point at his id, so nothing moves and two kids are never
   merged by accident. When his new details match another kid on file, the coach says whether it's the same kid:
   "Merge them" joins the two records (mergeInto), "Keep separate" keeps both. */
// Would a kid with these details be looked up as rec? Same team, and the same jersey number (or rec has no number yet and
// the same name). With no number, the same name.
function sameSlot(rec, team, num, name){
  if(slug(rec.team)!==slug(team)) return false;
  const n=normNum(num), nm=slug(name);
  if(n) return normNum(rec.num)===n || (!normNum(rec.num) && !!nm && slug(rec.name)===nm);
  return !!nm && slug(rec.name)===nm;
}
// Kids on file that his new details run into: they match now and didn't before. Kept separate once, they aren't asked about again.
function detailClashes(pid, f){
  const p=S.pitchers[pid]; if(!p) return [];
  const team=f.team!=null?f.team:p.team, num=f.num!=null?f.num:p.num, name=f.name!=null?f.name:p.name;
  if(!normNum(num) && !slug(name)) return [];
  return Object.values(S.pitchers).filter(x=>x && x.id!==pid && !x.mergedInto && !x.example===!p.example && !keptApart(p, x) && sameSlot(x, team, num, name) && !sameSlot(x, p.team, p.num, p.name));
}
// Same kid: src's games, notes and box-score lines join dst, and src's id leads to dst from now on (a later Send too).
// ch: what the coach changed in the form (name, number, hand), put on the kid who stays. One kid has one hand, so every
// game he pitched in reads that hand.
function mergeKids(src, dst, ch){
  if(src===dst || !S.pitchers[src] || !S.pitchers[dst]) return dst;
  ch=ch||{};
  mergeInto(src, dst);
  const d=S.pitchers[dst], r={};
  if(ch.name) r.name=ch.name;
  if(ch.num && !normNum(d.num)) r.num=ch.num;
  if(Object.keys(r).length) renamePitcher(dst, r);
  setPitcherHand(dst, ch.hand||d.hand, {seen:!!ch.hand});   // a hand the coach picked is known now; else his own stays as it was
  return dst;
}
// A kid's hand in words. A pasted arm whose hand nobody has seen yet says so.
const handWordP = p => !p ? "throws right" : !handKnown(p) ? "hand not seen yet" : p.hand==="L" ? "throws left" : "throws right";
function seenWord(x){
  const n=pitcherData(x.id,null).ps.length, os=outingsOf(x.id);
  return n||os.length ? `${n} pitch${n===1?"":"es"} charted${os[0]?`, last out ${shortDate(os[0].date)} ${os[0].date.slice(0,4)}`:""}.` : "Nothing charted yet.";
}
// A "same kid?" sheet opens right under the finger that tapped Save. For a moment it ignores taps, so a double tap
// can't answer for the coach (a merge can't be split).
function settled(fn){ const t0=performance.now(); return e=>{ if(performance.now()-t0<450) return; fn(e); }; }
// Close the sheet without choosing (Cancel, or a tap outside it).
function onSheetCancel(m, fn){
  const ov=m.parentElement, x=$("[data-x]",m);
  if(x) x.addEventListener("click", fn);
  if(ov) ov.addEventListener("click", e=>{ if(e.target===ov) fn(); });
}
// Save new details for a kid on file: any of team, num, name, hand. Asks first when they run into another kid on file.
// o.filed(id): runs once his details are saved, before any merge (Needs a team files his old games here).
// o.done(id, merged): after saving, with the id he's filed under now. o.cancel(): the coach backed out; nothing changed.
function savePitcherDetails(pid, fields, o){
  o=o||{};
  const p=S.pitchers[pid]; if(!p) return;
  const f={}; ["team","num","name","hand"].forEach(k=>{ if(fields[k]!=null) f[k]=String(fields[k]).trim(); });
  if(f.num!=null) f.num=f.num.replace(/^#/,"");
  if(f.hand!=null && f.hand!=="L" && f.hand!=="R") delete f.hand;
  const ch={};   // what the coach changed
  if(f.name!=null && f.name && f.name!==p.name) ch.name=f.name;
  if(f.num!=null && normNum(f.num) && normNum(f.num)!==normNum(p.num)) ch.num=f.num;
  if(f.hand && (f.hand!==p.hand || !handKnown(p))) ch.hand=f.hand;
  const keep=()=>{
    const r={}; ["team","num","name"].forEach(k=>{ if(f[k]!=null) r[k]=f[k]; });
    renamePitcher(pid, r);
    if(f.hand) setPitcherHand(pid, f.hand, {seen:true});   // his record, and every game he pitched in reads it (switch hitters)
    if(o.filed) o.filed(pid);
    save(); if(o.done) o.done(pid, false);
  };
  const merge=dst=>{
    if(o.filed) o.filed(pid);
    const id=mergeKids(pid, dst, {name:ch.name, num:f.num!=null?f.num:p.num, hand:ch.hand});
    save(); if(o.done) o.done(id, true);
  };
  const clashes=detailClashes(pid, f);
  if(!clashes.length){ keep(); return; }
  const team=f.team!=null?f.team:p.team, num=f.num!=null?f.num:p.num, after={...p, ...f};
  const byNum=!!normNum(num) && clashes.every(x=>normNum(x.num)===normNum(num));
  const head=byNum ? `#${num} is already on file${team?" for "+team:""}` : `${pLabel(after)} may already be on file${team?" for "+team:""}`;
  const kept=x=>{ const name=ch.name||x.name||p.name; return `${pLabel({num:x.num||num, name})}, ${handWordP(ch.hand ? {hand:ch.hand} : x)}`; };
  const likely=x=>!slug(x.name) || !slug(after.name) || slug(x.name)===slug(after.name);   // a name that differs: probably a new kid
  const one=clashes.length===1, moved=slug(team)!==slug(p.team), relabel=pLabel(after)!==pLabel(p);
  const doing=relabel ? `You're changing ${esc(pLabel(p))} to ${esc(pLabel(after))}${moved?` on ${esc(teamName(team))}`:""}.` : `You're moving ${esc(pLabel(p))} to ${esc(teamName(team))}.`;
  sheet(`<h3>${esc(head)}</h3>
    <p style="margin:0">${doing} ${one?"This kid is":"These kids are"} on file already:</p>
    ${clashes.map(x=>`<div class="flag" style="justify-content:space-between"><span><b>${esc(pLabel(x))}</b>, ${handWordP(x)}. ${esc(seenWord(x))}<br><span class="muted" style="font-size:13px">If you merge, he stays on file as ${esc(kept(x))}.</span></span>${one?"":`<button type="button" class="btn small" data-merge="${esc(x.id)}">Same kid. Merge them</button>`}</div>`).join("")}
    <p class="muted" style="margin:0;font-size:14px">Same kid? Merge them. His games, pitch counts, notes and box-score lines go on one record. This can't be split later.</p>
    <p class="muted" style="margin:0;font-size:14px">A different kid? Keep them separate. Both stay on file.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn ${one&&!likely(clashes[0])?"primary":""}" data-keep>Keep separate</button>${one?`<button type="button" class="btn ${likely(clashes[0])?"primary":""}" data-merge="${esc(clashes[0].id)}">Merge them</button>`:""}</div>`,
    (m, close)=>{
      onSheetCancel(m, ()=>{ if(o.cancel) o.cancel(); });
      // Different kids: both records remember it, so no device joins them later as one kid filed twice.
      $("[data-keep]",m).onclick=settled(()=>{ close(); clashes.forEach(x=>setApart(pid, x.id)); keep(); });
      $$("[data-merge]",m).forEach(b=>b.onclick=settled(()=>{ close(); merge(b.dataset.merge); }));
    });
}
// Move kids to a team: a team rename, or a game's pitching team fixed. Each kid who runs into one on file there (same
// number) is shown as a pair, and the coach picks same kid (merge) or different kids (keep both) for each. It starts at
// different kids, since a merge can't be split. o.done(merged count) after saving; o.cancel() when he backs out.
function moveArmsToTeam(ids, team, o){
  o=o||{};
  const moving=[...new Set(ids.map(id=>resolvePid(id)))].map(id=>S.pitchers[id]).filter(Boolean), set=new Set(moving.map(p=>p.id));
  const pairs=[];
  moving.forEach(a=>Object.values(S.pitchers).forEach(x=>{
    if(!x || set.has(x.id) || x.mergedInto || !x.example!==!a.example) return;
    if(sameSlot(x, team, a.num, a.name) && !sameSlot(x, a.team, a.num, a.name) && !keptApart(a, x)) pairs.push({a:a.id, b:x.id});
  }));
  const go=pick=>{
    moving.forEach(p=>renamePitcher(p.id,{team}));
    let n=0;
    pairs.forEach((pr,i)=>{ if(!pick[i]){ setApart(pr.a, pr.b); return; } const s=resolvePid(pr.a), d=resolvePid(pr.b); if(s!==d && S.pitchers[s] && S.pitchers[d]){ mergeKids(s, d); n++; } });
    save(); if(o.done) o.done(n);
  };
  if(!pairs.length){ go([]); return; }
  const pick=pairs.map(()=>false);
  const lab=id=>{ const x=S.pitchers[id]; return `<b>${esc(pLabel(x))}</b> (${handKnown(x)?x.hand+"HP":"hand not seen yet"}, ${esc(teamName(x.team))})`; };
  sheet(`<h3>${pairs.length===1?"A number is":"Some numbers are"} already on file for ${esc(team)}</h3>
    <p style="margin:0">Moving these pitchers to ${esc(team)} puts them next to kids with the same number. Is each pair the same kid?</p>
    <div class="checklist">${pairs.map((pr,i)=>`<div class="ci"><span>${lab(pr.a)} and ${lab(pr.b)}</span><div class="seg"><button type="button" data-pair="${i}" data-v="1" aria-pressed="false">Same kid. Merge them</button><button type="button" data-pair="${i}" data-v="0" aria-pressed="true">Different kids</button></div></div>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:14px">Merging puts his games, pitch counts and notes on one record. It can't be split later. Different kids both stay on file.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn primary" data-ok>Save</button></div>`,
    (m, close)=>{
      onSheetCancel(m, ()=>{ if(o.cancel) o.cancel(); });
      $$("[data-pair]",m).forEach(b=>b.onclick=settled(()=>{ const i=+b.dataset.pair; pick[i]=b.dataset.v==="1"; $$(`[data-pair="${i}"]`,m).forEach(x=>x.setAttribute("aria-pressed", String(x===b))); }));
      $("[data-ok]",m).onclick=settled(()=>{ close(); go(pick); });
    });
}

// Our roster from a backup file (the iPad's), so Coach's phone can show our hitters' names in the coach box. Only the file's
// roster is read: never its games or anything else (mergeIn copies a roster only into an empty one, and a backup from
// another device can ask "Whose games are these?").
function rosterFromFile(text){
  let pkg=null; try{ pkg=JSON.parse(text); }catch(e){}
  const ok=r=>!!r && typeof r==="object" && r.id!=null && String(r.id)!=="" && !!(String(r.name||"").trim() || String(r.num==null?"":r.num).trim());
  const tidy=a=>(Array.isArray(a) ? a : []).filter(ok).map(r=>({id:String(r.id), num:String(r.num==null?"":r.num).replace(/^#/,"").trim().slice(0,4), name:String(r.name||"").trim().slice(0,60), bats:["L","S"].includes(r.bats) ? r.bats : "R"}));
  const ros=pkg && pkg.roster && typeof pkg.roster==="object" ? {varsity:tidy(pkg.roster.varsity), jv:tidy(pkg.roster.jv)} : null, n=ros ? ros.varsity.length+ros.jv.length : 0;
  if(!n){ toast("There's no roster in this file. Use the iPad's backup file.", {ms:4000}); return; }
  sheet(`<h3>Use this roster?</h3><p style="margin:0 0 12px">Replace this phone's roster with the ${n} player${n===1?"":"s"} in this file? Nothing else in the file is loaded.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Replace the roster</button></div>`, (m, close)=>{
      $("[data-ok]",m).onclick=()=>{ close(); S.roster=ros; save(); renderTeams(); toast(`Roster replaced: ${n} player${n===1?"":"s"}`); }; });
}

/* ---------- Paste pitch counts (a game we didn't chart) ----------

const PASTE_HELP="One pitcher per line: number, name, pitches. 12 87 works too. 12 Smith P (no count) adds him to their list.";
const PASTE_PH="12 Smith 87\n7 Jones 18\nor type them off GameChanger";
function pasteOldText(n){ return n.length ? `${n.join(" and ")} ${n.length>1 ? "have" : "has"} an older Mound Book. Update ${n.length>1 ? "them" : "it"} before game day.` : ""; }
// A new team name whose first word is a team's on file: maybe that team.
function pasteMeant(name){
  const t=slug(name), all=teamsList().filter(Boolean); if(!t || all.some(x=>slug(x)===t)) return null;
  const w=t.split("-")[0]; if(w.length<3) return null;

        <label class="fld"><span class="label">They played (optional)</span><input type="text" id="pa-vs" list="pa-vss" maxlength="40" value="${esc(st.vs)}" placeholder="Who they played"></label>
        <datalist id="pa-vss">${[...(ours ? [ours] : []), ...teams].map(t=>`<option value="${esc(t)}">`).join("")}</datalist>

/* ---------- STAFF SHEET: their arms for our game, and a copy for another coach ----------
   For our coaches: every arm on their team that hasn't graduated, the ones who threw in the last two weeks first, with his
   pitches, his last two outings, rest per your table, what his card says (cardFacts), what he did to us, confirmed tells and
   what other coaches told us. Counts and rest per the table only, never a date he can pitch: the coach does the date math
   and checks the book. One landscape page on paper (staffFit picks the type size).
   The copy for another coach is built field by field from a short list (FRIEND_KEYS) and checked again before it goes out
   (friendCheck, friendScan), so our hitters' names, tells, notes, counts like 8 of 11 and the plan can't get in. It goes out
   only as plain text (Copy) or paper (Print): never a file. */
const STAFF_KS=[1, .92, .85, .78, .72];
const STAFF_PAGE_H=7.8*96;   // a landscape letter page inside .3in margins is 7.9in tall; keep a little back
const STAFF_PRINT_BLOCKED="Printing is blocked inside the Claude viewer. Open Mound Book from its own web address (or the Home Screen icon) to print the staff sheet. Copy works here.";
const byNum=(a, b)=>(parseInt(a.num)||999)-(parseInt(b.num)||999) || String(a.num||"").localeCompare(String(b.num||""));
const lastWord=n=>String(n||"").trim().split(/\s+/).filter(Boolean).pop()||"";
const isoDay=t=>{ if(!(t>946684800000)) return ""; const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const HAND_WORD={R:"throws right", L:"throws left", "?":"hand not seen yet"};
// Where an outing's count came from, on the screen and (shorter, for the narrow cell) on paper. Another coach told us:
// per Coach Hale on the screen and in Copy, per Hale (as typed) on paper.
const OUT_FROM={box:" (box score)", book:" (home book)"}, OUT_PAPER={box:" (box)", book:" (book)"};
const outFrom=(o, paper)=>o.by ? ` (per ${paper ? o.by : coachName(o.by)})` : ((paper ? OUT_PAPER : OUT_FROM)[o.src]||"");
// Ends a line with a period unless it has one.
const stop=t=>/[.!?]$/.test(t) ? t : t+".";

// The team's records: not merged away and not a stand-in, and never one of our own players (his whole name is one of ours,
// whatever label he is filed under): his record stays on this device, and nothing of him goes to team chat or another coach.
function staffPool(team){ const N=ourNames(); return Object.values(S.pitchers).filter(p=>p && !p.mergedInto && !p.stub && (p.team||"")===team && rowIsOurs(p, N)!=="drop"); }
// Used only for a kid whose outings don't say their level, as on the team page.
function staffLevel(team){ const g=S.games.filter(x=>x && (x.pTeam||"")===team).sort((a,b)=>gDate(b).localeCompare(gDate(a)))[0]; return g ? g.level : "varsity"; }
// Rest in the staff sheet's words: Check the book first when the table line says so, then the rest per the table, two days
// in a row with both days (no conclusion drawn), and outings that don't fit the table. {check, lines}, or null with no outing.
function staffRest(rl, os){
  if(!rl) return null;
  // Over the daily max: that first, then the table's rest (its top band).
  const lines=[...(rl.over ? [`Over the ${rl.max||rl.T.max} max`] : []), rl.rest==null ? "Rest: see your table" : `${rl.rest} day${rl.rest===1?"":"s"} rest${rl.level==="jv"?" · JV table":""}`];
  if(rl.back2 && os && os[1]) lines.push(`Threw ${shortDate(os[1].date)} and ${shortDate(rl.o.date)}, two days in a row.`);
  if(rl.misfit) lines.push("Outings don't fit the table.");
  return {check:!!rl.check, lines};
}
// The newest friend notes first.
function friendNotes(p){ return ((p&&p.notes)||[]).filter(n=>n && n.src==="friend").sort((a,b)=>(b.t||0)-(a.t||0)); }
function staffRow(p, date, lev){
  const pid=p.id, dg=defaultGames(pid, date.slice(0,4)), d=pitcherData(pid, dg.ids), F=cardFacts(pid, d);
  const os=outingsOf(pid, {asOf:date}), rl=restLine(pid, lev, date), fr=friendNotes(p);
  const from=addDays(date, -14), recent=os.filter(o=>o.date>from && o.date<=date).reduce((s,o)=>s+(+o.pitches||0), 0);
  // His pitches: the ones we charted; else the ones another coach named (and who); else his list when someone set it.
  let pitches=F.ars.slice(), pitchesFrom="";
  if(!pitches.length){
    const named=fr.find(n=>n.says && ((Array.isArray(n.says.ars) && n.says.ars.length) || n.says.out));
    if(named){ pitches=[...new Set([...(named.says.ars||[]), named.says.out].filter(c=>c && c!=="UN"))]; pitchesFrom="per "+noteWho(named); }
    else if(edStamp(p, "arsenal")>0 && (p.arsenal||[]).some(c=>c!=="UN")) pitches=p.arsenal.filter(c=>c!=="UN");
    else pitches=["?"];
  }
  // Up to three facts, the same numbers as his card.
  const facts=[];
  if(F.plan.approach) facts.push(F.plan.approach);
  if(F.split) facts.push(`Two strikes: ${F.split.R.type} to righties, ${F.split.L.type} to lefties`);
  else if(F.two) facts.push(`Out pitch: ${F.two.type}, ${xofy(F.two.n, F.two.tot)} with two strikes`);
  if(F.run) facts.push(`${F.run.tt.toFixed(2)} to the plate${F.run.pop?`, pop ${F.run.pop.secs.toFixed(1)}`:""}: ${F.run.call}`);
  // What he did to us: counts only, never who.
  const us=d.games.filter(g=>g.hitting==="us"), ids=new Set(us.map(g=>g.id));
  let vsUs=null; if(us.length){ const s=paStats(d.ps.filter(x=>ids.has(x.gameId)), d.evs.filter(e=>ids.has(e.gameId))); vsUs={games:us.length, pa:s.pa, k:s.k, bb:s.bb, h:s.h}; }
  const tells=confirmedTells(p).map(t=>{ const m=/^(\d+)\/(\d+)$/.exec(tellOk(p, t)||""); return {text:t, held:m?`held ${m[1]} of ${m[2]}`:""}; });
  const seen=[os[0] ? os[0].date : "", ...pitcherData(pid, null).games.map(g=>g.date), ...fr.map(n=>(n.saw && /^\d{4}-\d{2}-\d{2}$/.test(n.saw.date||"") && n.saw.date) || isoDay(n.t))]
    .filter(x=>x && x<=date).sort().pop()||"";
  const group=recent>0 ? 1 : (d.ps.length || os.length || fr.length) ? 2 : 0;
  return {pid, label:pLabel(p), num:p.num||"", hand:handText(p), pitches, pitchesFrom, outs:os.slice(0,2).map(o=>({date:o.date, n:o.pitches, src:o.source, by:o.by||""})),
    rest:staffRest(rl, os), recent, charted:d.ps.length, old:!!dg.old, facts:facts.slice(0,3), vsUs, tells, friends:fr.slice(0,2).map(noteLine), friendsN:fr.length,
    example:!!p.example, group, last:seen};
}
// The recent games line by line. A game we hit in reads "vs us", never our team's name.
function staffStarters(team, date){
  const us=ourNameSet() ? S.settings.ourName : "";
  return recentGames(team, 6, date).map(x=>recentText({...x, vs:x.vs && ((x.game && x.game.hitting==="us") || (us && sameTeam(x.vs, us))) ? "us" : x.vs}));
}
// Everything the sheet shows, for our game on date. rows: who threw in the 14 days up to the date (group 1, most pitches
// first, then the newest outing, then the number), then everyone else we charted, have outings for or heard about (group 2,
// last seen first). notSeen: the rest, by number. grad: the ones whose class has finished. fit: set when it is drawn.
function staffData(team, date){
  date=date||today();
  const lev=staffLevel(team), pool=staffPool(team), grads=pool.filter(p=>graduated(p, date)), all=pool.filter(p=>!graduated(p, date)).map(p=>staffRow(p, date, lev));
  const lastOut=r=>r.outs[0] ? String(r.outs[0].date) : "";
  const g1=all.filter(r=>r.group===1).sort((a,b)=>b.recent-a.recent || lastOut(b).localeCompare(lastOut(a)) || byNum(a,b));

// The biggest type size that keeps the sheet on one page, measured off screen at the page's width: {k, pages}. None fits:

function staffFit(D){

  const box=document.createElement("div"); box.style.cssText="position:absolute;left:-10000px;top:0;width:10.4in;visibility:hidden";
  document.body.appendChild(box);

    let h=0;
    for(const k of STAFF_KS){ box.innerHTML=staffPrintHTML(D, k); const el=box.firstElementChild; h=el ? el.getBoundingClientRect().height : 0; if(h<=STAFF_PAGE_H) return {k, pages:1, measured:true}; }
    return {k:last, pages:Math.max(2, Math.ceil(h/STAFF_PAGE_H)), measured:true};

/* ----- the copy for another coach ----- */
// Only these, and each checked (friendCheck): his number, hand, the pitch codes we charted, his out pitch (one, or one for
// each side), our slide-step answer, his time to the plate, and his last two outings (date and count, from our charts and
// box scores: never a count another coach told us). The sheet: the team name on it, and the day it was made.
const FRIEND_KEYS=["num","hand","pitches","out","slide","ttp","outs"], FRIEND_SHEET=["team","made","arms"];
const FR_CODE=/^[A-Z0-9]{1,5}$/, FR_NUM=/^[0-9a-z]{0,3}$/, FR_DATE=/^\d{4}-\d{2}-\d{2}$/;
// o.label: the team name on his copy (40 letters; blank is the team's own).
function friendData(team, date, o){
  o=o||{}; date=date||today();
  const lab=String(o.label!=null && String(o.label).trim() ? o.label : (team||"")).replace(/\s+/g," ").trim().slice(0,40);
  const codes=new Set(((S && S.catalog) || CATALOG).map(a=>a && a.code).filter(c=>typeof c==="string" && c!=="UN" && FR_CODE.test(c)));
  const code=c=>typeof c==="string" && codes.has(c) ? c : null;
  const arms=[];
  staffPool(team).filter(p=>!p.example && !graduated(p, date)).sort(byNum).forEach(p=>{
    const d=pitcherData(p.id, defaultGames(p.id, date.slice(0,4)).ids), F=cardFacts(p.id, d);
    const pitches=[...new Set(F.ars.map(code).filter(Boolean))];
    const out=F.split ? (code(F.split.R.type) && code(F.split.L.type) ? {R:code(F.split.R.type), L:code(F.split.L.type)} : null) : F.two ? code(F.two.type) : null;
    const sl=(p.check||{}).slide, t=F.R && F.R.ttpN ? Math.round(F.R.ttp*100)/100 : null;
    // His newest two days, or none: a day out of range (bad or doubled data) is never dropped on its own, or an older day
    // would read as his last outing.
    const two=outingsOf(p.id, {skip:b=>!!(b && b.src), asOf:date}).slice(0,2).map(x=>({date:String(x.date), n:x.pitches}));
    const outs=two.every(x=>FR_DATE.test(x.date) && Number.isInteger(x.n) && x.n>=0 && x.n<=200) ? two : [];
    if(!pitches.length && !outs.length) return;
    const n=normNum(p.num), h=handText(p);
    arms.push({num:FR_NUM.test(n) ? n : "", hand:["R","L","?"].includes(h) ? h : "?", pitches, out, slide:sl==="yes"||sl==="no" ? sl : null,
      ttp:t!=null && t>=0.9 && t<=2.5 ? t : null, outs});
  });
  return {team:lab, made:today(), arms};
}
// Throws on any key that isn't on the list, or a value that isn't what it should be. True when it's all right.
function friendCheck(F){
  const no=w=>{ throw new Error("not on the list: "+w); }, plain=o=>!!o && typeof o==="object" && !Array.isArray(o);
  const only=(o, keys, w)=>{ if(!plain(o)) no(w); Object.keys(o).forEach(k=>{ if(!keys.includes(k)) no(w+"."+k); }); keys.forEach(k=>{ if(!(k in o)) no(w+"."+k); }); };
  const isCode=c=>typeof c==="string" && FR_CODE.test(c) && c!=="UN";
  only(F, FRIEND_SHEET, "sheet");
  if(typeof F.team!=="string" || F.team.length>40 || /[\r\n]/.test(F.team)) no("team");
  if(typeof F.made!=="string" || !FR_DATE.test(F.made)) no("made");
  if(!Array.isArray(F.arms) || F.arms.length>80) no("arms");
  F.arms.forEach((a, i)=>{ const w="arm "+i; only(a, FRIEND_KEYS, w);
    if(typeof a.num!=="string" || !FR_NUM.test(a.num)) no(w+".num");
    if(!["R","L","?"].includes(a.hand)) no(w+".hand");
    if(!Array.isArray(a.pitches) || a.pitches.length>12 || !a.pitches.every(isCode)) no(w+".pitches");
    if(!(a.out===null || isCode(a.out) || (plain(a.out) && Object.keys(a.out).sort().join()==="L,R" && isCode(a.out.R) && isCode(a.out.L)))) no(w+".out");
    if(!(a.slide===null || a.slide==="yes" || a.slide==="no")) no(w+".slide");
    if(!(a.ttp===null || (typeof a.ttp==="number" && isFinite(a.ttp) && a.ttp>=0.9 && a.ttp<=2.5 && Math.abs(Math.round(a.ttp*100)-a.ttp*100)<1e-6))) no(w+".ttp");
    if(!Array.isArray(a.outs) || a.outs.length>2) no(w+".outs");
    a.outs.forEach((x, j)=>{ only(x, ["date","n"], w+".outs."+j); if(typeof x.date!=="string" || !FR_DATE.test(x.date)) no(w+".outs.date"); if(!Number.isInteger(x.n) || x.n<0 || x.n>200) no(w+".outs.n"); });
  });
  return true;
}
// Pitch words from the built-in list (fastball, slider); a pitch we added ourselves prints as its code.
function pitchWord(c){ const a=CATALOG.find(x=>x.code===c); return a && c!=="UN" ? a.name.toLowerCase() : String(c); }
// Reads only F.
function friendLines(F){
  const out=[`${F.team} pitchers, from Mound Book (${shortDate(F.made)})`];
  F.arms.forEach(a=>{
    let t=`${a.num ? "#"+a.num : "No number"}, ${HAND_WORD[a.hand]||HAND_WORD["?"]}${a.pitches.length ? ": "+a.pitches.map(pitchWord).join(", ") : ""}.`;
    if(a.out) t+=typeof a.out==="string" ? ` Out pitch: ${pitchWord(a.out)}.` : ` Out pitch: ${pitchWord(a.out.R)} to righties, ${pitchWord(a.out.L)} to lefties.`;
    if(a.slide==="yes") t+=" Has a slide step."; else if(a.slide==="no") t+=" No slide step.";
    if(a.ttp!=null) t+=` About ${a.ttp.toFixed(2)} seconds to the plate.`;
    if(a.outs.length) t+=` Last outing${a.outs.length>1?"s":""}: ${a.outs.map(o=>`${shortDate(o.date)}, ${o.n} pitch${o.n===1?"":"es"}`).join("; ")}.`;
    out.push(t); });
  if(!F.arms.length) out.push("No pitchers to list yet.");
  return out;
}

function friendHTML(F){ const L=friendLines(F); return `<div class="friend-sheet"><h2>${esc(L[0])}</h2><ul>${L.slice(1).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`; }
// The last look before it goes out. bad: a count like 8 of 11, or a web address. full: a whole name of one of our players
// (only a new team label fixes it). soft: one of our last names (4+ letters) that isn't a word of the team's name; open: the
// soft ones the coach hasn't said are not our players (o.ok). o.team: the team's own name (F.team is the label on it).
function friendScan(F, o){
  o=o||{}; const text=friendText(F), ok=new Set((o.ok||[]).map(x=>String(x).toLowerCase()));
  const bad=[]; if(/\b\d+ of \d+\b/.test(text)) bad.push("x of y"); if(/http/i.test(text)) bad.push("http");
  const teamWords=new Set(nameWords(o.team!=null ? o.team : F.team)), full=[], soft=[];
  namesInText(text).forEach(h=>{ const w=nameWords(h); if(w.length>1) full.push(h); else if(!w.every(x=>teamWords.has(x))) soft.push(h); });
  const open=soft.filter(x=>!ok.has(String(x).toLowerCase()));
  return {bad, full, soft, open, blocked:bad.length>0 || full.length>0 || open.length>0};
}
