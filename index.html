    <div class="checklist">${pairs.map((pr,i)=>`<div class="ci"><span>${lab(pr.a)} and ${lab(pr.b)}</span><div class="seg"><button type="button" data-pair="${i}" data-v="1" aria-pressed="false">Same kid. Merge them</button><button type="button" data-pair="${i}" data-v="0" aria-pressed="true">Different kids</button></div></div>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:14px">Merging puts his games, pitch counts and notes on one record. It can't be split later. Different kids both stay on file.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn primary" data-ok>Save</button></div>`,
    (m, close)=>{
      onSheetCancel(m, ()=>{ if(o.cancel) o.cancel(); });

      $("[data-ok]",m).onclick=settled(()=>{ close(); go(pick); });

function bindTeams(el){
  $$("[data-needs]",el).forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const [team,num]=$$("input",f).map(i=>i.value.trim()); if(!team){ toast("Enter his team"); return; }
    // His old games get his team as their pitching team, so they stop reading "? pitching".
    savePitcherDetails(f.dataset.needs, {team, num}, {filed:id=>fileOldGames(id, team),
      done:(id, merged)=>{ refreshGamePick(); renderTeams(); toast(merged?`Merged with ${pLabel(S.pitchers[id])} on file`:"Saved"); }}); });
  $$("[data-open]",el).forEach(b=>b.onclick=()=>{ ui.pitcherSel=b.dataset.open; ui.delpConfirm=null; renderTeams(); const pe=$("#p-ed"); if(pe) pe.scrollIntoView({block:"start"}); });
  $$("[data-rep]",el).forEach(b=>b.onclick=()=>{ ui.report.pid=b.dataset.rep; ui.report.games=null; setTab("report"); });
  const act=(a,fn)=>{ const b=$(`[data-act="${a}"]`,el); if(b) b.onclick=fn; };
  act("closep",()=>{ ui.pitcherSel=null; ui.delpConfirm=null; renderTeams(); });
  act("addarm",()=>{ const team=ui.teamSel; sheet(`<h3>Add a pitcher: ${esc(teamName(team))}</h3>${pitcherFields(team,null)}<div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Add</button></div>`,(m,close)=>{ bindPitcherFields(m); $("[data-ok]",m).onclick=()=>{ const p=readPitcherFields(m,team); if(!p) return; save(); close(); ui.pitcherSel=p.id; renderTeams(); }; }); });
  act("renameteam",()=>{ const old=ui.teamSel; sheet(`<h3>Rename team</h3><input type="text" id="rt-v" value="${esc(old)}" autofocus><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`,(m,close)=>{ $("[data-ok]",m).onclick=()=>{ const nv=$("#rt-v",m).value.trim(); if(!nv) return; close(); if(nv===old) return;
    const ids=Object.values(S.pitchers).filter(p=>!p.mergedInto && (p.team||"")===old).map(p=>p.id);
    // A game another device is still charting isn't renamed here (its next pitch would put the old name back): that device
    // renames it once his kids' new team reaches it (sync.js teamRenamed). An ended game gets no more pitches, and the
    // device that charted it may be gone for good, so it is renamed here and goes up to the team book (relayed).
    moveArmsToTeam(ids, nv, {done:n=>{ let away=0; S.games.filter(g=>(g.pTeam||"")===old).forEach(g=>{ const ed=Sync.canEdit(g); if(!ed && !g.endedAt){ away++; return; }
      setGameInfo(g, {pTeam:nv}, dev()); if(!ed && !g.conflictOf) Sync.relayed(g); saveGame(g); }); save();
      ui.teamSel=nv; ui.pitcherSel=null; refreshGamePick(); renderTeams();
      toast((n?`Renamed. ${n} kid${n===1?"":"s"} merged.`:"Renamed.")+(away?` ${away===1?"A game":`${away} games`} charted on another device ${away===1?"gets":"get"} the new name from that device.`:""), {ms:away?6000:3000}); }}); }; }); });
  const pid=ui.pitcherSel, p=pid&&S.pitchers[pid];
  if(p){
    // His record is looked up each time something is saved: one that came in from another device while this editor was
    // open is changed in place, and a merge leads to the kid who stayed. Each change is stamped (stampP), so it sticks.
    const rec=()=>S.pitchers[resolvePid(pid)];
    const shown={team:p.team||"", num:p.num||"", name:p.name||"", hand:p.hand==="L"?"L":"R"};
    let tells0=(p.tells||[]).slice();
    $("#pe-id",el).onsubmit=e=>{ e.preventDefault();
      const f={team:$("#pe-team",el).value.trim(), num:$("#pe-num",el).value.trim().replace(/^#/,""), name:$("#pe-name",el).value.trim(), hand:$("#pe-hand",el).value};
      if(!f.num && !f.name){ toast("Enter his number or name"); return; }
      // Only what the coach changed in the form: a detail changed on another device since it was drawn stays.
      Object.keys(f).forEach(k=>{ if(f[k]===shown[k]) delete f[k]; });
      const r=rec(); if(!r) return;
      savePitcherDetails(r.id, f, {done:(id, merged)=>{ ui.pitcherSel=id; ui.teamSel=S.pitchers[id]?S.pitchers[id].team||"":ui.teamSel; ui.delpConfirm=null; refreshGamePick(); renderTeams();
        toast(merged?`Merged. ${pLabel(S.pitchers[id])} has both records now.`:"Saved"); }}); };
    // One pitch on or off: only that one changes, so a pitch another device added meanwhile stays.
    $$("[name=ars]",el).forEach(c=>c.onchange=()=>{ const r=rec(); if(!r) return; const a=(r.arsenal||[]).filter(x=>x!==c.value); if(c.checked) a.push(c.value); stampList(r, "arsenal", r.arsenal, a); r.arsenal=a; save(); });
    $$("[data-velo]",el).forEach(i=>i.onchange=()=>{ const r=rec(); if(!r) return; r.velo=r.velo||{}; r.velo[i.dataset.velo]=i.value.trim(); stampP(r,"velo."+i.dataset.velo); save(); toast("Saved"); });
    // Tells: what the coach added and took out in the box, applied to his tells as they are now.
    $("#pe-tells",el).onchange=e=>{ const r=rec(); if(!r) return; const mine=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean), now=r.tells||[];
      r.tells = JSON.stringify(now)===JSON.stringify(tells0) ? mine : [...now.filter(t=>mine.includes(t) || !tells0.includes(t)), ...mine.filter(t=>!now.includes(t) && !tells0.includes(t))];
      stampList(r, "tells", tells0, mine); tells0=mine; save(); toast("Tells saved"); };   // each tell added or taken off is stamped on its own
    $$("[data-ck]",el).forEach(b=>b.onclick=()=>{ const r=rec(); if(!r) return; const k=b.dataset.ck, v=b.dataset.v; r.check=r.check||{}; if(r.check[k]===v) delete r.check[k]; else r.check[k]=v; stampP(r,"check."+k); save(); renderTeams(); });
    $("#pe-note",el).onsubmit=e=>{ e.preventDefault(); const r=rec(); const t=$("#pe-nt",el).value.trim(); if(!t || !r) return; const by=$("#pe-by",el).value.trim().toUpperCase(); if(by) S.settings.lastInitials=by; (r.notes=r.notes||[]).push({t:Date.now(), by, text:t}); save(); renderTeams(); };
    // Box-score lines: each game is its own line with its own pitches and level, so two on one day add up. A line can
    // instead be the official count for a game we charted; that game has one official count, so a new one replaces the old.
    const bindFor=()=>{ const fs=$("#po-for",el), lv=$("#po-lv",el); if(lv) lv.disabled=false; if(!fs||!lv) return;
      fs.onchange=()=>{ const g=S.games.find(x=>x.id===fs.value); lv.disabled=!!g; if(g) lv.value=g.level==="jv"?"jv":"varsity"; }; };
    $("#po-d",el).onchange=()=>{ $("#po-for-w",el).innerHTML=boxForHTML(pid, $("#po-d",el).value); bindFor(); };
    bindFor();
    $("#pe-out",el).onsubmit=e=>{ e.preventDefault(); const d=$("#po-d",el).value, n=parseInt($("#po-n",el).value,10), fs=$("#po-for",el);
      if(!d||!(n>0)){ toast("Enter the date and pitches"); return; }
      const g=fs&&fs.value ? S.games.find(x=>x.id===fs.value) : null;
      if(g) ((rec()||{}).outings||[]).filter(b=>b.replaces===true && b.game===g.id).map(b=>b.id).forEach(id=>removeBoxLine(pid, id));
      const b=addBoxLine(pid, {date:d, pitches:n, replaces:!!g, game:g?g.id:undefined, level:g?(g.level==="jv"?"jv":"varsity"):$("#po-lv",el).value});
      if(!b){ toast("Enter the date and pitches"); return; }
      renderTeams(); const o=outingsOf(pid).find(x=>x.date===d), tot=o?o.pitches:n;
      toast(g?`Official count saved. ${shortDate(d)}: ${tot} pitches.`:`Box-score line added. ${shortDate(d)}: ${tot} pitches in all.`); };
    $$("[data-delout]",el).forEach(b=>b.onclick=()=>{ const line=((rec()||{}).outings||[]).find(x=>x.id===b.dataset.delout); if(!line) return;
      removeBoxLine(pid, line.id); renderTeams();
      toast("Box-score line removed",{action:"Undo", ms:6000, fn:()=>{ restoreBoxLine(pid, line); renderTeams(); }}); });
    act("merge",()=>{ const dst=$("#pe-merge",el).value; if(!dst){ toast("Pick who he really is"); return; } const r=rec(); if(!r || !S.pitchers[dst] || r.id===dst) return; mergeKids(r.id,dst); ui.pitcherSel=dst; ui.delpConfirm=null; ui.teamSel=S.pitchers[dst].team||""; save(); refreshGamePick(); renderTeams(); toast("Merged. Games and notes moved over."); });
    // Two taps, then an Undo: a deleted kid takes his notes, tells, checklist, velo and box-score lines with him.
    act("delp",()=>{ if(ui.delpConfirm!==pid){ ui.delpConfirm=pid; renderTeams(); return; }
      ui.delpConfirm=null; const keep=S.pitchers[pid];
      delete S.pitchers[pid]; ui.pitcherSel=null; save(); refreshGamePick(); renderTeams();
      toast(`Deleted ${pLabel(keep)}`,{action:"Undo", ms:8000, fn:()=>{ if(S.pitchers[pid]) return; S.pitchers[pid]=keep; ui.pitcherSel=pid; ui.teamSel=keep.team||""; save(); refreshGamePick(); renderTeams(); toast(`${pLabel(keep)} is back`); }}); });
  }
  $$("[data-lv]",el).forEach(b=>b.onclick=()=>{ ui.rosterLv=b.dataset.lv; renderTeams(); });
  const ra=$("#ros-add",el); if(ra) ra.onsubmit=e=>{ e.preventDefault(); const lv=ui.rosterLv||"varsity"; const num=$("#ra-num",el).value.trim().replace(/^#/,""), name=$("#ra-name",el).value.trim(); if(!num&&!name) return; S.roster[lv].push({id:uid(), num, name, bats:$("#ra-bats",el).value}); S.roster[lv].sort((a,b)=>(parseInt(a.num)||999)-(parseInt(b.num)||999)); save(); renderTeams(); setTimeout(()=>{ const n=$("#ra-num"); if(n) n.focus(); },30); };
  $$("[data-rmros]",el).forEach(b=>b.onclick=()=>{ const lv=ui.rosterLv||"varsity"; S.roster[lv]=S.roster[lv].filter(r=>r.id!==b.dataset.rmros); save(); renderTeams(); });
  act("rospaste",()=>{ const lv=ui.rosterLv||"varsity"; let n=0; $("#ros-paste",el).value.split("\n").forEach(line=>{ const parts=line.split(/[,\t]/).map(x=>x.trim()); if(!parts[0]&&!parts[1]) return; const bats=(parts[2]||"R").toUpperCase()[0]; S.roster[lv].push({id:uid(), num:(parts[0]||"").replace(/^#/,""), name:parts[1]||"", bats:["L","S"].includes(bats)?bats:"R"}); n++; }); save(); renderTeams(); toast(`Added ${n}`); });
  const on=$("#our-name",el); if(on) on.onsubmit=e=>{ e.preventDefault(); S.settings.ourName=$("#on-v",el).value.trim()||"Us"; save(); toast("Saved"); };
}

function bandsText(T){ return T.bands.map(b=>`${b.upTo}:${b.rest}`).join(", "); }
function parseBands(s){ const out=s.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.match(/^(?:\d+\s*-\s*)?(\d+)\s*[:=]\s*(\d+)$/); return m?{upTo:+m[1], rest:+m[2]}:null; }); if(!out.length||out.some(x=>!x)) return null; out.sort((a,b)=>a.upTo-b.upTo); return out; }
// When a copy was last changed, for the second-copy rows (a copy saved without that time says so).

function doImport(text){
  try{
    const r=importText(text); ui.report.pid=null; refreshGamePick(); setTab(ui.tab);
    // What a spreadsheet couldn't change here, said plainly.
    const gs=n=>n===1?"1 game":`${n} games`;
    const more=[r.cut?`The sheet left out rows of ${gs(r.cut)}. A sheet doesn't take pitches out by itself, so a copy without them is kept under Changed on two devices. Pick it there if you meant to take them out.`:"",
      r.stale?`${gs(r.stale)} changed here after the sheet was saved, so some of the sheet's changes weren't brought in. Save a new sheet and make them there.`:"",
      r.ignored?"A sheet doesn't change pitchers or the pitching team. Use the Teams tab or Edit game for those.":"",
      // The backup's pitch-count rules on a device whose rules come from Coach's book: said, not used.
      r.rulesLocked?"The backup's pitch-count rules weren't used: the team's rules come from Coach's device.":"",
      // Keep both on the other device made this device's last pitches a game of their own, and the chart moved to it.
      r.part?`The other device kept both copies of this game. Your last ${r.part.n===1?"pitch is":r.part.n+" pitches are"} now a game of their own, and ${r.part.ended?"the chart shows that one":"you're charting that one"}.`:""].filter(Boolean);
    let msg=[r.added?`${r.added} new`:"", r.updated?`${r.updated} updated`:"", r.kept?`${r.kept} already had`:"", r.conflicts?`${r.conflicts} changed on both: pick one below`:"", r.restored?`brought back your ${r.restored.join(" and ")}`:""].filter(Boolean).join(", ");
    msg=msg ? msg.charAt(0).toUpperCase()+msg.slice(1) : (more.length ? "" : "Nothing new");
    if(more.length) msg=[msg && msg+".", ...more].filter(Boolean).join(" ");
    // A backup with edited rules that differ from this device's edited rules: the coach picks.
    if(r.rulesDiffer) toast(msg+". The backup has different pitch-count rules than this device.", {ms:10000, action:"Use the backup's rules", fn:()=>{ if(!useRules(r.rulesDiffer)){ toast("The team's rules come from Coach's device."); return; } setTab(ui.tab); toast("The backup's rules are in. Check them on the Data tab."); }});
    else toast(msg, {ms:more.length?10000:4000});
    if(r.whose) whoseBookSheet(r.whose);
  }catch(e){ toast(e.message||"Couldn't read that"); }
}

/* ---------- LIVE SYNC (Firebase) ----------
   The device that charts a game is its only writer; every other signed-in phone watches it live.
   Each device's own saved copy stays the source of truth and the cloud is only a pipe, so charting never waits
   on signal: games go up whenever there is a connection (the iPad on school Wi-Fi, or a coach's hotspot).
   Our hitters' names never leave the device: only lineup slot, bats and a random roster id go up.
   The Firebase code (fb.js) is a separate file that loads only after sync is set up. */

const SYNC_RULES = "rules_version = '2';\n// Mound Book live sync. Only people Coach lets in can read or write anything.\n// The owner email below is filled in by Mound Book when it shows you these rules.\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn() { return request.auth != null; }\n    function member() { return signedIn() && exists(/databases/$(db)/documents/members/$(request.auth.uid)); }\n    function role() { return get(/databases/$(db)/documents/members/$(request.auth.uid)).data.role; }\n    function owner() { return member() && role() == 'owner'; }\n    function ownerEmail() { return request.auth.token.email != null && request.auth.token.email.lower() == '__OWNER_EMAIL__'; }\n\n    // Claiming the program: only the owner email, only once, and only together with the owner's member record.\n    match /config/owner {\n      allow read: if signedIn();\n      allow create: if signedIn() && ownerEmail()\n        && request.resource.data.uid == request.auth.uid\n        && getAfter(/databases/$(db)/documents/members/$(request.auth.uid)).data.role == 'owner';\n      allow update, delete: if false;\n    }\n    // Pitch-count rules and pitch types: everyone reads, Coach sets them.\n    match /config/{name} {\n      allow read: if member();\n      allow write: if owner() && name != 'owner';\n    }\n    match /members/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || member());\n      allow create: if owner()\n        || (signedIn() && uid == request.auth.uid && ownerEmail()\n            && request.resource.data.role == 'owner'\n            && !exists(/databases/$(db)/documents/config/owner)\n            && existsAfter(/databases/$(db)/documents/config/owner));\n      allow update, delete: if owner();\n    }\n    // \"Let me in\" requests from a new phone. Coach approves them inside Mound Book.\n    match /requests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || owner());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Which devices are running which version, so Coach can see the iPad is up to date.\n    match /devices/{dev} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.uid == request.auth.uid;\n      allow delete: if owner();\n    }\n    // One document per game. Our hitters' names never come here, only lineup slot and bats.\n    // A copy can't go backwards: rev never decreases. A game moves to another device only when Coach moves it\n    // or a signed-in coach taps Take over (that copy names them in takeover).\n    match /games/{gid} {\n      allow read: if member();\n      // Only Coach deletes a game for everyone, or brings a deleted one back.\n      allow create: if member() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if member()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (request.resource.data.writerDev == resource.data.writerDev || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // Opposing pitchers. A merged-away kid stays as a tombstone naming the record he joined (mergedInto).\n    match /pitchers/{pid} {\n      allow read: if member();\n      allow create, update: if member() && request.resource.data.id == pid;\n      allow delete: if owner();\n    }\n\n    // ---------- Brier Stats (basketball) ----------\n    // Its own people list: being let into Brier Stats does not let anyone into Mound Book, and the other way round.\n    // Coach (the Mound Book owner) is in both. Scorers write games; viewers only watch.\n    function hoopsIn() { return signedIn() && (owner() || exists(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid))); }\n    function hoopsScorer() { return signedIn() && (owner() || (exists(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid))\n        && get(/databases/$(db)/documents/hoopsMembers/$(request.auth.uid)).data.role == 'scorer')); }\n    match /hoopsMembers/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || hoopsIn());\n      allow write: if owner();\n    }\n    match /hoopsRequests/{uid} {\n      allow read: if signedIn() && (uid == request.auth.uid || owner());\n      allow create, update: if signedIn() && uid == request.auth.uid\n        && request.resource.data.keys().hasOnly(['email', 'name', 'at']);\n      allow delete: if owner() || (signedIn() && uid == request.auth.uid);\n    }\n    // Rosters and settings.\n    match /hoopsBook/{name} {\n      allow read: if hoopsIn();\n      allow write: if hoopsScorer();\n    }\n    // One document per game, the whole play-by-play inside. A copy can't go backwards (rev never decreases), and a game\n    // moves to another device only when Coach moves it or a scorer taps Take over (that copy names them in takeover).\n    match /hoopsGames/{gid} {\n      allow read: if hoopsIn();\n      allow create: if hoopsScorer() && request.resource.data.id == gid\n        && (request.resource.data.deleted == false || owner());\n      allow update: if hoopsScorer()\n        && request.resource.data.rev >= resource.data.rev\n        && (request.resource.data.deleted == false || owner())\n        && (resource.data.deleted == false || owner())\n        && (resource.data.writer == null || request.resource.data.writer == resource.data.writer\n            || owner() || request.resource.data.takeover == request.auth.uid);\n      allow delete: if owner();\n    }\n    // The table (subs waiting to check in), booth notes and name notes: not stats, so the announcer can add to them too.\n    // Th   function touchDevice(){

    fb.setDoc(ref, {uid:st.uid, email:st.email, name:S.device.name, ver, at:fb.serverTimestamp(), sent:t0, app:ui.standalone?"home screen":"browser"}, {merge:true})
      .then(()=>{ heard(); quotaOk(); const t1=Date.now(); if(t1-t0>3000) return;
        fb.getDoc(ref).then(s=>{ if(!s.metadata.fromCache && s.exists()) clockFrom(s.data(), t0, t1); }, ()=>{}); }, handleErr);
  }
  // The server stamped it between sending (t0) and the answer (t1). A beat written since (another sent) says nothing.
  // It is kept (a device's clock offset rarely changes), so the next session dates its first late news with it. What came
  // in late before it was measured is dated again now.
  function clockFrom(d, t0, t1){ const a=d && d.at && d.at.toMillis ? d.at.toMillis() : 0; if(!(a && d.sent===t0)) return;
    st.skew=a-(t0+t1)/2; st.skewNow=true; const b=box(); if(b.skew!==Math.round(st.skew)){ b.skew=Math.round(st.skew); save(); }
    Object.entries(st.raw).forEach(([id, r])=>{ if(st.seen[id]===r.t && r.srv) st.seen[id]=Math.min(r.now, r.srv-st.skew); }); st.raw={}; paintWatch(); }
  // When game id was last sent by its charting device. late: it may have waited (madeAt); until this session knows its clock
  // offset, the server's time is kept so clockFrom can date it again.
  function seenAt(id, srv, late, now){
    const t=late ? madeAt(srv, now) : now; if(!(t>(st.seen[id]||0))) return;
    st.seen[id]=t; const s=srv && srv.toMillis ? srv.toMillis() : (typeof srv==="number" ? srv : 0);
    if(late && !st.skewNow && s) st.raw[id]={srv:s, now, t}; else delete st.raw[id];
  }
  // When something the server stamped (srv) really happened, on this device's clock, and never later than now. A change or
  // beat that waited while this device had no signal arrives late: it is not news from now. With the clock offset not known
  // yet, the server's time is taken as it is.
  function madeAt(srv, now){ const t=srv && srv.toMillis ? srv.toMillis() : (typeof srv==="number" ? srv : 0); return t ? Math.min(now, t-(st.skew||0)) : now; }
  // The team's devices (names, versions, last seen) for the Data tab and "charted on Dugout iPad". Read when going
  // live, when a device we don't know charts a game, and when the Data tab shows the list (at most every 2 min).
  function loadDevices(force){
    if(!live() || st.devBusy || Date.now()-(st.devAt||0)<(force?5000:120000)) return;
    const {fb, db}=st; st.devBusy=true; st.devAt=Date.now();
    fb.getDocs(fb.collection(db,"devices")).then(s=>{
      if(s.metadata.fromCache) return;
      const was=Object.keys(st.devices).length; s.forEach(d=>{ st.devices[d.id]={...st.devices[d.id], ...d.data()}; }); heard();
      paint(); if(Object.keys(st.devices).length!==was && (watching(cur()) || ui.tab==="log")) refresh([S.cur]);
    }, e=>handleErr(e)).finally(()=>{ st.devBusy=false; });
  }

  /* ----- is anything still coming in? -----
     The device charting a game says so about every 25 s while that game is open on it: one tiny write to its own
     devices doc, at most 144 an hour (about 360 for a 2.5-hour game, 2 games a day well under 1,000 of the free
     plan's 20,000 writes). A phone watching the game listens to that one doc only. Nothing heard for a minute means
     either the charting device went quiet (closed, asleep, no signal) or this one can't reach the cloud even though
     the browser says it's online (field Wi-Fi with no internet behind it). One small read tells which: it either
     answers (the charting device is quiet, or our listeners missed its beat and start again) or doesn't (this device
     can't reach the cloud: the pill says so and the listeners start again, less often each time). */
  const BEAT=25000, QUIET=60000;
  function heard(){ st.heard=Date.now(); if(st.stale){ st.stale=false; st.staleBack=0; paint(); } }
  function watching(g){ return !!g && !g.example && !g.conflictOf && !g.endedAt && live() && !mine(g) && !!writerOf(g); }
  function charting(g){ return !!g && !g.example && !g.conflictOf && !g.endedAt && mine(g); }
  function tick(){
    if(!live() || document.visibilityState==="hidden") return;
    const g=cur();
    if(charting(g) && st.net && navigator.onLine!==false && !st.beatBusy && Date.now()-(st.beatAt||0)>=BEAT) beat(g);
    watchWriter(g);
    if(watching(g) && navigator.onLine!==false && Date.now()-(st.heard||0)>QUIET && !st.probing && Date.now()-(st.probeAt||0)>QUIET) probe(g);
    paintWatch();
  }
  function beat(g){
    const {fb, db}=st; st.beatBusy=true; st.beatAt=Date.now();
    // Only one at a time: with no signal the write waits in the SDK, and a pile of them would all go up later.
    fb.setDoc(fb.doc(db,"devices",S.device.id), {uid:st.uid, at:fb.serverTimestamp(), beat:fb.serverTimestamp(), sent:Date.now(), game:g.id}, {merge:true})
      .then(()=>{ heard(); quotaOk(); }, e=>{ handleErr(e); paint(); }).finally(()=>{ st.beatBusy=false; });
  }
  function unwatchWriter(){ if(st.bsub){ try{ st.bsub(); }catch(e){} } st.bsub=null; st.bw=null; }
  function watchWriter(g){
    const w=watching(g) ? writerOf(g) : null;
    if(st.bw===w || (w && Date.now()-(st.bwErr||0)<QUIET)) return;
    unwatchWriter(); if(!w) return;
    const {fb, db}=st; st.bw=w; let first=true;
    st.bsub=fb.onSnapshot(fb.doc(db,"devices",w), s=>{
      if(s.metadata.fromCache) return;
      const late=first || !st.net || st.stale; first=false;
      heard(); quotaOk(); if(s.exists()) gotBeat(w, s.data(), late); paintWatch();
    }, e=>{ st.bsub=null; st.bw=null; st.bwErr=Date.now(); handleErr(e); });
  }
  // late: the first beat seen after (re)starting, or one read while this device couldn't hear the cloud. It may be old, so it
  // counts from when it was sent (madeAt). A beat that arrives as it is sent is news from that device now.
  function gotBeat(w, d, late){
    st.devices[w]={...st.devices[w], ...d};
    const b=d.beat && d.beat.toMillis ? d.beat.toMillis() : 0, prev=st.bt[w];
    if(!b || b===prev) return false;
    st.bt[w]=b; if(d.game) seenAt(d.game, b, late, Date.now());
    return prev!=null;
  }
  async function probe(g){
    const {fb, db}=st, w=writerOf(g), known=st.bt[w];
    st.probing=true; st.probeAt=Date.now();
    try{
      // One question at a time: with no answer it stays asked, and is answered once the connection is back.
      if(!st.probeP) st.probeP=fb.getDocs(fb.query(fb.collection(db,"devices"), fb.where("game","==",g.id))).finally(()=>{ st.probeP=null; });
      const q=await withTimeout(st.probeP, 10000);
      if(q.metadata.fromCache) throw Object.assign(new Error("No signal"), {code:"unavailable"});
      heard(); quotaOk(); st.net=true;
      const d=q.docs.find(x=>x.id===w);
      // It beat since and our listener never said: the listeners are stuck, start them again.
      if(d && gotBeat(w, d.data(), true) && known!=null){ st.restartAt=Date.now(); restartData(); }
    }catch(e){
      st.stale=true;
      if(Date.now()-(st.restartAt||0)>=(st.staleBack||QUIET)){ st.restartAt=Date.now(); st.staleBack=Math.min(10*60000, (st.staleBack||QUIET/2)*2); restartData(); }
    }
    st.probing=false; paint();
  }
  // The watch box's last line: what this device knows, and how long the charting device has been quiet.
  function watchLine(g){
    if(!watching(g)) return statusText();
    const age=Date.now()-(st.seen[g.id] || (g.edited && g.edited.t) || Date.now()), mins=Math.max(1, Math.round(age/60000));
    if(age<=QUIET) return statusText();
    if(st.stale || !st.net || navigator.onLine===false) return `No update for ${mins} min. This device can't reach the cloud right now: check its Wi-Fi or signal.`;
    return `No update from ${devName(writerOf(g))} for ${mins} min. It may be closed, asleep or out of signal.`;
  }
  function paintWatch(){ const el=$("#view-chart .watch-st"); if(!el) return; const g=cur(); const t=watchLine(g); if(el.textContent!==t) el.textContent=t; }

  /* ----- receiving ----- */
  // Returns the game id when something on this device changed.
  // A game deleted here, or taken off with its season, stays off: the team copy never brings it back.
  function recvGame(d){
    const b=box(); const id=d.id; if(!id || b.hidden[id]) return null;
    if((S.deletedIds||[]).includes(id)){
      // Only a game the cloud deleted comes back, when Coach brings it back. One deleted or archived here never does.
      if(d.deleted || !(b.cloudDel||{})[id]) return null;
      S.deletedIds=S.deletedIds.filter(x=>x!==id); delete b.cloudDel[id];
    }
    const at=S.games.findIndex(x=>x.id===id && !x.conflictOf); const loc=at>=0?S.games[at]:null;
    if(d.deleted){
      if(!loc) return null;
      if(mine(loc) && (loc.rev||0)>(b.pushed[id]||0)) keepCopy(loc);
      dropGame(id); delete b.pushed[id]; b.cloudDel=b.cloudDel||{}; b.cloudDel[id]=true; if(S.cur===id) S.cur=null; return id;
    }
    // Our own write coming back (the server's echo of a push or a take over, or a re-read once the signal returns):
    // this device already has that copy, or something newer (an undo, a Log fix), so it is never taken again.
    const h=b.heads[id], pd=b.pend[id];
    if(d.head && ((h && h.head===d.head && (d.rev||0)<=(h.rev||0)) || (pd && pd.head===d.head && (d.rev||0)<=(pd.rev||0)))) return null;
    let inc; try{ inc=unpack(d); }catch(e){ console.warn("sync: skipped a game that isn't whole", id); return null; }
    if(!loc){ S.games.push(inc); b.pushed[id]=inc.rev||0; landed(inc, false); saveGame(inc); announce(inc); return id; }
    const iWrite=mine(loc) && !!writerOf(loc);
    // Older than what this device sent (the cloud's copy from just before our own push or take over, arriving late):
    // nothing in it is new here. A real take over always comes in above anything this device sent.
    if(iWrite && (inc.rev||0)<(b.pushed[id]||0) && (inc.rev||0)<(loc.rev||0)) return null;
    if(iWrite && inc.writerDev!==S.device.id){
      if(setAsideHolds(id, inc)) return null;   // the copy the coach set aside on the Data tab doesn't come back
      // A book moved to this copy before it signed in, and the team book has it as the copy it came from: this device
      // takes it over (the coach said it is his own book), or asks first (adoptCloud).
      if(adoptHeld(loc, inc)){ adoptCloud(loc, d); return null; }
      // Someone took this game over. What this device had that their copy lacks joins theirs (joinTaken), or when the two
      // went different ways it is kept as a second copy. Then we watch theirs.
      const how=!loc.takeover && joinTaken(loc, inc) ? "joined" : adds(loc, inc) ? "kept" : "";
      if(how!=="joined"){ if(how) keepCopy(loc); keepNames(loc, inc); replaceGame(loc, inc); }
      b.pushed[id]=Math.max(b.pushed[id]||0, inc.rev||0); landed(loc, false); saveGame(loc);
      // A sheet open on this game closes with its own toast (refresh), which says so. What went along is said once it has it.
      if(!st.hush && !(sheetOpen() && ui.sheetGame===id)) toast(movedText(inc.writerDev, how==="joined" ? "" : how), {ms:6000}); return id;
    }
    if(iWrite){ if((inc.rev||0)<(b.pushed[id]||0)) return null; return reconcile(loc, inc) ? id : null; }
    // Watching someone else's game: the charting device's copy wins unless it is older than the last one we had from
    // the cloud. Our own revision number can't be the test: a merge or hand fix here bumps it without new pitches.
    // A newer copy brought in from a file (relay) stays until it goes up.
    const seen=b.pushed[id];
    if(loc.relay && (loc.rev||0)>(inc.rev||0)) return null;
    if(seen!=null && (inc.rev||0)<seen) return null;
    if(seen!=null && (inc.rev||0)===seen && sameLog(inc, loc) && !loc.relay) return null;
    // Changed here since the last cloud copy (a sheet's fix, a file, charting while live sync was off), or this device
    // can't tell: what this copy holds that theirs lacks is never just overwritten. It joins theirs and goes up (relay),
    // or when the logs split it is kept as a second copy.
    // An entry of the charting device's that its copy no longer has, made before it last changed it, was taken out there
    // (an undo from before undo left a mark): it isn't ours to put back (store.js leftOut). What this device charted is.
    const own=leftOut(inc, loc);
    if((loc.relay || seen==null || (loc.rev||0)>seen) && adds(own, inc)){
      const m=mergeGame(own, inc);
      if(m.kind==="conflict"){ keepCopy(own); keepNames(loc, inc); replaceGame(loc, inc); b.pushed[id]=inc.rev||0; landed(loc, false); saveGame(loc);
        const al=st.along[id]; delete st.along[id];
        toast(al ? movedText(al.w, "kept") : "This game was changed in two places. Both copies are on the Data tab.", {ms:al?6000:5000}); return id; }
      const g=m.game===own ? {...own} : m.game; keepNames(loc, g);
      g.rev=Math.max(g.rev||0, loc.rev||0, (inc.rev||0)+1); g.relay=true; g.writerDev=inc.writerDev||g.writerDev;   // still theirs to chart
      replaceGame(loc, g); b.pushed[id]=inc.rev||0; landed(loc, false); saveGame(loc); return id;
    }
    if(seen==null && (inc.rev||0)<(loc.rev||0) && own===loc && !adds(inc, loc)) return null;
    alongIn(id, inc);
    keepNames(loc, inc); replaceGame(loc, inc); b.pushed[id]=inc.rev||0; landed(loc, false); saveGame(loc); return id;
  }
  /* Our own game came back from the cloud different from ours: a second tab on this device, or a relayed file or fix
     (our own pushes coming back are skipped above). Compare what each copy holds, never just revision numbers, so nothing
     is dropped, and the revision never goes down (live sync only sends what is above the last one sent):
     theirs has more: take it. Ours has more: ours goes up above their revision. Both: merge them. When the logs split
     apart and this device has changes it hasn't sent, ours stays the game and theirs is kept as a second copy; otherwise
     ours is kept as the second copy and theirs is the game. Returns true when this device's copy changed. */
  function reconcile(loc, inc){
    const b=box(), id=inc.id, unsent=(loc.rev||0)>(b.pushed[id]||0); b.pushed[id]=Math.max(b.pushed[id]||0, inc.rev||0);
    // A copy that only shows what the other already has (a game rebuilt from a sheet) adds nothing, nor does one the
    // coach set aside on the Data tab.
    const theirs=adds(inc, loc) && !showsAll(inc, loc) && !setAsideHolds(id, inc), ours=adds(loc, inc) && !showsAll(loc, inc);
    if(!theirs){
      if(ours && (loc.rev||0)<=(inc.rev||0)){ loc.rev=inc.rev||0; touch(loc, dev()); saveGame(loc); }
      else if(!ours && (loc.rev||0)<(inc.rev||0)){ loc.rev=inc.rev||0; saveGame(loc); }
      return false;
    }
    const top=Math.max(loc.rev||0, inc.rev||0);
    // Taken as it is, it goes up again as this device's own: the device that relayed it hears it went in (alongIn).
    if(!ours){ keepNames(loc, inc); inc.rev=top; replaceGame(loc, inc); touch(loc, dev()); landed(loc, true); saveGame(loc); return true; }
    const m=mergeGame(loc, inc);
    if(m.kind==="conflict"){
      if(inc.writerDev===S.device.id && unsent){ otherCopy(inc, id); loc.rev=top; touch(loc, dev()); saveGame(loc); }
      else { keepCopy(loc); keepNames(loc, inc); inc.rev=top; replaceGame(loc, inc); landed(loc, true); saveGame(loc); }
      toast("This game was changed in two places. Both copies are on the Data tab.", {ms:5000}); return true;
    }
    const g=m.game; keepNames(loc, g); g.rev=Math.max(g.rev||0, top); if((g.rev||0)<=(inc.rev||0)) touch(g, dev());
    replaceGame(loc, g); landed(loc, true); saveGame(loc); return true;
  }
  // The cloud copy of our own game, kept beside ours for the Data tab (once: the same copy read again adds nothing).
  function otherCopy(inc, mainId){
    if(S.games.some(x=>x.conflictOf===mainId && !x.mine && mergeGame(x, inc).kind==="kept")) return;
    const c={...inc, id:uid(), conflictOf:mainId}; delete c.mine; delete c.relay; S.games.push(c); saveGame(c);
  }
  // A cloud copy has our hitters' names taken out. Where it has the bare placeholder and this device has the name (by
  // lineup slot, or by entry id for a lineup, sub or typed batter), the name stays: they only ever lived here.
  function keepNames(loc, inc){
    if(!loc || !inc || loc===inc) return inc;
    const bare=p=>!!p && !p.name && !p.num, named=p=>!!p && !!(p.name || p.num);
    const put=(m, t)=> bare(t) && named(m) && (!t.rid || t.rid===m.rid) ? {...t, name:m.name, num:m.num, ...(m.own?{own:true}:{})} : t;
    inc.lineup0=(inc.lineup0||[]).map((p,i)=>put((loc.lineup0||[])[i], p));
    const byId=new Map((loc.log||[]).map(e=>[e.id,e]));
    (inc.log||[]).forEach(e=>{ const m=byId.get(e.id); if(!m || m===e || m.k!==e.k) return;
      if(e.k==="lineup") e.lineup=(e.lineup||[]).map((p,i)=>put((m.lineup||[])[i], p));
      if(e.k==="sub") e.player=put(m.player, e.player);
      if(e.k==="adj" && e.batter==="" && m.batter) e.batter=m.batter; });
    return inc;
  }
  // A copy that just came in: pitch types this device doesn't know yet join the catalog, and a hand fixed on his record
  // after the game's entry (a coach fixed it on a phone while the iPad was away) shows. own: this device charts the game,
  // so the fix is stamped and goes out with it; a watched copy is only shown that way.
  // A second copy of it that now holds nothing the game lacks (the copy a Receive kept, and the game just took that same
  // copy from the cloud) leaves nothing to sort out on the Data tab, so it goes.
  function landed(g, own){ learnTypes(gameTypes(g)); dropEchoes(g); return handsFromRecords(g, own); }
  function dropEchoes(g){
    const by=new Map(g.log.map(e=>[e.id,e]));
    S.games.filter(c=>c.conflictOf===g.id && c.log.every(e=>sameEntry(by.get(e.id), e)) && canon(c.lineup0||[])===canon(g.lineup0||[]) && mergeGame(g, c).kind==="kept")
      .forEach(c=>{ if(S.cur===c.id) S.cur=g.id; dropGame(c.id); });
  }
  // Our unsent version, kept beside the team copy. "mine" tells the Data tab which side is which.
  function keepCopy(g){ const c={...JSON.parse(JSON.stringify(g)), id:uid(), conflictOf:g.id, mine:true}; delete c.relay; delete c.takeover; S.games.push(c); saveGame(c); }
  // Charting moved while this device still had something waiting to go up (the pitch charted just before, a fix made with no
  // signal, or a game moved over from v2 on two devices, where each one counts as its maker). When the two copies line up,
  // ours joins the new charting device's and goes up to it (relay), as a file's fix does. Only a split keeps a second copy.
  // It is only said to have gone along once the charting device's own copy holds it (alongIn); st.along holds what it was.
  function joinTaken(loc, inc){
    const own=leftOut(inc, loc); if(!adds(own, inc)) return false;
    const m=mergeGame(own, inc); if(m.kind==="conflict") return false;
    const g=m.game===own ? {...own} : m.game; keepNames(loc, g);
    g.rev=Math.max(g.rev||0, loc.rev||0, (inc.rev||0)+1); g.relay=true; g.writerDev=inc.writerDev||g.writerDev; delete g.takeover;   // still theirs to chart
    const had=new Set(inc.log.map(e=>e.id)); st.along[loc.id]={w:g.writerDev, ids:g.log.filter(e=>!had.has(e.id)).map(e=>e.id)};
    replaceGame(loc, g); return true;
  }
  // The charting device's copy, taken as it is: it holds ours (it went along), or, once ours was in the team copy (sent),
  // that device had charted on before ours reached it and kept ours as a second copy over there (reconcile).
  function alongIn(id, inc){
    const al=st.along[id]; if(!al) return; delete st.along[id];
    const have=new Set(inc.log.map(e=>e.id)), gone=cutIds(inc), lost=al.ids.some(x=>!have.has(x) && !gone.has(x));
    if(!lost) toast(movedText(al.w, "joined"), {ms:6000});
    else if(al.sent) toast(`What you entered just before didn't go along: ${devName(al.w)} charted on first, and kept it as a second copy on its Data tab.`, {ms:6000});
  }
  // how: "joined" (what this device had went along), "kept" (a second copy), or "" (it had nothing new).
  function movedText(w, how){ return `Charting for this game moved to ${devName(w)}.${how==="joined" ? " What you entered just before went along." : how==="kept" ? " What you entered just before is kept as a second copy on the Data tab." : ""} You're watching it now.`; }
  function announce(g){
    const real=S.games.filter(x=>!x.example && !x.conflictOf);
    const cg=cur();
    if(!g.endedAt && (!cg || cg.example || (cg.endedAt && cg.id!==g.id))){ S.cur=g.id; ui.type=null; }
    else if(!g.endedAt && real.length>1) toast(`New game from ${devName(g.writerDev)}: ${gameName(g)}. Pick it under Game.`, {ms:5000});
  }
  /* Pitcher records. Two devices can file the same kid under two ids (the iPad charts Central #14 while a coach's phone
     already had him from a scouting trip). The same strict test a Receive uses decides it's him (one kid on file with that
     team and number, no two different names), and the smaller id wins on every device, so they all agree. A merge made
     anywhere, by that test or by "Same kid twice?", goes up as a tombstone naming the survivor and is redone everywhere.
     Never two kids the coach kept apart, and never a kid renumbered or moved into that slot by hand unless the same name is
     typed on both (movedApart): only the coach can say. */
  function recvPitchers(list){
    const before=new Set(Object.keys(S.pitchers).filter(k=>S.pitchers[k] && !S.pitchers[k].example));
    const recs=[], keyN={};
    list.filter(d=>d.id && !d.deleted).forEach(d=>{ try{ const p=JSON.parse(d.body); if(p && typeof p==="object"){ p.id=d.id; recs.push(p); } }catch(e){ console.warn("sync: bad pitcher", d.id, e); } });
    // Two new records with the same team and number in one batch: a device kept them apart, so neither is matched here.
    // (Our own records coming back don't count.)
    recs.forEach(p=>{ if(S.pitchers[p.id] || resolvePid(p.id)!==p.id) return; const k=pitcherKey(p.team,p.num,p.name); keyN[k]=(keyN[k]||0)+1; });
    let n=0;
    recs.forEach(p=>{ try{ if(recvPitcher(p, before, keyN[pitcherKey(p.team,p.num,p.name)]===1)) n++; }catch(e){ console.warn("sync: pitcher", p.id, e); } });
    list.filter(d=>d.id && d.deleted).forEach(d=>{ try{ if(recvTomb(d)) n++; }catch(e){ console.warn("sync: pitcher", d.id, e); } });
    if(n) n+=teamRenamed();
    return n;
  }
  // Records are changed in place, never swapped for a new object, so a Teams editor or coach drawer that is open on him
  // keeps writing to his real record.
  function replaceRec(lp, rp){ Object.keys(lp).forEach(k=>{ delete lp[k]; }); Object.assign(lp, rp); return lp; }
  function recvPitcher(rp, before, unique){
    const b=box(), id=rp.id, to=resolvePid(id);
    learnTypes(rp.arsenal);
    if(to!==id){   // merged away here: what's new on his old record joins the survivor, and the merge goes up again
      const dst=S.pitchers[to]; if(dst) foldInto(dst, rp);

  /* ----- what a coach can do ----- */
  // Why Take over can't run right now, in words a coach can act on.
  function notLiveText(){

  // The new copy is built inside the transaction from the cloud copy as it is at that moment (the transaction reruns if

  // above the last cloud copy. A copy that only lags behind never does, so a pitch the charting device took back stays out.
  async function takeOver(x, o){
    const id=typeof x==="string" ? x : x && x.id; o=o||{};
    if(!live() || navigator.onLine===false){ toast(notLiveText(), {ms:4500}); return false; }
    const now=()=>S.games.find(y=>y.id===id && !y.conflictOf);
    if(!id || !now()) return false;
    const {fb, db}=st; const ref=fb.doc(db,"games",id);
    try{
      const res=await withTimeout(fb.runTransaction(db, async tx=>{
        const s=await tx.get(ref); const r=s.exists()?s.data():null;
        if(r && r.deleted) return {k:"deleted"};
        const g=now(); if(!g) return {k:"gone"};
        const unsent=!!g.relay || (g.rev||0)>(box().pushed[id]||0);
        let inc=null; if(r){ try{ inc=unpack(r); }catch(e){ inc=null; } }
        let base, split=false;

        return {k:"ok", base, split, head};

  async function adoptTake(ids){

  function bindPanel(el){

    on("rejoin", ()=>{ st.form=st.form==="rejoin"?null:"rejoin"; paint(); const t=$("#sy-join"); if(t) t.focus(); });
    on("setup", ()=>{ st.form="setup"; paint(); });
    on("on", ()=>{ box().off=false; save(); saveThenReload(); });
    on("joinok", ()=>{ const o=readJoin($("#sy-join",el).value); if(!o){ toast("That join code didn't read. Copy all of it, starting with MB1:"); return; } setConfig(o); });
    const readSetup=()=>{ const f=parseFirebase($("#sy-cfg",el).value), owner=$("#sy-owner",el).value.trim().toLowerCase(); if(!f){ toast("Paste the whole firebaseConfig: it needs apiKey and projectId."); return null; } if(!/^\S+@\S+\.\S+$/.test(owner)){ toast("Enter your email."); return null; } return {firebase:f, owner, setup:true}; };

    $$("[data-ok-uid]",el).forEach(b=>b.onclick=async()=>{ try{ await approve(b.dataset.okUid,"coach"); toast("Let in."); }catch(e){ handleErr(e); toast(st.err||"Couldn't do that"); } });

  // em: the email typed. Firebase's own setup is Coach's to fix: on the device he set it up on, or, with the setup built into
  // this site, when he is the one signing in. Anyone else asks Coach; only a join code can be a wrong one.

    const c=String((e&&e.code)||""), cf=conf(), built=!!cf && cf===SYNC_BUILD, setup=!!(box().config && box().config.setup);

    if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "That email and password don't match.";
    if(c.includes("email-already-in-use")) return "That email already has an account. Sign in instead.";
    if(c.includes("weak-password")) return "Use at least 8 characters.";
    if(c.includes("invalid-email")) return "That email doesn't look right.";
    if(c.includes("network")) return "No signal. Try again with a connection.";

/* ---------- shell: tabs, charter/coach mode, theme, keyboard, screen wake ---------- */
const TABS=["chart","log","report","teams","data"];
const RENDER={chart:()=>renderChart(), log:()=>renderLog(), report:()=>renderReport(), teams:()=>renderTeams(), data:()=>renderData()};
function applyTheme(){ const t=S.settings.theme; if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
function setTab(t){
  if(isCharter()) t="chart";
  if(!TABS.includes(t)) t="chart";
  ui.tab=t;
  $$(".tabs [data-tab]").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===t)));
  TABS.forEach(k=>{ $("#view-"+k).hidden = k!==t; });
  if(t!=="chart") document.body.classList.remove("charting");
  RENDER[t]();
  renderBanners(); wake();
  try{ sessionStorage.setItem("mb.tab",t); }catch(e){}
}
function setMode(m){
  S.settings.mode=m; save();
  document.body.classList.toggle("charter", m==="charter");
  const b=$("#mode-btn"); b.classList.toggle("coach", m==="coach");
  $("span",b).textContent = m==="charter" ? "Charter · hold for coach" : "Coach mode";
  b.setAttribute("aria-label", m==="charter" ? "Charter mode. Hold for 2 seconds to switch to coach mode" : "Coach mode. Tap to switch to charter mode");
  $(".tabs").hidden = m==="charter"; $(".gamepick").hidden = m==="charter";
  setTab(m==="charter"?"chart":ui.tab);
}
// Leaving charter mode takes a 2-second hold: hard to do by accident on a bouncing bench, and no PIN to forget.
function bindModeButton(){
  const b=$("#mode-btn"); let t=null;
  const start=e=>{ if(!isCharter()){ return; } if(e.type==="keydown"&&!(e.key==="Enter"||e.key===" ")) return; if(e.repeat) return; e.preventDefault(); b.classList.add("holding"); t=setTimeout(()=>{ b.classList.remove("holding"); t=null; setMode("coach"); toast("Coach mode"); }, 2000); };
  const stop=()=>{ if(t){ clearTimeout(t); t=null; b.classList.remove("holding"); if(isCharter()) toast("Hold it for 2 seconds to get to coach mode"); } };
  b.addEventListener("pointerdown", start); b.addEventListener("keydown", start);
  ["pointerup","pointerleave","pointercancel","keyup"].forEach(ev=>b.addEventListener(ev, stop));
  b.addEventListener("click", ()=>{ if(!isCharter()){ setMode("charter"); toast("Charter mode: hold the button 2 seconds to get back"); } });
  b.addEventListener("contextmenu", e=>e.preventDefault());
}
function refreshGamePick(){
  const s=$("#game-select"); const gs=[...S.games].sort(newestFirst);
  s.innerHTML=gs.map(g=>`<option value="${g.id}" ${g.id===S.cur?"selected":""}>${esc(gameName(g))}${g.conflictOf?" (second copy)":""}</option>`).join("")||"<option>No games</option>";
}
// Keep the screen on while a game is live on the Chart tab. Called after every chart redraw, so one request runs at a time,
// and a change that comes in while it runs is looked at again once it's done.
let _wl=null, _wlBusy=false, _wlAgain=false;
async function wake(){
  if(_wlBusy){ _wlAgain=true; return; }
  _wlBusy=true;
  try{
    const g=cur(), want = ui.tab==="chart" && !!g && !g.endedAt && document.visibilityState==="visible" && !EMBEDDED;
    if(want && !_wl && "wakeLock" in navigator){ const l=await navigator.wakeLock.request("screen"); _wl=l; l.addEventListener("release",()=>{ if(_wl===l) _wl=null; }); }
    else if(!want && _wl){ const l=_wl; _wl=null; await l.release(); }
  }catch(e){ _wl=null; }

}
function onKey(e){
  if(e.key==="Escape"){ if(sheetOpen()){ $("#modal-root").innerHTML=""; ui.keyHandler=null; } ui.prefix=null; return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.repeat) return;   // a held key is one press, not a pitch per repeat (typing and scrolling still work)

  if(sheetOpen()){ if(ui.keyHandler && !typing && ui.keyHandler(e.key)) e.preventDefault(); return; }
  if(typing || ui.tab!=="chart") return;

  const k=e.key.toLowerCase(); const L=replay(g).live;
  // O, G, Q, J wait for a base number. The wait ends after 2.5 seconds or any tap. A key that isn't a number does its own job.
  if(ui.prefix && performance.now()-ui.prefix.t>2500) ui.prefix=null;
  if(ui.prefix){ const p=ui.prefix.k; ui.prefix=null; const n=parseInt(k,10);
    if(p==="o" && n>=1&&n<=3){ e.preventDefault(); addEvent(g,"PK",n); return; }
    if(p==="g" && n>=2&&n<=4){ e.preventDefault(); addEvent(g,"SB",n-1); return; }
    if(p==="q" && n>=2&&n<=4){ e.preventDefault(); addEvent(g,"CS",n-1); return; }
    if(p==="j" && n>=1&&n<=3){ e.preventDefault(); addEvent(g,"PO",n); return; }
    if(/^[0-9]$/.test(k)){ e.preventDefault(); toast("Cancelled"); return; } }
  if(["o","g","q","j"].includes(k)){ e.preventDefault(); ui.prefix={k, t:performance.now()}; toast(({o:"Throw over to which base? 1, 2 or 3",g:"Steals which base? 2, 3 or 4 (home)",q:"Caught stealing at? 2, 3 or 4 (home)",j:"Picked off which base? 1, 2 or 3"})[k]); return; }
  const shown=arsenalFor(g,L.pitcher).filter(c=>c!=="UN");
  if(/^[1-9]$/.test(k)){ const c=shown[+k-1]; if(c){ e.preventDefault(); tapType(c); renderChart(); } return; }
  if(k==="0"){ e.preventDefault(); tapType("UN"); renderChart(); return; }
  const res={b:"B",c:"CS",s:"SS",f:"F",h:"HBP",n:"BF"}[k];
  if(res){ e.preventDefault(); commitPitch(g,{result:res}); return; }
  if(k==="d"){ e.preventDefault(); commitPitch(g,{result:"B", dirt:true}); return; }
  if(k==="x"){ e.preventDefault(); inPlaySheet(g); return; }
  if(k==="i"){ e.preventDefault(); addEvent(g,"IBB"); return; }
  if(k==="m"){ e.preventDefault(); missedSheet(g); return; }
  if(k==="u"){ e.preventDefault(); undoAction(g); return; }
  if(k==="t"){ e.preventDefault(); toggleWatch(); return; }
  if(k==="w"){ e.preventDefault(); addEvent(g,"WP"); return; }
  if(k==="p"){ e.preventDefault(); addEvent(g,"PB"); return; }
  if(k==="z"){ e.preventDefault(); addEvent(g,"BK"); return; }
  if(k==="l"||k==="r"){ e.preventDefault(); const h=k.toUpperCase(); if(L.hand!==h) fixState(g,{hand:h},"side"); return; }
}
async function boot(){
  S = await loadState();

  applyTheme(); save();
  document.body.classList.toggle("charter", isCharter());
  $$(".tabs [data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $("#game-select").onchange=e=>{ S.cur=e.target.value; ui.type=null; ui.h=null; ui.zone=null; ui.ttp=null; stopWatch(); ui.report.pid=null; save(); setTab(ui.tab); };
  $("#btn-newgame-top").onclick=()=>gameSheet(null);
  bindModeButton();
  document.addEventListener("keydown", onKey);
  // A double or bounced tap on a sheet's button: the sheet closes on the first tap and the second lands on whatever is
  // under it (often Undo, or a result). A tap at the same spot right after a sheet closed is dropped. Any tap also ends
  // a waiting O/G/Q/J key.

    const now=performance.now(), c=ui.closedTap, real=e.detail>0;
    if(real && c && now-c.t<500 && Math.abs(e.clientX-c.x)<48 && Math.abs(e.clientY-c.y)<48 && !(e.target.closest && e.target.closest("#modal-root"))){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); ui.closedTap=null; return; }

  try{ refreshGamePick(); }catch(e){ console.warn("game list", e); }

  ui.tab=start;
  try{ setMode(S.settings.mode||"coach"); }catch(e){ console.warn("first draw", e); }
  Sync.init();
  if(SAVE.recovered) toast(`Recovered ${SAVE.recovered} entr${SAVE.recovered===1?"y":"ies"} from the backup copy`, {ms:4000});
  else if(S.migratedFromV2 && !S.migratedSeen){ S.migratedSeen=true; save(); toast("Your games moved to the new version. Old data is still saved as a backup.", {ms:5000}); }
  // Both return promises: a failure (no signal on the first visit, a browser that says no) is caught, not left unhandled.
  if(!EMBEDDED && "serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
  if(ui.standalone && navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist().catch(()=>{}); }catch(e){} }
}
window.__MB = {get S(){ return S; }, get Sync(){ return Sync; }, replay, flushNow, importText, packGames, backupAll, toCSV, SAVE, ui, setTab, setMode, findPitcher, resolvePid, dropGame, mergeInto, setPitcherHand};
boot();
