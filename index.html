<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mound Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mound Book</title>
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
/* Layout: dugout clipboard. Scoreboard strip on top, big tap targets below, result bar pinned to the bottom on upright tablets and phones. Report is a letter-size scouting sheet. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#16211B; --muted:#5A6A61; --line:#D3DBD5;
  --accent:#1F3A68; --accent-ink:#FFFFFF; --ball:#2C7A4B; --strike:#B83227; --out:#B7790A; --warn-bg:#FFF4D6; --bad-bg:#FBE3E0;
  --band0:#2C7A4B; --band1:#7A8F1F; --band2:#B7790A; --band3:#C2410C; --band4:#B83227;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:10px; --bw:1px; --barh:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sun"]){
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2621; --ink:#E5ECE7; --muted:#97A79E; --line:#2B3731;
  --accent:#9DB9EE; --accent-ink:#0E1411; --ball:#5CC488; --strike:#F06A5D; --out:#E6AE3A; --warn-bg:#3A3118; --bad-bg:#3D1C19;
  --band0:#5CC488; --band1:#B5CC4A; --band2:#E6AE3A; --band3:#F08A3C; --band4:#F06A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2621; --ink:#E5ECE7; --muted:#97A79E; --line:#2B3731;
  --accent:#9DB9EE; --accent-ink:#0E1411; --ball:#5CC488; --strike:#F06A5D; --out:#E6AE3A; --warn-bg:#3A3118; --bad-bg:#3D1C19;
  --band0:#5CC488; --band1:#B5CC4A; --band2:#E6AE3A; --band3:#F08A3C; --band4:#F06A5D; color-scheme:dark}
/* Sun mode: black on white, thick borders, solid buttons. Readable in glare. */
:root[data-theme="sun"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --ink:#000000; --muted:#222222; --line:#000000;
  --accent:#0033A0; --accent-ink:#FFFFFF; --ball:#006B2D; --strike:#C00000; --out:#8A5A00; --warn-bg:#FFF0A8; --bad-bg:#FFD6D1;
  --band0:#006B2D; --band1:#4F6B00; --band2:#8A5A00; --band3:#B03A00; --band4:#C00000; --bw:2.5px; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* No double-tap zoom: two quick taps are two taps (and a bounced one is caught in app.js), never a zoom. Pinch zoom still works. */
html,button,input,select,label,.zc,.base{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(40px + var(--barh))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.gamepick{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.gamepick select{max-width:280px;min-width:0}
.mode{position:relative;overflow:hidden;border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;user-select:none;-webkit-user-select:none;touch-action:none;min-height:36px}
.mode .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 30%,transparent);transform-origin:left;transform:scaleX(0)}
.mode.holding .fill{transition:transform 2s linear;transform:scaleX(1)}
.mode span{position:relative}
.mode.coach{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

select,input[type=text],input[type=number],input[type=date],input[type=search]{background:var(--surface);border:var(--bw) solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px;min-width:0}
.btn{border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--strike);border-color:color-mix(in srgb,var(--strike) 45%,var(--line))}
.btn.small{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default}
.label{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.h3note{font-family:var(--f-body);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.flag{background:var(--warn-bg);border:var(--bw) solid color-mix(in srgb,var(--out) 50%,var(--line));border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flag.bad{background:var(--bad-bg);border-color:var(--strike);font-weight:600}
.banners{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.banners:empty{display:none}

.chart-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:860px){.chart-grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

.board{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px 14px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px 14px}
@media (max-width:600px){.board{grid-template-columns:1fr 1fr}}
.cell-lab{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.inning{display:flex;align-items:center;gap:6px}
.inning .num{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:30px;text-align:center}
.step{width:36px;height:36px;border-radius:8px;border:var(--bw) solid var(--line);background:var(--surface-2);font-weight:700}
.count{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;display:flex;align-items:baseline;gap:4px}
.count .b{color:var(--ball)} .count .s{color:var(--strike)} .count .dash{color:var(--muted);font-size:34px}
/* Sun: the count and the pitch count are what the charter reads in glare, so they go bigger and heavier. */
:root[data-theme="sun"] .count{font-size:66px;-webkit-text-stroke:1.5px currentColor;gap:6px}
:root[data-theme="sun"] .count .b{-webkit-text-stroke-color:var(--ball)} :root[data-theme="sun"] .count .s{-webkit-text-stroke-color:var(--strike)}
:root[data-theme="sun"] .count .dash{font-size:44px;-webkit-text-stroke:0}
.lights{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.lights .grp{display:flex;align-items:center;gap:4px}
.lights .grp span{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-right:2px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0}
.dot.on.b{background:var(--ball);border-color:var(--ball)} .dot.on.s{background:var(--strike);border-color:var(--strike)} .dot.on.o{background:var(--out);border-color:var(--out)}
.diamond{width:96px;height:80px}
.diamond .base{cursor:pointer;stroke:var(--muted);stroke-width:2;fill:var(--surface-2)}
.diamond .base.on{fill:var(--out);stroke:var(--out)}
.diamond .plate{fill:var(--line)}
.diamond.big{width:132px;height:110px}
.pcount{text-align:center;min-width:104px}
.pcount .n{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;color:var(--band)}
:root[data-theme="sun"] .pcount .n{font-size:66px;-webkit-text-stroke:1.5px var(--band)}
:root[data-theme="sun"] .pcount .hint{font-size:14px;color:var(--ink);font-weight:600}
.pcount .hint{font-size:12.5px;color:var(--muted);line-height:1.2}
.pcount .book{margin-top:4px}
.pcount .book.ok{color:var(--ball);border-color:var(--ball)}
.pcount .book.off{color:var(--strike);border-color:var(--strike)}
@media (max-width:600px){.pcount{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:center;text-align:left}}
.batbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border-top:var(--bw) solid var(--line);padding-top:10px}
.batbar .who{flex:1;min-width:140px}
.batbar .who b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.hand{display:flex;gap:6px}
.hand button{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:24px}
.hand button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hand.pulse button{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}}
/* A pasted arm whose hand nobody has seen yet: Throws on the charter's form asks once. */
#pf-hand.pulse{animation:pulse 1.2s ease-in-out 3;border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.hand.pulse button,#pf-hand.pulse{animation:none}.mode.holding .fill{transition:none}}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.type{position:relative;min-height:62px;border-radius:10px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:8px 10px 8px 16px;display:flex;flex-direction:column;justify-content:center}
.type::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--pc)}
.type b{font-family:var(--f-display);font-size:22px;line-height:1;letter-spacing:.03em}
.type small{color:var(--muted);font-size:12px;line-height:1.2;margin-top:2px}
.type[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,var(--surface))}
:root[data-theme="sun"] .type[aria-pressed="true"]{background:var(--pc);color:#fff}
:root[data-theme="sun"] .type[aria-pressed="true"] small{color:#fff}
.type.add{border-style:dashed;align-items:center;text-align:center;padding:8px}
.type.add::before{display:none}
.heights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.heights button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.heights button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.zone-wrap{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:start;margin-top:8px}
@media (max-width:420px){.zone-wrap{grid-template-columns:minmax(0,1fr)}}
.zone svg{width:100%;max-width:190px;height:auto;display:block;touch-action:manipulation}
.zsel rect.zc{cursor:pointer}

.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.res{min-height:64px;border-radius:10px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,var(--surface));font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;padding:6px;color:var(--ink)}
.res small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--muted)}
.res:active{background:color-mix(in srgb,var(--rc) 28%,var(--surface))}
:root[data-theme="sun"] .res{background:var(--rc);color:#fff;border-color:#000}
:root[data-theme="sun"] .res small{color:#fff}
.res:disabled{opacity:.35}
.res.undo{--rc:var(--muted)}
/* Upright tablets and phones, and touch tablets held sideways: results and Undo pinned to the bottom so nothing scrolls away. */
.resbar{display:none}
@media (max-width:860px), (orientation:landscape) and (max-height:900px) and (pointer:coarse){
  body.charting{--barh:150px}
  body.charting .results-panel{display:none}
  body.charting .resbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:var(--bw) solid var(--line);
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  body.charting .resbar .res{min-height:56px;font-size:16px;padding:4px}
  body.charting .resbar .res small{display:none}
}
/* Sideways iPad: one row of ten, so the bar stays short. */
@media (orientation:landscape) and (max-height:900px) and (pointer:coarse) and (min-width:861px){
  body.charting{--barh:96px}
  body.charting .resbar{grid-template-columns:repeat(10,minmax(0,1fr))}
}

.run-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.watch{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.watch .t{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:80px}
.watch .go{min-height:52px;min-width:150px;border-radius:10px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.watch .go.live{background:var(--accent);color:var(--accent-ink)}

.pa-strip{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;border:var(--bw) solid var(--line);border-radius:999px;padding:3px 9px 3px 6px;font-size:13px;background:var(--surface-2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.chip.ev{border-style:dashed}
.chip.est{opacity:.7;border-style:dotted}
button.chip{cursor:pointer}
.star{font-size:20px;line-height:1;border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;min-height:36px}
.star[aria-pressed="true"]{background:var(--out);color:#fff;border-color:var(--out)}
.dugout{border:2px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.dugout p{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.dugout.told{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--barh) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;pointer-events:none}
/* Taps go through the toast to the buttons under it; only its own button takes a tap. */
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:6px;padding:6px 10px;font-weight:700;pointer-events:auto;min-height:36px}
/* Pregame: is this device ready to chart? */
.pregame{border:var(--bw) solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2);font-size:14px;margin:0 0 10px}
.pregame ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px}
.pregame li::before{content:"✓";color:var(--ball);font-weight:700;margin-right:5px}
.pregame li.warn{color:var(--strike);font-weight:600}
.pregame li.warn::before{content:"!";color:var(--strike)}
.pregame p{margin:6px 0 0;font-weight:600}
.sheet-modal .pregame{margin:0}
.pf{display:flex;flex-direction:column;gap:10px}

.mixbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.mixbar span{background:var(--pc);height:100%}
.mixlist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.mixlist .bar{height:10px;border-radius:3px;background:var(--pc);min-width:2px}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet-modal{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;border:var(--bw) solid var(--line)}
.sheet-modal h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.opt{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;padding:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
:root[data-theme="sun"] .opt[aria-pressed="true"]{background:var(--accent);color:#fff}
.opt:disabled{opacity:.35}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld-help{font-size:13px;margin:4px 0 0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.lineup-ed{display:grid;grid-template-columns:40px 64px minmax(0,1fr) 96px 36px;gap:6px;align-items:center}
@media (max-width:520px){.lineup-ed{grid-template-columns:36px 54px minmax(0,1fr) 80px 32px}}
.picklist{display:flex;flex-wrap:wrap;gap:6px}
.picklist button{border:var(--bw) solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-weight:600}
.picklist button[disabled]{opacity:.35}
.stepper{display:flex;gap:6px;align-items:center}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:28px;text-align:center}

kbd{display:none;font-family:var(--f-body);font-size:11px;font-weight:600;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}
.kbd-help{display:none}
@media (hover:hover) and (pointer:fine){ kbd{display:inline-block} .kbd-help{display:block} .type kbd{position:absolute;top:6px;right:6px} .res kbd,.opt kbd{margin-right:6px;vertical-align:2px} }

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;color:var(--muted)}
td.l,th.l{text-align:left}
td.wrap{white-space:normal}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
textarea{width:100%;min-height:110px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:8px;padding:8px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.meter{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.checklist{display:grid;gap:8px}
.checklist .ci{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 10px;align-items:center}
@media (max-width:520px){.checklist .ci{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:4px}
/* One pitcher per row on the Official counts sheet: on a phone the controls wrap, no table, no side scroll. */
.prow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.prow .oc-off{color:var(--strike);font-size:13px;font-weight:600}
/* Paste pitch counts (Teams tab): rows wrap on a phone, long names break, nothing scrolls sideways. */
.pa{gap:10px}
.pa .prow>*{min-width:0;overflow-wrap:anywhere}
.pa .prow .seg button{min-height:34px;padding:4px 10px}
.pa-tick{display:inline-flex;gap:6px;align-items:baseline}
.pa-games{flex-direction:column}
.pa-games button{text-align:left;font-weight:500}
.pa-games button.pa-likely{border-color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pa-err{color:var(--strike);font-size:13px;font-weight:600}
.lately-line{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.lately-line>span{min-width:0;overflow-wrap:anywhere}
/* the pitcher editor: a row per tell, the senior tick, what another coach saw */
.tk-row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tk-row .tk-t{flex:1 1 100%;min-width:0;overflow-wrap:anywhere;font-weight:600}
.tk-row .tk-ok{display:inline-flex;gap:6px;align-items:center}
.tk-row .tk-held{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tk-row input[type=number]{width:64px}
.tk-row .tk-no{font-size:13px}
.pe-sr{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.pe-sr input{margin-top:3px}
.fr{gap:10px;margin-top:8px}
.fr .checks label{min-height:32px}
.pe-notes p{min-width:0}
.seg button{border:var(--bw) solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-height:38px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ===== REPORT ===== */
.rep-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.rep-controls .games{display:flex;flex-wrap:wrap;gap:6px 14px}
.rep-controls label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.report{--pi:var(--ink);--pm:var(--muted);--pl:var(--line);--pbg:var(--surface);margin-top:14px;display:flex;flex-direction:column;gap:14px}
.rpage{background:var(--pbg);border:1px solid var(--pl);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;color:var(--pi)}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;border-bottom:3px solid var(--pi);padding-bottom:8px}
.rhead h1{margin:0;font-family:var(--f-display);font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.rhead .sub{font-size:13px;color:var(--pm)}
.rhead .meta{text-align:right;font-size:12.5px;color:var(--pm)}
.draft{display:inline-block;border:2px solid var(--strike);color:var(--strike);font-family:var(--f-display);font-weight:700;letter-spacing:.12em;padding:0 6px;border-radius:4px;font-size:14px;vertical-align:4px;margin-left:6px}
.tells{border:2px solid var(--pi);border-radius:6px;padding:6px 10px;font-size:14px}
.tells b{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.rsec h2{margin:0 0 6px;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--pl);padding-bottom:3px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rsec h2 em{font-style:normal;font-family:var(--f-body);font-weight:500;letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--pm)}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--pl);border-radius:6px;overflow:hidden}
@media (max-width:620px){.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.five div{padding:6px 8px;border-right:1px solid var(--pl);border-bottom:1px solid var(--pl);margin:0 -1px -1px 0}
.five b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.05}
.five span{font-size:11px;color:var(--pm);text-transform:uppercase;letter-spacing:.05em}
.approach{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan .side{border:1.5px solid var(--pi);border-radius:6px;padding:8px 10px}
.plan .side h3{margin:0 0 4px;font-family:var(--f-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.plan ul,.notes-list{margin:0;padding-left:17px;display:grid;gap:3px;font-size:13.5px}
.plan li::marker,.notes-list li::marker{color:var(--strike)}
.callout{border-left:4px solid var(--out);padding:5px 10px;background:color-mix(in srgb,var(--out) 9%,transparent);font-size:13.5px;border-radius:0 4px 4px 0}
.rtable{font-size:12.5px}
.rtable th,.rtable td{padding:3px 6px}
.rtable td.pt{text-align:left;font-weight:600}
.rtable td.pt i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--pc);margin-right:5px}
.rtable td.dim,.dim{color:var(--pm);opacity:.55}
.rtable td.hm{background:color-mix(in srgb,var(--pc) var(--a),transparent)}
.cmx-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cmx-pair{grid-template-columns:minmax(0,1fr)}}
.cmx-title{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.cmx{display:grid;grid-template-columns:22px repeat(4,minmax(0,1fr));gap:3px;font-size:11px}
.cmx .ax{font-family:var(--f-display);color:var(--pm);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.04em}
.cmx .c{border:1px solid var(--pl);border-radius:4px;padding:3px 4px;min-height:48px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cmx .c .h{display:flex;justify-content:space-between;color:var(--pm);font-size:10.5px}
.cmx .c .h b{color:var(--pi);font-family:var(--f-display);font-size:12.5px}
.cmx .c .top{font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmx .c .mixbar{height:9px;border-radius:2px}
.cmx .c.empty{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--pl) 60%,transparent) 5px 6px)}
.rgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.rgrid2{grid-template-columns:minmax(0,1fr)}}
.runbox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--pl);border-radius:6px;overflow:hidden;margin-bottom:6px}
.runbox div{padding:4px 8px;border-right:1px solid var(--pl)}
.runbox div:last-child{border-right:0}
.runbox b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.05}
.runbox span{font-size:10.5px;color:var(--pm);text-transform:uppercase;letter-spacing:.05em}
.scout-notes{white-space:pre-wrap;font-size:13px;border:1px dashed var(--pl);border-radius:6px;padding:6px 10px;min-height:40px}
.ours td{white-space:normal;vertical-align:top}
.foot{font-size:10.5px;color:var(--pm);border-top:1px solid var(--pl);padding-top:5px}
.editor textarea{min-height:120px;font-size:14px;background:var(--surface)}
.side-by-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.side-by-side{grid-template-columns:minmax(0,1fr)}}

/* hitter's card preview */
.cardsheet{display:flex;flex-direction:column;gap:0;border:1px solid var(--pl);border-radius:6px;background:var(--pbg,var(--surface));color:var(--ink)}
.hcard{padding:18px 22px;display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.3}
.hcard + .hcard{border-top:2px dashed var(--line)}
.hcard h2{margin:0;font-family:var(--f-display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.hcard .hl{font-size:16px;color:var(--muted)}
.hcard .tl{border:2px solid var(--ink);border-radius:6px;padding:6px 10px;font-weight:700}
.hcard .tl .unok{font-weight:500;font-size:.75em;color:var(--muted);white-space:nowrap}
.hcard ul{margin:0;padding-left:22px;display:grid;gap:6px}
.hcard .appr{font-family:var(--f-display);font-weight:700;font-size:26px}

/* paper chart and charter sheet (print only, previewed on screen) */
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:14px;overflow-x:auto}
.paper table{font-size:11px;color:#000;table-layout:fixed;width:100%;min-width:760px;border-collapse:collapse}
.paper th,.paper td{border:1px solid #000;padding:2px 4px;height:22px;color:#000}
.paper .key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 14px;font-size:11px;margin:6px 0}
.cheat{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:18px;font-size:17px;line-height:1.35}
.cheat h2{font-family:var(--f-display);font-size:30px;margin:0 0 8px;text-transform:uppercase}
.cheat ol{padding-left:24px;display:grid;gap:8px;margin:0}

/* staff sheet on the Teams tab: one card per arm, one column on a phone, two on an iPad */
.st-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:10px 0}
.st-for{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;flex:1 1 100%}
.st-fr{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
.st-fr input{width:22px;height:22px}
.st-band{display:grid;gap:4px;font-size:14px;margin:10px 0}
.st-band p{margin:0}
.st-h{margin:14px 0 6px;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.staff-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:600px){.staff-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.staff-arm{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;overflow-wrap:anywhere;font-size:14px}
.staff-arm:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.staff-arm .st-arm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px}
.staff-arm .st-arm-h .btn{margin-left:auto}
.staff-arm .label{margin-right:4px}
.staff-arm .st-facts{margin:0;padding-left:18px}
.st-low{margin:10px 0 0;font-size:14px}
#st-text{width:100%;min-height:110px;margin-top:10px}
.st-preview{margin-top:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.st-preview .friend-sheet{font-size:15px;padding:10px 12px}
.st-preview .friend-sheet h2{font-size:18px}
/* staff sheet and the copy for another coach on paper. staffFit measures the sheet off screen, so these hold on screen too.
   Landscape comes from the #mb-page style print.js adds. No named page here: in Chromium a named page with the
   -webkit-box clamps below pushes all but the title onto a second page. */
.staff-sheet{line-height:1.15;font-size:calc(8.5pt*var(--k,1));color:#111;background:#fff;font-family:var(--f-body)}
.staff-sheet .ss-head{display:flex;gap:12pt;justify-content:space-between;margin-bottom:4pt}
.staff-sheet .ss-l{flex:1 1 55%;min-width:0}
.staff-sheet .ss-r{flex:0 1 44%;min-width:0}
.staff-sheet .ss-t{font-family:var(--f-display);font-size:1.6em;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.staff-sheet .ss-lab{font-weight:700}
.staff-sheet .ss-st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8pt}
.staff-sheet table{table-layout:fixed;width:100%;border-collapse:collapse;font-size:1em}
.staff-sheet thead{display:table-header-group}
.staff-sheet tr{break-inside:avoid}
.staff-sheet th,.staff-sheet td{border:.5pt solid #888;padding:2pt 3pt;vertical-align:top;text-align:left;white-space:normal;overflow-wrap:anywhere;color:#111}
.staff-sheet th{background:#ececec;font-size:.92em;color:#111}
.staff-sheet .ss-foot{margin-top:4pt;color:#333;display:grid;gap:1pt}
.staff-sheet .cl1,.staff-sheet .cl2,.staff-sheet .cl3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.staff-sheet .cl1{-webkit-line-clamp:1}
.staff-sheet .cl2{-webkit-line-clamp:2}
.staff-sheet .cl3{-webkit-line-clamp:3}
.staff-sheet .nw{white-space:nowrap}
.staff-sheet .st-last{display:flex;gap:3pt;align-items:baseline}
.staff-sheet .st-last .cl1{flex:1 1 auto;min-width:0}
.staff-sheet .st-more{flex:none}
.friend-sheet{font-size:13pt;line-height:1.35;color:#111;background:#fff;font-family:var(--f-body);page:land;overflow-wrap:anywhere}
.friend-sheet h2{font-family:var(--f-display);font-size:20pt;margin:0 0 8pt;line-height:1.1}
.friend-sheet ul{margin:0;padding-left:18pt;display:grid;gap:5pt}

#print-root{display:none}
@page{size:letter;margin:.32in}
@page land{size:letter landscape;margin:.3in}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f4f4f4;--ink:#111;--muted:#555;--line:#c9c9c9;--ball:#1d6b3d;--strike:#b0261c;--out:#a66c00;color-scheme:light}
  html,body{background:#fff!important;color:#111}
  body{font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;--barh:0px}
  body::before{display:none}
  .top,.wrap,#modal-root,.toast,.resbar{display:none!important}
  #print-root{display:block}
  .rpage{border:0;border-radius:0;padding:0;gap:7px;break-after:page}
  .rpage:last-child{break-after:auto}
  .rhead h1{font-size:24px}
  .rsec{break-inside:avoid}
  .rtable{font-size:9px}
  .rtable th,.rtable td{padding:1.5px 4px}
  .plan ul,.notes-list{font-size:10px;gap:1px}
  .callout{font-size:10px;padding:3px 8px}
  .five b{font-size:17px}
  .five div{padding:3px 6px}
  .five{grid-template-columns:repeat(5,1fr)}
  .approach{font-size:16px}
  .tells{font-size:11px;padding:3px 8px}
  .rsec h2{font-size:12px;margin-bottom:3px}
  .rgrid2,.plan{grid-template-columns:1fr 1fr}
  .runbox b{font-size:15px}
  .scout-notes{font-size:10px}
  .cardsheet{border:0;border-radius:0}
  .hcard{height:5.02in;overflow:hidden;font-size:calc(17pt*var(--k,1));padding:.15in .25in;break-inside:avoid}
  .cardsheet{break-after:avoid}
  .hcard h2{font-size:calc(26pt*var(--k,1))}
  .hcard .appr{font-size:calc(20pt*var(--k,1))}
  .hcard .hl{font-size:calc(12pt*var(--k,1))}
  .paper{border:0;padding:0;page:land}
  .paper table{font-size:9pt}
  .paper th,.paper td{height:.27in}
  .paper table{min-width:0}
  .cheat{border:0;padding:0;font-size:15pt}
}

/* Phones: the header scrolls away and packs into three tidy rows */
@media (max-width:600px){
  .top{position:static}
  .brand{order:1} #mode-btn{order:2;margin-left:auto}
  .tabs{order:3;width:100%} .gamepick{order:4;width:100%;margin-left:0;flex-wrap:nowrap}
  .gamepick select{flex:1;max-width:none} .gamepick .label{display:none}
  body.boxview .gamepick{display:none}
}

/* Live sync: the header pill, watch mode on a game another device charts */
.syncpill{border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px 3px 9px;min-height:30px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.syncpill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncpill[data-s="ok"]::before{background:var(--ball)}
.syncpill[data-s="warn"]::before{background:var(--out)}
.syncpill[data-s="bad"]{border-color:var(--strike)} .syncpill[data-s="bad"]::before{background:var(--strike)}
.ro{opacity:.9} .ro button,.ro select,.ro input,.ro textarea{pointer-events:none}
.watchbox{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
/* Coach box view (box.js): Coach's phone while we hit. One column on a phone, in this order: the count line, this count,
   the run pill, the status, the pitcher, today, this hitter, running details, the buttons. At 700 px and up two columns
   (count, this count, pitcher, today on the left; hitter, pill and running on the right). Nothing wider than the screen. */
.cbox{display:flex;flex-direction:column;gap:12px;margin-top:12px;min-width:0;overflow-wrap:anywhere}
.cb-l,.cb-r{display:contents}
.cbox .cb-o1{order:1} .cbox .cb-o2{order:2} .cbox .cb-o3{order:3} .cbox .cb-o4{order:4} .cbox .cb-o5{order:5} .cbox .cb-o6{order:6} .cbox .cb-o7{order:7} .cbox .cb-o8{order:8}
.cb-blk{min-width:0}
.cbox p{margin:0}
.cb-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cb-sit{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.01em;min-width:0}
.cb-count{color:var(--accent)}
.cb-sit .nw{white-space:nowrap}
.cb-dia{width:54px;height:40px;flex:none}
.cb-dia rect{fill:var(--surface-2);stroke:var(--muted);stroke-width:2}
.cb-dia rect.on{fill:var(--out);stroke:var(--out)}
.cb-top{font-family:var(--f-display);font-weight:700;line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px}
.cb-top b{font-size:clamp(40px,14vw,60px);text-transform:uppercase;letter-spacing:.01em;min-width:0}
.cb-top span{font-size:34px}
.cb-rest{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15;margin-top:4px!important}
.cb-why{font-size:17px;font-weight:600;margin-bottom:4px!important}
.cb-side{color:var(--muted);font-size:14px;margin-top:4px!important}
.cb-pill{--pc:var(--muted);display:flex;align-items:center;gap:10px;border:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--surface));border-radius:999px;padding:8px 18px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;min-height:56px}
.cb-pill i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--pc)}
.cb-pill.go{--pc:var(--ball)} .cb-pill.jump{--pc:var(--out)} .cb-pill.great{--pc:var(--strike)}
.cb-pill.none{font-size:20px;font-weight:600}
.cb-st{font-size:14px}

<script>
(function(){
"use strict";
const MB_VERSION="3.1.0";
/* ---------- constants ---------- */
const STORE_KEY = "moundbook.v1";
const CATALOG = [
  {code:"FB", name:"Fastball", color:"#D7263D"},
  {code:"2S", name:"2-Seam / Sinker", color:"#EE8A25"},
  {code:"CT", name:"Cutter", color:"#8A5A3B"},
  {code:"SL", name:"Slider", color:"#D9A600"},
  {code:"SW", name:"Sweeper", color:"#9C7BD6"},
  {code:"CB", name:"Curveball", color:"#2E6FD8"},
  {code:"BRK", name:"Breaking ball", color:"#5D4BD1"},
  {code:"CH", name:"Changeup", color:"#2BA84A"},
  {code:"SPL", name:"Splitter", color:"#17A2B8"},
  {code:"KN", name:"Knuckleball", color:"#7D5BA6"},
  {code:"UN", name:"Not sure", color:"#8C949A"}
];
const DEFAULT_ARSENAL = ["FB","CB","SL","CH"];
const EXTRA_COLORS = ["#E056A0","#6B7A8F","#A0522D","#3FA796","#C2185B","#4E7D2E"];
const RESULTS = {
  B:{label:"Ball", short:"Ball", abbr:"b"},
  CS:{label:"Called strike", short:"Called", abbr:"c"},
  SS:{label:"Swinging strike", short:"Whiff", abbr:"s"},
  F:{label:"Foul", short:"Foul", abbr:"f"},
  BF:{label:"Foul bunt", short:"Foul bunt", abbr:"fb"},
  IP:{label:"In play", short:"In play", abbr:"x"},
  HBP:{label:"Hit by pitch", short:"HBP", abbr:"hbp"},
  CI:{label:"Catcher's interference", short:"Catcher's int.", abbr:"ci"},
  ILL:{label:"Illegal pitch, bases empty (ball)", short:"Illegal pitch", abbr:"ip"},
  UNK:{label:"Missed pitch (estimated)", short:"Missed", abbr:"?"}
};
const IP_RESULTS = [["OUT","Out"],["1B","Single"],["2B","Double"],["3B","Triple"],["HR","Home run"],["E","Error"],["FC","Fielder's choice"],["DP","Double play"],["SAC","Sacrifice"]];
const ENDINGS = [["K","Strikeout"],["BB","Walk"],["HBP","Hit by pitch"],...IP_RESULTS];
const EVENTS = {PK:"Throw over", PO:"Picked off", SB:"Stolen base", CS:"Caught stealing", WP:"Wild pitch", PB:"Passed ball", BK:"Balk", IBB:"Intentional walk"};
const HITS = new Set(["1B","2B","3B","HR"]);
const HEIGHTS = {U:"Up", M:"Middle", D:"Down"};

const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
// JSON with sorted keys, so two copies of the same thing always compare equal.
const canon = o => JSON.stringify(o, (k,v)=> v && typeof v==="object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}) : v);
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- pitchers ----------
   Each kid has a stable id that never changes. Team, jersey number and name are details on his record, so a rename,
   renumber or team change never touches a game log. Older ids built from team + number (like "westlake#22") are just ids too. */
const slug = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
// A jersey number cleaned up for matching: "#07" -> "07".
function normNum(num){ return String(num==null?"":num).replace(/[^0-9a-z]/gi,"").toLowerCase(); }
// Matching key: same team and number, or same team and name when there's no number. Used to find a kid, never as his id.
function pitcherKey(team, num, name){ const t=slug(team)||"team"; const n=normNum(num); return n ? `${t}#${n}` : `${t}@${slug(name)||"unknown"}`; }
function newPitcherId(){ return "p-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }
function newPitcher(o){
  const p={id:o.id||newPitcherId(), team:o.team||"", num:String(o.num||""), name:o.name||"", hand:o.hand||"R",
    arsenal:o.arsenal||DEFAULT_ARSENAL.slice(), tells:o.tells||[], check:o.check||{}, notes:o.notes||[], velo:o.velo||{},
    plan:o.plan||null, card:o.card||null, outings:o.outings||[], example:!!o.example, mergedInto:null};
  // When each part last changed (ed, and edAt for older versions), box-score lines removed on purpose, kids the coach
  // said are someone else (apart), and stub: a stand-in made before his real record reached this device.
  if(o.edAt) p.edAt=o.edAt;
  if(o.ed && typeof o.ed==="object") p.ed={...o.ed};
  if(Array.isArray(o.boxGone) && o.boxGone.length) p.boxGone=o.boxGone.slice();
  if(Array.isArray(o.apart) && o.apart.length) p.apart=o.apart.slice();
  if(o.stub) p.stub=true;
  return p;
}
// Edit stamps. p.ed says when each part of his record last changed on purpose: team, num, name, hand, arsenal, tells, and
// "check.<item>" / "velo.<range>" for each checklist answer and velo range. Two devices' copies keep the newer of each
// part, so a fix or a removal made anywhere sticks. Older records only have edAt, for the four details.
const P_DETAILS=["team","num","name","hand"];
function edStamp(p, f){ if(!p) return 0; if(p.ed) return p.ed[f]||0; return P_DETAILS.includes(f) ? p.edAt||0 : 0; }
// Markers kept as checklist keys, so a 3.0.0 build copies and merges them key by key (and never shows them):
// x.handUnk, his hand isn't known yet (an arm from a pasted box score; p.hand still holds R or L for the game entries);
// x.grad, his class year; x.ok.<tell key>, a tell someone confirmed ("yes" or "3/4"); x.home, one of our own kids (seen
// only in practice here), so his record stays on this device after those games are gone (store.js homeOnly, markHome).
const HAND_UNK="x.handUnk", GRAD="x.grad", TELL_OK="x.ok.", HOME="x.home";
// Known unless the flag is newer than his hand. Equal stamps read known: a 3.0.0 join that puts the flag back gives it the
// hand's stamp (raiseHand keeps the hand at or after the flag).
function handKnown(p){ return !!p && ((p.check||{})[HAND_UNK]==null || edStamp(p,"hand")>=edStamp(p,"check."+HAND_UNK)); }
function raiseHand(p){ if(!p || !p.ed) return p; p.ed.hand=Math.max(p.ed.hand||0, p.ed["check."+HAND_UNK]||0); p.edAt=Math.max(p.edAt||0, p.ed.hand); return p; }
// The spring season a date counts toward: July on counts toward next spring. 0 for no date.
function seasonYear(d){ d=String(d||""); if(!/^\d{4}-\d{2}/.test(d)) return 0; return +d.slice(0,4) + (+d.slice(5,7)>=7 ? 1 : 0); }
// His class has finished its last season by date d (today when not given).
function graduated(p, d){ const g=+(((p&&p.check)||{})[GRAD]||0); return g>0 && seasonYear(d||today())>g; }
function stampP(p, ...fs){
  if(!p) return p;
  if(!p.ed){ p.ed={}; if(p.edAt) P_DETAILS.forEach(k=>{ p.ed[k]=p.edAt; }); }
  const t=Date.now(); fs.forEach(f=>{ p.ed[f]=Math.max(t, (p.ed[f]||0)+1); });
  const d=Math.max(0, ...P_DETAILS.map(k=>p.ed[k]||0)); if(d) p.edAt=d;   // older versions read edAt
  return p;
}
// He was moved into his team and number on purpose (a renumber or team change), not filed there. Filling in a number,
// team or name he didn't have yet is finishing his details, not a move: renamePitcher stamps that as fill.<detail> too.
const slotStampMoved=(p, k)=>edStamp(p,k)>edStamp(p,"fill."+k);
function slotMoved(p){ return !!p && (slotStampMoved(p,"team") || slotStampMoved(p,"num") || (!normNum(p.num) && slotStampMoved(p,"name"))); }
// A pitch or tell put on or taken off his lists gets its own stamp (ars.<code>, tell.<text>), so two devices that each
// add a different one both keep theirs, and a removal wins only over that same item. Returns how many changed.
const LIST_ITEM={arsenal:"ars", tells:"tell"};
function stampList(p, k, before, after){
  if(!p || !LIST_ITEM[k]) return 0; const b=new Set((before||[]).filter(Boolean)), a=new Set((after||[]).filter(Boolean));
  const ch=[...[...a].filter(x=>!b.has(x)), ...[...b].filter(x=>!a.has(x))];
  // The whole list is stamped too (k), for older builds that read only that, and k~ says this build wrote it along with
  // the items' own stamps. A later whole-list stamp with no k~ to match came from an older build (see mergePitcher).
  if(ch.length){ stampP(p, k, ...ch.map(x=>LIST_ITEM[k]+"."+x)); p.ed[k+"~"]=p.ed[k]; }
  return ch.length;
}
function pLabel(p){ if(!p) return "?"; const n=p.num?"#"+p.num:""; return [n, p.name].filter(Boolean).join(" ") || "Unknown"; }

/* ---------- pitch-count rules ---------- */
// One table per level. Numbers are loaded from the state association's current policy and stay editable.
function restDays(table, n){ if(!table||!table.bands) return null; for(const b of table.bands){ if(n<=b.upTo) return b.rest; } return table.bands.length?table.bands[table.bands.length-1].rest:null; }
// Over the daily max: the warning and the table's own top band next to it (never a date): "Over the 120 max. 4 days rest."
function overMaxText(table, n){ const r=restDays(table, n); return `Over the ${table.max} max.${r==null ? "" : ` ${r} day${r===1?"":"s"} rest.`}`; }
// The first pitch count that lands in a band with more rest than he has now.
function nextBand(table, n){ if(!table||!table.bands) return null; const cur=restDays(table,n); const i=table.bands.findIndex(b=>b.rest>cur); if(i<0) return null; return {at:i>0?table.bands[i-1].upTo+1:0, rest:table.bands[i].rest}; }
function bandIndex(table, n){ if(!table||!table.bands) return 0; const i=table.bands.findIndex(b=>n<=b.upTo); return i<0?table.bands.length-1:i; }
function nearBandLine(table, n, within){ if(!table||!table.bands) return false; return table.bands.some(b=>Math.abs(n-(b.upTo+0.5))<=within+0.5); }
function addDays(date, d){ const t=new Date(date+"T12:00:00"); t.setDate(t.getDate()+d); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
// Rest days are calendar days after the game date; eligible the day after the last rest day.
function eligibleDate(date, rest){ return rest==null?null:addDays(date, rest+1); }
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }

/* ---------- game log + replay ----------
   A game is an ordered log of entries. Everything else (count, outs, runners, batter, pitch counts)
   is rebuilt by replaying the log, so any edit in the middle fixes everything after it. */
function newGame(p){
  const t=Date.now();
  return {v:3, id:uid(), date:p.date||today(), pTeam:p.pTeam||"", bTeam:p.bTeam||"", hitting:p.hitting||"us", level:p.level||"varsity",
    practice:!!p.practice, example:!!p.example, chartedBy:p.chartedBy||"", lineup0:p.lineup0||[], spot0:p.spot0==null?(p.lineup0&&p.lineup0.length?0:null):p.spot0,
    log:[], pop:[], created:{t, dev:p.dev||""}, edited:{t, dev:p.dev||""}, sentAt:null, endedAt:null, endReason:null, rev:0, conflictOf:null};
}
function entry(k, o, dev){ return Object.assign({id:uid(), k, t:Date.now(), dev:dev||""}, o); }
function newLive(g){
  return {inning:1, outs:0, r1:false, r2:false, r3:false, balls:0, strikes:0, hand:"R", batter:"", spot:g&&g.lineup0&&g.lineup0.length?(g.spot0||0):null,
    paNo:1, pop:1, pitcher:null, phand:"R", lineup:g&&g.lineup0?clone(g.lineup0):[], starters:g&&g.lineup0?clone(g.lineup0):[], bf:{}, pc:{}, paOpen:false};
}
// L.rid: the roster id of the kid in that spot (our lineup from the roster), or "". It lives only in replay output (the coach
// box keys his at-bats by it); the cloud lineup already carries it, never his name.
function setBatter(L){
  if(!L.lineup.length || L.spot==null){ L.rid=""; return; }
  const b=L.lineup[L.spot]; if(!b){ L.rid=""; return; }
  L.batter = b.name || (b.num?"#"+b.num:"Spot "+(L.spot+1));   // an unnamed spot isn't a jersey number
  L.rid = b.rid || "";
  L.hand = b.hand==="S" ? (L.phand==="R"?"L":"R") : (b.hand||"R");
}
function force(L){ if(L.r1){ if(L.r2){ L.r3 = true; } L.r2 = true; } L.r1 = true; }
function runnersUp(L){ L.r3=L.r2; L.r2=L.r1; L.r1=false; }
// Default guess at where runners end up on a ball in play. The charter fixes it in one tap when it's wrong.
function guessRunners(L, end){
  const r={r1:L.r1, r2:L.r2, r3:L.r3}; let outs=0;
  switch(end){
    case "1B": r.r1=true; r.r2=L.r1; r.r3=false; break;                                     // runners on 2nd/3rd score, runner on 1st to 2nd
    case "2B": r.r3=L.r1; r.r2=true; r.r1=false; break;                                    // runner on 1st to 3rd, others score
    case "3B": r.r1=r.r2=false; r.r3=true; break;
    case "HR": r.r1=r.r2=r.r3=false; break;
    case "E": r.r3=L.r2; r.r2=L.r1; r.r1=true; break;                                      // everybody moves up one
    case "FC": outs=1; if(L.r1){ const f={...r}; force(f); r.r1=true; r.r2=false; r.r3=f.r3; } else { if(L.r3) r.r3=false; else if(L.r2) r.r2=false; r.r1=true; } break; // force out at 2nd, batter safe
    case "DP": outs=2; if(L.r1){ r.r1=false; r.r2=false; r.r3=L.r2; } else { if(L.r3) r.r3=false; else if(L.r2) r.r2=false; } break; // 6-4-3: runner on 2nd moves to 3rd
    case "SAC": outs=1; r.r3=L.r2; r.r2=L.r1; r.r1=false; break;
    case "OUT": outs=1; break;
  }
  return {...r, outs};
}
function endPA(L, end, p){
  switch(end){
    case "K": if(p&&p.d3) force(L); else L.outs++; break;
    case "BB": case "IBB": case "HBP": case "CI": force(L); break;
    default: {
      const gr = guessRunners(L, end);
      const ra = p&&p.ra ? p.ra : gr;
      L.r1=!!ra.r1; L.r2=!!ra.r2; L.r3=!!ra.r3;
      L.outs += (p&&p.ra&&p.ra.outs!=null) ? p.ra.outs : gr.outs;
    }
  }
}
function checkInning(L){ if(L.outs>=3){ L.inning++; L.outs=0; L.r1=L.r2=L.r3=false; L.balls=0; L.strikes=0; L.pop=1; return true; } return false; }
function nextPA(L){
  L.balls=0; L.strikes=0; L.paNo++; L.pop=1; L.paOpen=false;
  if(L.lineup.length){ L.spot = L.spot==null?0:(L.spot+1)%L.lineup.length; setBatter(L); }
  else { L.batter=""; L.rid=""; }   // no lineup: a typed name is for one at-bat only
}
const sameBatter = (a, b) => !!a && !!b && String(a.num||"")===String(b.num||"") && String(a.name||"")===String(b.name||"");
function snap(L){ return {inning:L.inning, outs:L.outs, r1:L.r1, r2:L.r2, r3:L.r3, balls:L.balls, strikes:L.strikes, hand:L.hand, batter:L.batter, spot:L.spot, paNo:L.paNo, pop:L.pop, pitcher:L.pitcher, phand:L.phand, ...(L.rid?{rid:L.rid}:{})}; }

const _replayCache = new WeakMap();
function replay(g){
  const c=_replayCache.get(g); if(c && c.rev===g.rev && c.len===g.log.length) return c.out;
  const L=newLive(g); setBatter(L);
  const pitches=[], events=[], books=[], adjs=[]; let n=0, seq=0;
  const order=[], lastInn={};
  // The innings each pitcher threw a pitch (or made a play) in, by number. Outs a fix adds or takes back count for the
  // pitcher on the mound only in those innings. Innings the charter skipped past (a late start, a stretch she missed)
  // have none of his pitches, so their outs aren't his to count.
  const threwIn={};
  const threw=pid=>{ (threwIn[pid]||(threwIn[pid]=new Set())).add(L.inning); };
  // a0, a1: outs in the game before and after the fix, counted from the first out of the 1st inning.
  const fixOuts=(pid, a0, a1)=>{ const set=threwIn[pid]; if(!set || a0===a1) return 0;
    const lo=Math.min(a0,a1), hi=Math.max(a0,a1); let k=0;
    set.forEach(i=>{ k+=Math.max(0, Math.min(hi, i*3)-Math.max(lo, (i-1)*3)); });
    return a1>a0 ? k : -k; };
  // Double steal entered trail runner first: the runner ahead was moved up with him. These are the bases those
  // lead runners came from, so their own steal (or caught stealing), if it is entered next, isn't applied twice.
  let ds=[];
  const toMound=(pid, hand)=>{ const same=L.pitcher===pid; L.pitcher=pid; L.phand=hand||"R"; if(!order.includes(pid)) order.push(pid); if(L.bf[pid]==null) L.bf[pid]=0; if(L.pc[pid]==null) L.pc[pid]=0; if(!same) L.paOpen=false; setBatter(L); };
  const starter=g.log.find(e=>e.k==="pitcher");
  // Book catch-up pitches saved before they were marked (extra): "?" pitches added in one tap (one grp) with the book's count
  // and nothing else. Only the official count sheet ever saved that. Without the count it can't be told: "Book has more
  // pitches" picked by itself looks the same as a "He's still up" tap whose count fix was deleted in the Log.
  const grp={}, oldExtra=new Set(); g.log.forEach(e=>{ if(e.grp) (grp[e.grp]||(grp[e.grp]=[])).push(e); });

// Two copies of the same record (one id) from two devices, joined into a (changed in place, so a screen holding a keeps

  if(a.stub){ const mine=clone(a); Object.keys(a).forEach(k=>{ delete a[k]; }); Object.assign(a, newPitcher({...clone(b), id:mine.id})); delete a.stub; return addPitcherBits(a, mine); }

    new Set([...Object.keys(A), ...Object.keys(B), ...stampedKeys(a,k), ...stampedKeys(b,k)]).forEach(x=>{ const w=win(k+"."+x);
      if(w>0){ if(B[x]===undefined) delete A[x]; else A[x]=B[x]; }

// Two records of one kid (Same kid twice?, or the same kid filed on two devices): src joins dst. dst keeps his team,

// (a hand fixed on a record that another device had merged away). Pitches, tells, checklist answers and velo add up.
function joinPitchers(dst, src, o){
  if(!dst || !src || dst===src) return dst;
  if(src.stub && !dst.stub) return addPitcherBits(dst, src);
  if(dst.stub && !src.stub) return mergePitcher(dst, src);   // his real record is the base either way

  // and stays, and his games then take the hand that comes out of here.
  const unk=!handKnown(dst) && handKnown(src);
  const ed=dst.ed ? {...dst.ed} : dst.edAt ? Object.fromEntries(P_DETAILS.map(k=>[k, dst.edAt])) : {};
  const take=k=>{ const t=Math.max(edStamp(dst,k), edStamp(src,k)); if(t) ed[k]=t; };
  ["team","num","name"].forEach(k=>{ if(!String(dst[k]||"") && String(src[k]||"")){ dst[k]=String(src[k]); take(k); if(ed[k] && !slotStampMoved(src,k)) ed["fill."+k]=ed[k]; } });
  // A hand only guessed on src (not known there) never comes along.
  if(o && o.details) ["name","hand"].forEach(k=>{ if(src[k] && edStamp(src,k)>edStamp(dst,k) && (k!=="hand" || handKnown(src))){ dst[k]=String(src[k]); take(k); } });
  ["arsenal","tells"].forEach(k=>take(k));
  Object.values(LIST_ITEM).forEach(f=>[...stampedKeys(dst,f), ...stampedKeys(src,f)].forEach(x=>take(f+"."+x)));
  [...stampedKeys(dst,"check"), ...stampedKeys(src,"check")].forEach(x=>take("check."+x));
  [...stampedKeys(dst,"velo"), ...stampedKeys(src,"velo")].forEach(x=>take("velo."+x));

  if(Object.keys(ed).length){ dst.ed=ed; const d=Math.max(0, ...P_DETAILS.map(k=>ed[k]||0)); if(d) dst.edAt=d; }
  if(unk){ dst.hand=src.hand==="L" ? "L" : "R"; if(dst.check) delete dst.check[HAND_UNK]; stampP(dst, "hand", "check."+HAND_UNK); raiseHand(dst); }
  return dst;
}

/* ---------- stats ----------

const MIN_ROW = 8;
const real = ps => ps.filter(p=>!p.est);
const typed = ps => ps.filter(p=>!p.est && p.type!=="UN");

const pct = (a,b) => b ? Math.round(100*a/b) : null;

function mix(ps){ const m={}; ps.forEach(p=>{ m[p.type]=(m[p.type]||0)+1; }); return m; }

function agg(ps){

  ps.forEach(p=>{

    if(isSwing(p.result)) a.sw++;

    if(p.dirt) a.dirt++;

}
// Height from the up/middle/down strip, the 13-zone grid, or a ball in the dirt.
const ZONE_H = {1:"U",2:"U",3:"U",11:"U",12:"U",4:"M",5:"M",6:"M",7:"D",8:"D",9:"D",13:"D",14:"D"};

  if(a.up/a.loc>=0.6) return `up, ${xofy(a.up,a.loc)} up in the zone or higher`;

// One group per at-bat: {ps (its pitches), end (how it ended, or null), endBy (the pitch or play that ended it)}.
// Pitches added only to match the book (paNo null) belong to no at-bat, so they stay out.
function paGroups(ps, evs){
  const by={}, at=x=>{ const k=x.gameId+"|"+x.paNo; return by[k]||(by[k]={ps:[], end:null, endBy:null}); };
  ps.forEach(p=>{ if(p.paNo==null) return; const g=at(p); g.ps.push(p); if(p.pa){ g.end=p.pa; g.endBy=p; } });

function paStats(ps, evs){
  const ends = ps.filter(p=>p.pa).concat((evs||[]).filter(e=>e.pa));
  const o={pa:ends.length, k:0, bb:0, ibb:0, hbp:0, h:0, sac:0, hr:0};
  ends.forEach(p=>{ const x=p.pa; if(x==="K") o.k++; else if(x==="BB") o.bb++; else if(x==="IBB") o.ibb++; else if(x==="HBP") o.hbp++; else if(x==="SAC") o.sac++; if(HITS.has(x)){ o.h++; if(x==="HR") o.hr++; } });

// Outs he got: on pitches, on pickoffs and caught stealing (evs), and outs the charter added with a fix (adjs, from

function outsMade(ps, evs, adjs){ const sum=a=>(a||[]).reduce((s,x)=>s+(x.outsMade||0),0); return Math.max(0, sum(ps)+sum(evs)+sum(adjs)); }

function running(ps, evs){

// Pop time: live in-game throws beat warm-up throw-downs.
function popTime(games){

// The running call from his time to the plate, and the catcher's pop time when we have one: {tt, pop, level, call}, level

function runCall(R, pop){

    return {tt:R.ttp, pop, level, call:{go:"run on him", jump:"run with good jumps", great:"steals need a great jump"}[level]}; }
  const level=R.ttp>=1.45 ? "go" : R.ttp>=1.32 ? "jump" : "great";

function runVerdict(R, pop){

function dirtLine(ps){

/* ---------- count groups (replace the 12-count grids on paper) ---------- */
const GROUPS = [
  {key:"fp", label:"First pitch", f:p=>p.balls===0&&p.strikes===0},
  {key:"ahead", label:"He's ahead (0-1, 0-2, 1-2)", f:p=>p.strikes>p.balls},
  {key:"even", label:"Even (1-1, 2-2)", f:p=>p.balls===p.strikes&&p.balls>0},
  {key:"behind", label:"He's behind (1-0, 2-0, 2-1)", f:p=>p.balls>p.strikes&&p.balls<3},
  {key:"two", label:"Two strikes", f:p=>p.strikes===2},
  {key:"three", label:"Three balls (3-0, 3-1, 3-2)", f:p=>p.balls===3},
  {key:"risp", label:"Runners in scoring position", f:p=>p.r2||p.r3}

function countGroups(ps, h){
  const base=typed(ps).filter(p=>p.hand===h);
  return GROUPS.map(g=>{ const f=base.filter(g.f); const r=real(ps).filter(p=>p.hand===h).filter(g.f); return {label:g.label, n:f.length, m:mix(f), str:pct(r.filter(p=>isStrike(p.result)).length, r.length)}; }).filter(x=>x.n>=MIN_ROW);

/* ---------- the game plan, in plain words ---------- */
const sideWord = h => h==="R"?"righties":"lefties";

  if(fp.length>=MIN_ROW){ const t=topOf(mix(fp)); const st=rfp.filter(p=>isStrike(p.result)).length;
    out.push(`First pitch: ${t.type} ${xofy(t.n,t.tot)}, strikes ${xofy(st,rfp.length)}. ${st/rfp.length>=0.6?(t.share>=0.6?`Be ready to swing at a ${t.type} in your zone.`:"Hunt a pitch in your zone."):"He misses a lot here. Make him throw a strike."}`); }

const TEAM_DEF = [

  {k:"bunt", label:"Bunt defense", short:"Bunts", opts:[["standard","Standard"],["wheel","Wheel play"],["charge","Corners charge hard"]]},

  {k:"cf", label:"Center field arm", short:"CF", opts:[["strong","Strong"],["weak","Weak"]]},
  {k:"rf", label:"Right field arm", short:"RF", opts:[["strong","Strong"],["weak","Weak"]]},

// A record as it may be kept or sent: only its name, answers, stamps and where it moved. Anything else is left out.

function cleanTeam(o){

  if(vs.length>40) return {error:"Keep their team name to 40 letters."};

// Our players' names in free text (a tell, a note, what another coach said): a whole name of 2+ words, either way round, or a

// (Smith-Jones) as well as by its parts. Returns the names found as the roster spells them ('Banks', 'Tanner Banks').
function namesInText(text){

  const words=re=>base.split(re).map(x=>x.replace(/'s$/,"").replace(/[^a-z0-9]/g,"")).filter(Boolean);
  const ws=[words(/[^a-z0-9'-]+/), words(/[^a-z0-9']+/)];   // hyphens kept (the roster keeps Smith-Jones as one word), then split

    if(nw.length>1 && !show.has(nw.join(" "))) show.set(nw.join(" "), raw);

// TSSAA count in his outing log is that log's job): a kid on our team (ourTeam, team Us too), a kid whose whole name is one
// of our players' (rowIsOurs "drop", whatever team he is filed under), or a kid charted only in practice games (our kids,

/* ---------- our own team stays out of a paste ----------

/* ---------- saving: IndexedDB first, browser storage as a fallback, and a loud banner when neither works ---------- */

const IDB_NAME="moundbook", LS_V3="moundbook.v3", LS_BOOT="moundbook.boot";
let _db=null;
function idbOpen(ms){

    let r, done=false;
    const end=(f, v)=>{ if(done) return false; done=true; clearTimeout(t); f(v); return true; };
    const t=setTimeout(()=>end(rej, new Error("IndexedDB timed out")), ms||5000);
    try{ if(!window.indexedDB) return end(rej, new Error("No IndexedDB")); r=indexedDB.open(IDB_NAME,1); }catch(e){ return end(rej, e); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=()=>{ const db=r.result;
      if(!end(res, db)){ try{ db.close(); }catch(e){} return; }   // it answered after we stopped waiting
      // A connection the browser closes (iPad Safari does this) is dropped, so the next save opens a fresh one.
      const lost=()=>{ if(_db===db) _db=null; };

    };
    r.onerror=()=>end(rej, r.error||new Error("IndexedDB open failed")); r.onblocked=()=>end(rej, new Error("IndexedDB blocked"));

}
function idbAll(db){

    const rq=tx.objectStore("kv").openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } };
    tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error("aborted")); });
}
function metaRecord(){ const m={}; for(const k in S){ if(k!=="games") m[k]=S[k]; } m.gameIds=S.games.map(g=>g.id); m.savedAt=Date.now(); return JSON.parse(JSON.stringify(m)); }
function idbWrite(ids, meta, dels){
  return new Promise((res,rej)=>{ let tx; try{ tx=_db.transaction("kv","readwrite"); }catch(e){ return rej(e); }

    try{
      ids.forEach(id=>{ const g=S.games.find(x=>x.id===id); if(g) st.put(JSON.parse(JSON.stringify(g)), "g:"+id); });
      dels.forEach(id=>st.delete("g:"+id));

// While the database won't open, the book is kept here and marked, so it joins the database copy once that opens again.

    if(!pitchers[pid]){ const have=v2id && S.pitchers[resolvePid(v2id)];
      pitchers[pid]=have ? newPitcher({...clone(have), id:pid}) : newPitcher({id:pid, team, num:pn, name:pnm, hand:v("pitcher_hand")||"R", arsenal:[]}); }
    return pid;
  };
  for(const gid in by){
    const rs=by[gid].sort((a,b)=>(+a("seq")||0)-(+b("seq")||0)); const f=rs[0];
    const team=f("pitching_team")||f("opponent")||"";
    const list=rs.map((v,i)=>({v, eid:v("entry_id")||(gid+".r"+(v("seq")||i+1))}));
    // A v2 sheet of a game moved over from v2 here: its rows are that game's pitches and plays, in order (they have no ids).
    // They line up as far as each row is the same kind of pitch or play with the same result; from the first that isn't,
    // the sheet went another way (an undo in v2 after this device's copy), and the rows are new.
    const old=S.games.find(g=>g.id===gid && !g.conflictOf);
    if(ix("entry_id")<0 && old && old.legacyOpp!=null){
      const ps=old.log.filter(e=>(e.k==="pitch"||e.k==="ev") && String(e.id).startsWith(gid+".v"));
      for(let i=0;i<list.length && i<ps.length;i++){ const v=list[i].v, kind=v("row_type")||"pitch", e=ps[i];
        if(kind==="pitch" ? (e.k!=="pitch" || e.result!==v("result")) : (e.k!=="ev" || e.kind!==kind)) break;
        list[i].eid=e.id; } }
    list.forEach(({v})=>{ const pid=csvPid(v, team), type=v("pitch_type")||"UN";
      if((v("row_type")||"pitch")!=="pitch" || !RESULTS[v("result")]) return;
      if(type!=="UN" && !pitchers[pid].arsenal.includes(type)) pitchers[pid].arsenal.push(type);
      if(!S.catalog.some(a=>a.code===type)) S.catalog.splice(Math.max(0,S.catalog.findIndex(a=>a.code==="UN")),0,{code:type, name:type, color:EXTRA_COLORS[S.catalog.length%EXTRA_COLORS.length]}); });
    const loc=S.games.find(g=>g.id===gid && !g.conflictOf), exp=Math.max(0, ...list.map(x=>csvStamp(x.v))), plan=loc && csvPlan(loc, list, exp, csvSigOf(list));
    if(plan){ patches.push({g:loc, plan, team, list}); continue; }
    const g=newGame({date:csvDate(f("game_date"))||f("game_date"), pTeam:team, bTeam:f("batting_team"), hitting:f("hitting")||"us", level:f("level")||"varsity", practice:f("practice")==="1", example:f("example")==="1", chartedBy:f("charted_by"), dev:S.device.id}); g.id=gid;
    csvAppend(g, list, v=>csvPid(v, team));
    games.push(g);
  }
  const r=mergeIn({games, pitchers}, {sheet:true}), has=new Set(hdr); r.cut=0; r.stale=0; r.ignored=0;
  patches.forEach(({g, plan, team, list})=>{ const pidFor=v=>resolvePid(csvPid(v, team));
    if(csvIgnored(g, list, plan)) r.ignored++;
    const res=csvApply(g, plan, pidFor, list, has); if(res.stale || plan.unsure) r.stale++;
    // A fix to a game another device charts goes up like a Receive does (relay), or that device's next push wipes it.
    if(res.n){ touch(g, dev()); Sync.relayed(g); saveGame(g); }
    let copy=false;
    if(plan.cut.length){ const out=new Set(plan.cut), c=clone(g); c.log=c.log.filter(e=>!out.has(e.id)); c.cut=mergeCut(c.cut, plan.cut.map(id=>({id, t:Date.now()}))); touch(c, dev());
      copy=secondCopy(c, g.id, false)==="conflicts"; if(copy) r.cut++; }
    if(res.n) r.updated++; else if(!copy) r.kept++;
  });
  S.needsTeam=[...new Set([...(S.needsTeam||[]), ...Object.keys(pitchers).map(resolvePid).filter(id=>S.pitchers[id]&&!S.pitchers[id].team)])]; save(); return r;
}

/* ---------- past seasons: save to a file, then take them off this device ----------
   A season is the calendar year of the game date. Its file is a backup-style package (kind "season") of that year's
   games and the pitchers they use; Receive brings it back. Removing a season needs a save of exactly those games first,
   and keeps every pitcher with his notes and box-score lines. */
function seasonOf(g){ return String(g&&g.date||"").slice(0,4); }
function seasonGames(year){ return S.games.filter(g=>!g.example && seasonOf(g)===year); }
function seasonList(){
  const by={}, now=today().slice(0,4);
  S.games.forEach(g=>{ const y=seasonOf(g); if(g.example || !/^\d{4}$/.test(y)) return; by[y]=(by[y]||0)+1; });
  return Object.keys(by).sort().reverse().map(y=>({year:y, games:by[y], past:y<now, saved:seasonSaved(y)}));
}
// Which games, in which state: a save only counts while the season's games are the ones that were saved.
function seasonSig(year){ return textHash(seasonGames(year).map(g=>g.id+":"+(g.rev||0)+":"+(g.edited&&g.edited.t||0)).sort().join(",")); }
function seasonSaved(year){ const s=(S.seasonSaved||{})[year]; return s && s.sig===seasonSig(year) ? s : null; }
function packSeason(year){
  const games=seasonGames(year), pitchers={}, alias={};
  games.forEach(g=>replay(g).order.forEach(id=>{ const p=S.pitchers[resolvePid(id)]; if(p) pitchers[p.id]=p; }));
  Object.entries(S.pitcherAlias||{}).forEach(([k,v])=>{ if(pitchers[resolvePid(v)]) alias[k]=v; });
  return JSON.stringify({mb:3, kind:"season", season:year, from:{dev:S.device.id, name:S.device.name||""}, at:Date.now(), games, pitchers, pitcherAlias:alias, catalog:S.catalog});
}
// how: "copied" when the coach copied it out by hand and said it's kept (the Claude viewer can't save a file).
function markSeasonSaved(year, how){ S.seasonSaved=S.seasonSaved||{}; S.seasonSaved[year]={at:Date.now(), sig:seasonSig(year), games:seasonGames(year).length}; if(how) S.seasonSaved[year].how=how; save(); }
// Returns how many games came off, or 0 when the season wasn't saved as it is now.
function removeSeason(year){
  if(!/^\d{4}$/.test(year) || year>=today().slice(0,4) || !seasonSaved(year)) return 0;
  const ids=seasonGames(year).map(g=>g.id); ids.forEach(id=>dropGame(id));
  S.seasonSaved[year]={...S.seasonSaved[year], removed:Date.now()};
  if(!cur()){ const main=S.games.filter(g=>!g.conflictOf); S.cur=main.length?main[main.length-1].id:(S.games.length?S.games[S.games.length-1].id:null); }
  if(ui.report.games) ui.report.games=null;
  save(); return ids.length;
}

/* ---------- reading pasted pitch counts and rosters ----------
   Pure: it reads text and keeps nothing (no S, no page). The sheets pick which section to use, and store.js leaves our
   own team out (ourNames, isOurSection, rowIsOurs). The pasted text itself is never stored.
   parsePaste(text, ctx) -> {format: typed|table|gc, header (a title row was skipped), wholeBox (looks like a whole box score),
     sections:[{title, rows:[{line, raw, num, name, pitches (null: a roster line), cls, hand R|L|"", pos, warn:[], err}],
     skipped:[{line, raw, why}]}]}. ctx.max: the daily max, over it only warns (ctx.table: the rest table, for its rest).
   PASTE_READERS: each takes (text, ctx) and returns a reading, or null when the text isn't its kind. The first that reads it
   wins; readTyped reads anything. */
const PASTE_WORDS=new Set(["#","no","num","number","jersey","name","player","pitcher","pitching","first","last","pos","position","class","yr","grade",
  "bats","throws","b/t","ip","h","r","er","bb","so","k","hr","np","pc","#p","p","pitches","pitch count","pitch-count","pitches-strikes","p-s",
  "strikes","bf","era",
  // more column titles of the same kind, so a whole box score's title rows read as title rows
  "tp","ab","rbi","avg","obp","slg","ops","lob","hbp","sb","cs","pa","tb","2b","3b","sf","sac","wp","bk","whip","baa","w","l","s","sv","b","t",
  "balls","hand","bat","throw","year","grad","player name","first name","last name","jersey #","#pitches","total pitches"]);

// Fr, So, Jr, Sr or 9th-12th: his class. It is never part of his name.
function pasteCls(t){ const m=/^(fr|so|jr|sr)$/i.exec(t); if(m) return m[1][0].toUpperCase()+m[1][1].toLowerCase(); const n=/^(9|10|11|12)th$/i.exec(t); return n ? n[1]+"th" : ""; }

// Lines: a new line or ";" (two counts texted on one line). Bullets are left off; blank lines stay, since they end a table.
function pasteLines(text){
  const out=[];
  String(text==null?"":text).split(/\r?\n/).forEach((ln, i)=>ln.split(";").forEach(part=>{
    // On a line with tabs a dash is a bullet only with a space after it: '-' in a tab cell is an empty cell. Else '-12 Smith 87'
    // is a bullet too.
    const raw=part.trim(), dash=part.includes("\t") ? "[-–—]+ +" : "[-–—]+\\s*", bullet=new RegExp("^(?:[•*·▪●]+\\s*|"+dash+")"), lead=new RegExp("^[ ]*(?:[•*·▪●]+\\s*|"+dash+")");

}
// A line's cells: tabs when the text has them, else commas, else spaces.
function pasteCells(x, tabs){
  if(tabs && x.src.includes("\t")) return x.src.split("\t").map(c=>c.trim());
  if(x.text.includes(",")) return x.text.split(",").map(c=>c.trim());
  return x.text.replace(/pitch\s+count/ig,"Pitch-Count").split(/\s+/).filter(Boolean);
}
// 'Pitches-Strikes: J Smith 87-55, K Jones 18-10' gives a line for each part, the label left off. A title as the label
// ('Greene Co Pitching: ...') still names the section. 'Smith 87, Jones 18' (each part a name and a count) splits too.
function pasteExpand(L){
  const out=[];
  L.forEach(x=>{
    if(x.blank || x.src.includes("\t")){ out.push(x); return; }
    const m=/^([A-Za-z][A-Za-z#\/' -]{0,40}?)\s*:\s*(.+)$/.exec(x.text), part=s=>({...x, text:s, src:s});
    if(m){
      // A part with no number ('Banks, Tanner 40') isn't a line of its own: it may be a first name.
      const label=m[1].trim(), rest=m[2].trim(), parts=rest.split(",").map(s=>s.trim()).filter(Boolean), title=/(pitching|pitchers|batting)$/i.test(label);
      if(parts.length>1 && parts.every(s=>/\d/.test(s))){ if(title) out.push(part(label)); parts.forEach(s=>out.push(part(s))); return; }
      if(title){ out.push(part(label)); out.push(part(rest)); return; }
      if(PASTE_WORDS.has(pasteNorm(label)) || isHeaderRow(label.split(/\s+/))){ out.push(part(rest)); return; }
    }
    // Each part a name and a count: a line each. '12 Banks, Tanner 40' stays one line.
    const parts=x.text.split(",").map(s=>s.trim()).filter(Boolean);
    if(parts.length>1 && parts.every(s=>{ const r=/[a-z]/i.test(s) ? pasteTyped(s) : null; return !!r && !r.why && r.pitches!=null && !!r.name; })){ parts.forEach(s=>out.push(part(s))); return; }
    out.push(x);
